<svg width="1440" height="1080" viewBox="0 0 1440 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#020617" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A2"/>
      <stop offset="0.45" stop-color="#D6A12A"/>
      <stop offset="1" stop-color="#9A6D18"/>
    </linearGradient>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <path id="star" d="M12 2.5l2.9 6.06 6.6.83-4.86 4.63 1.28 6.55L12 17.35l-5.92 3.22 1.28-6.55L2.5 9.39l6.6-.83L12 2.5z"/>
  </defs>

  <rect width="1440" height="1080" fill="#F5F7FB"/>
  <path d="M0 0H1440V1080H0V0Z" fill="url(#phoneBg)"/>
  <circle cx="1180" cy="120" r="260" fill="#FFF4D8" opacity="0.72"/>
  <circle cx="180" cy="950" r="320" fill="#EEF2FF" opacity="0.88"/>

  <text x="720" y="104" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900" fill="#050505">PaMarket Rating Prompt Preview</text>
  <text x="720" y="148" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#667085">Polished for both stores: App Store on iPhone, Play Store on Android</text>

  <!-- iOS phone -->
  <g transform="translate(185 210)">
    <rect x="0" y="0" width="470" height="760" rx="58" fill="#101828" filter="url(#shadow)"/>
    <rect x="16" y="16" width="438" height="728" rx="46" fill="#FFFFFF"/>
    <rect x="151" y="30" width="168" height="34" rx="17" fill="#101828"/>
    <text x="56" y="62" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#101828">9:41</text>
    <text x="320" y="62" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#101828">5G</text>
    <rect x="358" y="44" width="44" height="20" rx="6" stroke="#101828" stroke-width="3"/>
    <rect x="404" y="50" width="4" height="8" rx="2" fill="#101828"/>
    <rect x="362" y="48" width="32" height="12" rx="3" fill="#22C55E"/>

    <rect x="16" y="16" width="438" height="728" rx="46" fill="#101828" opacity="0.55"/>

    <g transform="translate(76 184)" filter="url(#soft)">
      <rect width="318" height="354" rx="28" fill="#FFFFFF"/>
      <g transform="translate(127 32)">
        <rect width="64" height="64" rx="18" fill="#FFF4D8"/>
        <use href="#star" x="17" y="17" width="30" height="30" fill="url(#gold)"/>
      </g>
      <g transform="translate(92 118)">
        <use href="#star" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="27" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="54" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="81" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="108" width="20" height="20" fill="#D6A12A"/>
      </g>
      <text x="159" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#050505">Enjoying PaMarket?</text>
      <text x="159" y="211" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085">Tell us with a rating — it takes</text>
      <text x="159" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#050505">10 seconds</text>
      <text x="159" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085">and helps other Zimbabweans find the app.</text>
      <rect x="24" y="280" width="270" height="52" rx="14" fill="url(#brand)"/>
      <use href="#star" x="78" y="296" width="18" height="18" fill="#D6A12A"/>
      <text x="168" y="313" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">Rate on App Store</text>
    </g>
    <text x="235" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#050505">iPhone</text>
  </g>

  <!-- Android phone -->
  <g transform="translate(785 210)">
    <rect x="0" y="0" width="470" height="760" rx="42" fill="#111827" filter="url(#shadow)"/>
    <rect x="16" y="16" width="438" height="728" rx="32" fill="#FFFFFF"/>
    <text x="56" y="60" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#101828">9:41</text>
    <circle cx="390" cy="52" r="6" fill="#101828"/>
    <circle cx="410" cy="52" r="6" fill="#101828"/>
    <rect x="16" y="16" width="438" height="728" rx="32" fill="#101828" opacity="0.55"/>

    <g transform="translate(76 184)" filter="url(#soft)">
      <rect width="318" height="354" rx="28" fill="#FFFFFF"/>
      <g transform="translate(127 32)">
        <rect width="64" height="64" rx="18" fill="#FFF4D8"/>
        <use href="#star" x="17" y="17" width="30" height="30" fill="url(#gold)"/>
      </g>
      <g transform="translate(92 118)">
        <use href="#star" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="27" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="54" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="81" width="20" height="20" fill="#D6A12A"/>
        <use href="#star" x="108" width="20" height="20" fill="#D6A12A"/>
      </g>
      <text x="159" y="172" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#050505">Enjoying PaMarket?</text>
      <text x="159" y="211" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085">Tell us with a rating — it takes</text>
      <text x="159" y="232" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#050505">10 seconds</text>
      <text x="159" y="253" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#667085">and helps other Zimbabweans find the app.</text>
      <rect x="24" y="280" width="270" height="52" rx="14" fill="url(#brand)"/>
      <use href="#star" x="78" y="296" width="18" height="18" fill="#D6A12A"/>
      <text x="168" y="313" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#FFFFFF">Rate on Play Store</text>
    </g>
    <text x="235" y="700" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#050505">Android</text>
  </g>

  <g transform="translate(310 985)">
    <rect width="820" height="56" rx="28" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="36" cy="28" r="9" fill="#D6A12A"/>
    <text x="62" y="35" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#344054">Shows after the 3rd app open, snoozes for 5 days, and uses the right store for each platform.</text>
  </g>
</svg>
