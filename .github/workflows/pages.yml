name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Daily rebuild so listings/jobs posted since the last push get their static
    # pre-rendered pages (and drop pages for ones that went inactive).
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip non-public files from the deploy
        # The admin panel and backend source must NOT be served on the public
        # site. They stay in the repo (run admin.html locally), but are removed
        # from the GitHub Pages artifact so the public site can't serve them.
        run: |
          rm -f www/admin.html
          rm -rf supabase android qa-system
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pre-render static listing/job pages
        # Generates l/<slug>-<id>.html (real HTML + baked JSON-LD) for every
        # active listing so non-JS crawlers get full content. Reads the public
        # anon key from js/supabase-config.js. Never fails the deploy — if the
        # fetch hiccups, the client-rendered /detail?id= pages still serve.
        run: node tools/prerender.js
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
