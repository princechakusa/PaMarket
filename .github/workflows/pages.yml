name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip non-public files from the deploy
        # The admin panel, backend source, build tooling, and internal docs
        # must NOT be served on the public site. They stay in the repo (run
        # admin.html locally, `node tools/...` from a checkout) but are
        # removed from the GitHub Pages artifact so the public site can't
        # serve them. None of these are referenced by any deployed page —
        # confirmed by grepping *.html/js/*.js for src=/href= into any of
        # these paths before adding them here.
        run: |
          rm -f www/admin.html
          rm -rf supabase android qa-system
          rm -f PRODUCTION_AUDIT_2026-07-03.md GO_LIVE_RUNBOOK.md TECHNICAL_BLUEPRINT.md
          rm -rf docs tools scripts
          rm -f build.sh serve.js package.json package-lock.json capacitor.config.json google-services.json
          rm -f analyze-bundle.ps1 verify-architecture.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
