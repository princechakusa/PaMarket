name: Update Sitemap & Static Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - 'sitemap.xml'
      - 'l/**'
      - 'r/**'
      - 'b/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Generate sitemap.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tools/generate-sitemap.js

      - name: Pre-render static listing/job pages
        # Same proven CI context (secrets) that generates the sitemap. Writes
        # l/<slug>-<id>.html with real HTML + baked JSON-LD for every active
        # listing so non-JS crawlers get full content. Committed below so the
        # branch-based Pages deploy serves them reliably.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node tools/prerender.js

      - name: Commit sitemap + static pages if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove pages for entities that are no longer active, then re-add the
          # current set so deleted/sold ones drop out of the deploy.
          git add -A sitemap.xml l r b
          if git diff --cached --quiet; then
            echo "sitemap + static pages unchanged, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh sitemap + pre-rendered listing pages"
          # Retry on a push race (another push landed on master between our
          # checkout and this push — e.g. a person pushing at the same time,
          # or the cron and a push-triggered run overlapping). Deliberately
          # NOT a rebase: our diff is the entire regenerated content of
          # sitemap.xml/l/r/b, so a concurrent run touching those same files
          # would make a patch-based rebase conflict almost every time.
          # Instead, re-sync to the new tip and recommit the (already-on-disk,
          # already-regenerated) files fresh against it — always
          # conflict-free, since it's just "does this deterministic output
          # differ from what's now on master", never a text merge.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) — re-syncing to the new master tip"
            git fetch origin master
            git reset --soft origin/master
            git add -A sitemap.xml l r b
            if git diff --cached --quiet; then
              echo "sitemap + static pages now match latest master already, nothing left to commit"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "chore: refresh sitemap + pre-rendered listing pages"
            sleep $((attempt * 3))
          done
          echo "::error::git push failed after 5 attempts"
          exit 1

      - name: Trigger the Pages deploy
        # A push made with the default GITHUB_TOKEN (as the commit step above
        # just did) does NOT fire pages.yml's own `on: push` trigger — GitHub
        # suppresses that specifically to prevent workflow recursion. Without
        # this step, every automatic/cron sitemap refresh would sit committed
        # on master but never actually get published, silently drifting from
        # what's live until someone noticed and re-ran pages.yml by hand
        # (which is what was happening before this fix). workflow_dispatch is
        # the documented exception — GITHUB_TOKEN CAN trigger it explicitly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
