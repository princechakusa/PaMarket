name: Flutter APK Build

on:
  push:
    branches:
      - claude/pamarket-flutter-rewrite-UgRZd
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pamarket-flutter-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Build release APK (unsigned)
        working-directory: flutter_app
        run: flutter build apk --release --no-tree-shake-icons
        continue-on-error: true

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pamarket-flutter-release-unsigned
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
