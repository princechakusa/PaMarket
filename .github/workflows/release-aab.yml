name: Build Signed Release AAB

# Builds a Play-ready, signed Android App Bundle.
# Signing credentials come ONLY from GitHub repository secrets — nothing
# sensitive lives in the repo. See docs/SIGNING.md for the one-time setup.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of pamarket.keystore  (see docs/SIGNING.md)
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias (e.g. pamarket)
#   ANDROID_KEY_PASSWORD       key password

on:
  workflow_dispatch:        # run manually from the Actions tab
  push:
    tags:
      - 'v*'                # or automatically when you push a tag like v1.0.9

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Decode keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pamarket.keystore"

      - name: Build signed release AAB
        working-directory: android
        env:
          PAMARKET_KEYSTORE_FILE: ${{ runner.temp }}/pamarket.keystore
          PAMARKET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAMARKET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAMARKET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pamarket.keystore"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pamarket-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
