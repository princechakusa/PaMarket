<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in... — PaMarket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#F5F7FA}
.box{text-align:center;padding:48px 32px;background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-width:360px;width:100%;margin:16px}
.logo{font-size:28px;font-weight:900;color:#1A3A8F;margin-bottom:24px;letter-spacing:-.5px}
.logo span{color:#F5A623}
.spinner{width:44px;height:44px;border:3px solid #E4E8F0;border-top-color:#1A3A8F;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.msg{color:#667085;font-size:15px;line-height:1.5}
.error{color:#ef4444;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Pa<span>Market</span></div>
  <div class="spinner" id="spinner"></div>
  <p class="msg" id="msg">Signing you in...</p>
  <p class="error hidden" id="errMsg"></p>
  <button class="confirm-btn hidden" id="confirmBtn" style="margin-top:20px;padding:12px 28px;border:none;border-radius:10px;background:#1A3A8F;color:#fff;font-size:15px;font-weight:700;cursor:pointer">Confirm my email</button>
</div>
<script>
const SB_URL='https://gxgytumhknmnwspxjzxw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4Z3l0dW1oa25tbndzcHhqenh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzMwNDUsImV4cCI6MjA5MzY0OTA0NX0.ddJhWdUy7JVrSfdaSK8a0On3zuwssY2H4DWsxBhgbJs';

function showErr(msg){
  document.getElementById('spinner').style.display='none';
  document.getElementById('msg').textContent='Sign-in failed.';
  const e=document.getElementById('errMsg');
  e.textContent=msg;
  e.classList.remove('hidden');
  setTimeout(()=>window.location.href='/',3000);
}

function safeReturnUrl(url){
  try{const u=new URL(url,location.href);if(u.origin!==location.origin)return'/';}catch{}
  if(!url||url.includes('auth')||url.includes('auth-callback'))return'/';
  return url;
}

// PaMarket's Android/Capacitor app can't be opened directly from links inside
// HTML emails — most mail clients strip or refuse custom URI schemes
// (com.pamarket.app://...). So Supabase's Site URL/email templates point here
// (a normal https page every mail client opens fine), and this page forwards
// into the app via the custom scheme, which mail-client restrictions don't
// apply to once you're already in a real browser context.
function forwardToApp(query){
  const appUrl='com.pamarket.app://login-callback'+(query?('?'+query):'');
  document.getElementById('msg').textContent='Opening PaMarket…';
  window.location.href=appUrl;
  setTimeout(function(){
    document.getElementById('spinner').style.display='none';
    document.getElementById('msg').innerHTML='If PaMarket didn\'t open automatically, <a href="'+appUrl+'">tap here</a>.';
  },1500);
}

// Mail servers/clients (Gmail, Outlook Safe Links, corporate scanners) often
// prefetch every link in an HTML email to scan for phishing BEFORE the user
// ever taps it. Supabase's confirmation token is single-use, so an
// auto-verify on page load gets silently burned by that prefetch and the
// real click sees "invalid or expired". Requiring an explicit button tap
// avoids this — scanners fetch the page but don't click buttons.
async function verifyEmailToken(tokenHash, type){
  document.getElementById('confirmBtn').classList.add('hidden');
  document.getElementById('spinner').style.display='block';
  document.getElementById('msg').textContent='Confirming your email…';
  try{
    const r=await fetch(`${SB_URL}/auth/v1/verify`,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({token_hash:tokenHash,type:type||'signup'})
    });
    if(!r.ok){
      const err=await r.json().catch(()=>({}));
      throw new Error(err.error_description||err.msg||'Email link is invalid or has expired');
    }
    const data=await r.json();
    if(!data.access_token) throw new Error('Email link is invalid or has expired');
    forwardToApp('access_token='+encodeURIComponent(data.access_token)+
      '&refresh_token='+encodeURIComponent(data.refresh_token||'')+
      '&expires_in='+encodeURIComponent(data.expires_in||3600)+
      '&token_type='+encodeURIComponent(data.token_type||'bearer'));
  }catch(err){
    showErr(err.message||'Email link is invalid or has expired');
  }
}

async function handleCallback(){
  const qp=new URLSearchParams(location.search);
  const hash=window.location.hash.substring(1);
  const hashParams=new URLSearchParams(hash);

  const code=qp.get('code');
  const tokenHash=qp.get('token_hash');
  const type=qp.get('type')||hashParams.get('type');

  // Signup/magic-link confirmations: wait for an explicit tap before
  // spending the single-use token (see comment on verifyEmailToken above).
  if(tokenHash && type!=='recovery'){
    document.getElementById('spinner').style.display='none';
    document.getElementById('msg').textContent='Tap below to confirm your email address.';
    const btn=document.getElementById('confirmBtn');
    btn.classList.remove('hidden');
    btn.onclick=function(){ verifyEmailToken(tokenHash,type); };
    return;
  }
  // NOTE: this page is only ever reached by the WEBSITE's own auth flows
  // (auth.html's doGoogle()/doForgot()) — the Android app's Google Sign-In
  // never lands here at all; it opens Supabase's authorize URL directly in
  // an in-app Browser tab and catches the com.pamarket.app://login-callback
  // deep link itself, via _oauthInCap in auth.js. So both a query-string
  // ?code= (PKCE, e.g. if the project's flow_type doesn't honor the
  // implicit request from doGoogle()) and a hash #access_token= (implicit)
  // must complete a WEBSITE session below, never forward into the app.

  // Supabase puts tokens in URL hash after OAuth redirect
  const params=hashParams;

  const accessToken=params.get('access_token');
  const refreshToken=params.get('refresh_token');
  const expiresIn=parseInt(params.get('expires_in')||'3600',10);
  const tokenType=params.get('token_type')||'bearer';

  if(!accessToken){
    const error=qp.get('error_description')||qp.get('error');
    if(error){showErr(error);return}
    if(code){
      try{
        document.getElementById('msg').textContent='Completing sign-in…';
        const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=pkce`,{
          method:'POST',
          headers:{'apikey':SB_KEY,'Content-Type':'application/json'},
          body:JSON.stringify({auth_code:code,code_verifier:sessionStorage.getItem('pm_pkce_verifier')||''})
        });
        if(!r.ok)throw new Error('Code exchange failed');
        const data=await r.json();
        const session={
          access_token:data.access_token,
          refresh_token:data.refresh_token||'',
          expires_at:Math.floor(Date.now()/1000)+(data.expires_in||3600),
          user:data.user
        };
        localStorage.setItem('pm_session',JSON.stringify(session));
        sessionStorage.removeItem('pm_pkce_verifier');
        const returnUrl=safeReturnUrl(sessionStorage.getItem('pm_return_url')||'/');
        sessionStorage.removeItem('pm_return_url');
        window.location.href=returnUrl;
        return;
      }catch{showErr('Could not complete sign-in. Please try again.');return}
    }
    showErr('No access token found. Please try signing in again.');
    return;
  }

  try{
    // Password reset flow — redirect to set-new-password screen
    if(type==='recovery'){
      document.getElementById('msg').textContent='Loading password reset…';
      sessionStorage.setItem('pm_recovery_token',accessToken);
      window.location.href='auth?mode=reset';
      return;
    }

    // Fetch user profile from Supabase
    const r=await fetch(`${SB_URL}/auth/v1/user`,{
      headers:{
        'apikey':SB_KEY,
        'Authorization':tokenType+' '+accessToken
      }
    });
    if(!r.ok) throw new Error('Could not fetch user profile');
    const user=await r.json();

    const session={
      access_token:accessToken,
      refresh_token:refreshToken||'',
      expires_at:Math.floor(Date.now()/1000)+expiresIn,
      user:user
    };
    localStorage.setItem('pm_session',JSON.stringify(session));

    // Redirect back to where the user came from (same-origin only)
    const returnUrl=safeReturnUrl(sessionStorage.getItem('pm_return_url')||'/');
    sessionStorage.removeItem('pm_return_url');
    window.location.href=returnUrl;
  }catch(err){
    showErr('Error completing sign-in. Please try again.');
  }
}

handleCallback();
</script>
<script src="js/cookie-consent.js" defer></script>
</body>
</html>
