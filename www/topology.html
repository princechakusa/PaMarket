<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAmarket — Live System Topology</title>
<script src="js/lib/supabase.umd.js"></script>
<script src="js/lib/d3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#03060f;
  --bg2:#060d1a;
  --border:#0e1f3a;
  --text:#c8d8f0;
  --text2:#607090;
  --green:#00e676;
  --yellow:#ffab00;
  --red:#ff1744;
  --blue:#448aff;
  --purple:#7c4dff;
  --cyan:#00e5ff;
  --orange:#ff6d00;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;color:var(--text)}

/* ── TOP BAR ───────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:rgba(3,6,15,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:16px;
  z-index:100;
}
#topbar .logo{
  display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;
  letter-spacing:.5px;color:#fff;white-space:nowrap;
}
#topbar .logo svg{width:24px;height:24px}
.live-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.3);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;
  color:var(--green);letter-spacing:.5px;
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 1.2s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.spacer{flex:1}
#search-wrap{position:relative;display:flex;align-items:center}
#search-wrap svg{position:absolute;left:10px;width:14px;height:14px;color:var(--text2);pointer-events:none}
#global-search{
  background:rgba(14,31,58,.8);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px 7px 32px;
  font-size:12px;color:var(--text);outline:none;width:200px;
  transition:border-color .2s,width .2s;
}
#global-search:focus{border-color:var(--blue);width:260px}
#global-search::placeholder{color:var(--text2)}

.top-stat{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(14,31,58,.5);border:1px solid var(--border);
  border-radius:8px;padding:4px 12px;min-width:80px;cursor:default;
}
.top-stat .val{font-size:15px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.top-stat .lbl{font-size:9px;color:var(--text2);letter-spacing:.5px;text-transform:uppercase;margin-top:1px}

.btn-icon{
  background:rgba(14,31,58,.6);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;cursor:pointer;
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);
  transition:border-color .2s,background .2s;white-space:nowrap;
}
.btn-icon:hover{border-color:var(--blue);background:rgba(68,138,255,.1);color:#fff}
.btn-icon svg{width:14px;height:14px}
.btn-icon.active{border-color:var(--blue);background:rgba(68,138,255,.15);color:var(--blue)}

/* ── FILTER BAR ────────────────────────── */
#filterbar{
  position:fixed;top:52px;left:0;right:0;height:38px;
  background:rgba(3,6,15,.85);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:8px;
  z-index:99;overflow-x:auto;
}
#filterbar::-webkit-scrollbar{height:3px}
#filterbar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.filter-chip{
  display:flex;align-items:center;gap:5px;
  border:1px solid var(--border);border-radius:20px;
  padding:3px 10px;font-size:11px;color:var(--text2);
  cursor:pointer;transition:all .15s;white-space:nowrap;
  background:rgba(14,31,58,.4);
}
.filter-chip:hover,.filter-chip.on{color:#fff;border-color:currentColor}
.filter-chip.on{background:rgba(68,138,255,.15);border-color:var(--blue);color:var(--blue)}
.filter-chip .dot{width:6px;height:6px;border-radius:50%}
.fc-all .dot{background:var(--text2)}
.fc-client .dot{background:var(--cyan)}
.fc-service .dot{background:var(--blue)}
.fc-database .dot{background:var(--purple)}
.fc-table .dot{background:var(--purple);opacity:.7}
.fc-external .dot{background:var(--orange)}
.fc-infra .dot{background:var(--yellow)}

/* ── CANVAS AREA ───────────────────────── */
#canvas-wrap{position:fixed;top:90px;left:0;right:0;bottom:200px;overflow:hidden}
#canvas-bg,#canvas-main{position:absolute;top:0;left:0;width:100%;height:100%}
#canvas-bg{z-index:0}
#canvas-main{z-index:1;cursor:grab}
#canvas-main.grabbing{cursor:grabbing}

/* ── BOTTOM EVENT FEED ──────────────────── */
#event-feed{
  position:fixed;bottom:0;left:0;right:0;height:200px;
  background:rgba(3,6,15,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;flex-direction:column;
  z-index:100;
}
#event-feed-header{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#event-feed-header .title{font-size:11px;font-weight:600;color:var(--text2);letter-spacing:.5px;text-transform:uppercase}
#event-count{font-size:11px;color:var(--text2);margin-left:auto}
#events-list{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:4px 0;
}
#events-list::-webkit-scrollbar{width:4px}
#events-list::-webkit-scrollbar-thumb{background:var(--border)}
.evt{
  display:flex;align-items:center;gap:10px;
  padding:4px 16px;font-size:11px;
  animation:evt-in .25s ease-out;
  transition:background .15s;
}
.evt:hover{background:rgba(14,31,58,.5)}
@keyframes evt-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.evt-icon{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0}
.evt-path{color:var(--text2);font-size:10px;display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.evt-path .node-chip{
  background:rgba(14,31,58,.8);border:1px solid var(--border);
  border-radius:4px;padding:1px 6px;white-space:nowrap;
  font-size:10px;
}
.evt-path .arrow{color:var(--text2);font-size:10px}
.evt-time{color:var(--text2);font-size:9px;white-space:nowrap;margin-left:auto}
.evt-msg{color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── SIDE PANEL ─────────────────────────── */
#side-panel{
  position:fixed;top:90px;right:0;width:320px;bottom:200px;
  background:rgba(6,13,26,.98);backdrop-filter:blur(16px);
  border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
  z-index:101;display:flex;flex-direction:column;overflow:hidden;
}
#side-panel.open{transform:none}
#panel-header{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
#panel-title{font-size:14px;font-weight:600;flex:1}
#panel-close{
  width:24px;height:24px;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:rgba(14,31,58,.6);border:1px solid var(--border);
  color:var(--text2);transition:all .15s;
}
#panel-close:hover{color:#fff;border-color:var(--red)}
#panel-close svg{width:14px;height:14px}
#panel-content{flex:1;overflow-y:auto;padding:12px 16px}
#panel-content::-webkit-scrollbar{width:4px}
#panel-content::-webkit-scrollbar-thumb{background:var(--border)}
.panel-section{margin-bottom:16px}
.panel-section-title{font-size:9px;font-weight:600;color:var(--text2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.panel-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(14,31,58,.5)}
.panel-row:last-child{border-bottom:none}
.panel-key{font-size:11px;color:var(--text2)}
.panel-val{font-size:11px;color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.panel-val.green{color:var(--green)}
.panel-val.yellow{color:var(--yellow)}
.panel-val.red{color:var(--red)}
.panel-val.blue{color:var(--blue)}
.badge{display:inline-block;padding:1px 7px;border-radius:12px;font-size:10px;font-weight:600}
.badge-green{background:rgba(0,230,118,.15);color:var(--green);border:1px solid rgba(0,230,118,.3)}
.badge-red{background:rgba(255,23,68,.15);color:var(--red);border:1px solid rgba(255,23,68,.3)}
.badge-yellow{background:rgba(255,171,0,.15);color:var(--yellow);border:1px solid rgba(255,171,0,.3)}
.badge-blue{background:rgba(68,138,255,.15);color:var(--blue);border:1px solid rgba(68,138,255,.3)}
.badge-purple{background:rgba(124,77,255,.15);color:var(--purple);border:1px solid rgba(124,77,255,.3)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-cell{background:rgba(14,31,58,.4);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.stat-cell .sv{font-size:18px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.stat-cell .sk{font-size:9px;color:var(--text2);letter-spacing:.4px;text-transform:uppercase;margin-top:2px}
.policy-list{display:flex;flex-direction:column;gap:4px}
.policy-item{
  background:rgba(14,31,58,.3);border:1px solid var(--border);
  border-radius:6px;padding:5px 8px;font-size:10px;
  display:flex;align-items:center;gap:6px;
}
.mini-chart{height:32px;background:rgba(14,31,58,.3);border:1px solid var(--border);border-radius:6px;overflow:hidden;position:relative}
canvas.mini{position:absolute;inset:0;width:100%;height:100%}
/* ── TOOLTIP ────────────────────────────── */
#tooltip{
  position:fixed;pointer-events:none;
  background:rgba(6,13,26,.98);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:11px;
  z-index:200;display:none;max-width:220px;
}
#tooltip .tt-name{font-size:12px;font-weight:600;color:#fff;margin-bottom:4px}
#tooltip .tt-row{display:flex;justify-content:space-between;gap:16px;padding:1px 0}
#tooltip .tt-key{color:var(--text2)}
#tooltip .tt-val{color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
/* ── LEGEND ─────────────────────────────── */
#legend{
  position:fixed;bottom:210px;left:16px;
  background:rgba(6,13,26,.9);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;z-index:100;
  display:flex;flex-direction:column;gap:5px;
}
.leg-row{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── ZOOM CONTROLS ──────────────────────── */
#zoom-controls{
  position:fixed;bottom:210px;right:16px;
  display:flex;flex-direction:column;gap:6px;z-index:100;
}
.zoom-btn{
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  background:rgba(6,13,26,.9);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--text2);transition:all .15s;font-size:16px;font-weight:300;
}
.zoom-btn:hover{color:#fff;border-color:var(--blue)}
/* ── ALERTS OVERLAY ─────────────────────── */
#alerts-container{
  position:fixed;top:100px;right:16px;z-index:200;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:300px;
}
.alert-toast{
  background:rgba(6,13,26,.98);border-radius:10px;
  padding:10px 14px;pointer-events:all;
  animation:toast-in .3s ease-out;border:1px solid;
  display:flex;align-items:flex-start;gap:10px;
}
@keyframes toast-in{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.alert-toast.info{border-color:rgba(68,138,255,.4)}
.alert-toast.warn{border-color:rgba(255,171,0,.4)}
.alert-toast.error{border-color:rgba(255,23,68,.4)}
.alert-toast.success{border-color:rgba(0,230,118,.4)}
.toast-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.toast-body .toast-title{font-size:12px;font-weight:600;color:#fff}
.toast-body .toast-msg{font-size:11px;color:var(--text2);margin-top:2px}
/* ── HEALTH BADGE ─────────────────────── */
#health-globe{
  position:fixed;bottom:210px;left:50%;transform:translateX(-50%);
  background:rgba(6,13,26,.9);border:1px solid var(--border);
  border-radius:30px;padding:6px 20px;z-index:100;
  display:flex;align-items:center;gap:10px;font-size:11px;
}
#health-score{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#health-label{color:var(--text2);font-size:10px}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#448aff" stroke-width="2">
      <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>

  </button>
  <button class="btn-icon" id="btn-freeze" title="Freeze physics">

    Freeze
  </button>
</div>

<!-- FILTER BAR -->
<div id="filterbar">
  <div class="filter-chip fc-all on" data-tier="all"><div class="dot"></div>All</div>
  <div class="filter-chip fc-client" data-tier="client"><div class="dot"></div>Client</div>
  <div class="filter-chip fc-infra" data-tier="infra"><div class="dot"></div>Infra</div>
  <div class="filter-chip fc-service" data-tier="service"><div class="dot"></div>Services</div>
  <div class="filter-chip fc-database" data-tier="database"><div class="dot"></div>Database</div>
  <div class="filter-chip fc-table" data-tier="table"><div class="dot"></div>Tables</div>

<!-- CANVAS -->

  <canvas id="canvas-main"></canvas>

<!-- HEALTH GLOBE -->

    <div style="font-size:12px;font-weight:600;color:#fff">System Health</div>
    <div id="health-label" style="color:var(--text2)">Calculating…</div>

</div>

<!-- LEGEND (compact — bottom right, above zoom controls) -->
<div id="legend" style="bottom:212px;right:56px;left:auto;flex-direction:row;gap:12px;padding:6px 12px">
  <div class="leg-row"><div class="leg-dot" style="background:var(--green)"></div>OK</div>
  <div class="leg-row"><div class="leg-dot" style="background:var(--yellow)"></div>Warn</div>
  <div class="leg-row"><div class="leg-dot" style="background:var(--red)"></div>Error</div>
  <div class="leg-row"><div style="width:16px;height:2px;background:linear-gradient(90deg,var(--blue),transparent)"></div>Real</div>
  <div class="leg-row"><div style="width:16px;height:2px;background:linear-gradient(90deg,rgba(68,138,255,.3),transparent)"></div>Heartbeat</div>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoom-controls">
  <div class="zoom-btn" id="zoom-in">+</div>
  <div class="zoom-btn" id="zoom-out">−</div>
  <div class="zoom-btn" id="zoom-fit" style="font-size:11px">fit</div>
</div>

<!-- EVENT FEED -->
<div id="event-feed">
  <div id="event-feed-header">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span class="title">Live Event Stream</span>
    <span id="event-count" style="font-size:10px;color:var(--text2)">0 events</span>
    <button class="btn-icon" id="btn-clear-feed" style="padding:3px 8px;font-size:10px">Clear</button>
    <label style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);cursor:pointer">
      <input type="checkbox" id="chk-autoscroll" checked style="accent-color:var(--blue)"> Auto-scroll
    </label>
  </div>
  <div id="events-list"></div>
</div>

<!-- SIDE PANEL -->
<div id="side-panel">
  <div id="panel-header">
    <div id="panel-icon" style="font-size:18px"></div>
    <div id="panel-title">Node Details</div>

</div>

  <div class="tt-name" id="tt-name"></div>
  <div id="tt-body"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   PAmarket Live System Topology
   Real-time architecture visualization
═══════════════════════════════════════════════════════════ */

const SUPABASE_URL = 'https://gxgytumhknmnwspxjzxw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cf3Z72lUE6PLCb2m42OFLA_znE8JK2r';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── TOPOLOGY DEFINITION ─────────────────────────────────── */
const NODES = [
  // CLIENTS
  { id:'browser',    label:'Browser',         tier:'client',   icon:'web',       desc:'Web browser client' },
  { id:'android',    label:'Android App',     tier:'client',   icon:'mobile',    desc:'Capacitor Android APK/AAB' },

  // INFRA
  { id:'dns',        label:'DNS',             tier:'infra',    icon:'cdn',       desc:'Domain resolution' },
  { id:'cdn',        label:'GitHub Pages CDN',tier:'infra',    icon:'cdn',       desc:'Static asset hosting' },
  { id:'r2',         label:'Cloudflare R2',   tier:'infra',    icon:'cloud',     desc:'Object storage CDN' },

  // SUPABASE SERVICES
  { id:'api',        label:'REST API',        tier:'service',  icon:'api',       desc:'PostgREST auto-generated' },
  { id:'auth',       label:'Authentication',  tier:'service',  icon:'auth',      desc:'GoTrue / PKCE / OAuth' },
  { id:'realtime',   label:'Realtime',        tier:'service',  icon:'realtime',  desc:'WebSocket subscriptions' },
  { id:'storage',    label:'Storage',         tier:'service',  icon:'storage',   desc:'Supabase Storage API' },

/* ── HISTORY RING BUFFER ────────────────────────────────── */
const HISTORY_MAX = 3000;
const HISTORY = [];
function recordHistory(type, msg, nodeIds) {
  HISTORY.push({ type, msg, nodeIds: nodeIds || [], ts: Date.now() });
  if (HISTORY.length > HISTORY_MAX) HISTORY.shift();
}
function getNodeHistory(nodeId, limit = 15) {
  const out = [];
  for (let i = HISTORY.length - 1; i >= 0 && out.length < limit; i--) {
    if (HISTORY[i].nodeIds.includes(nodeId)) out.push(HISTORY[i]);
  }
  return out;
}

/* ── TABLE RATE TRACKING ────────────────────────────────── */
function trackTableEvent(tableId, eventType) {
  if (!state.tableRates[tableId]) state.tableRates[tableId] = [];
  state.tableRates[tableId].push({ t: Date.now(), type: eventType });
  const cutoff = Date.now() - 120000; // keep 2 min window
  state.tableRates[tableId] = state.tableRates[tableId].filter(e => e.t > cutoff);
}
function getTableRate(tableId, eventType, windowMs = 60000) {
  const rates = state.tableRates[tableId] || [];
  const cutoff = Date.now() - windowMs;
  return rates.filter(e => e.t > cutoff && (!eventType || e.type === eventType)).length;
}

/* ── CANVAS SETUP ───────────────────────────────────────── */
const wrap = document.getElementById('canvas-wrap');
const bgCvs = document.getElementById('canvas-bg');
const cvs   = document.getElementById('canvas-main');
const bgCtx = bgCvs.getContext('2d');
const ctx   = cvs.getContext('2d');
let W, H;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  [bgCvs, cvs].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
    const c2 = c.getContext('2d');
    c2.scale(dpr, dpr);
  });
  drawBackground();
}

function drawBackground() {
  bgCtx.clearRect(0, 0, W, H);

  // Deep space gradient
  const g = bgCtx.createRadialGradient(W/2, H*.3, 0, W/2, H/2, Math.max(W,H)*.8);
  g.addColorStop(0,  '#04091e');
  g.addColorStop(.4, '#030712');
  g.addColorStop(1,  '#020408');
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0, 0, W, H);

  // Subtle grid
  bgCtx.strokeStyle = 'rgba(14,31,58,0.28)';
  bgCtx.lineWidth = 1;
  const gs = 60;
  for (let x = 0; x < W; x += gs) { bgCtx.beginPath(); bgCtx.moveTo(x,0); bgCtx.lineTo(x,H); bgCtx.stroke(); }
  for (let y = 0; y < H; y += gs) { bgCtx.beginPath(); bgCtx.moveTo(0,y); bgCtx.lineTo(W,y); bgCtx.stroke(); }

  // Tier lane horizontal bands
  const TIER_BANDS = [
    { y:.06, h:.14, label:'CLIENT',   color:'rgba(0,229,255,',   lc:'#00e5ff' },
    { y:.20, h:.10, label:'INFRA',    color:'rgba(255,171,0,',   lc:'#ffab00' },
    { y:.30, h:.20, label:'SERVICES', color:'rgba(68,138,255,',  lc:'#448aff' },
    { y:.50, h:.15, label:'DATABASE', color:'rgba(124,77,255,',  lc:'#7c4dff' },
    { y:.65, h:.20, label:'TABLES',   color:'rgba(164,122,255,', lc:'#a47aff' },
    { y:.85, h:.12, label:'EXTERNAL', color:'rgba(255,109,0,',   lc:'#ff6d00' },
  ];
  TIER_BANDS.forEach(b => {
    const by = b.y * H, bh = b.h * H;
    bgCtx.fillStyle = `${b.color}0.03)`;
    bgCtx.fillRect(0, by, W, bh);
    // Left edge accent line
    bgCtx.fillStyle = `${b.color}0.18)`;
    bgCtx.fillRect(0, by, 3, bh);
    // Label
    bgCtx.font = 'bold 9px monospace';
    bgCtx.fillStyle = b.lc + '55';
    bgCtx.letterSpacing = '2px';
    bgCtx.textAlign = 'left';
    bgCtx.textBaseline = 'middle';
    bgCtx.fillText(b.label, 10, by + bh / 2);
    bgCtx.letterSpacing = '0px';
    // Top border of band
    bgCtx.beginPath();
    bgCtx.moveTo(0, by); bgCtx.lineTo(W, by);
    bgCtx.strokeStyle = `${b.color}0.08)`;
    bgCtx.lineWidth = 1;
    bgCtx.stroke();
  });

  // Center glow
  const cg = bgCtx.createRadialGradient(W/2, H*.5, 0, W/2, H*.5, W*.45);
  cg.addColorStop(0, 'rgba(68,138,255,0.05)');
  cg.addColorStop(1, 'transparent');
  bgCtx.fillStyle = cg;
  bgCtx.fillRect(0, 0, W, H);
}

/* ── ICON DRAWING ─────────────────────────────────────────── */
function drawIcon(ctx2, icon, x, y, size, color) {
  ctx2.save();
  ctx2.strokeStyle = color;
  ctx2.fillStyle = color;
  ctx2.lineWidth = 1.5;
  ctx2.lineCap = 'round';
  ctx2.lineJoin = 'round';
  const s = size * .35;
  ctx2.translate(x, y);

  switch(icon) {
    case 'mobile':
      ctx2.strokeRect(-s*.5, -s*.8, s, s*1.6);
      ctx2.beginPath(); ctx2.arc(0, s*.55, s*.1, 0, Math.PI*2); ctx2.fill();
      break;
    case 'web':
      ctx2.beginPath(); ctx2.arc(0, 0, s*.8, 0, Math.PI*2); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(-s*.8,0); ctx2.lineTo(s*.8,0); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(0,-s*.8); ctx2.bezierCurveTo(s*.5,-s*.4, s*.5,s*.4, 0,s*.8); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(0,-s*.8); ctx2.bezierCurveTo(-s*.5,-s*.4,-s*.5,s*.4,0,s*.8); ctx2.stroke();
      break;
    case 'admin':
      ctx2.beginPath(); ctx2.arc(0,-s*.2,s*.35,0,Math.PI*2); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(-s*.6,s*.7); ctx2.quadraticCurveTo(0,s*.1, s*.6,s*.7); ctx2.stroke();
      ctx2.beginPath(); ctx2.rect(-s*.3,-s*.8,s*.6,s*.15); ctx2.fill();
      break;
    case 'cdn':
      for(let i=0;i<3;i++){ const a=i/3*Math.PI*2-Math.PI/2; ctx2.beginPath(); ctx2.arc(Math.cos(a)*s*.5, Math.sin(a)*s*.5, s*.2,0,Math.PI*2); ctx2.stroke(); }
      ctx2.beginPath(); for(let i=0;i<3;i++){const a=i/3*Math.PI*2-Math.PI/2; ctx2.moveTo(0,0); ctx2.lineTo(Math.cos(a)*s*.3,Math.sin(a)*s*.3);} ctx2.stroke();
      break;
    case 'cloud':
      ctx2.beginPath(); ctx2.arc(-s*.3,s*.1,s*.35,0,Math.PI*2); ctx2.arc(s*.2,0,s*.45,0,Math.PI*2); ctx2.arc(0,s*.3,s*.3,0,Math.PI*2); ctx2.fill();
      ctx2.beginPath(); ctx2.arc(-s*.3,s*.1,s*.35,0,Math.PI*2); ctx2.arc(s*.2,0,s*.45,0,Math.PI*2); ctx2.stroke();
      break;
    case 'api':
      ctx2.font = `bold ${s*.8}px monospace`;
      ctx2.textAlign='center'; ctx2.textBaseline='middle';
      ctx2.fillStyle = color;
      ctx2.fillText('</>',0,0);
      break;
    case 'auth':
      ctx2.beginPath(); ctx2.arc(0,-s*.2,s*.4,Math.PI,0); ctx2.lineTo(s*.4,s*.5); ctx2.lineTo(-s*.4,s*.5); ctx2.closePath(); ctx2.stroke();
      ctx2.beginPath(); ctx2.arc(0,s*.35,s*.1,0,Math.PI*2); ctx2.fill();
      break;
    case 'realtime':
      for(let i=1;i<=3;i++){
        ctx2.globalAlpha=.3+i*.2; ctx2.beginPath();
        ctx2.arc(0,0,s*.2*i,Math.PI*1.3,Math.PI*1.7); ctx2.stroke();
        ctx2.arc(0,0,s*.2*i,Math.PI*.3,Math.PI*.7); ctx2.stroke();
      }
      ctx2.globalAlpha=1; ctx2.beginPath(); ctx2.arc(0,0,s*.1,0,Math.PI*2); ctx2.fill();
      break;
    case 'storage':
      ctx2.beginPath(); ctx2.arc(0,-s*.4,s*.55,Math.PI,0); ctx2.lineTo(s*.55,s*.4); ctx2.arc(0,s*.4,s*.55,0,Math.PI); ctx2.closePath(); ctx2.stroke();
      ctx2.beginPath(); ctx2.arc(0,-s*.4,s*.55,0,Math.PI); ctx2.stroke();
      break;
    case 'lambda':
      ctx2.font = `bold ${s*1.2}px monospace`;
      ctx2.textAlign='center'; ctx2.textBaseline='middle'; ctx2.fillStyle=color; ctx2.fillText('λ',0,0);
      break;
    case 'db':
      const dw=s*.7, dh=s*.25;
      ctx2.beginPath(); ctx2.ellipse(0,-s*.4,dw,dh,0,0,Math.PI*2); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(-dw,-s*.4); ctx2.lineTo(-dw,s*.4); ctx2.moveTo(dw,-s*.4); ctx2.lineTo(dw,s*.4); ctx2.stroke();
      ctx2.beginPath(); ctx2.ellipse(0,s*.4,dw,dh,0,0,Math.PI); ctx2.stroke();
      ctx2.beginPath(); ctx2.ellipse(0,0,dw,dh,0,0,Math.PI); ctx2.stroke();
      break;
    case 'firebase':
      ctx2.beginPath(); ctx2.moveTo(-s*.4,s*.5); ctx2.lineTo(0,-s*.7); ctx2.lineTo(s*.2,-s*.1); ctx2.lineTo(s*.4,s*.5); ctx2.closePath(); ctx2.fill();
      ctx2.fillStyle='rgba(0,0,0,.3)'; ctx2.beginPath(); ctx2.moveTo(0,-s*.7); ctx2.lineTo(s*.2,-s*.1); ctx2.lineTo(-s*.1,s*.2); ctx2.closePath(); ctx2.fill();
      break;
    case 'email':
      ctx2.strokeRect(-s*.6,-s*.4,s*1.2,s*.8);
      ctx2.beginPath(); ctx2.moveTo(-s*.6,-s*.4); ctx2.lineTo(0,s*.1); ctx2.lineTo(s*.6,-s*.4); ctx2.stroke();
      break;
    case 'google':
      ctx2.beginPath(); ctx2.arc(0,0,s*.65,0,Math.PI*2); ctx2.stroke();
      ctx2.beginPath(); ctx2.moveTo(s*.65,0); ctx2.lineTo(s*.15,0); ctx2.arc(0,0,s*.15,0,Math.PI*2); ctx2.stroke();
      break;
    case 'facebook':
      ctx2.font=`bold ${s*1.1}px serif`; ctx2.textAlign='center'; ctx2.textBaseline='middle'; ctx2.fillText('f',0,0);
      break;
    case 'device':
      ctx2.strokeRect(-s*.45,-s*.65,s*.9,s*1.3);
      ctx2.beginPath(); ctx2.moveTo(-s*.2,-s*.55); ctx2.lineTo(s*.2,-s*.55); ctx2.stroke();
      ctx2.beginPath(); ctx2.arc(0,s*.5,s*.08,0,Math.PI*2); ctx2.fill();
      break;
    default:
      // Generic hexagon
      ctx2.beginPath();
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2-Math.PI/6; ctx2.lineTo(Math.cos(a)*s*.7, Math.sin(a)*s*.7);}
      ctx2.closePath(); ctx2.stroke();
  }
  ctx2.restore();
}

/* ── NODE RENDERING ─────────────────────────────────────── */
const NODE_R = { client:38, infra:34, service:36, database:44, table:26, external:34 };

function getNodeRadius(node) { return NODE_R[node.tier] || 32; }
function getNodeHealth(node) { return state.healthChecks[node.id] || 'healthy'; }
function healthColor(h) { return HEALTH_COLOR[h] || HEALTH_COLOR.unknown; }

function drawNode(node) {
  if (!isNodeVisible(node)) return;
  const { x, y } = toScreen(node);
  const r = getNodeRadius(node);
  const health = getNodeHealth(node);
  const hc = healthColor(health);
  const tc = TIER_COLOR[node.tier] || '#448aff';
  const isSelected = state.selectedNode === node.id;
  const isHovered  = state.hoveredNode === node.id;
  const isHighlit  = state.searchTerm && node.label.toLowerCase().includes(state.searchTerm);

  // Pulse ring for healthy nodes
  const t = performance.now();
  if (health === 'healthy' && !state.frozen) {
    const pulsed = (Math.sin(t / 1000 + node._phase) + 1) / 2;
    ctx.beginPath();
    ctx.arc(x, y, r + 4 + pulsed * 8, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(0,230,118,${.08 * pulsed})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Error pulsing
  if (health === 'error') {
    const pulse = (Math.sin(t / 400) + 1) / 2;
    ctx.beginPath();
    ctx.arc(x, y, r + 6 + pulse * 10, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,23,68,${.2 * pulse})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Outer glow ring (selection / hover)
  if (isSelected || isHovered || isHighlit) {
    ctx.beginPath();
    ctx.arc(x, y, r + 3, 0, Math.PI*2);
    ctx.strokeStyle = isHighlit ? '#ffab00' : (isSelected ? hc : 'rgba(255,255,255,.4)');
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.stroke();
  }

  // Main circle fill
  const grad = ctx.createRadialGradient(x - r*.2, y - r*.2, 0, x, y, r);
  grad.addColorStop(0, `${tc}22`);
  grad.addColorStop(1, `${tc}08`);
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Border
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.strokeStyle = hc;
  ctx.lineWidth = health === 'error' ? 2.5 : 1.5;
  ctx.stroke();

  // Tier dot top-right
  ctx.beginPath();
  ctx.arc(x + r*.65, y - r*.65, 4, 0, Math.PI*2);
  ctx.fillStyle = tc;
  ctx.fill();

  // Health indicator bottom-right
  ctx.beginPath();
  ctx.arc(x + r*.6, y + r*.6, 5, 0, Math.PI*2);
  ctx.fillStyle = '#060d1a';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r*.6, y + r*.6, 4, 0, Math.PI*2);
  ctx.fillStyle = hc;
  ctx.fill();

  // Icon
  drawIcon(ctx, node.icon || 'default', x, y - 4, r * 1.8, tc);

  // Label
  ctx.font = `${node.tier === 'table' ? 9 : 10}px 'Segoe UI', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#c8d8f0';
  ctx.fillText(node.label, x, y + r + 4);

  // Traffic counter
  const traffic = (state.stats[node.id] || {}).traffic || 0;
  if (traffic > 0) {
    ctx.font = 'bold 9px monospace';
    ctx.fillStyle = tc;
    ctx.fillText(traffic + '/s', x, y + r + 16);
  }
}

/* ── EDGE RENDERING ─────────────────────────────────────── */
function drawEdge(edge) {
  const sn = findNode(edge.s), tn = findNode(edge.t);
  if (!sn || !tn) return;
  if (!isNodeVisible(sn) || !isNodeVisible(tn)) return;

  const sx = screenX(sn), sy = screenY(sn);
  const tx = screenX(tn), ty = screenY(tn);
  const ec = EDGE_COLOR[edge.type] || '#448aff';
  const health = Math.min(
    getNodeHealth(sn) === 'error' ? 0 : 1,
    getNodeHealth(tn) === 'error' ? 0 : 1
  );
  const lineColor = health === 0 ? '#ff174480' : `${ec}50`;

  // Bezier control point
  const mx = (sx + tx) / 2 + (ty - sy) * .15;
  const my = (sy + ty) / 2 + (sx - tx) * .15;

  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.quadraticCurveTo(mx, my, tx, ty);
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 8]);
  ctx.lineDashOffset = -(performance.now() / 80) % 12;
  ctx.stroke();
  ctx.setLineDash([]);

  // Arrow head at target
  const angle = Math.atan2(ty - my, tx - mx);
  const aw = 6;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - aw * Math.cos(angle - .4), ty - aw * Math.sin(angle - .4));
  ctx.lineTo(tx - aw * Math.cos(angle + .4), ty - aw * Math.sin(angle + .4));
  ctx.closePath();
  ctx.fillStyle = lineColor;
  ctx.fill();
}

/* ── PARTICLE SYSTEM ─────────────────────────────────────── */
function spawnParticle(sourceId, targetId, type, payload) {
  const sn = findNode(sourceId), tn = findNode(targetId);
  if (!sn || !tn) return;
  state.particles.push({
    id: ++state.particleId,
    s: sourceId, t: targetId,
    type,
    payload,
    progress: 0,
    speed: .004 + Math.random() * .003,
    color: EDGE_COLOR[type] || '#448aff',
    size: type === 'error' ? 5 : 4,
    trail: [],
    born: performance.now(),
  });
}

function spawnChain(chain, type, payload, delay = 0) {
  for (let i = 0; i < chain.length - 1; i++) {
    setTimeout(() => spawnParticle(chain[i], chain[i+1], type, payload), delay + i * 250);
  }
}

function updateParticles() {
  const now = performance.now();
  state.particles = state.particles.filter(p => {
    if (p.progress >= 1) return false;
    if (now - p.born > 8000) return false;
    p.trail.push(p.progress);
    if (p.trail.length > 8) p.trail.shift();
    p.progress = Math.min(1, p.progress + p.speed);
    return true;
  });
}

function drawParticles() {
  for (const p of state.particles) {
    const sn = findNode(p.s), tn = findNode(p.t);
    if (!sn || !tn) continue;
    if (!isNodeVisible(sn) || !isNodeVisible(tn)) continue;

    const sx = screenX(sn), sy = screenY(sn);
    const tx = screenX(tn), ty = screenY(tn);
    const mx = (sx + tx) / 2 + (ty - sy) * .15;
    const my = (sy + ty) / 2 + (sx - tx) * .15;

    const pos = bezierPoint(sx, sy, mx, my, tx, ty, p.progress);

    // Trail
    for (let i = 0; i < p.trail.length; i++) {
      const tp = bezierPoint(sx, sy, mx, my, tx, ty, p.trail[i]);
      const alpha = (i / p.trail.length) * .4;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, p.size * (i / p.trail.length), 0, Math.PI*2);
      ctx.fillStyle = p.color + hex2(alpha * 255);
      ctx.fill();
    }

    // Head
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.fill();

    // Glow
    const gw = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, p.size * 3);
    gw.addColorStop(0, p.color + 'aa');
    gw.addColorStop(1, p.color + '00');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.size * 3, 0, Math.PI*2);
    ctx.fillStyle = gw;
    ctx.fill();
  }
}

function bezierPoint(x0, y0, cx, cy, x1, y1, t) {
  const mt = 1 - t;
  return {
    x: mt*mt*x0 + 2*mt*t*cx + t*t*x1,
    y: mt*mt*y0 + 2*mt*t*cy + t*t*y1,
  };
}
function hex2(v) { return ('0' + Math.max(0,Math.min(255,Math.round(v))).toString(16)).slice(-2); }

/* ── COORDINATE TRANSFORMS ──────────────────────────────── */
function toScreen(node) {
  return {
    x: node.x * state.transform.scale + state.transform.x,
    y: node.y * state.transform.scale + state.transform.y,
  };
}
function screenX(node) { return node.x * state.transform.scale + state.transform.x; }
function screenY(node) { return node.y * state.transform.scale + state.transform.y; }
function toWorld(sx, sy) {
  return {
    x: (sx - state.transform.x) / state.transform.scale,
    y: (sy - state.transform.y) / state.transform.scale,
  };
}

/* ── D3 FORCE SIMULATION ───────────────────────────────── */
let simulation;

const TIER_Y = { client: .15, infra: .25, service: .42, database: .62, table: .80, external: .92 };
const TIER_X_BASE = {
  client:   [.2, .5, .8],
  infra:    [.3, .7],
  service:  [.12, .28, .45, .62, .78],
  database: [.5],
  table:    [],
  external: [],
};

function initSimulation() {
  const nodes = state.nodes.map(n => ({ ...n }));
  state.nodes = nodes;

  // Assign initial positions by tier
  const tierCounters = {};
  nodes.forEach(n => {
    tierCounters[n.tier] = (tierCounters[n.tier] || 0) + 1;
  });
  const tierIdx = {};
  nodes.forEach(n => {
    tierIdx[n.tier] = (tierIdx[n.tier] || 0);
    const count = tierCounters[n.tier];
    const xFrac = (tierIdx[n.tier] + 1) / (count + 1);
    const yFrac = TIER_Y[n.tier] || .5;
    if (!n.x || n.x === 0) n.x = xFrac * W - W/2;
    if (!n.y || n.y === 0) n.y = yFrac * H - H/2;
    n._phase = Math.random() * Math.PI * 2;
    tierIdx[n.tier]++;
  });

  const links = state.edges
    .filter(e => findNode(e.s) && findNode(e.t))
    .map(e => ({ source: e.s, target: e.t }));

  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      const sn = findNode(d.source.id||d.source), tn = findNode(d.target.id||d.target);
      if (!sn || !tn) return 120;
      if (sn.tier === 'db' || tn.tier === 'db') return 100;
      if (sn.tier === 'table' || tn.tier === 'table') return 80;
      return 150;
    }).strength(0.3))
    .force('charge', d3.forceManyBody().strength(d => d.tier === 'table' ? -150 : -400))
    .force('collision', d3.forceCollide(d => getNodeRadius(d) + 20))
    .force('x', d3.forceX(d => {
      const tierCnt = tierCounters[d.tier] || 1;
      const idx = nodes.filter(n => n.tier === d.tier).indexOf(d);
      return ((idx + 1) / (tierCnt + 1)) * W - W/2;
    }).strength(0.15))
    .force('y', d3.forceY(d => (TIER_Y[d.tier] || .5) * H - H/2).strength(0.3))
    .alphaDecay(0.02)
    .on('tick', () => { if (!state.frozen) render(); });

  centerView();
}

function centerView() {
  state.transform.x = W / 2;
  state.transform.y = H / 2;
  state.transform.scale = 0.85;
}

/* ── MAIN RENDER LOOP ────────────────────────────────────── */
let _frameCount = 0;
function render() {
  requestAnimationFrame(render);
  ctx.clearRect(0, 0, W, H);

  // Edges first (behind nodes)
  for (const e of state.edges) drawEdge(e);

  // Particles (skip update when paused, still draw existing ones)
  if (!state.frozen && !state.paused) updateParticles();
  drawParticles();

  // Nodes
  for (const n of state.nodes) drawNode(n);

  // Minimap every 6th frame to save CPU
  _frameCount++;
  if (_frameCount % 6 === 0) drawMinimap();
}

/* ── FAILURE PROPAGATION ─────────────────────────────────── */
// Which services break when a node fails
const DEPENDENCY_MAP = {
  db:       ['api','realtime','storage','functions'],
  api:      ['browser','android','ios','admin'],
  auth:     ['browser','android','ios','admin'],
  realtime: ['browser','android','ios'],
  storage:  ['r2','bkt_listings_photos','bkt_chat_images','bkt_cv_files','bkt_verification_docs'],
  functions:['fcm','smtp'],
  fcm:      ['device'],
};

function propagateFailure(nodeId) {
  const deps = DEPENDENCY_MAP[nodeId] || [];
  if (!deps.length) return;
  deps.forEach((depId, i) => {
    setTimeout(() => {
      const n = findNode(depId);
      if (!n) return;
      const current = state.healthChecks[depId];
      if (current === 'healthy' || current === undefined) {
        state.healthChecks[depId] = 'warning';
        // Spawn a red error particle along the edge
        spawnErrorParticle(nodeId, depId);
      }
    }, i * 180);
  });
}

function spawnErrorParticle(srcId, tgtId) {
  const sn = findNode(srcId), tn = findNode(tgtId);
  if (!sn || !tn) return;
  state.particles.push({
    id: ++state.particleId,
    s: srcId, t: tgtId,
    type: 'error',
    payload: 'failure cascade',
    progress: 0,
    speed: .006,
    color: '#ff1744',
    size: 6,
    trail: [],
    born: performance.now(),
    isError: true,
  });
}

function recoverNode(nodeId) {
  state.healthChecks[nodeId] = 'healthy';
  const deps = DEPENDENCY_MAP[nodeId] || [];
  deps.forEach(depId => {
    if (state.healthChecks[depId] === 'warning') {
      state.healthChecks[depId] = 'healthy';
    }
  });
  updateHealthScore();
}

/* ── LATENCY HISTORY ─────────────────────────────────────── */
// Rolling 20-sample latency history per service for sparklines
const LATENCY_HISTORY = {};
function recordLatency(serviceId, ms) {
  if (!LATENCY_HISTORY[serviceId]) LATENCY_HISTORY[serviceId] = [];
  LATENCY_HISTORY[serviceId].push({ t: Date.now(), ms });
  if (LATENCY_HISTORY[serviceId].length > 30) LATENCY_HISTORY[serviceId].shift();
}

function drawSparkline(canvasEl, serviceId, color = '#448aff') {
  if (!canvasEl) return;
  const history = LATENCY_HISTORY[serviceId] || [];
  if (history.length < 2) return;
  const ctx2 = canvasEl.getContext('2d');
  const w = canvasEl.offsetWidth, h = canvasEl.offsetHeight;
  canvasEl.width = w; canvasEl.height = h;
  ctx2.clearRect(0, 0, w, h);
  const vals = history.map(p => p.ms);
  const maxV = Math.max(...vals, 100);
  const minV = Math.min(...vals, 0);
  const range = maxV - minV || 1;
  ctx2.beginPath();
  vals.forEach((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - minV) / range) * h * .85 - h * .05;
    i === 0 ? ctx2.moveTo(x, y) : ctx2.lineTo(x, y);
  });
  ctx2.strokeStyle = color;
  ctx2.lineWidth = 1.5;
  ctx2.stroke();
  // Fill area under
  ctx2.lineTo(w, h); ctx2.lineTo(0, h); ctx2.closePath();
  ctx2.fillStyle = color + '22';
  ctx2.fill();
  // Latest value label
  const latest = vals[vals.length - 1];
  ctx2.font = 'bold 9px monospace';
  ctx2.fillStyle = color;
  ctx2.textAlign = 'right';
  ctx2.textBaseline = 'top';
  ctx2.fillText(latest + 'ms', w - 2, 2);
}

/* ── NODE LOOKUP ─────────────────────────────────────────── */
function findNode(id) { return state.nodes.find(n => n.id === (id?.id || id)); }
function isNodeVisible(node) {
  if (!state.showTables && node.tier === 'table') return false;
  if (state.filterTier !== 'all' && node.tier !== state.filterTier) return false;
  if (state.filterErrors && getNodeHealth(node) !== 'error') return false;
  return true;
}
function nodeAt(sx, sy) {
  const w = toWorld(sx, sy);
  return state.nodes.find(n => {
    if (!isNodeVisible(n)) return false;
    const r = getNodeRadius(n);
    return Math.hypot(n.x - w.x, n.y - w.y) < r + 4;
  });
}

/* ── INTERACTION ─────────────────────────────────────────── */
let isPanning = false, panStart = null, panOrigin = null;

cvs.addEventListener('mousedown', e => {
  const node = nodeAt(e.offsetX, e.offsetY);
  if (node) {
    state.dragging = { node, ox: node.x - toWorld(e.offsetX, e.offsetY).x, oy: node.y - toWorld(e.offsetX, e.offsetY).y };
    if (simulation) { simulation.alphaTarget(.3).restart(); }
    cvs.classList.add('grabbing');
  } else {
    isPanning = true;
    panStart = { x: e.clientX, y: e.clientY };
    panOrigin = { ...state.transform };
    cvs.classList.add('grabbing');
  }
});

window.addEventListener('mousemove', e => {
  if (state.dragging) {
    const w = toWorld(e.offsetX, e.offsetY);
    state.dragging.node.x = w.x + state.dragging.ox;
    state.dragging.node.y = w.y + state.dragging.oy;
    if (simulation) simulation.alphaTarget(.3).restart();
  } else if (isPanning) {
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    state.transform.x = panOrigin.x + dx;
    state.transform.y = panOrigin.y + dy;
  } else {
    const node = nodeAt(e.offsetX, e.offsetY);
    const prev = state.hoveredNode;
    state.hoveredNode = node ? node.id : null;
    if (node) { showTooltip(e, node); cvs.style.cursor = 'pointer'; }
    else { hideTooltip(); cvs.style.cursor = ''; }
  }
});

window.addEventListener('mouseup', () => {
  if (state.dragging) {
    state.dragging.node.fx = state.dragging.node.x;
    state.dragging.node.fy = state.dragging.node.y;
    if (simulation) simulation.alphaTarget(0);
    state.dragging = null;
  }
  isPanning = false;
  cvs.classList.remove('grabbing');
});

cvs.addEventListener('click', e => {
  const node = nodeAt(e.offsetX, e.offsetY);
  if (node) {
    state.selectedNode = state.selectedNode === node.id ? null : node.id;
    if (state.selectedNode) openPanel(node);
    else closePanel();
  } else {
    state.selectedNode = null;
    closePanel();
  }
});

cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? .9 : 1.1;
  const mx = e.offsetX, my = e.offsetY;
  state.transform.x = mx + (state.transform.x - mx) * factor;
  state.transform.y = my + (state.transform.y - my) * factor;
  state.transform.scale = Math.max(.2, Math.min(3, state.transform.scale * factor));
}, { passive: false });

document.getElementById('zoom-in').onclick = () => zoom(1.2);
document.getElementById('zoom-out').onclick = () => zoom(.8);
document.getElementById('zoom-fit').onclick = () => { centerView(); };
function zoom(f) {
  state.transform.x = W/2 + (state.transform.x - W/2) * f;
  state.transform.y = H/2 + (state.transform.y - H/2) * f;
  state.transform.scale = Math.max(.2, Math.min(3, state.transform.scale * f));
}

let mmCanvas, mmCtx;
function initMinimap() {
  mmCanvas = document.createElement('canvas');
  mmCanvas.style.cssText = `
    position:fixed;bottom:212px;left:16px;width:160px;height:90px;
    background:rgba(3,6,15,.85);border:1px solid #0e1f3a;border-radius:8px;
    z-index:100;cursor:pointer;
  `;
  mmCanvas.title = 'Click to fit view';
  mmCanvas.addEventListener('click', centerView);
  document.body.appendChild(mmCanvas);
  mmCtx = mmCanvas.getContext('2d');
}

function drawMinimap() {
  if (!mmCtx || !state.nodes.length) return;
  const mw = 160, mh = 90;
  mmCanvas.width = mw; mmCanvas.height = mh;
  mmCtx.clearRect(0, 0, mw, mh);

  // Find bounding box of all nodes
  const xs = state.nodes.map(n => n.x), ys = state.nodes.map(n => n.y);
  const minX = Math.min(...xs) - 60, maxX = Math.max(...xs) + 60;
  const minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 60;
  const rangeX = maxX - minX || 1, rangeY = maxY - minY || 1;
  const scaleM = Math.min((mw - 8) / rangeX, (mh - 8) / rangeY);
  const offX = 4 - minX * scaleM, offY = 4 - minY * scaleM;

  const mx = n => n.x * scaleM + offX;
  const my = n => n.y * scaleM + offY;

  // Draw edges
  mmCtx.lineWidth = 0.5;
  state.edges.forEach(e => {
    const sn = findNode(e.s), tn = findNode(e.t);
    if (!sn || !tn || !isNodeVisible(sn) || !isNodeVisible(tn)) return;
    mmCtx.beginPath();
    mmCtx.moveTo(mx(sn), my(sn));
    mmCtx.lineTo(mx(tn), my(tn));
    mmCtx.strokeStyle = (EDGE_COLOR[e.type]||'#448aff') + '40';
    mmCtx.stroke();
  });

  // Draw nodes
  state.nodes.forEach(n => {
    if (!isNodeVisible(n)) return;
    const r = n.tier === 'table' ? 2 : 3.5;
    mmCtx.beginPath();
    mmCtx.arc(mx(n), my(n), r, 0, Math.PI * 2);
    const hc = healthColor(getNodeHealth(n));
    mmCtx.fillStyle = hc;
    mmCtx.fill();
  });

  // Viewport rectangle
  const vl = -state.transform.x / state.transform.scale;
  const vt = -state.transform.y / state.transform.scale;
  const vr = vl + W / state.transform.scale;
  const vb = vt + H / state.transform.scale;
  mmCtx.strokeStyle = 'rgba(68,138,255,.6)';
  mmCtx.lineWidth = 1;
  mmCtx.strokeRect(
    vl * scaleM + offX, vt * scaleM + offY,
    (vr - vl) * scaleM, (vb - vt) * scaleM
  );
}

let totalEventCount = 0;

function addEvent(type, msg, payload, spawnParticles = true) {
  totalEventCount++;
  state.eventCountWindow.push(Date.now());
  const cutoff = Date.now() - 60000;
  state.eventCountWindow = state.eventCountWindow.filter(t => t > cutoff);
  document.getElementById('sv-events').textContent = state.eventCountWindow.length;
  document.getElementById('event-count').textContent = totalEventCount + ' events';

  const cfg = EVENT_ICONS[type] || { icon:'●', color:'#448aff', chain:[] };

  // Record to history ring buffer
  recordHistory(type, msg, cfg.chain || []);

  if (state.paused) return; // still record but don't animate

  // Spawn particles
  if (spawnParticles && cfg.chain.length > 1) spawnChain(cfg.chain, type, msg);

  // Update node traffic
  cfg.chain.forEach(id => {
    if (!state.stats[id]) state.stats[id] = {};
    state.stats[id].traffic = (state.stats[id].traffic || 0) + 1;
    setTimeout(() => { if (state.stats[id]) state.stats[id].traffic = Math.max(0, state.stats[id].traffic - 1); }, 5000);
  });

  const list = document.getElementById('events-list');
  const div = document.createElement('div');
  div.className = 'evt';

  const pathNodes = cfg.chain.slice(0, 5);
  const pathHtml = pathNodes.map((id,i) => {
    const n = findNode(id);
    return `${i > 0 ? '<span class="arrow">→</span>' : ''}<span class="node-chip">${n?.label||id}</span>`;
  }).join('');

  div.innerHTML = `
    <div class="evt-icon" style="background:${cfg.color}22;color:${cfg.color}">${cfg.icon}</div>
    <div class="evt-msg" style="color:${cfg.color}">${msg}</div>
    <div class="evt-path">${pathHtml}</div>
    <div class="evt-time">${new Date().toLocaleTimeString()}</div>
  `;
  list.prepend(div);

  // Keep max 200 events
  while (list.children.length > 200) list.removeChild(list.lastChild);

  if (document.getElementById('chk-autoscroll').checked) {
    list.scrollTop = 0;
  }
}

/* ── OPENAPI SCHEMA AUTO-DISCOVERY ──────────────────────── */
async function discoverSchema() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    if (!r.ok) return;
    const spec = await r.json();
    state.schemaSpec = spec;
    const defs = Object.keys(spec.definitions || {});
    const rpcs = Object.keys(spec.paths || {}).filter(p => p.startsWith('/rpc/')).map(p => p.slice(5));

    // Add dynamically discovered tables not already in our static list
    let added = 0;
    defs.forEach(tbl => {
      const nodeId = `tb_${tbl}`;
      if (!findNode(nodeId)) {
        state.nodes.push({
          id: nodeId, label: tbl, tier: 'table', parent: 'db',
          desc: `Auto-discovered — ${Object.keys(spec.definitions[tbl]?.properties || {}).length} columns`,
          x: 0, y: 0, _phase: Math.random() * Math.PI * 2,
          discovered: true,
        });
        state.edges.push({ s: 'db', t: nodeId, type: 'query', label: 'RLS' });
        state.discoveredTables.add(tbl);
        added++;
      } else {
        // Enrich existing node with column count
        const n = findNode(nodeId);
        if (n) n.columns = Object.keys(spec.definitions[tbl]?.properties || {});
      }
    });

    if (added > 0) {
      addEvent('api_request', `[discovery] Found ${defs.length} tables, ${rpcs.length} RPCs via OpenAPI`, EDGES.map(e=>e.s), false);
      if (simulation) { simulation.nodes(state.nodes); simulation.alpha(0.3).restart(); }
      document.getElementById('sv-nodes').textContent = state.nodes.length;
    }
    return { tables: defs, rpcs };
  } catch(e) { console.warn('Schema discovery:', e.message); }
}

/* ── STORAGE BUCKET DISCOVERY ────────────────────────────── */
async function discoverBuckets() {
  try {
    const { data, error } = await sb.storage.listBuckets();
    if (error || !data) return;
    state.buckets = data;
    state.healthChecks['storage'] = 'healthy';

    // Dynamically sync bucket nodes
    data.forEach(bucket => {
      const nodeId = `bkt_${bucket.name.replace(/-/g,'_')}`;
      const existing = findNode(nodeId);
      if (existing) {
        existing.desc = `${bucket.public ? 'Public' : 'Private'} bucket`;
        existing.bucketData = bucket;
      }
    });

    // Probe file counts per known bucket
    for (const b of data) {
      try {
        const { data: files } = await sb.storage.from(b.name).list('', { limit: 1, offset: 0 });
        const nodeId = `bkt_${b.name.replace(/-/g,'_')}`;
        if (!state.tableStats[nodeId]) state.tableStats[nodeId] = {};
        state.tableStats[nodeId].public = b.public;
        state.tableStats[nodeId].bucketName = b.name;
      } catch(e) {}
    }
  } catch(e) {}
}

      updateTableStat('tb_transactions', 1);
    })
    .subscribe(status => updateChannelHealth('tb_transactions', status));

  state.healthChecks['realtime'] = 'healthy';
}

function updateChannelHealth(nodeId, status) {
  if (status === 'SUBSCRIBED') state.healthChecks[nodeId] = 'healthy';
  else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
    state.healthChecks[nodeId] = 'error';
    showAlert('warn', `Realtime: ${nodeId}`, `Subscription status: ${status}`);
  }
}

function updateTableStat(id, delta) {
  if (!state.tableStats[id]) state.tableStats[id] = { count: 0 };
  state.tableStats[id].count = (state.tableStats[id].count || 0) + delta;
}

/* ── HEALTH CHECKS ───────────────────────────────────────── */
async function runHealthChecks() {
  // DB health — measure round-trip latency
  const t0 = performance.now();
  try {
    await sb.from('profiles').select('id', { count: 'exact', head: true });
    const lat = Math.round(performance.now() - t0);
    const prev = state.healthChecks['db'];
    state.healthChecks['db'] = lat < 600 ? 'healthy' : lat < 2500 ? 'warning' : 'error';
    state.healthChecks['api'] = 'healthy';
    state.stats['db']  = { latency: lat };
    state.stats['api'] = { latency: lat };
    recordLatency('db', lat);
    recordLatency('api', lat);
    document.getElementById('sv-latency').textContent = lat + 'ms';
    if (prev === 'error' && state.healthChecks['db'] === 'healthy') {
      recoverNode('db');
      showAlert('success', 'Database recovered', `Latency: ${lat}ms`);
    }
  } catch(e) {
    const prev = state.healthChecks['db'];
    state.healthChecks['db'] = 'error';
    state.healthChecks['api'] = 'error';
    if (prev !== 'error') {
      propagateFailure('db');
      showAlert('error', 'Database unreachable', e.message);
    }
  }

  // Auth health — measure GoTrue response
  const ta = performance.now();
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/health`, {
      headers: { 'apikey': SUPABASE_KEY }, signal: AbortSignal.timeout(4000)
    });
    const lat = Math.round(performance.now() - ta);
    const prev = state.healthChecks['auth'];
    state.healthChecks['auth'] = r.ok ? 'healthy' : 'warning';
    state.stats['auth'] = { latency: lat };
    recordLatency('auth', lat);
    if (prev === 'error' && state.healthChecks['auth'] === 'healthy') recoverNode('auth');
  } catch(e) {
    const prev = state.healthChecks['auth'];
    state.healthChecks['auth'] = 'error';
    if (prev !== 'error') { propagateFailure('auth'); showAlert('error', 'Auth unreachable', e.message); }
  }

  // Realtime health — check WebSocket endpoint
  const tr = performance.now();
  try {
    const r = await fetch(`${SUPABASE_URL}/realtime/v1/`, {
      method:'HEAD', headers: { 'apikey': SUPABASE_KEY }, signal: AbortSignal.timeout(3000)
    });
    const lat = Math.round(performance.now() - tr);
    state.healthChecks['realtime'] = r.status < 500 ? 'healthy' : 'warning';
    state.stats['realtime'] = { latency: lat };
    recordLatency('realtime', lat);
  } catch { state.healthChecks['realtime'] = 'warning'; }

  // Storage health
  const ts = performance.now();
  try {
    const { data, error } = await sb.storage.listBuckets();
    const lat = Math.round(performance.now() - ts);
    if (!error) {
      const prev = state.healthChecks['storage'];
      state.healthChecks['storage'] = 'healthy';
      state.healthChecks['r2'] = 'healthy';
      state.stats['storage'] = { buckets: data?.length || 0, latency: lat };
      recordLatency('storage', lat);
      if (prev === 'error') recoverNode('storage');
    }
  } catch(e) {
    state.healthChecks['storage'] = 'error';
    propagateFailure('storage');
  }

  // Edge Functions endpoint
  const tf = performance.now();
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/`, {
      method:'HEAD', headers:{ 'apikey': SUPABASE_KEY }, signal: AbortSignal.timeout(3000)
    });
    const lat = Math.round(performance.now() - tf);
    state.healthChecks['functions'] = r.status < 500 ? 'healthy' : 'warning';
    state.stats['functions'] = { latency: lat };
    recordLatency('functions', lat);
  } catch { state.healthChecks['functions'] = 'warning'; }

  // Client / external nodes — assume healthy unless realtime subscriptions fail
  ['browser','android','ios','admin','dns','cdn','fcm','smtp','google','facebook','device'].forEach(id => {
    if (!state.healthChecks[id]) state.healthChecks[id] = 'healthy';
  });

  updateHealthScore();
  updateTopStats();
}

/* ── SECURITY SCANNER ────────────────────────────────────── */
const securityIssues = [];

async function runSecurityScan() {
  securityIssues.length = 0;

  // 1. Check if any table is accessible without auth (using anonymous key with no session)
  const publicTables = ['listings','profiles']; // expected to be public-readable
  const unexpectedPublic = [];
  const sensitiveTables = ['reports','verifications','transactions','error_logs','push_tokens','topup_requests'];
  for (const tbl of sensitiveTables) {
    try {
      const { data, error } = await sb.from(tbl).select('id').limit(1);
      // If we get data back without auth session, it's a potential exposure
      const { data: session } = await sb.auth.getSession();
      if (data && data.length > 0 && !session?.session) {
        unexpectedPublic.push(tbl);
        securityIssues.push({ severity:'high', table: tbl, issue:'Accessible without authentication', fix:`Add RLS policy: USING (auth.uid() IS NOT NULL)` });
      }
    } catch(e) {}
  }

  // 2. Check for recent error_log spikes (sign of attack / bugs)
  try {
    const since = new Date(Date.now() - 3600000).toISOString(); // last 1 hour
    const { count } = await sb.from('error_logs').select('*', { count:'exact', head:true }).gte('created_at', since);
    if (count > 50) {
      securityIssues.push({ severity:'medium', table:'error_logs', issue:`${count} errors in last hour`, fix:'Check application logs for crash patterns' });
      showAlert('warn', 'High Error Rate', `${count} errors logged in the last hour`);
    }
  } catch(e) {}

  // 3. Check for reports spike
  try {
    const since = new Date(Date.now() - 3600000).toISOString();
    const { count } = await sb.from('reports').select('*', { count:'exact', head:true }).gte('created_at', since);
    if (count > 10) {
      securityIssues.push({ severity:'medium', table:'reports', issue:`${count} content reports in last hour`, fix:'Review flagged content in admin panel' });
    }
  } catch(e) {}

  // 4. Measure auth endpoint latency — high latency can indicate brute force protection kicking in
  const ta = performance.now();
  try {
    await fetch(`${SUPABASE_URL}/auth/v1/health`, { headers:{'apikey':SUPABASE_KEY}, signal:AbortSignal.timeout(5000) });
    const lat = Math.round(performance.now() - ta);
    if (lat > 2000) {
      securityIssues.push({ severity:'low', table:'auth', issue:`Auth endpoint slow (${lat}ms)`, fix:'May indicate rate-limiting active or high login volume' });
    }
  } catch(e) {}

  // Update security badge on health globe if issues found
  const high = securityIssues.filter(i => i.severity === 'high').length;
  if (high > 0) {
    showAlert('error', 'Security', `${high} high-severity issue${high>1?'s':''} detected`);
    state.healthChecks['auth'] = state.healthChecks['auth'] === 'healthy' ? 'warning' : state.healthChecks['auth'];
  }

  return securityIssues;
}

function updateHealthScore() {
  const checks = Object.values(state.healthChecks);
  if (!checks.length) return;
  const healthy = checks.filter(h => h === 'healthy').length;
  const score = Math.round((healthy / checks.length) * 100);
  const el = document.getElementById('health-score');
  el.textContent = score + '%';
  el.style.color = score >= 90 ? '#00e676' : score >= 70 ? '#ffab00' : '#ff1744';
  document.getElementById('health-label').textContent =
    score >= 90 ? 'All systems operational' :
    score >= 70 ? 'Degraded performance' : 'Critical issues detected';
}

/* ── POLLING STATS ───────────────────────────────────────── */
async function pollStats() {
  // Profile count
  try {
    const { count } = await sb.from('profiles').select('*', { count:'exact', head:true });
    document.getElementById('sv-users').textContent = (count||0).toLocaleString();
    state.tableStats['tb_profiles'] = { count: count || 0 };
    if (state.selectedNode === 'tb_profiles') {
      const el = document.getElementById('ps-trows');
      if (el) el.textContent = (count||0).toLocaleString();
    }
  } catch(e) {}

  // Listing count (active)
  try {
    const { count } = await sb.from('listings').select('*', { count:'exact', head:true }).eq('status','active');
    document.getElementById('sv-listings').textContent = (count||0).toLocaleString();
    state.tableStats['tb_listings'] = { count: count || 0 };
  } catch(e) {}

  // Today's new listings
  const today = new Date(); today.setHours(0,0,0,0);
  const todayISO = today.toISOString();
  try {
    const { count: todayListings } = await sb.from('listings').select('*',{count:'exact',head:true}).gte('created_at', todayISO);
    if (todayListings != null) {
      const n = findNode('tb_listings');
      if (n) n._todayCount = todayListings;
    }
  } catch(e) {}

  document.getElementById('sv-nodes').textContent = state.nodes.length;
}

function updateTopStats() {
  document.getElementById('sv-nodes').textContent = state.nodes.length;
}

/* ── ALERTS ──────────────────────────────────────────────── */
const activeAlerts = new Map();
function showAlert(type, title, msg, duration = 5000) {
  const key = title + msg;
  if (activeAlerts.has(key)) return;
  const c = document.getElementById('alerts-container');
  const d = document.createElement('div');
  d.className = `alert-toast ${type}`;
  const icons = { info:'ℹ️', warn:'⚠️', error:'🚨', success:'✅' };
  d.innerHTML = `
    <div class="toast-icon">${icons[type]||'●'}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
    </div>
  `;
  c.appendChild(d);
  activeAlerts.set(key, true);
  setTimeout(() => {
    d.style.opacity = '0';
    d.style.transform = 'translateX(20px)';
    d.style.transition = 'all .3s';
    setTimeout(() => { d.remove(); activeAlerts.delete(key); }, 300);
  }, duration);
}

document.getElementById('fc-errors').addEventListener('click', function() {

document.getElementById('fc-active').addEventListener('click', function() {

document.getElementById('btn-layout').addEventListener('click', () => {

document.getElementById('global-search').addEventListener('input', function() {

document.getElementById('btn-clear-feed').addEventListener('click', () => {

});

document.getElementById('btn-pause').addEventListener('click', function() {

  this.querySelector('svg').innerHTML = state.paused
    ? '<polygon points="5 3 19 12 5 21 5 3"/>'  // play icon
    : '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'; // pause icon

  if (!state.paused) showAlert('success', 'Resumed', 'Live event stream active');
});

/* ── REAL HEARTBEAT ANIMATIONS (labeled, not faked) ─────── */
// These represent actual system processes: auth token refreshes,
// WebSocket keepalives, health probe results, realtime pings.
// They are dimmer than real event particles (opacity 0.35).
function startHeartbeats() {
  // Auth token refresh every ~60s in the app (we visualize every 20s here)
  setInterval(() => {
    if (state.frozen || state.paused) return;
    spawnHeartbeat(['browser','auth'], 'auth', '[heartbeat] Token refresh probe');
    setTimeout(() => spawnHeartbeat(['android','auth'], 'auth', '[heartbeat] Token refresh'), 800);
  }, 20000);

  // WebSocket keepalive — realtime pings every ~30s
  setInterval(() => {
    if (state.frozen || state.paused) return;
    spawnHeartbeat(['browser','realtime'], 'ws', '[heartbeat] WS ping');
    setTimeout(() => spawnHeartbeat(['android','realtime'], 'ws', '[heartbeat] WS ping'), 400);
  }, 12000);

  // Health probe particles — mirror actual HTTP HEAD checks
  setInterval(() => {
    if (state.frozen || state.paused) return;
    spawnHeartbeat(['api','db'], 'sql', '[heartbeat] Health probe');
    setTimeout(() => spawnHeartbeat(['auth','api'], 'jwt', '[heartbeat] Auth probe'), 500);
  }, 15000);
}

function spawnHeartbeat(chain, type, msg) {
  // Heartbeat particles are smaller and dimmer to distinguish from real events
  for (let i = 0; i < chain.length - 1; i++) {
    const delay = i * 300;
    setTimeout(() => {
      const sn = findNode(chain[i]), tn = findNode(chain[i+1]);
      if (!sn || !tn) return;
      state.particles.push({
        id: ++state.particleId,
        s: chain[i], t: chain[i+1],
        type, payload: msg,
        progress: 0,
        speed: .003 + Math.random() * .002,
        color: (EDGE_COLOR[type] || '#448aff') + '66', // 40% opacity
        size: 2.5, // smaller than real events
        trail: [], born: performance.now(),
        heartbeat: true,
      });
    }, delay);
  }
}

/* ── INIT ─────────────────────────────────────────────────── */
async function init() {
  // Setup nodes & edges
  state.nodes = NODES.map(n => ({ ...n, x: 0, y: 0, _phase: Math.random() * Math.PI * 2 }));
  state.edges = EDGES;

  resize();
  window.addEventListener('resize', () => { resize(); if (simulation) simulation.restart(); });

  initMinimap();
  initSimulation();
  render();
  setupRealtime();

  // Initial health checks
  await runHealthChecks();
  await pollStats();

  // Periodic refresh
  setInterval(runHealthChecks, 15000);
  setInterval(pollStats, 8000);
  setInterval(discoverBuckets, 60000);

  // Security scan runs once at startup and then every 5 minutes
  setTimeout(() => runSecurityScan(), 5000);
  setInterval(runSecurityScan, 300000);

  // Refresh sparklines in open panel every 15 seconds
  setInterval(() => {
    if (state.selectedNode) {
      const n = findNode(state.selectedNode);
      if (n) {
        const cvs2 = document.getElementById(`sparkline-${n.id}`);
        if (cvs2) drawSparkline(cvs2, n.id);
        // Also update rate cells live
        const insEl = document.getElementById('ps-ins');
        if (insEl) insEl.textContent = getTableRate(n.id, 'insert');
        const updEl = document.getElementById('ps-upd');
        if (updEl) updEl.textContent = getTableRate(n.id, 'update');
        const delEl = document.getElementById('ps-del');
        if (delEl) delEl.textContent = getTableRate(n.id, 'delete');
      }
    }
  }, 15000);

  startHeartbeats();

  // OpenAPI + bucket auto-discovery
  discoverSchema().then(result => {
    if (result) {
      addEvent('api_request', `[discovery] Schema: ${result.tables.length} tables, ${result.rpcs.length} RPCs`, null, false);
    }
  });
  discoverBuckets();

  // Poll additional table counts on startup
  const extraTables = ['messages','conversations','verifications','reports','transactions','applications','reviews','error_logs','user_saves','businesses','notifications'];
  extraTables.forEach((tbl, i) => {
    setTimeout(async () => {
      try {
        const { count } = await sb.from(tbl).select('*', { count:'exact', head:true });
        state.tableStats[`tb_${tbl}`] = { ...(state.tableStats[`tb_${tbl}`]||{}), count: count||0 };
      } catch(e) {}
    }, i * 400 + 2000);
  });

  // Welcome event
  setTimeout(() => {
    addEvent('auth_login', 'PAmarket digital twin connected — all subscriptions active', null, true);
    showAlert('success', 'Digital Twin Live', `${state.nodes.length} nodes — ${state.edges.length} edges — real events only`);
  }, 600);
}

init();
