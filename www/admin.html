async function viewUser(userId) {
  openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="loading-msg">Loading…</div>');
  try {
    var res = await Promise.allSettled([
      sb.from('profiles').select('*').eq('id',userId).single(),
      sb.from('listings').select('id,title,status,created_at').eq('seller_id',userId).order('created_at',{ascending:false}).limit(8),
      cnt('listings',function(q){return q.eq('seller_id',userId);}),
      cnt('listings',function(q){return q.eq('seller_id',userId).eq('status','rejected');}),
      sb.from('businesses').select('id,name,status').eq('owner_user_id',userId).limit(5),
      cnt('reports',function(q){return q.eq('reporter_id',userId);}),
      cnt('reports',function(q){return q.eq('target_id',userId).eq('target_type','user');}),
      sb.from('verifications').select('status,submitted_at,admin_note').eq('user_id',userId).order('submitted_at',{ascending:false}).limit(3),
      sb.from('admin_audit_logs').select('action,reason,actor_email,created_at').eq('entity','profiles').eq('entity_id',userId).order('created_at',{ascending:false}).limit(10),
      cnt('reviews',function(q){return q.eq('seller_id',userId);}),
      cnt('messages',function(q){return q.eq('sender_id',userId);}),
      cnt('contact_requests',function(q){return q.eq('requester_id',userId);}),
      cnt('reviews',function(q){return q.eq('seller_id',userId).gte('rating',4);}),
      cnt('listings',function(q){return q.eq('seller_id',userId).eq('status','sold');})
    ]);
    var u = res[0].value && res[0].value.data; if(!u){ openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">User not found.</div>'); return; }
    var lst = (res[1].value&&res[1].value.data)||[];
    var lTotal = res[2].value, lRejected = res[3].value;
    var bizs = (res[4].value&&res[4].value.data)||[];
    var repBy = res[5].value, repAgainst = res[6].value;
    var verifs = (res[7].value&&res[7].value.data)||[];
    var notes = (res[8].status==='fulfilled'&&res[8].value&&!res[8].value.error) ? (res[8].value.data||[]) : null;
    var revCount = res[9].value;
    var msgCount = res[10].value, unlockCount = res[11].value;
    var positiveReviews = res[12].value;
    var soldListings = res[13].value;
    var ageDays = (Date.now()-new Date(u.created_at).getTime())/864e5;
    var warns = (notes||[]).filter(function(n){return n.action==='warn_user';}).length;

    // Shared trust + fraud scoring (transparent heuristics, see infra v2).
    var sig = {verified:u.verified, ageDays:ageDays, rejected:lRejected, reportsAgainst:repAgainst, warnings:warns, banned:u.status==='banned', positiveReviews:positiveReviews, soldListings:soldListings, mfaEnabled:!!u.mfa_enabled};
    var trust = computeTrust(sig), risk = computeRisk(sig);
    var tColor = trust>=70?'var(--green)':trust>=40?'var(--amber)':'var(--red)';
    var rColor = risk>=60?'var(--red)':risk>=30?'var(--amber)':'var(--green)';

    var html = '<div class="modal-title">'+esc(u.name||'User')+(u.mfa_enabled?' <span class="badge badge-verified">2FA</span>':'')+'<button class="modal-close" onclick="closeModal()">×</button></div>';
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">';
    function chip(v,l,c){ return '<div style="flex:1;min-width:74px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 11px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+(c||'var(--text)')+'">'+v+'</div><div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px">'+l+'</div></div>'; }
    html += chip(trust, 'Trust', tColor) + chip(risk, 'Fraud risk', rColor) + chip(fmtCnt(lTotal),'Listings',null) + chip(fmtCnt(lRejected),'Rejected',(lRejected>0?'var(--red)':null))
      + chip(fmtCnt(repAgainst),'Reports vs',(repAgainst>0?'var(--red)':null)) + chip(fmtCnt(repBy),'Reports by',null)
      + chip(warns,'Warnings',(warns>0?'var(--amber)':null)) + chip(fmtCnt(revCount)+(positiveReviews?' ('+positiveReviews+'+)':''),'Reviews',null)
      + chip(fmtCnt(soldListings),'Sold',(soldListings>0?'var(--green)':null)) + chip(fmtCnt(msgCount),'Messages',null) + chip(fmtCnt(unlockCount),'Unlocks',null);
    html += '</div>';
    // Fraud reasoning line
    var flags=[]; if(ageDays<2) flags.push('account < 48h old'); if(repAgainst>0) flags.push(repAgainst+' report(s) against'); if(lRejected>1) flags.push(lRejected+' rejected listings'); if(!u.verified) flags.push('unverified');
    if(flags.length) html += '<div style="font-size:11.5px;color:'+rColor+';margin:-4px 0 12px">Risk factors: '+flags.join(' · ')+'</div>';
    html += '<div style="font-size:13px;color:var(--sub);line-height:1.9;margin-bottom:12px">'
      + '<div><b>Contact:</b> '+esc(u.phone||'—')+' · '+esc(u.email||'—')+'</div>'
      + '<div><b>Role:</b> '+esc(u.role||'user')+' &nbsp; <b>Status:</b> '+esc(u.status||'active')+(u.ban_reason?' — '+esc(u.ban_reason):'')+(u.ban_until?' (until '+fmtDate(u.ban_until)+')':'')+'</div>'
      + '<div><b>Joined:</b> '+fmtDate(u.created_at)+' &nbsp; <b>Verified:</b> '+(u.verified?'yes':'no')+(u.verification_pending?' (review pending)':'')+'</div>'
      + (u.last_seen_at?'<div><b>Last active:</b> '+ago(u.last_seen_at)+' ago ('+fmtDateTime(u.last_seen_at)+')</div>':'')
      + '<div><b>User ID:</b> <span style="font-size:11px">'+esc(u.id)+'</span></div>'
      + '</div>';
    if(lst.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Recent Listings</div>';
      lst.forEach(function(l){ html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">'+esc(l.title)+'</span><span><span class="badge badge-'+(l.status==='active'?'active':l.status==='rejected'?'rejected':'pending')+'">'+esc(l.status)+'</span> <span style="color:var(--sub);font-size:11px">'+fmtDate(l.created_at)+'</span></span></div>'; });
    }
    if(bizs.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Businesses</div>';
      bizs.forEach(function(b){ html += '<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px"><span>'+esc(b.name||'—')+'</span><span class="badge badge-'+(b.status==='active'?'active':'pending')+'">'+esc(b.status||'—')+'</span></div>'; });
    }
    if(verifs.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Verification History</div>';
      verifs.forEach(function(v){ html += '<div style="font-size:12.5px;padding:4px 0;color:var(--sub)">'+fmtDate(v.submitted_at)+' — <span class="badge badge-'+(v.status==='approved'?'active':v.status==='rejected'?'rejected':'pending')+'">'+esc(v.status)+'</span>'+(v.admin_note?' · '+esc(v.admin_note):'')+'</div>'; });
    }
    html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Admin Notes &amp; Actions</div>';
    if(notes===null) html += '<div style="font-size:12px;color:var(--sub)">Audit table not installed — run ADMIN_ENTERPRISE_UPGRADE.sql to enable notes and action history.</div>';
    else if(!notes.length) html += '<div style="font-size:12px;color:var(--sub)">No recorded actions for this user.</div>';
    else notes.forEach(function(n){ html += '<div style="font-size:12px;padding:4px 0;border-left:2px solid var(--border);padding-left:8px;margin-bottom:4px"><b>'+esc(n.action)+'</b>'+(n.reason?' — '+esc(n.reason):'')+'<div style="color:var(--sub2);font-size:11px">'+esc((n.actor_email||'').split('@')[0])+' · '+fmtDateTime(n.created_at)+'</div></div>'; });

    html += '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">';
    html += '<button class="ab ab-edit" style="padding:9px 14px" onclick="warnUser(\''+u.id+'\')">Issue Warning</button>';
    html += '<button class="ab ab-view" style="padding:9px 14px" onclick="addUserNote(\''+u.id+'\')">Add Note</button>';
    if(u.status==='banned') html += '<button class="ab ab-approve" style="padding:9px 14px" onclick="closeModal();unbanUser(\''+u.id+'\')">Unban</button>';
    else html += '<button class="ab ab-ban" style="padding:9px 14px" onclick="closeModal();banUser(\''+u.id+'\')">Ban</button>';
    if(!u.verified) html += '<button class="ab ab-approve" style="padding:9px 14px" onclick="closeModal();verifyUser(\''+u.id+'\')">Verify</button>';
    html += '</div>';
    openModal(html);
  } catch(e) {
    openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">Could not load: '+esc(e.message)+'</div>');
  }
}

// Warning system: notify the user + record a strike in the audit trail.
async function warnUser(userId) {
  if(!requirePerm('users.warn')) return;
  var reason = await confirm2('Issue Warning','This sends the user a formal warning notification and records a strike. Reason:','Warn','red',true,'e.g. Repeated prohibited listings');
  if(reason===null) return;
  if(!String(reason).trim()){ toast('A warning reason is required','error'); return; }
  try {
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Official Warning',body:'You have received a warning from PaMarket moderators. Reason: '+reason+'. Further violations may lead to suspension.',type:'report',read:false,created_at:Date.now()});
    auditLog('warn_user','profiles',userId,null,null,String(reason).trim());
    closeModal(); toast('Warning sent and recorded');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function addUserNote(userId) {
  var note = await confirm2('Add Internal Note','Visible to admins only (stored in the audit trail):','Save Note','green',true,'e.g. Called user about duplicate account');
  if(note===null || !String(note).trim()) return;
  await auditLog('admin_note','profiles',userId,null,null,String(note).trim());
  if(AUDIT_OK===false) toast('Audit table missing — run ADMIN_ENTERPRISE_UPGRADE.sql','error');
  else toast('Note saved');
}

async function banUser(userId) {
  if(!requirePerm('*')) return;
  var reason = await confirm2('Ban User','Enter reason for ban:','Next','red',true,'e.g. Spam, fraudulent listing');
  if(reason===null) return;
  var dur = await confirm2('Ban Duration','Enter days (e.g. 7, 30) or "permanent":','Ban','red',true,'30');
  if(dur===null) return;
  var perm = /^perm/i.test(String(dur).trim());
  var days = perm ? null : (parseInt(dur)||30);
  if(perm && !(await reauth('permanently ban this user'))) return;
  if(!(await mutationGuard('ban_user'))) return;
  try {
    var u = getUser(userId)||{};
    var prevStatus = u.status||'active';
    var banUntil = perm ? null : new Date(Date.now()+days*24*3600*1000).toISOString();
    await updRow('profiles', userId, {status:'banned',ban_reason:reason||'Policy violation',ban_until:banUntil});
    if(u){ u.status='banned'; u.ban_reason=reason; u.ban_until=banUntil; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Suspended',body:'Your account has been suspended'+(perm?' permanently':' until '+fmtDate(banUntil))+'.'+(reason?' Reason: '+reason:''),type:'ban',read:false,created_at:Date.now()});
    auditLog('ban_user','profiles',userId,{status:prevStatus},{status:'banned',ban_until:banUntil,permanent:perm},reason||null);
    renderTab(); toast(perm?'User permanently banned':'User banned for '+days+' days');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function unbanUser(userId) {
  var ok = await confirm2('Unban User','Remove ban from this user?','Unban','green');
  if(!ok) return;
  try {
    await updRow('profiles', userId, {status:'active',ban_reason:null,ban_until:null});
    var u = getUser(userId);
    if(u){ u.status='active'; u.ban_reason=null; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Reinstated',body:'Your account ban has been removed. Welcome back!',type:'info',read:false,created_at:Date.now()});
    auditLog('unban_user','profiles',userId,{status:'banned'},{status:'active'},null);
    renderTab(); toast('User unbanned');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function verifyUser(userId) {
  if(!requirePerm('verifications.manage')) return;
  var ok = await confirm2('Verify User','Grant verified badge to this user?','Verify','green');
  if(!ok) return;
  try {
    await updRow('profiles', userId, {verified:true,verification_pending:false});
    var u = getUser(userId);
    if(u){ u.verified=true; u.verification_pending=false; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Congratulations! Your blue verified badge is now active.',type:'verify',read:false,created_at:Date.now()});
    auditLog('verify_user','profiles',userId,{verified:false},{verified:true},null);
    renderTab(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function renderVerifications() {
  // Merge: verifications table + profiles with verification_pending=true

  var pendingFromTable = DATA.verifications.filter(function(v){ return v.status==='pending'; });
  var pendingFromProfiles = (DATA.pendingProfiles||[]).filter(function(u){ return !verifMap[u.id]; });
  var approved = DATA.verifications.filter(function(v){ return v.status==='approved'; });
  var rejected = DATA.verifications.filter(function(v){ return v.status==='rejected'; });

  var cvPending = (DATA.companyVerifications||[]).filter(function(c){ return c.status==='pending'; }).length;
  var html = '<div class="stats-grid">';
  html += statCard('ID Pending','amber',pendingFromTable.length+pendingFromProfiles.length,'awaiting review');
  html += statCard('Co. Pending','accent',cvPending,'company / sole trader');
  html += statCard('Approved','green',approved.length,'identity verified');
  html += statCard('Rejected','red',rejected.length,'declined');
  html += '</div>';

  html += '<div class="sec-head"><div class="sec-title">Pending Verifications</div><button class="btn-refresh" onclick="Promise.all([loadUsers(),loadVerifications()]).then(function(){updateBadges();renderVerifications();})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Refresh</button></div>';

  // Show note if documents are missing (verifications table might not exist)
  if(!DATA.verifications.length && pendingFromProfiles.length) {
    html += '<div style="background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:var(--sub);line-height:1.7">';
    html += '<strong style="color:#fbbf24"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ID photos not available</strong><br>';
    html += 'The user submitted their verification request but the <code>verifications</code> table may not exist in your Supabase database. You can still approve the profile below (they will get their verified badge), but you won\'t be able to see their ID photo.<br><br>';
    html += '<strong style="color:var(--text)">To enable photo verification, run this SQL in your Supabase SQL editor:</strong><br>';
    html += '<code style="display:block;margin-top:6px;padding:8px;background:rgba(0,0,0,.3);border-radius:6px;font-size:11px;white-space:pre-wrap">CREATE TABLE IF NOT EXISTS verifications (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid REFERENCES profiles(id),\n  id_doc text,\n  selfie text,\n  status text DEFAULT \'pending\',\n  submitted_at timestamptz DEFAULT now(),\n  admin_note text,\n  UNIQUE(user_id)\n);\nALTER TABLE verifications ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "Admin reads verifications" ON verifications FOR SELECT USING (true);\nCREATE POLICY "User inserts own" ON verifications FOR INSERT WITH CHECK (auth.uid() = user_id);\nCREATE POLICY "User upserts own" ON verifications FOR UPDATE USING (auth.uid() = user_id);</code>';
    html += '</div>';
  }

  var total = pendingFromTable.length + pendingFromProfiles.length;
  if(!total) {
    html += '<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:12px;padding:20px;text-align:center;color:var(--green);font-weight:700;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> No pending verification requests</div>';

  // Cards with photos
  pendingFromTable.forEach(function(v){
    var u = getUser(v.user_id) || {};
    html += verifCard(v, u, true);
  });
  pendingFromProfiles.forEach(function(u){
    html += verifCard(null, u, false);
  });

  // Recently approved/rejected
  if(approved.length||rejected.length) {
    html += '<div class="sec-head" style="margin-top:24px"><div class="sec-title">Recent Reviews</div></div>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>User</th><th>Status</th><th>Date</th><th>Note</th></tr></thead><tbody>';
    DATA.verifications.filter(function(v){ return v.status!=='pending'; }).slice(0,20).forEach(function(v){

    });
  }

  document.getElementById('mainContent').innerHTML = html;
}

function companyVerifCard(cv, u) {
  var isSoleTrader = (cv.company_name||'').startsWith('SOLE TRADER:');
  var displayName  = isSoleTrader
    ? (cv.company_name||'').replace(/^SOLE TRADER:\s*/,'')
    : (cv.company_name||'Company');
  var typeBadge = isSoleTrader
    ? '<span class="badge" style="background:rgba(124,58,237,.15);color:#7c3aed">Sole Trader</span>'
    : '<span class="badge badge-info">Company</span>';

  var docs = isSoleTrader
    ? [['Owner ID / National ID', cv._ownerUrl]]
    : [
        ['Certificate of Incorporation', cv._regUrl],
        ['Tax Clearance',                cv._taxUrl],
        ['Business Premises',            cv._premisesUrl]
      ];

  var html = '<div class="verif-card">';
  html += '<div class="verif-header">';
  html += '<div class="verif-user"><div class="verif-avatar">'+initials(displayName||u.name||'C')+'</div>';
  html += '<div><div class="verif-name">'+esc(displayName)+'</div>';
  html += '<div class="verif-meta">'+esc(u.name||'')+' · '+esc(u.email||u.phone||'')+' · Submitted '+fmtDate(cv.submitted_at)+'</div></div></div>';
  html += '<div style="display:flex;gap:6px;align-items:center">'+typeBadge+'<span class="badge badge-pending">Pending</span></div>';
  html += '</div>';

  html += '<div class="verif-docs">';
  docs.forEach(function(d){
    html += '<div class="verif-doc-box"><div class="verif-doc-label">'+esc(d[0])+'</div>';
    if(d[1]) html += '<img class="verif-doc-img" src="'+esc(d[1])+'" onclick="openVerifPhoto(this,false)" onerror="this.style.opacity=\'.3\'">';
    else html += '<div style="padding:20px;text-align:center;color:var(--sub);font-size:12px">Not submitted</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="verif-actions">';
  html += '<button class="btn-verif-approve" onclick="approveCompany(\''+esc(cv.user_id)+'\')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> Approve</button>';

  html += '</div></div>';
  return html;
}

async function approveVerification(userId, verifId) {
  var ok = await confirm2('Approve Verification','Grant verified badge to this user?','Approve','green');
  if(!ok) return;
  try {
    var r = await sb.from('profiles').update({verified:true,verification_pending:false,updated_at:new Date().toISOString()}).eq('id',userId).select('id');
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('Could not update the user — run FIX_ADMIN_PROFILE_UPDATE.sql so admins can verify other users.');
    if(verifId) await sb.from('verifications').update({status:'approved',admin_note:'Approved by admin'}).eq('id',verifId);
    var u = getUser(userId); if(u){ u.verified=true; u.verification_pending=false; }
    DATA.pendingProfiles = (DATA.pendingProfiles||[]).filter(function(p){ return p.id!==userId; });
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='approved';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Your blue verified badge is now active on all your listings.',type:'verify',read:false,created_at:Date.now()});
    auditLog('approve_verification','profiles',userId,{verified:false},{verified:true},null);
    if(COUNTS.verifPending) COUNTS.verifPending--;
    updateBadges(); renderVerifications(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rejectVerification(userId, verifId) {
  var note = await confirm2('Reject Verification','Reason for rejection (will be sent to user):','Reject','red',true,'e.g. ID photo blurry, face not visible');
  if(note===null) return;
  try {
    await sb.from('profiles').update({verification_pending:false}).eq('id',userId);
    if(verifId) await sb.from('verifications').update({status:'rejected',admin_note:note||'Documents unclear'}).eq('id',verifId);
    var u = getUser(userId); if(u) u.verification_pending=false;
    DATA.pendingProfiles = (DATA.pendingProfiles||[]).filter(function(p){ return p.id!==userId; });
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='rejected';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Verification Not Approved',body:'Your ID was not approved.'+(note?' Reason: '+note+'. Please resubmit with clearer photos.':' Please resubmit.'),type:'report',read:false,created_at:Date.now()});
    auditLog('reject_verification','profiles',userId,null,null,note||null);
    if(COUNTS.verifPending) COUNTS.verifPending--;
    updateBadges(); renderVerifications(); toast('Verification rejected, user notified','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function siteAnnouncementLinkIsSafe(raw) {
  if(!raw) return true;
  try {
    var url=new URL(raw,location.origin);
    return url.protocol==='http:' || url.protocol==='https:';
  } catch(e) { return false; }
}

async function loadSiteAnnouncementPanel() {
  var status=document.getElementById('siteAnnStatus');
  var current=document.getElementById('siteAnnCurrent');
  var deactivate=document.getElementById('deactivateSiteAnnBtn');
  if(!status||!current) return;
  status.textContent='Checking current announcement...';
  try {
    var res=await sb.from('site_announcements').select('*').eq('is_active',true).order('created_at',{ascending:false}).limit(50);
    if(res.error) throw res.error;
    var now=Date.now();
    var rows=res.data||[];
    _siteLiveAnnouncement=rows.find(function(row){
      return (!row.starts_at || new Date(row.starts_at).getTime()<=now) && (!row.ends_at || new Date(row.ends_at).getTime()>now);
    }) || null;
    var scheduled=rows.find(function(row){ return row.starts_at && new Date(row.starts_at).getTime()>now; }) || null;
    if(_siteLiveAnnouncement){
      status.textContent='Currently live'; status.style.color='var(--green)';
      current.style.display='block';
      current.innerHTML='<div style="font-size:10px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Live website announcement</div>'
        +'<div style="font-size:13px;font-weight:700;color:var(--text)">'+esc(_siteLiveAnnouncement.message)+'</div>'
        +(_siteLiveAnnouncement.link_url?'<div style="font-size:11px;color:var(--sub);margin-top:4px">'+esc(_siteLiveAnnouncement.link_label||'Link')+' &rarr; '+esc(_siteLiveAnnouncement.link_url)+'</div>':'')
        +'<div style="font-size:10px;color:var(--sub2);margin-top:5px">'+(_siteLiveAnnouncement.ends_at?'Ends '+fmtDateTime(_siteLiveAnnouncement.ends_at):'No end date')+'</div>';
      if(deactivate) deactivate.disabled=false;
    } else {
      status.style.color='var(--sub)';
      status.textContent=scheduled?'Scheduled for '+fmtDateTime(scheduled.starts_at):'No announcement is live';
      current.style.display=scheduled?'block':'none';
      if(scheduled) current.innerHTML='<div style="font-size:10px;font-weight:800;color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Next scheduled announcement</div><div style="font-size:13px;font-weight:700;color:var(--text)">'+esc(scheduled.message)+'</div>';
      if(deactivate) deactivate.disabled=true;
    }
  } catch(e) {
    _siteLiveAnnouncement=null;
    status.style.color='var(--red)';
    status.textContent=e && e.code==='42P01'?'Migration required: site_announcements table not found':'Could not load announcement status';
    current.style.display='none';
    if(deactivate) deactivate.disabled=true;
  }
}

async function saveSiteAnnouncement() {
  var message=((document.getElementById('siteAnnMessage')||{}).value||'').trim();
  var linkUrl=((document.getElementById('siteAnnLinkUrl')||{}).value||'').trim();
  var linkLabel=((document.getElementById('siteAnnLinkLabel')||{}).value||'').trim();
  var startsRaw=(document.getElementById('siteAnnStartsAt')||{}).value||'';
  var endsRaw=(document.getElementById('siteAnnEndsAt')||{}).value||'';
  var isActive=!!((document.getElementById('siteAnnActive')||{}).checked);
  if(!message){toast('Enter an announcement message','error');return;}
  if(message.length>200){toast('Announcement message must be 200 characters or fewer','error');return;}
  if(!siteAnnouncementLinkIsSafe(linkUrl)){toast('Link must be a website URL or relative site path','error');return;}
  if(linkLabel&&!linkUrl){toast('Add a Link URL or clear the Link Label','error');return;}
  if(linkUrl&&!linkLabel) linkLabel='Learn more';
  var startsAt=startsRaw?new Date(startsRaw):null;
  var endsAt=endsRaw?new Date(endsRaw):null;
  if(startsAt&&isNaN(startsAt.getTime())){toast('Invalid start date','error');return;}
  if(endsAt&&isNaN(endsAt.getTime())){toast('Invalid end date','error');return;}
  if(endsAt&&startsAt&&endsAt<=startsAt){toast('End date must be after the start date','error');return;}
  if(endsAt&&endsAt<=new Date()){toast('End date must be in the future','error');return;}

  var btn=document.getElementById('saveSiteAnnBtn');
  var status=document.getElementById('siteAnnSaveStatus');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  if(status) status.textContent='';
  try {
    if(!_adminUid){var user=(await sb.auth.getUser()).data.user;_adminUid=user&&user.id;}
    var rec={message:message,link_url:linkUrl||null,link_label:linkUrl?linkLabel:null,is_active:isActive,
      starts_at:startsAt?startsAt.toISOString():null,ends_at:endsAt?endsAt.toISOString():null,created_by:_adminUid||null};
    var result=await sb.from('site_announcements').insert(rec).select('id').single();
    if(result.error) throw result.error;
    if(isActive){
      // Keep the existing announcement live until the replacement insert succeeds.
      var off=await sb.from('site_announcements').update({is_active:false}).eq('is_active',true).neq('id',result.data.id);
      if(off.error) throw off.error;
    }
    auditLog('create_site_announcement','site_announcements',result.data.id,null,rec,null);
    toast(isActive?(startsAt&&startsAt>new Date()?'Announcement scheduled':'Announcement is live'):'Inactive announcement saved');
    clearSiteAnnouncementForm();
    await loadSiteAnnouncementPanel();
  } catch(e) {
    toast('Error: '+e.message,'error');
    if(status) status.textContent='Save failed';
  } finally {
    if(btn){btn.disabled=false;btn.textContent='Create Announcement';}
  }
}

async function previewAudience(target) {
  var el = document.getElementById('audCount'); if(!el) return;
  if(target && target.length===36){ el.textContent='(1 user)'; return; }
  el.textContent='(counting…)';
  var n = null;
  if(target==='all')        n = await cnt('profiles');
  else if(target==='verified')   n = await cnt('profiles',function(q){return q.eq('verified',true);});
  else if(target==='unverified') n = await cnt('profiles',function(q){return q.eq('verified',false);});
  else n = null; // sellers/buyers need a join — resolved by the Edge Function at send time
  el.textContent = n==null ? '(resolved at send time)' : '(~'+fmtCnt(n)+' users)';
}

async function sendNotification() {
  var target       = document.getElementById('notifTarget').value;
  var title        = document.getElementById('notifTitle').value.trim();
  var body         = document.getElementById('notifBody').value.trim();
  var type         = document.getElementById('notifType').value;
  var deepLink     = (document.getElementById('notifDeepLink')||{}).value||'';
  var imageUrl     = (document.getElementById('notifImageUrl')||{}).value||'';
  var schedLater   = document.getElementById('schedLater');
  var scheduledFor = (schedLater && schedLater.checked)
    ? (document.getElementById('notifScheduledFor')||{}).value || '' : '';

  if(!title){ toast('Enter a notification title','error'); return; }
  if(!body){  toast('Enter a message','error'); return; }
  if(schedLater && schedLater.checked && !scheduledFor){ toast('Select a date and time to schedule','error'); return; }

  // Collect province checkboxes
  var provinces = [];
  document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ provinces.push(cb.value); });

  var btn = document.getElementById('sendNotifBtn');
  var status = document.getElementById('sendStatus');
  btn.disabled = true;
  btn.textContent = scheduledFor ? 'Scheduling…' : 'Sending…';

  try {
    var sess = await sb.auth.getSession();
    var jwt = sess && sess.data && sess.data.session && sess.data.session.access_token;
    if(!jwt) throw new Error('Not authenticated — please sign in again');

    var payload = {
      target:       target,
      title:        title,
      body:         body,
      type:         type,
      deepLink:     deepLink  || null,
      imageUrl:     imageUrl  || null,
      provinces:    provinces.length ? provinces : null,
      scheduledFor: scheduledFor || null,
    };

    if(status) status.textContent = 'Calling FCM…';
    var res = await fetch(SUPABASE_URL + '/functions/v1/send-push', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + jwt,
        'Content-Type':  'application/json',
        'apikey':        SUPABASE_ANON,
      },
      body: JSON.stringify(payload),
    });

    var result = await res.json();
    if(!res.ok) throw new Error(result.error || ('HTTP ' + res.status));

    btn.disabled = false;
    btn.textContent = schedLater && schedLater.checked ? 'Schedule Notification' : 'Send Notification';
    if(status) status.textContent = '';

    // Clear form
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifBody').value  = '';
    if(document.getElementById('notifDeepLink'))  document.getElementById('notifDeepLink').value  = '';
    if(document.getElementById('notifImageUrl'))  document.getElementById('notifImageUrl').value  = '';
    document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ cb.checked = false; });
    updateNotifPreview();

    auditLog('send_notification','notifications',null,null,{target:target,title:title,scheduled:!!scheduledFor,sent:result.total_users||0},null);
    if(result.scheduled) {
      toast('Scheduled for '+new Date(scheduledFor).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}));
    } else {
      var msg = 'Sent to '+result.total_users+' user'+(result.total_users!==1?'s':'');
      if(result.fcm_sent  > 0) msg += ' · '+result.fcm_sent+' FCM delivered';
      if(result.no_token  > 0) msg += ' · '+result.no_token+' no device token';
      if(result.fcm_failed> 0) msg += ' · '+result.fcm_failed+' FCM failed';
      toast(msg);
    }

    await loadNotifHistory();
    renderNotifications();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Send Notification';
    if(status) status.textContent = '';
    toast('Error: '+e.message,'error');
  }
}

var _reportView = 'support'; // 'support' | 'flags'
// ═══════════════════════════════════════════════════════════════════════════
// MODERATION CENTER (Phase B) — queue-based dashboard on the Phase A backend.
// Every action writes public.moderation_actions; sanctions go through
// public.user_sanctions. Reads respect RLS (moderator/admin only).
// ═══════════════════════════════════════════════════════════════════════════
var MOD_DATA = { reports:[], listings:[], sanctions:[], actions:[], missing:false };
var _modSub    = 'queue';                 // queue | listings | users | resolved
var _modType   = 'all';                   // all | listing | user | message | chat | appeal | support
var _modSev    = 'all';                   // all | critical | high | medium | low
var _modSort   = 'severity';              // severity | priority | recent | oldest | reported
var _modPage   = 0;
var _modSel    = {};
var MOD_PAGE_SIZE = 25;
// UI action → moderation_actions.action_type enum
var MOD_ACT_ENUM = { approve:'approve', restore:'restore', reject:'reject', remove:'remove',
  warn:'warning', suspend:'suspend', unsuspend:'unsuspend', ban:'ban', unban:'unban',
  block_listing:'block_listing', unblock_listing:'unblock_listing' };
var SEV_RANK = { critical:0, high:1, medium:2, low:3 };
var SEV_COLOR = { critical:'#DC2626', high:'#F59E0B', medium:'#3B82F6', low:'#9CA3AF' };

async function loadModeration(){
  try{ if(!_adminUid){ var u=(await sb.auth.getUser()).data.user; _adminUid=u?u.id:null; } }catch(e){}
  var res = await Promise.all([
    sb.from('reports').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('listings').select('id,title,seller_id,seller_name,price,currency,category,city,province,photos,description,status,created_at').in('status',['flagged','under_review','removed']).order('created_at',{ascending:false}).limit(200),
    sb.from('user_sanctions').select('*').order('issued_at',{ascending:false}).limit(500),
    sb.from('moderation_actions').select('*').order('created_at',{ascending:false}).limit(500)
  ]);
  MOD_DATA.reports   = (res[0]&&res[0].data)||[];
  MOD_DATA.listings  = (res[1]&&res[1].data)||[];
  MOD_DATA.sanctions = (res[2]&&res[2].data)||[];
  MOD_DATA.actions   = (res[3]&&res[3].data)||[];
  // If the audit-log or sanctions table is absent, Phase A hasn't been applied.
  MOD_DATA.missing = !!((res[2]&&res[2].error) || (res[3]&&res[3].error));
}

function _sanctionActive(s){ return s.active && (!s.expires_at || new Date(s.expires_at) > new Date()); }
function modCounts(){
  var r = MOD_DATA.reports, open = r.filter(function(x){ return x.status==='open'||x.status==='reviewing'; });
  return {
    open: open.length,
    critical: open.filter(function(x){ return x.severity==='critical'; }).length,
    high: open.filter(function(x){ return x.severity==='high'; }).length,
    pending: MOD_DATA.listings.filter(function(x){ return x.status==='flagged'||x.status==='under_review'; }).length,
    suspensions: MOD_DATA.sanctions.filter(function(s){ return s.sanction_type==='suspension' && _sanctionActive(s); }).length,
    bans: MOD_DATA.sanctions.filter(function(s){ return s.sanction_type==='permanent_ban' && _sanctionActive(s); }).length
  };
}
function _reportCounts(){ // how many open reports target each user/listing
  var m = {};
  MOD_DATA.reports.forEach(function(r){ if(r.status==='open'||r.status==='reviewing'){ var k=(r.target_type||'')+':'+(r.target_id||''); m[k]=(m[k]||0)+1; } });
  return m;
}

function renderModeration(){
  if(!can('reports.manage') && !can('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Your role does not have moderation access.</div>'; return; }
  var c = modCounts();
  var h = '<div class="sec-head"><div class="sec-title">Moderation Center</div></div>';
  if(MOD_DATA.missing) h += '<div class="empty-msg" style="border:1.5px solid #FCD34D;background:#FEF9E7;color:#92400E">Phase A moderation tables not found. Run supabase/migrations/moderation_backend_phase_a.sql, then reload.</div>';

  // Counter cards
  var cards = [
    ['Open reports', c.open, '#3B82F6'], ['Critical', c.critical, '#DC2626'],
    ['High severity', c.high, '#F59E0B'], ['Pending reviews', c.pending, '#8B5CF6'],
    ['Active suspensions', c.suspensions, '#0EA5E9'], ['Permanent bans', c.bans, '#111827']
  ];
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px">';
  cards.forEach(function(k){ h += '<div style="background:var(--card);border:1px solid var(--border);border-left:3px solid '+k[2]+';border-radius:12px;padding:14px 16px"><div style="font-size:26px;font-weight:900;color:'+k[2]+'">'+k[1]+'</div><div style="font-size:12px;color:var(--sub);margin-top:2px">'+k[0]+'</div></div>'; });
  h += '</div>';

  // Sub-tabs
  var subs = [['queue','Report Queue'],['listings','Flagged Listings ('+c.pending+')'],['users','Users & Sanctions'],['resolved','Resolved']];
  h += '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">';
  subs.forEach(function(s){ h += '<button class="filter-btn'+(_modSub===s[0]?' on':'')+'" onclick="_modSub=\''+s[0]+'\';_modPage=0;renderModeration()">'+s[1]+'</button>'; });
  h += '</div>';

  if(_modSub==='queue') h += modQueueHtml(false);
  else if(_modSub==='resolved') h += modQueueHtml(true);
  else if(_modSub==='listings') h += modListingsHtml();
  else if(_modSub==='users') h += modUsersHtml();

  document.getElementById('mainContent').innerHTML = h;
}

function modQueueHtml(resolved){
  var open = MOD_DATA.reports.filter(function(r){ return resolved ? (r.status==='resolved'||r.status==='dismissed'||r.status==='actioned') : (r.status==='open'||r.status==='reviewing'); });
  var rc = _reportCounts();
  var h = '';
  if(!resolved){
    // type + severity + sort filters
    var types = ['all','listing','user','message','chat','appeal','support'];
    h += '<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">';
    types.forEach(function(t){ var n=t==='all'?open.length:open.filter(function(r){return (r.target_type||'')===t;}).length; h += '<button class="filter-btn'+(_modType===t?' on':'')+'" onclick="_modType=\''+t+'\';_modPage=0;renderModeration()">'+t.charAt(0).toUpperCase()+t.slice(1)+' ('+n+')</button>'; });
    h += '</div>';
    h += '<div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center">';
    h += '<label style="font-size:12px;color:var(--sub)">Severity <select onchange="_modSev=this.value;_modPage=0;renderModeration()" style="font-size:12px;padding:4px;border-radius:6px;background:var(--bg);color:var(--text);border:1px solid var(--border)">'+['all','critical','high','medium','low'].map(function(s){return '<option'+(_modSev===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></label>';
    h += '<label style="font-size:12px;color:var(--sub)">Sort <select onchange="_modSort=this.value;renderModeration()" style="font-size:12px;padding:4px;border-radius:6px;background:var(--bg);color:var(--text);border:1px solid var(--border)">'+[['severity','Highest severity'],['priority','Highest priority'],['recent','Most recent'],['oldest','Oldest'],['reported','Most reported target']].map(function(s){return '<option value="'+s[0]+'"'+(_modSort===s[0]?' selected':'')+'>'+s[1]+'</option>';}).join('')+'</select></label>';
    var selCount = Object.keys(_modSel).filter(function(k){return _modSel[k];}).length;
    if(selCount) h += '<span style="margin-left:auto;font-size:12px;color:var(--sub)">'+selCount+' selected</span><button class="filter-btn" onclick="modBulk(\'resolve\')">Bulk resolve</button><button class="filter-btn" onclick="modBulk(\'dismiss\')">Bulk dismiss</button>';
    h += '</div>';
  }
  var rows = open.filter(function(r){
    if(!resolved && _modType!=='all' && (r.target_type||'')!==_modType) return false;
    if(!resolved && _modSev!=='all' && (r.severity||'medium')!==_modSev) return false;
    return true;
  });
  rows.sort(function(a,b){
    if(_modSort==='severity'){ var s=(SEV_RANK[a.severity||'medium'])-(SEV_RANK[b.severity||'medium']); if(s) return s; return new Date(b.created_at)-new Date(a.created_at); }
    if(_modSort==='priority') return (b.priority||3)-(a.priority||3);
    if(_modSort==='oldest') return new Date(a.created_at)-new Date(b.created_at);
    if(_modSort==='reported'){ var ka=(a.target_type+':'+a.target_id), kb=(b.target_type+':'+b.target_id); return (rc[kb]||0)-(rc[ka]||0); }
    return new Date(b.created_at)-new Date(a.created_at);
  });
  var total = rows.length, pages = Math.max(1, Math.ceil(total/MOD_PAGE_SIZE));
  if(_modPage>=pages) _modPage=0;
  var pageRows = rows.slice(_modPage*MOD_PAGE_SIZE, (_modPage+1)*MOD_PAGE_SIZE);
  if(!pageRows.length) return h + '<div class="empty-msg">No reports in this view.</div>';

  h += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+(resolved?'':'<th style="width:24px"></th>')+'<th>Sev</th><th>Type</th><th>Target</th><th>Reporter</th><th>Reason</th><th>Reports</th><th>When</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  pageRows.forEach(function(r){
    var sev=r.severity||'medium', tType=r.target_type||'—', tId=r.target_id||'', k=tType+':'+tId;
    var reporter = getUser(r.reporter_id)||{};
    var esc2=function(x){return esc(String(x==null?'':x));};
    h += '<tr>';
    if(!resolved) h += '<td><input type="checkbox" '+(_modSel[r.id]?'checked':'')+' onclick="modToggleSel(\''+r.id+'\')"></td>';
    h += '<td><span style="font-size:10px;font-weight:800;color:#fff;background:'+(SEV_COLOR[sev]||'#9CA3AF')+';border-radius:5px;padding:2px 7px">'+sev+'</span></td>';
    h += '<td><span class="badge badge-info">'+esc2(tType)+'</span></td>';
    h += '<td style="font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis">'+esc2(modTargetLabel(tType,tId))+'</td>';

function _modNoteVal(){ var el=document.getElementById('modNote'); return el?el.value.trim():''; }

async function modResolveReport(reportId, status){
  if(!requirePerm('reports.manage')) return;
  try{
    var note=_modNoteVal();
    var up = await sb.from('reports').update({status:status}).eq('id',reportId); if(up.error) throw up.error;
    var r = MOD_DATA.reports.find(function(x){return x.id===reportId;})||{};
    await modLog(status==='dismissed'?'approve':'approve','report',reportId,note||('report '+status),r.status,status,note);
    toast('Report '+status,'success'); closeModal(); await loadModeration(); renderModeration();
  }catch(e){ toast('Failed: '+(e.message||e),'error'); }
}

// Core action engine. action ∈ approve/restore/reject/remove/warn/suspend/unsuspend/ban/unban
async function modAct(action, targetType, targetId, userId, days, reportId){
  if(!requirePerm('reports.manage')) return;
  var titles={approve:'Approve',restore:'Restore',reject:'Reject',remove:'Remove',warn:'Warn user',suspend:'Suspend user',unsuspend:'Lift suspension',ban:'Permanently ban',unban:'Lift ban'};
  var destructive=['reject','remove','suspend','ban'].indexOf(action)>=0;
  var reason = await confirm2(titles[action]||action, 'This is recorded in the moderation log.'+(destructive?' This action is significant.':''), titles[action]||'Confirm', destructive?'confirm-danger':'', true, 'Reason (recorded)');
  if(reason===null) return; if(reason===true) reason='';
  var note=_modNoteVal();
  try{
    var prev=null, next=null;
    if(targetType==='listing' && ['approve','restore','reject','remove'].indexOf(action)>=0){
      var l=MOD_DATA.listings.find(function(x){return x.id===targetId;}); prev=l?l.status:null;
      next=(action==='approve'||action==='restore')?'active':'removed';
      var up=await sb.from('listings').update({status:next}).eq('id',targetId); if(up.error) throw up.error;
    }
    if(targetType==='message' && action==='remove'){
      var dm=await sb.from('messages').update({body:'[removed by moderator]'}).eq('id',targetId); /* soft-delete; tolerate schema */
    }
    if(['warn','suspend','ban','unsuspend','unban'].indexOf(action)>=0){
      await modSanction(action, userId||targetId, reason, days);
    }
    await modLog(action, targetType, targetId, reason, prev, next, note);
    if(reportId){ await sb.from('reports').update({status:'actioned'}).eq('id',reportId); }
    toast('Done: '+action,'success'); closeModal(); await loadModeration(); renderModeration();
  }catch(e){ toast('Failed: '+(e.message||e),'error'); }
}

async function modSanction(action, userId, reason, days){
  if(action==='warn'){ var w=await sb.from('user_sanctions').insert({user_id:userId,sanction_type:'warning',reason:reason,issued_by:_adminUid}); if(w.error) throw w.error; return; }
  if(action==='suspend'){ var exp=new Date(Date.now()+(days||7)*86400000).toISOString(); var s=await sb.from('user_sanctions').insert({user_id:userId,sanction_type:'suspension',reason:reason,issued_by:_adminUid,expires_at:exp}); if(s.error) throw s.error; return; }
  if(action==='ban'){ var b=await sb.from('user_sanctions').insert({user_id:userId,sanction_type:'permanent_ban',reason:reason,issued_by:_adminUid}); if(b.error) throw b.error; return; }
  if(action==='unsuspend'){ var u=await sb.from('user_sanctions').update({active:false}).eq('user_id',userId).eq('sanction_type','suspension').eq('active',true); if(u.error) throw u.error; return; }
  if(action==='unban'){ var un=await sb.from('user_sanctions').update({active:false}).eq('user_id',userId).eq('sanction_type','permanent_ban').eq('active',true); if(un.error) throw un.error; return; }
}

async function modLog(action, targetType, targetId, reason, prev, next, notes){
  var enumType = MOD_ACT_ENUM[action]||action;
  var mt = (targetType==='listing'||targetType==='user'||targetType==='message'||targetType==='chat'||targetType==='report')?targetType:'report';
  var r = await sb.from('moderation_actions').insert({ moderator_id:_adminUid, action_type:enumType, target_type:mt, target_id:String(targetId), reason:reason||null, notes:notes||null, previous_status:prev, new_status:next });
  if(r.error) throw r.error;
}

async function resolveReport(id) {
  if(!requirePerm('reports.manage')) return;
  try {
    await updRow('reports', id, {status:'resolved'});
    var rr=DATA.reports.find(function(x){return x.id===id;}); if(rr) rr.status='resolved';
    auditLog('resolve_report','reports',id,{status:'open'},{status:'resolved'},null);
    if(COUNTS.reportsOpen) COUNTS.reportsOpen--;
    updateBadges(); renderReports(); toast('Report resolved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function dismissReport(id) {
  if(!requirePerm('reports.manage')) return;
  try {
    var finalStatus = 'dismissed';
    var r = await sb.from('reports').update({status:'dismissed'}).eq('id',id).select('id');
    if(r.error){ // some databases restrict status to open/resolved — fall back gracefully
      finalStatus = 'resolved';
      r = await sb.from('reports').update({status:'resolved'}).eq('id',id).select('id');
      if(r.error) throw r.error;
    }
    if(!r.data || !r.data.length) throw new Error('Update matched 0 rows — blocked by RLS');
    var rr=DATA.reports.find(function(x){return x.id===id;});
    if(rr){ var wasOpen = rr.status==='open'; rr.status=finalStatus; if(wasOpen && COUNTS.reportsOpen) COUNTS.reportsOpen--; }
    auditLog('dismiss_report','reports',id,null,{status:finalStatus},null);
    updateBadges(); renderReports(); toast('Report dismissed','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function decideContact(id, status) {
  try {
    var c = DATA.contactRequests.find(function(x){ return x.id===id; });
    var r = await sb.from('contact_requests').update({ status:status, decided_at:new Date().toISOString() }).eq('id',id);
    if(r.error) throw r.error;
    if(c) { c.status=status; c.decided_at=new Date().toISOString(); }
    // Notify the employer that their request was reviewed (best-effort; ignore failures)
    auditLog('contact_request_'+status,'contact_requests',id,null,{status:status},null);
    if(c && c.requester_id) {
      try {
        var candName = (c.candidate_name) || ((getUser(c.candidate_id)||{}).name) || 'the candidate';
        await sb.from('notifications').insert({
          id: notifId(), user_id: c.requester_id, type: 'contact',
          title: status==='approved' ? 'Contact unlocked' : 'Contact request declined',
          body: status==='approved'
            ? ('You can now view '+candName+'’s contact details in Hire Talent.')
            : ('Your request to contact '+candName+' was not approved.'),
          created_at: Date.now()
        });
      } catch(e){}
    }
    updateBadges(); renderContactRequests();
    toast(status==='approved' ? 'Contact unlocked for employer' : 'Request declined', status==='approved'?'success':'info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function parseBlogVideoUrl(raw) {
  var url;
  try { url = new URL(String(raw||'').trim()); }
  catch(e) { return null; }
  if(url.protocol!=='https:' && url.protocol!=='http:') return null;
  var host=url.hostname.toLowerCase();
  var id='';
  if(host==='youtu.be') {
    id=url.pathname.split('/').filter(Boolean)[0]||'';
  } else if(host==='youtube.com'||host==='www.youtube.com'||host==='m.youtube.com'||host==='music.youtube.com') {
    if(url.pathname==='/watch') id=url.searchParams.get('v')||'';
    else {
      var embedMatch=url.pathname.match(/^\/embed\/([A-Za-z0-9_-]+)\/?$/);
      if(embedMatch) id=embedMatch[1];
    }
  }
  if(id && /^[A-Za-z0-9_-]{6,20}$/.test(id)) {
    return {provider:'youtube',embedId:id,embedUrl:'https://www.youtube.com/embed/'+id};
  }
  if(host==='vimeo.com'||host==='www.vimeo.com') {
    var parts=url.pathname.split('/').filter(Boolean);
    id=parts.length===1?parts[0]:'';
    if(/^[0-9]{5,15}$/.test(id)) {
      return {provider:'vimeo',embedId:id,embedUrl:'https://player.vimeo.com/video/'+id};
    }
  }
  return null;
}

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="form-row"><label class="form-label">Sort Order</label><input class="form-input" id="blogVideoSort" type="number" step="1" value="'+sortOrder+'"></div>'
    +'<label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;cursor:pointer"><input type="checkbox" id="blogVideoPublished" '+(published?'checked':'')+' style="accent-color:var(--accent)"> Published</label></div>'
    +'<div id="blogVideoPreview" style="display:none;aspect-ratio:16/9;background:#0B1C4D;border-radius:12px;overflow:hidden;margin:4px 0 18px"></div>'
    +'<div style="display:flex;align-items:center;gap:10px"><button class="btn-send" id="saveBlogVideoBtn" onclick="saveBlogVideo(\''+(video?video.id:'')+'\')">'+(video?'Save Changes':'Add Video')+'</button><button class="filter-btn" onclick="closeModal()">Cancel</button></div>');
  updateBlogVideoPreview();
}

function updateBlogVideoPreview() {
  var field=document.getElementById('blogVideoUrl');
  var status=document.getElementById('blogVideoUrlStatus');
  var preview=document.getElementById('blogVideoPreview');
  if(!field||!status||!preview)return;
  var raw=field.value.trim();
  var parsed=parseBlogVideoUrl(raw);
  if(!raw){status.textContent='Accepted: YouTube watch, youtu.be, YouTube embed, or Vimeo video URLs.';status.style.color='var(--sub)';preview.style.display='none';preview.innerHTML='';return;}
  if(!parsed){status.textContent='This is not a recognized YouTube or Vimeo video URL.';status.style.color='var(--red)';preview.style.display='none';preview.innerHTML='';return;}
  status.textContent=(parsed.provider==='youtube'?'YouTube':'Vimeo')+' video recognized';
  status.style.color='var(--green)';
  preview.style.display='block';
  preview.innerHTML='<iframe src="'+parsed.embedUrl+'" title="Video preview" style="width:100%;height:100%;border:0" allowfullscreen></iframe>';
}

async function saveBlogVideo(id) {
  if(!requirePerm('ads.manage'))return;
  var title=((document.getElementById('blogVideoTitle')||{}).value||'').trim();
  var description=((document.getElementById('blogVideoDescription')||{}).value||'').trim();
  var rawUrl=((document.getElementById('blogVideoUrl')||{}).value||'').trim();
  var parsed=parseBlogVideoUrl(rawUrl);
  var sortRaw=((document.getElementById('blogVideoSort')||{}).value||'0').trim();
  var sortOrder=Number(sortRaw);
  var published=!!((document.getElementById('blogVideoPublished')||{}).checked);
  if(!title){toast('Enter a video title','error');return;}
  if(!parsed){toast('Enter a recognized YouTube or Vimeo video URL','error');return;}
  if(!Number.isInteger(sortOrder)){toast('Sort order must be a whole number','error');return;}
  var rec={title:title,description:description||null,video_url:rawUrl,provider:parsed.provider,embed_id:parsed.embedId,sort_order:sortOrder,is_published:published};
  var btn=document.getElementById('saveBlogVideoBtn');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  try {
    var before=id?DATA.blogVideos.find(function(row){return row.id===id;}):null;
    var result;
    if(id) result=await sb.from('blog_videos').update(rec).eq('id',id).select('*').single();
    else {
      if(!_adminUid){var user=(await sb.auth.getUser()).data.user;_adminUid=user&&user.id;}
      rec.created_by=_adminUid||null;
      result=await sb.from('blog_videos').insert(rec).select('*').single();
    }
    if(result.error)throw result.error;
    if(id) DATA.blogVideos=DATA.blogVideos.map(function(row){return row.id===id?result.data:row;});
    else DATA.blogVideos.push(result.data);
    DATA.blogVideos.sort(function(a,b){return Number(a.sort_order||0)-Number(b.sort_order||0)||new Date(b.created_at)-new Date(a.created_at);});
    auditLog(id?'update_blog_video':'create_blog_video','blog_videos',result.data.id,before||null,rec,null);
    closeModal();renderVideos();toast(id?'Video updated':'Video added');
  } catch(e){toast('Error: '+e.message,'error');if(btn){btn.disabled=false;btn.textContent=id?'Save Changes':'Add Video';}}
}

async function toggleBlogVideoPublished(id,published) {
  if(!requirePerm('ads.manage'))return;
  try {
    var result=await sb.from('blog_videos').update({is_published:!!published}).eq('id',id).select('*').single();
    if(result.error)throw result.error;
    DATA.blogVideos=DATA.blogVideos.map(function(row){return row.id===id?result.data:row;});
    auditLog(published?'publish_blog_video':'unpublish_blog_video','blog_videos',id,{is_published:!published},{is_published:!!published},null);
    renderVideos();toast(published?'Video published':'Video unpublished','info');
  } catch(e){toast('Error: '+e.message,'error');}
}

async function deleteBlogVideo(id) {
  if(!requirePerm('ads.manage'))return;
  var video=DATA.blogVideos.find(function(row){return row.id===id;});
  var ok=await confirm2('Delete Video','Remove this blog video permanently?','Delete','red');
  if(!ok)return;
  if(!(await mutationGuard('delete_blog_video')))return;
  try {
    var result=await sb.from('blog_videos').delete().eq('id',id);
    if(result.error)throw result.error;
    DATA.blogVideos=DATA.blogVideos.filter(function(row){return row.id!==id;});
    auditLog('delete_blog_video','blog_videos',id,video||null,null,null);
    renderVideos();toast('Video deleted','info');
  } catch(e){toast('Error: '+e.message,'error');}
}

async function toggleAd(id, active) {
  if(!requirePerm('ads.manage')) return;
  try {
    var on = active==='true'||active===true;
    await updRow('paid_ads', id, {active:on});
    var a=DATA.ads.find(function(x){return x.id===id;}); if(a) a.active=on;
    auditLog(on?'activate_ad':'pause_ad','paid_ads',id,{active:!on},{active:on},null);
    renderAds(); toast(on?'Ad activated':'Ad paused','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function deactivateExpiredAds() {
  if(!requirePerm('ads.manage')) return;
  var expired = DATA.ads.filter(function(a){ return a.active && a.ends_at && new Date(a.ends_at).getTime() < Date.now(); });
  var ok = await confirm2('Deactivate Expired','Pause '+expired.length+' expired ad(s)?','Deactivate','red');
  if(!ok) return;
  var done=0;
  for(var i=0;i<expired.length;i++){
    try { await updRow('paid_ads', expired[i].id, {active:false}); expired[i].active=false; done++;
      auditLog('expire_ad','paid_ads',expired[i].id,{active:true},{active:false},'past ends_at'); } catch(e){}
  }
  renderAds(); toast(done+' expired ad(s) deactivated');
}

async function deleteAd(id) {
  if(!requirePerm('ads.manage')) return;
  var ok = await confirm2('Delete Ad','Remove this ad permanently?','Delete','red');
  if(!ok) return;
  if(!(await mutationGuard('delete_ad'))) return;
  try {
    var a=DATA.ads.find(function(x){return x.id===id;});
    await sb.from('paid_ads').delete().eq('id',id);
    DATA.ads=DATA.ads.filter(function(x){return x.id!==id;});
    auditLog('delete_ad','paid_ads',id,{headline:a&&a.headline,business:a&&a.business_name},null,null);
    renderAds(); toast('Ad deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// Upload the compressed creative to Cloudflare R2. Ad images are always
// persisted as public URLs; inline base64 is never written to paid_ads.
async function _adUploadToR2(blob, contentType) {
  var sess = await sb.auth.getSession();
  var tok = sess && sess.data && sess.data.session && sess.data.session.access_token;
  var uid = sess && sess.data && sess.data.session && sess.data.session.user && sess.data.session.user.id;
  if(!tok) throw new Error('Not authenticated');
  if(!uid) throw new Error('Admin user ID unavailable');
  // Store ad creatives inside the authenticated admin's existing R2 namespace.
  // This path is accepted by both current and earlier storage-function versions.
  var key = 'profiles/' + uid + '/ads/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.jpg';
  var res = await fetch(SUPABASE_URL + '/functions/v1/get-r2-upload-url', {
    method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body: JSON.stringify({ key:key, contentType:contentType })
  });
  var payload = await res.json().catch(function(){ return {}; });
  if(!res.ok) throw new Error(payload.error||('R2 upload-url error: '+res.status));
  var up = await fetch(payload.signedUrl, { method:'PUT', headers:{'Content-Type':contentType}, body:blob });
  if(!up.ok) throw new Error('R2 PUT failed: '+up.status);
  if(!payload.publicUrl) throw new Error('No public URL returned');
  return payload.publicUrl;
}

window._adLoadImage = function(e) {
  var f = e.target.files[0]; if(!f) return;
  var imageField = document.getElementById('adImg');
  if(imageField){ imageField.value=''; imageField.dataset.uploading='true'; }
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    var img = new Image();
    img.onload = function() {
      var MAX_W = 800, MAX_H = 400;
      var w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.72);
      var prev = document.getElementById('adImgPreview');
      if(prev) prev.innerHTML = '<img src="'+compressed+'" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:contain"><div style="font-size:11px;color:var(--sub);margin-top:4px">Uploading to R2…</div>';
      canvas.toBlob(async function(blob){
        if(!blob){
          var emptyFld=document.getElementById('adImg');
          if(emptyFld){ emptyFld.value=''; emptyFld.dataset.uploading='false'; }
          toast('Could not prepare the ad image','error');
          return;
        }
        var stored = null, note = 'stored on R2';
        try { stored = await _adUploadToR2(blob, 'image/jpeg'); }
        catch(err){
          console.error('Ad image upload failed:', err);
          var failedFld = document.getElementById('adImg');
          if(failedFld){ failedFld.value=''; failedFld.dataset.uploading='false'; }
          var failedPv = document.getElementById('adImgPreview');
          if(failedPv) failedPv.innerHTML='<div style="color:var(--red);font-size:12px;font-weight:700">Upload failed</div><div style="color:var(--sub);font-size:11px;margin-top:4px">'+esc(err.message||'R2 upload failed')+'. Select the image to retry.</div>';
          toast('Ad image upload failed: '+(err.message||'R2 error'),'error');
          return;
        }
        var fld = document.getElementById('adImg'); if(fld) fld.value = stored;
        if(fld) fld.dataset.uploading='false';
        var pv = document.getElementById('adImgPreview');
        if(pv) pv.innerHTML = '<img src="'+compressed+'" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:contain"><div style="font-size:11px;color:var(--sub);margin-top:4px">'+w+'×'+h+' px · '+note+'</div>';
      }, 'image/jpeg', 0.72);
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(f);
};

async function saveNewAd() {
  var _advertRaw = (document.getElementById('adAdvertiser')||{}).value||'';
  var advertId = (_advertRaw && _advertRaw !== '__pamarket__') ? _advertRaw : null;

  if(!head){ toast('Enter a headline for the ad','error'); return; }

  if(imageFile && imageFile.files && imageFile.files.length && !(imageField&&imageField.value)){ toast('The ad image did not upload. Select it again to retry.','error'); return; }
  try {
    var adAction = (document.querySelector('input[name="adAction"]:checked')||{}).value||'none';
    var listingId = adAction==='listing' ? ((document.getElementById('adListingId')||{}).value||'').trim()||null : null;
    var linkUrl   = adAction==='link'    ? ((document.getElementById('adLinkUrl')||{}).value||'').trim()||null
                  : adAction==='inapp'   ? ((document.getElementById('adInappPage')||{}).value||null)
                  : null;
    var actionCat = adAction==='cat'     ? ((document.getElementById('adActionCatVal')||{}).value||null) : null;
    var placement = (document.getElementById('adPlacement')||{}).value;
    var placementCat = (placement==='category') ? ((document.getElementById('adCat')||{}).value||'other') : null;
    var targetCat = actionCat || placementCat || null;
    var bgColor = (document.getElementById('adBgColor')||{}).value||'#1A3A8F';
    var startValue = (document.getElementById('adStart')||{}).value
      ? (document.getElementById('adStart')||{}).value + 'T00:00:00Z' : null;
    var endValue = (document.getElementById('adEnd')||{}).value
      ? (document.getElementById('adEnd')||{}).value + 'T23:59:59Z' : null;
    if(startValue && endValue && new Date(endValue)<=new Date(startValue)){ toast('End date must be after the start date','error'); return; }
    var isScheduled = startValue && new Date(startValue)>new Date();
    var rec = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'',
      business_name: biz,
      advertiser_id: advertId||null,
      headline: head,
      // The public website (pamarketzw.com) renders paid_ads by `title` and
      // filters by `placement`, so persist both — otherwise ads created here
      // show on the website with no headline and can't be targeted to Home.
      title: head,
      placement: placement,
      tagline: (document.getElementById('adTag')||{}).value.trim(),
      image_url: (imageField||{}).value||null,
      bg_color: bgColor,
      type: (document.getElementById('adType')||{}).value||'banner',
      target_cat: targetCat,
      listing_id: listingId,
      link_url: linkUrl,
      starts_at: startValue,
      ends_at: endValue,
      price_paid: parseFloat((document.getElementById('adPrice')||{}).value)||0,
      status: isScheduled ? 'scheduled' : 'active',
      active: !isScheduled, impressions: 0, clicks: 0,
      created_at: new Date().toISOString()
    };
    var r = await sb.from('paid_ads').insert(rec);
    if(r.error) throw r.error;
    DATA.ads.unshift(rec);
    auditLog('create_ad','paid_ads',rec.id,null,{headline:rec.headline,business:rec.business_name,type:rec.type,price:rec.price_paid},null);
    closeModal(); renderAds(); toast('Ad created');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// ── CHATS ─────────────────────────────────────────────────
// Redesigned as a proper messenger UI (list + thread, like a SaaS inbox)
// backed by real pagination instead of a flat "last 600 messages app-wide"
// query — that old approach silently dropped older conversations and
// truncated long threads whenever they fell outside the global cap.
var CHAT_PAGE = 20;
var _chatPage = 0, _chatsTotal = null, _chatSearch = '';
var _openChatId = null;
var _chatMsgs = [];          // messages currently loaded for the open thread, oldest first
var _chatMsgsHasMore = false;
var _chatMsgsOldestAt = null; // cursor for "load older"

async function loadChats() {
  try {
    var from = _chatPage * CHAT_PAGE, to = from + CHAT_PAGE - 1;
    var r = await sb.from('conversations')
      .select('id,members,listing_id,updated_at,created_at', {count:'exact'})
      .order('updated_at', {ascending:false})
      .range(from, to);
    if(r.error||!r.data){ DATA.chats=[]; _chatsTotal=null; return; }
    DATA.chats = r.data;
    _chatsTotal = r.count!=null ? r.count : null;

    var uids = [];
    DATA.chats.forEach(function(c){ (c.members||[]).forEach(function(m){ uids.push(m); }); });
    await ensureProfiles(uids);

    var convIds = DATA.chats.map(function(c){ return c.id; });
    if(convIds.length){
      var lastRes = await sb.from('messages').select('conversation_id,text,image,created_at,read,sender_id')
        .in('conversation_id', convIds).order('created_at',{ascending:false}).limit(convIds.length*4);
      var lastByConv = {}, unreadByConv = {};
      (lastRes.data||[]).forEach(function(m){
        if(!lastByConv[m.conversation_id]) lastByConv[m.conversation_id]=m;
        if(!m.read) unreadByConv[m.conversation_id]=(unreadByConv[m.conversation_id]||0)+1;
      });
      DATA.chats.forEach(function(c){ c.lastMsg=lastByConv[c.id]||null; c.unread=unreadByConv[c.id]||0; });
    }
  } catch(e){ DATA.chats=[]; _chatsTotal=null; }
}

function chatsGo(page){ _chatPage=page; loadChats().then(renderChats); }
function chatsSearchInput(v){ _chatSearch=v; debounce('chatSearch', function(){ renderChats(); var s=document.getElementById('chatSearchIn'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); } }); }

function _chatParticipants(c){
  return (c.members||[]).map(function(id){ return getUser(id); }).filter(Boolean);
}
function _chatTitle(c){
  var names = _chatParticipants(c).map(function(u){ return u.name||u.email||u.phone; }).filter(Boolean);
  return names.length ? names.join(' ↔ ') : c.id;
}
function _avatarChip(name, size){
  size = size||36;
  var initial = (name||'?').trim().charAt(0).toUpperCase()||'?';
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:'+Math.round(size*0.4)+'px;font-weight:800;color:#fff;flex-shrink:0">'+esc(initial)+'</div>';
}

// Loads one page of a single conversation's message history, oldest-first
// within the page. Called on open, and again by "Load older" — so a long
// thread's full history is reachable instead of being cut off by a global cap.
async function _loadChatMessages(convId, before){
  var q = sb.from('messages').select('id,sender_id,sender_name,text,image,created_at,read')
    .eq('conversation_id', convId).order('created_at',{ascending:false}).limit(50);
  if(before) q = q.lt('created_at', before);
  var r = await q;
  if(r.error||!r.data) return {rows:[], hasMore:false};
  var rows = r.data.slice().reverse(); // oldest-first for rendering
  return {rows: rows, hasMore: r.data.length===50};
}

async function openChat(id){
  _openChatId = id;
  _chatMsgs = []; _chatMsgsHasMore = false; _chatMsgsOldestAt = null;
  renderChats(); // show loading shell immediately
  var page = await _loadChatMessages(id, null);
  _chatMsgs = page.rows;
  _chatMsgsHasMore = page.hasMore;
  _chatMsgsOldestAt = _chatMsgs.length ? _chatMsgs[0].created_at : null;
  var cv = DATA.chats.find(function(c){ return c.id===id; });
  if(cv && window._lastAuditedChat !== id){
    window._lastAuditedChat = id;
    auditLog('view_chat','messages',id,null,{participants:_chatParticipants(cv).map(function(u){return u.name;})},null);
  }
  renderChats();
}

async function loadOlderChatMessages(){
  if(!_openChatId || !_chatMsgsHasMore) return;
  var page = await _loadChatMessages(_openChatId, _chatMsgsOldestAt);
  _chatMsgs = page.rows.concat(_chatMsgs);
  _chatMsgsHasMore = page.hasMore;
  _chatMsgsOldestAt = page.rows.length ? page.rows[0].created_at : _chatMsgsOldestAt;
  renderChats();
}

function closeChat(){ _openChatId=null; _chatMsgs=[]; renderChats(); }

function renderChats() {
  var html='<div class="sec-head"><div class="sec-title">User Chats</div>'

    html+='<div class="empty-msg">No conversations found yet.</div>';
    document.getElementById('mainContent').innerHTML=html; return;
  }

  var q = _chatSearch.trim().toLowerCase();
  var filtered = q ? DATA.chats.filter(function(c){ return _chatTitle(c).toLowerCase().indexOf(q)!==-1; }) : DATA.chats;

  html += '<div class="chat-shell">';

  // ── Left pane: conversation list ──
  html += '<div class="chat-list-pane">';

  }
  filtered.forEach(function(c){
    var title = _chatTitle(c);
    var lm = c.lastMsg;
    var preview = lm ? (lm.image ? 'Photo' : (lm.text||'').slice(0,54)+((lm.text||'').length>54?'…':'')) : 'No messages yet';
    var isActive = c.id===_openChatId;
    html += '<div class="chat-list-row'+(isActive?' active':'')+'" onclick="openChat(\''+esc(c.id)+'\')">';
    html += _avatarChip(title, 40);
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="display:flex;justify-content:space-between;gap:8px"><div class="chat-list-name">'+esc(title)+'</div>';
    html += '<div class="chat-list-time">'+(lm?fmtDateTime(lm.created_at):'')+'</div></div>';
    html += '<div style="display:flex;justify-content:space-between;gap:8px"><div class="chat-list-preview">'+esc(preview)+'</div>';
    html += (c.unread?'<span class="badge badge-pending">'+c.unread+'</span>':'')+'</div>';
    html += '</div></div>';
  });
  html += '</div>';
  html += pagerHtml(_chatPage, CHAT_PAGE, _chatsTotal, DATA.chats.length, 'chatsGo');
  html += '</div>';

  // ── Right pane: thread view ──
  html += '<div class="chat-thread-pane">';
  if(!_openChatId){
    html += '<div class="chat-thread-empty">'
      + '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.35;margin-bottom:10px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
      + '<div>Select a conversation to view messages</div></div>';
  } else {
    var cv = DATA.chats.find(function(c){ return c.id===_openChatId; });
    var title = cv ? _chatTitle(cv) : _openChatId;
    var participants = cv ? _chatParticipants(cv) : [];
    html += '<div class="chat-thread-hdr">';
    html += _avatarChip(title, 38);
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:14px;font-weight:700;color:var(--text)">'+esc(title)+'</div>';
    html += '<div style="font-size:11.5px;color:var(--sub)">'+participants.length+' participant'+(participants.length===1?'':'s')+' · conversation '+esc(String(_openChatId).slice(0,12))+'</div>';
    html += '</div>';
    html += '<button class="filter-btn" onclick="closeChat()">Close</button>';
    html += '</div>';

    html += '<div class="chat-thread-scroll" id="chatThreadScroll">';
    if(_chatMsgsHasMore){
      html += '<div style="text-align:center;padding:6px 0 14px"><button class="filter-btn" onclick="loadOlderChatMessages()">Load older messages</button></div>';
    }
    if(!_chatMsgs.length){
      html += '<div class="empty-msg">No messages yet.</div>';
    }
    _chatMsgs.forEach(function(m){
      var sender = getUser(m.sender_id);
      var name = esc(sender ? (sender.name||sender.email||sender.phone) : (m.sender_name||String(m.sender_id).slice(-6)));
      var mine = participants.length && m.sender_id === participants[0].id; // left/right split by first participant, purely visual
      html += '<div class="chat-bubble-row'+(mine?' mine':'')+'">';
      html += '<div class="chat-bubble">';
      html += '<div class="chat-bubble-name">'+name+'</div>';
      if(m.image) html += '<img src="'+esc(m.image)+'" style="max-width:220px;border-radius:8px;display:block;margin-bottom:4px">';
      if(m.text) html += '<div class="chat-bubble-text">'+esc(m.text)+'</div>';
      html += '<div class="chat-bubble-time">'+fmtDateTime(m.created_at)+(m.read?' · Read':'')+'</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>'; // .chat-thread-pane
  html += '</div>'; // .chat-shell

  document.getElementById('mainContent').innerHTML=html;
  if(_openChatId){
    var scroller = document.getElementById('chatThreadScroll');
    if(scroller) scroller.scrollTop = scroller.scrollHeight;
  }

// ── ANALYTICS ─────────────────────────────────────────────
// Every number here is a server-side count/aggregate — nothing is derived from
// paged in-memory arrays, so charts stay correct at any scale.
var ANALYTICS = null;
var _anWindow = 14; // growth chart window in days
async function loadAnalytics() {
  var winDays = _anWindow;
  // Per-category + per-province counts (parallel head counts).
  var catJobs  = MK_CATEGORIES.map(function(c){ return cnt('listings',function(q){return q.eq('category',c);}); });
  var provJobs = PROVINCES.map(function(p){ return cnt('listings',function(q){return q.eq('province',p);}); });
  // Daily new users + listings for the growth chart.
  var dayBounds = [];
  for(var i=winDays-1;i>=0;i--){
    var s = new Date(Date.now()-i*864e5); s.setHours(0,0,0,0);
    var e = new Date(s); e.setDate(e.getDate()+1);
    dayBounds.push([s,e]);
  }
  var userDayJobs = dayBounds.map(function(b){ return cnt('profiles',function(q){return q.gte('created_at',b[0].toISOString()).lt('created_at',b[1].toISOString());}); });
  var lstDayJobs  = dayBounds.map(function(b){ return cnt('listings',function(q){return q.gte('created_at',b[0].toISOString()).lt('created_at',b[1].toISOString());}); });
  var d30 = new Date(Date.now()-30*864e5).toISOString();
  var d7  = new Date(Date.now()-7*864e5).toISOString();
  var extra = Promise.allSettled([
    cnt('verifications',function(q){return q.eq('status','pending');}),
    cnt('verifications',function(q){return q.eq('status','approved');}),
    cnt('verifications',function(q){return q.eq('status','rejected');}),

  ]);

    cnt('business_subscriptions',function(q){return q.eq('status','active').neq('plan_id','free');}), // paid
    rpc('admin_cohorts',{weeks:8}),

  ]);
  var res = await Promise.all([Promise.all(catJobs), Promise.all(provJobs), Promise.all(userDayJobs), Promise.all(lstDayJobs), extra, centerP]);

    vPending:ex[0], vApproved:ex[1], vRejected:ex[2],
    subsRev30:(ex[3]&&ex[3].data||[]).reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0),

  };
  if(currentTab==='analytics') renderAnalytics();
}

// Merge-safe save: re-fetch the settings row first and change only this key,
// so two admins editing different settings can't clobber each other's writes.
async function saveSetting(key, value) {
  try {
    var cur = {};
    try { var rr = await sb.from('app_settings').select('settings').eq('id',1).single(); cur = (!rr.error && rr.data && rr.data.settings) || {}; } catch(e){}
    var prev = cur[key];
    cur[key] = value;
    var sr = await sb.from('app_settings').upsert({id:1,settings:cur,updated_at:new Date().toISOString()});
    if(sr.error) throw sr.error;
    DATA.settings = cur;
    auditLog('change_setting','app_settings','1',{key:key,value:prev},{key:key,value:value},null);
    toast('Setting saved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// One-click lockdown: flips every enforced emergency switch on at once.
// Deliberately only touches the switches that are ACTUALLY wired to code
// (see EMERGENCY_ENFORCED) — flipping unwired flags would give a false
// sense that the whole app stopped when only the state changed.
async function emergencyLockdown(){
  if(!requirePerm('*')) return;
  var enforcedKeys = Object.keys(EMERGENCY_ENFORCED).filter(function(k){return EMERGENCY_ENFORCED[k];});
  var confirmed = await confirm2('Emergency Lockdown','This immediately enables: '+enforcedKeys.join(', ')+'. Every non-admin user will be blocked from the app until you turn these off. This is for active incidents only.','Lock down the app','red',true,'Type LOCKDOWN to confirm');
  if(confirmed===null) return;
  if(String(confirmed).trim().toUpperCase()!=='LOCKDOWN'){ toast('Type LOCKDOWN exactly to confirm','error'); return; }
  if(!(await reauth('trigger an emergency lockdown of the entire app'))) return;
  try {
    var rr = await sb.from('app_settings').select('settings').eq('id',1).single();
    var cur = (!rr.error && rr.data && rr.data.settings) || {};
    var before = {}; enforcedKeys.forEach(function(k){ before[k]=cur[k]; });
    enforcedKeys.forEach(function(k){ cur[k]=true; });
    var sr = await sb.from('app_settings').upsert({id:1,settings:cur,updated_at:new Date().toISOString()});
    if(sr.error) throw sr.error;
    DATA.settings = cur;
    auditLog('emergency_lockdown','app_settings','1',before,enforcedKeys.reduce(function(a,k){a[k]=true;return a;},{}),'One-click emergency lockdown');
    toast('Emergency lockdown activated — app is now blocked for non-admins','error');
    renderSettings();
  } catch(e){ toast('Lockdown failed: '+e.message,'error'); }
}

  _maintLog('Clearing error_logs...');
  try {
    // Delete every row via the uuid primary key — a type-agnostic filter that
    // never trips an "invalid input syntax" cast error, regardless of how the

    var r = await sb.from('error_logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (r.error) throw r.error;

    toast('Error logs cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
