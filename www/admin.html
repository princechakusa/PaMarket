<!-- Single source of truth for Play Billing product IDs — same file the
     customer app loads (js/billing-products.js). Admin never defines its
     own product/price data; everything below reads from window.H.*_PRODUCTS. -->
<script src="js/billing-products.js?v=2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0F172A;--card:#1E293B;--card2:#263044;--border:#334155;
  --text:#F1F5F9;--sub:#94A3B8;--sub2:#64748B;
  --accent:#6366F1;--accent2:#4F46E5;
  --green:#10B981;--amber:#F59E0B;--red:#EF4444;--blue:#3B82F6;
  --sidebar-w:220px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow-x:hidden;}
.content{min-width:0;}
.tbl-wrap{max-width:100%;}

/* ── LOGIN ── */
#loginWrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,var(--bg) 60%);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.6);}
.login-logo{font-size:28px;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:-1px;}
.login-logo em{font-style:normal;color:var(--accent);}
.login-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:28px;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;color:var(--sub);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.fi{width:100%;padding:11px 14px;background:#0F172A;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit;}
.fi:focus{border-color:var(--accent);}
.btn-login{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s;font-family:inherit;}
.btn-login:hover{background:var(--accent2);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.err-box{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.4);padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5;}

/* ── DASHBOARD ── */
#dash{display:none;min-height:100vh;}
.layout{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s;}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-brand-name{font-size:20px;font-weight:900;letter-spacing:-.5px;}
.sidebar-brand-name em{font-style:normal;color:var(--accent);}
.sidebar-badge{font-size:10px;background:rgba(99,102,241,.2);color:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:700;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-section{font-size:10px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.8px;padding:12px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:0;transition:background .15s;color:var(--sub);font-size:13px;font-weight:500;position:relative;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.nav-item.active{background:rgba(99,102,241,.15);color:var(--accent);font-weight:700;}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:auto;}
.nav-badge.amber{background:var(--amber);}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.sidebar-user{font-size:12px;color:var(--sub);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-signout{width:100%;padding:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-signout:hover{background:rgba(239,68,68,.2);}

/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:800;color:var(--text);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn-refresh{padding:7px 14px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--sub);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-refresh:hover{background:rgba(255,255,255,.1);color:var(--text);}
.content{padding:20px 24px 40px;flex:1;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;transition:border-color .15s,transform .15s;}
.stat-card[onclick]:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-val{font-size:26px;font-weight:900;color:var(--text);line-height:1;}
.stat-sub{font-size:11px;color:var(--sub);margin-top:4px;}
.stat-card.green .stat-val{color:var(--green);}
.stat-card.amber .stat-val{color:var(--amber);}
.stat-card.red .stat-val{color:var(--red);}
.stat-card.blue .stat-val{color:var(--blue);}
.stat-card.accent .stat-val{color:var(--accent);}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sec-title{font-size:15px;font-weight:800;}
.sec-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.filter-btn.on{background:rgba(99,102,241,.15);border-color:var(--accent);color:var(--accent);}
.search-input{padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;font-family:inherit;width:200px;}
.search-input:focus{border-color:var(--accent);}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 14px;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1px solid var(--border);background:rgba(255,255,255,.03);}
.tbl td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,.03);}
.tbl-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;}
.tbl-thumb-ph{width:40px;height:40px;border-radius:8px;background:var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--sub);}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-pending{background:rgba(245,158,11,.15);color:var(--amber);}
.badge-active{background:rgba(16,185,129,.15);color:var(--green);}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--red);}
.badge-verified{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-banned{background:rgba(239,68,68,.2);color:#FCA5A5;}
.badge-info{background:rgba(99,102,241,.15);color:var(--accent);}

/* ── ACTION BUTTONS ── */
.ab{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s;white-space:nowrap;}
.ab:hover{opacity:.8;}
.ab-approve{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.ab-reject{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.ab-view{background:rgba(99,102,241,.12);color:var(--accent);border:1px solid rgba(99,102,241,.25);}
.ab-edit{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25);}
.ab-delete{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.ab-ban{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.25);}

/* ── VERIFICATIONS ── */
.verif-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.verif-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.verif-user{display:flex;align-items:center;gap:12px;}
.verif-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
.verif-name{font-size:15px;font-weight:700;}
.verif-meta{font-size:12px;color:var(--sub);margin-top:3px;}
.verif-docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.verif-doc-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.verif-doc-label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
.verif-doc-img{width:100%;height:160px;object-fit:contain;background:#000;display:block;cursor:pointer;}
.verif-selfie{width:100%;height:160px;object-fit:cover;display:block;cursor:pointer;}
.verif-actions{display:flex;gap:10px;}
.btn-verif-approve{flex:1;padding:11px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;}
.btn-verif-approve:hover{opacity:.85;}
.btn-verif-reject{flex:1;padding:11px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-verif-reject:hover{background:rgba(239,68,68,.25);}

/* ── NOTIFICATION FORM ── */
.notif-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px;}
.form-row{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-input{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-select{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.form-textarea{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;resize:vertical;min-height:80px;}
.form-textarea:focus,.form-select:focus{border-color:var(--accent);}
.char-count{font-size:11px;color:var(--sub);text-align:right;margin-top:3px;}
.btn-send{padding:12px 28px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-send:hover{background:var(--accent2);}
.btn-send:disabled{opacity:.5;cursor:not-allowed;}
.notif-preview{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px;}
.notif-preview-label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.notif-preview-card{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(8px);}
.notif-preview-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-preview-title{font-size:13px;font-weight:700;color:var(--text);}
.notif-preview-body{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4;}
.notif-preview-app{font-size:10px;color:var(--sub2);margin-top:4px;}

/* ── SETTINGS ── */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-info{flex:1;padding-right:16px;}
.setting-title{font-size:14px;font-weight:600;color:var(--text);}
.setting-desc{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4;}
.toggle{position:relative;width:46px;height:26px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:background .2s;}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle input:checked+.toggle-slider{background:var(--green);}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}

/* ── MODAL ── */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;}
#modalOverlay.open{display:flex;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px;line-height:1;padding:2px;}
.modal-img{width:100%;border-radius:10px;margin-bottom:12px;max-height:300px;object-fit:contain;background:#000;}

/* ── TOAST ── */
#toastWrap{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .25s ease;max-width:320px;pointer-events:auto;}
.toast.success{background:#065F46;border:1px solid var(--green);}
.toast.error{background:#7F1D1D;border:1px solid var(--red);}
.toast.info{background:#1E1B4B;border:1px solid var(--accent);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5);}70%{box-shadow:0 0 0 6px rgba(16,185,129,0);}100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}}

/* ── CONFIRM ── */
#confirmOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1100;display:none;align-items:center;justify-content:center;padding:16px;}
#confirmOverlay.open{display:flex;}
.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:380px;width:100%;}
.confirm-title{font-size:16px;font-weight:800;margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:16px;}
.confirm-input{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:inherit;margin-bottom:14px;}
.confirm-input:focus{border-color:var(--accent);}
.confirm-btns{display:flex;gap:10px;}
.confirm-ok{flex:1;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.confirm-cancel{flex:1;padding:11px;background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--border);border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.confirm-ok.red{background:var(--red);}
.confirm-ok.green{background:var(--green);}

/* ── EMPTY ── */
.empty-msg{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px;}
.empty-msg svg{display:block;margin:0 auto 12px;opacity:.3;}

/* ── LOADING ── */
.loading-msg{text-align:center;padding:30px;color:var(--sub);font-size:13px;}

/* ── ANALYTICS BARS ── */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.bar-label{font-size:12px;color:var(--sub);width:120px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);transition:width .6s ease;}
.bar-val{font-size:12px;font-weight:700;color:var(--text);width:40px;flex-shrink:0;}

/* ── HAMBURGER (mobile) ── */
.hamburger{display:none;padding:8px;background:none;border:none;color:var(--text);cursor:pointer;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}

/* ── MOBILE ── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:none;}
  .sidebar-overlay.open{display:block;}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .topbar{padding:12px 16px;}
  .content{padding:14px 14px 40px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .verif-docs{grid-template-columns:1fr;}
  .search-input{width:140px;}
  .tbl-wrap{overflow-x:auto;}
  .chat-shell{flex-direction:column;height:auto;}
  .chat-list-pane{width:100%;border-right:none;border-bottom:1px solid var(--border);}
  .chat-thread-pane{min-height:420px;}
}

/* ── CHATS (redesigned inbox: list + thread) ── */
.chat-shell{display:flex;gap:0;height:calc(100vh - 160px);min-height:480px;background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.chat-list-pane{width:320px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;}
.chat-search-wrap{padding:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.chat-list-scroll{flex:1;overflow-y:auto;}
.chat-list-row{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;}
.chat-list-row:hover{background:rgba(255,255,255,.04);}
.chat-list-row.active{background:rgba(99,102,241,.14);}
.chat-list-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-list-time{font-size:10.5px;color:var(--sub2);flex-shrink:0;white-space:nowrap;}
.chat-list-preview{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chat-thread-pane{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
.chat-thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);font-size:13px;}
.chat-thread-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0;}
.chat-thread-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;}
.chat-bubble-row{display:flex;}
.chat-bubble-row.mine{justify-content:flex-end;}

// profiles.role drives capabilities. 'admin' stays the full-power role for
// backwards compatibility; the extra roles only work once profiles carry them.
var ADMIN_ROLE  = 'admin';
var ADMIN_ROLES = ['super_admin','admin','moderator','support','finance'];
var ROLE_PERMS = {
  super_admin: ['*'],
  admin:       ['*'],
  moderator:   ['listings.moderate','reviews.moderate','reports.manage','verifications.manage','rentals.moderate','users.warn','users.view','chats.view','notifications.send'],

// ── Unified admin audit trail ─────────────────────────────
// Every admin action is recorded to admin_audit_logs (actor, entity, before,
// after, reason). Tolerates the table not existing until the migration runs.
var AUDIT_OK = null;
var _adminUid = null;
async function auditLog(action, entity, entityId, before, after, reason){
  if(AUDIT_OK===false) return;
  try {
    if(!_adminUid){ try{ var u=(await sb.auth.getUser()).data.user; _adminUid=u?u.id:null; }catch(e){} }
    var r = await sb.from('admin_audit_logs').insert({
      actor_id:_adminUid, actor_email:_adminEmail||null, actor_role:ADMIN_ROLE,
      action:action, entity:entity, entity_id:entityId?String(entityId):null,
      before_state:before||null, after_state:after||null, reason:reason||null
    });
    if(r.error){ if(AUDIT_OK===null) console.warn('admin_audit_logs unavailable (run ADMIN_ENTERPRISE_UPGRADE.sql):', r.error.message); AUDIT_OK=false; }
    else AUDIT_OK=true;
  } catch(e){ AUDIT_OK=false; }
}

// ── Checked write ─────────────────────────────────────────
// Update + select('id') so an RLS-blocked write (0 rows matched) throws
// instead of silently showing success. Mirrors the rental-admin pattern.
async function updRow(table, id, patch){
  var r = await sb.from(table).update(patch).eq('id',id).select('id');
  if(r.error) throw r.error;
  if(!r.data || !r.data.length) throw new Error('Update matched 0 rows — blocked by RLS (check admin policies on '+table+')');
  return r;
}

async function cnt(table, mod){
  try { var q = sb.from(table).select('id',{count:'exact',head:true}); if(mod) q=mod(q); var r=await q; return r.error?null:(r.count||0); }
  catch(e){ return null; }
}

function likeSafe(s){ return String(s||'').replace(/[%,()."']/g,' ').trim(); }

// ── Queue-age helpers (SLA visibility) ────────────────────
function ago(iso){
  if(!iso) return '—';
  var ms = Date.now() - new Date(iso).getTime();
  if(!(ms>0)) return 'now';
  var m=Math.floor(ms/60000); if(m<60) return m+'m';
  var h=Math.floor(m/60); if(h<48) return h+'h';
  return Math.floor(h/24)+'d';
}
function ageChip(iso, warnH, dangerH){
  if(!iso) return '';
  var h = (Date.now()-new Date(iso).getTime())/3600000;
  var c = h>=(dangerH||72) ? '#EF4444' : h>=(warnH||24) ? '#F59E0B' : 'var(--sub2)';
  return '<span style="font-size:10px;font-weight:700;color:'+c+'">waiting '+ago(iso)+'</span>';
}

// ── Server-side aggregation RPC helper ────────────────────
// Returns {data, missing:true} when the function isn't installed yet.
async function rpc(name, args){
  try {
    var r = await sb.rpc(name, args||{});
    if(r.error){
      var m = (r.error.message||'').toLowerCase();
      if(m.indexOf('does not exist')!==-1 || m.indexOf('not find')!==-1 || r.error.code==='42883') return {missing:true};
      return {error:r.error};
    }
    return {data:r.data};
  } catch(e){ return {error:e}; }
}
// One-shot capability probe cache so we only warn once per table.
var CAP = {};
async function hasTable(table){
  if(CAP[table]!==undefined) return CAP[table];
  try { var r = await sb.from(table).select('*',{head:true,count:'exact'}).limit(1); CAP[table] = !r.error; }
  catch(e){ CAP[table] = false; }
  return CAP[table];
}
function migrationNotice(what, file){
  return '<div class="empty-msg" style="line-height:1.7">'+esc(what)+' needs a database object that is not installed yet.<br><br>Run <b>supabase/'+(file||'ADMIN_ENTERPRISE_V2.sql')+'</b> in the Supabase SQL Editor to enable it. Everything else keeps working.</div>';
}

// ── Trust / risk / fraud scoring (shared, transparent heuristics) ──
// Trust 0-100 (higher=better). Risk 0-100 (higher=worse). Both derive purely
// from live signals so they need no schema and are explainable in the UI.
function computeTrust(sig){
  var t = 50;
  if(sig.verified) t += 25;
  t += Math.min(15, Math.floor((sig.ageDays||0)/30)*3);
  t -= Math.min(30, (sig.rejected||0)*10);
  t -= Math.min(30, (sig.reportsAgainst||0)*10);
  t -= Math.min(20, (sig.warnings||0)*10);
  if(sig.banned) t = Math.min(t, 10);
  return Math.max(0, Math.min(100, t));
}
function computeRisk(sig){
  var r = 0;
  r += Math.min(35, (sig.reportsAgainst||0)*12);
  r += Math.min(25, (sig.rejected||0)*8);
  r += Math.min(20, (sig.warnings||0)*10);
  if((sig.ageDays||999) < 2) r += 15;        // brand-new account
  if(!sig.verified) r += 8;
  if(sig.banned) r = Math.max(r, 80);
  return Math.max(0, Math.min(100, r));
}
function scoreBadge(score, invert){
  // invert=true → high is bad (risk). else high is good (trust).
  var good = invert ? score<30 : score>=70;
  var mid  = invert ? score<60 : score>=40;
  var c = good?'var(--green)':mid?'var(--amber)':'var(--red)';
  return '<span style="font-size:11px;font-weight:800;color:'+c+'">'+score+'</span>';
}

// ── TOTP two-factor auth (RFC 6238, self-contained via Web Crypto) ──
var _B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32encode(bytes){
  var bits='', out='';
  for(var i=0;i<bytes.length;i++){ bits += bytes[i].toString(2).padStart(8,'0'); }
  for(var j=0;j+5<=bits.length;j+=5){ out += _B32[parseInt(bits.substr(j,5),2)]; }
  return out;
}
function b32decode(str){
  str = (str||'').toUpperCase().replace(/=+$/,'').replace(/\s/g,'');
  var bits='';
  for(var i=0;i<str.length;i++){ var v=_B32.indexOf(str[i]); if(v<0) continue; bits += v.toString(2).padStart(5,'0'); }
  var bytes=[];
  for(var j=0;j+8<=bits.length;j+=8){ bytes.push(parseInt(bits.substr(j,8),2)); }
  return new Uint8Array(bytes);
}
async function totpAt(secretB32, counter){
  var key = b32decode(secretB32);
  var buf = new ArrayBuffer(8); var view = new DataView(buf);
  view.setUint32(4, counter>>>0, false);
  view.setUint32(0, Math.floor(counter/0x100000000), false);
  var ck = await crypto.subtle.importKey('raw', key, {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  var sig = new Uint8Array(await crypto.subtle.sign('HMAC', ck, buf));
  var off = sig[sig.length-1] & 0xf;
  var bin = ((sig[off]&0x7f)<<24)|((sig[off+1]&0xff)<<16)|((sig[off+2]&0xff)<<8)|(sig[off+3]&0xff);
  return (bin % 1000000).toString().padStart(6,'0');
}
async function verifyTOTP(secretB32, code){
  if(!/^\d{6}$/.test(code||'')) return false;
  var t = Math.floor(Date.now()/30000);
  for(var w=-1; w<=1; w++){ if((await totpAt(secretB32, t+w))===code) return true; }  // ±30s drift
  return false;
}
function genTotpSecret(){
  var rnd = crypto.getRandomValues(new Uint8Array(20));
  return b32encode(rnd);
}

var _gsT = null;
function openGlobalSearch(){
  var ov = document.getElementById('gsearchOverlay'); ov.style.display='flex';

function closeGlobalSearch(){ document.getElementById('gsearchOverlay').style.display='none'; }
function runGlobalSearch(term){
  clearTimeout(_gsT);
  var q = likeSafe(term);
  if(q.length < 2){ document.getElementById('gsearchResults').innerHTML='<div style="padding:16px;color:var(--sub);font-size:13px">Keep typing…</div>'; return; }
  document.getElementById('gsearchResults').innerHTML='<div class="loading-msg">Searching…</div>';
  _gsT = setTimeout(async function(){
    var res = await Promise.allSettled([
      sb.from('profiles').select('id,name,email,phone').or('name.ilike.%'+q+'%,email.ilike.%'+q+'%,phone.ilike.%'+q+'%').limit(5),
      sb.from('listings').select('id,title,status,category').ilike('title','%'+q+'%').limit(5),
      sb.from('businesses').select('id,name,status').ilike('name','%'+q+'%').limit(5)
    ]);
    var users = (res[0].value&&res[0].value.data)||[];
    var lst   = (res[1].value&&res[1].value.data)||[];
    var biz   = (res[2].value&&res[2].value.data)||[];
    var html = '';
    function group(title){ return '<div style="font-size:10px;font-weight:800;color:var(--sub2);text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 4px">'+title+'</div>'; }
    function row(icon, main, sub, onclick){ return '<div onclick="'+onclick+'" style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px" onmouseover="this.style.background=\'rgba(255,255,255,.05)\'" onmouseout="this.style.background=\'none\'"><span style="color:var(--sub)">'+icon+'</span><div style="min-width:0"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+main+'</div><div style="font-size:11px;color:var(--sub)">'+sub+'</div></div></div>'; }
    if(users.length){ html += group('Users'); users.forEach(function(u){ html += row('◉', esc(u.name||'—'), esc(u.email||u.phone||''), 'closeGlobalSearch();viewUser(\''+u.id+'\')'); }); }
    if(lst.length){ html += group('Listings'); lst.forEach(function(l){ html += row('▤', esc(l.title||'—'), esc((l.category||'')+' · '+(l.status||'')), 'closeGlobalSearch();viewListing(\''+l.id+'\')'); }); }
    if(biz.length){ html += group('Businesses'); biz.forEach(function(b){ html += row('▣', esc(b.name||'—'), esc(b.status||''), 'closeGlobalSearch();showTab(\'businesses\');'); }); }
    if(!html) html = '<div style="padding:16px;color:var(--sub);font-size:13px">No matches for “'+esc(term)+'”.</div>';

  }, 260);
}

function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, rows){
  var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
// Exports fetch fresh server-side pages (respecting the active filter/search)
// instead of exporting whatever page is loaded in memory.
async function exportUsers(){
  toast('Preparing export…','info');
  try {
    var rows = [['Name','Phone','Email','Role','Status','Verified','Joined']];
    var page = 0, PAGE = 1000;
    while(page < 10){
      var q = sb.from('profiles').select('name,phone,email,role,status,verified,created_at').order('created_at',{ascending:false}).range(page*PAGE,(page+1)*PAGE-1);
      var s = likeSafe(_userSearch);
      if(s) q = q.or('name.ilike.%'+s+'%,email.ilike.%'+s+'%,phone.ilike.%'+s+'%');
      if(_userFilter==='banned') q=q.eq('status','banned');
      if(_userFilter==='verified') q=q.eq('verified',true);
      if(_userFilter==='unverified') q=q.eq('verified',false);
      var r = await q;
      if(r.error || !r.data || !r.data.length) break;
      r.data.forEach(function(u){ rows.push([u.name||'',u.phone||'',u.email||'',u.role||'user',u.status||'active',u.verified?'yes':'no',fmtDate(u.created_at)]); });
      if(r.data.length < PAGE) break;
      page++;
    }
    if(rows.length===1){ toast('No users to export','info'); return; }
    downloadCSV('pamarket-users-'+new Date().toISOString().slice(0,10)+'.csv', rows);
    auditLog('export_users','profiles',null,null,{rows:rows.length-1},null);
    toast('Exported '+(rows.length-1)+' users');
  } catch(e){ toast('Export failed: '+e.message,'error'); }
}

// confirm2: returns Promise<string|null>
var _confirmResolve = null;
function confirm2(title, msg, btnLabel, btnClass, withInput, inputPlaceholder, inputType) {
  return new Promise(function(resolve) {
    _confirmResolve = resolve;
    var inputHtml = withInput ? '<input class="confirm-input" id="confirmInput" type="'+(inputType||'text')+'" placeholder="'+(inputPlaceholder||'')+'" autofocus>' : '';
    document.getElementById('confirmBox').innerHTML =
      '<div class="confirm-title">'+esc(title)+'</div>'+
      '<div class="confirm-msg">'+esc(msg)+'</div>'+
      inputHtml+
      '<div class="confirm-btns">'+
        '<button class="confirm-ok '+(btnClass||'')+'" onclick="_confirmOk()">'+esc(btnLabel||'Confirm')+'</button>'+
        '<button class="confirm-cancel" onclick="_confirmCancel()">Cancel</button>'+
      '</div>';
    document.getElementById('confirmOverlay').classList.add('open');
    if(withInput) setTimeout(function(){ var el=document.getElementById('confirmInput'); if(el) el.focus(); },100);
  });
}
function _confirmOk() {
  var input = document.getElementById('confirmInput');
  var val = input ? input.value.trim() : true;
  document.getElementById('confirmOverlay').classList.remove('open');
  if(_confirmResolve){ _confirmResolve(val); _confirmResolve=null; }
}
function _confirmCancel() {
  document.getElementById('confirmOverlay').classList.remove('open');
  if(_confirmResolve){ _confirmResolve(null); _confirmResolve=null; }
}

var LOGIN_KEY = '_adm_fl';
var MAX_FAILS = 5;
var LOCKOUT_MS = 15 * 60 * 1000;
function getFailState(){ try{ return JSON.parse(sessionStorage.getItem(LOGIN_KEY)||'{"count":0,"until":0}'); } catch(e){ return {count:0,until:0}; } }
function saveFailState(s){ sessionStorage.setItem(LOGIN_KEY, JSON.stringify(s)); }
function recordFail(){ var s=getFailState(); s.count++; if(s.count>=MAX_FAILS) s.until=Date.now()+LOCKOUT_MS; saveFailState(s); }
function clearFails(){ sessionStorage.removeItem(LOGIN_KEY); }

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('aPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

async function doLogin() {
  if(!sb){ showErr('Supabase not loaded. Please refresh the page.'); return; }
  var email = document.getElementById('aEmail').value.trim();
  var pass  = document.getElementById('aPass').value;
  var errEl = document.getElementById('errMsg');
  errEl.style.display='none';
  var fs = getFailState();
  if(fs.until && Date.now()<fs.until){
    var mins=Math.ceil((fs.until-Date.now())/60000);
    showErr('Too many failed attempts. Try again in '+mins+' min'+(mins>1?'s':'.'));
    return;
  }
  if(!email||!pass){ showErr('Enter your email and password.'); return; }
  var btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Signing in…';
  try {
    var res = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(res.error||!res.data||!res.data.user){ recordFail(); logLoginAttempt(email,false,res.error?res.error.message:'invalid'); showErr((res.error?res.error.message:'Invalid credentials')+' ('+(MAX_FAILS-getFailState().count)+' attempts left)'); btn.disabled=false; btn.textContent='Sign In'; return; }
    var pr = await sb.from('profiles').select('role,name,mfa_secret').eq('id',res.data.user.id).single();
    if(pr.error||!pr.data||ADMIN_ROLES.indexOf(pr.data.role)===-1){
      await sb.auth.signOut(); logLoginAttempt(email,false,'not_admin'); showErr('Access denied. Admin team only.');
      btn.disabled=false; btn.textContent='Sign In'; return;
    }
    // Second factor: if this admin has enrolled a TOTP secret, require a code.
    if(pr.data.mfa_secret){
      var code = await confirm2('Two-Factor Authentication','Enter the 6-digit code from your authenticator app.','Verify','confirm-ok',true,'123456');
      if(code===null){ await sb.auth.signOut(); btn.disabled=false; btn.textContent='Sign In'; return; }
      var ok = await verifyTOTP(pr.data.mfa_secret, String(code).replace(/\s/g,''));
      if(!ok){ await sb.auth.signOut(); logLoginAttempt(email,false,'bad_mfa'); showErr('Incorrect authentication code.'); btn.disabled=false; btn.textContent='Sign In'; return; }
    }
    clearFails();
    _adminEmail = email;
    ADMIN_ROLE = pr.data.role;
    _adminUid = res.data.user.id;
    auditLog('admin_login','auth',res.data.user.id,null,{mfa:!!pr.data.mfa_secret},null);
    logLoginAttempt(email,true,null);
    startAdminSession();
    document.getElementById('sidebarUser').textContent = (pr.data.name || email) + (ADMIN_ROLE!=='admin' ? ' ('+ADMIN_ROLE+')' : '');
    showDash();
  } catch(e) {
    showErr('Login error: '+e.message);
    btn.disabled=false; btn.textContent='Sign In';
  }
}

// Server-side paged + searched + filtered user loading. DATA.users holds ONE
// page; _usersTotal is the exact server count for the current filter/search.
var _userPage = 0, USERS_PAGE = 50, _userFilter = 'all', _usersTotal = null;
function _userQuery(cols, withCount) {
  var q = sb.from('profiles').select(cols, withCount?{count:'exact'}:undefined).order('created_at',{ascending:false});
  var s = likeSafe(_userSearch);
  if(s) q = q.or('name.ilike.%'+s+'%,email.ilike.%'+s+'%,phone.ilike.%'+s+'%');
  if(_userFilter==='banned')     q = q.eq('status','banned');
  if(_userFilter==='verified')   q = q.eq('verified',true);
  if(_userFilter==='unverified') q = q.eq('verified',false);
  if(_userFilter==='pending')    q = q.eq('verification_pending',true);
  if(_userFilter==='team')       q = q.in('role',ADMIN_ROLES);
  return q.range(_userPage*USERS_PAGE, (_userPage+1)*USERS_PAGE-1);
}
async function loadUsers() {
  var cols = [
    'id,name,phone,email,role,status,verified,verification_pending,ban_reason,ban_until,created_at',
    'id,name,phone,email,role,status,verified,verification_pending,created_at',
    'id,name,phone,email,role,status,verified,created_at'
  ];
  for(var i=0;i<cols.length;i++){
    try {
      var r = await _userQuery(cols[i], true);
      if(!r.error && r.data){ DATA.users = r.data; _usersTotal = r.count; DATA.users.forEach(function(u){ PROF[u.id]=u; }); return; }
      if(i===cols.length-1 && r.error) toast('Users load error: '+r.error.message,'error');
    } catch(e){ if(i===cols.length-1) toast('Users exception: '+e.message,'error'); }
  }
}
function pagerHtml(page, pageSize, total, shown, goFn) {
  var pages = total!=null ? Math.max(1, Math.ceil(total/pageSize)) : null;
  var h = '<div style="display:flex;align-items:center;gap:10px;padding:10px 2px;font-size:12px;color:var(--sub)">';
  h += '<button class="filter-btn" '+(page<=0?'disabled style="opacity:.4"':'onclick="'+goFn+'('+(page-1)+')"')+'>← Prev</button>';
  h += '<span>Page '+(page+1)+(pages?' of '+pages:'')+' · '+(total!=null?fmtCnt(total)+' total':shown+' shown')+'</span>';
  var hasNext = total!=null ? (page+1)*pageSize<total : shown===pageSize;
  h += '<button class="filter-btn" '+(!hasNext?'disabled style="opacity:.4"':'onclick="'+goFn+'('+(page+1)+')"')+'>Next →</button>';
  h += '</div>';
  return h;
}

var MK_CATEGORIES = ['electronics','vehicles','property','furniture','fashion','jobs','agriculture','services','rooms','pets','kids','other'];
function _listingQuery(withCount) {

async function signedVUrl(path) {
  if(!path) return null;
  try {
    var sess = await sb.auth.getSession();
    var tok = sess && sess.data && sess.data.session && sess.data.session.access_token;
    if(!tok) return null;
    var res = await fetch('https://gxgytumhknmnwspxjzxw.supabase.co/functions/v1/get-r2-upload-url', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: path, verb: 'GET', expiresIn: 3600 })
    });
    if(!res.ok) return null;
    var data = await res.json();
    return data.signedUrl || null;
  } catch(e) { return null; }
}
async function loadVerifications() {
  try {
    var r = await sb.from('verifications').select('id,user_id,id_doc,selfie,id_doc_path,selfie_path,status,submitted_at,admin_note').order('submitted_at',{ascending:false}).limit(200);
    if(r.error) { toast('Verifications load error: '+r.error.message,'error'); return; }
    if(r.data) {
      DATA.verifications = r.data;
      // Resolve signed URLs for images held in the private verification-docs bucket
      await Promise.all(r.data.map(async function(v){
        if(v.id_doc_path && !v.id_doc) v._idUrl = await signedVUrl(v.id_doc_path);
        if(v.selfie_path && !v.selfie) v._selfieUrl = await signedVUrl(v.selfie_path);
      }));
    }
  } catch(e){ toast('Verifications exception: '+e.message,'error'); }
  // Pending-flag profiles are fetched directly (users are server-paged now, so
  // we can no longer derive this from the loaded users array).
  try {
    var pp = await sb.from('profiles').select('id,name,phone,email,verified,verification_pending,created_at').eq('verification_pending',true).order('created_at',{ascending:false}).limit(200);
    DATA.pendingProfiles = (!pp.error && pp.data) ? pp.data : [];
    DATA.pendingProfiles.forEach(function(p){ PROF[p.id]=p; });
  } catch(e){ DATA.pendingProfiles = []; }
  await ensureProfiles((DATA.verifications||[]).map(function(v){ return v.user_id; }));
  // Company verifications (table may not exist until the migration is run)
  try {

function extractPlanFromDesc(desc) {
  var m = (desc||'').match(/\[([a-z0-9_]+)\]\s*$/i);
  return m ? m[1].toLowerCase() : null;
}

    html += '<div style="font-size:12px;color:#F59E0B;font-weight:700;margin-top:3px">Upgrade to '+esc(planLabel)+' plan</div>';
    html += '<div style="font-size:11.5px;color:var(--sub);margin-top:2px">'+esc(cleanDesc)+' &nbsp;·&nbsp; <b style="color:var(--green)">$'+fmt(req.amount||0)+'</b> &nbsp;·&nbsp; '+fmtDate(req.created_at)+'</div>';
    html += '</div>';

async function approveBizUpgrade(paymentId, businessId, planId) {
  if(!BIZ_PLANS.includes(planId)){ toast('Unknown plan: '+planId,'error'); return; }
  var biz = DATA.businesses.find(function(b){return b.id===businessId;});
  var confirmed = await confirm2(
    'Approve Upgrade',
    'Activate '+planId.charAt(0).toUpperCase()+planId.slice(1)+' plan for '+(biz?biz.name:'this business')+'? Mark as paid and activate the subscription now.',
    'Approve + Activate', 'confirm-ok'
  );
  if(!confirmed) return;
  try {
    var rp = await sb.from('business_payments').update({status:'paid'}).eq('id',paymentId);
    if(rp.error) throw rp.error;
    await sb.from('business_subscriptions').update({status:'downgraded'}).eq('business_id',businessId).eq('status','active');
    var now = new Date(); now.setMonth(now.getMonth()+1);
    var rs = await sb.from('business_subscriptions').insert({business_id:businessId,plan_id:planId,billing_cycle:'monthly',status:'active',current_period_end:now.toISOString()});
    if(rs.error) throw rs.error;
    await sb.from('businesses').update({plan_id:planId}).eq('id',businessId);
    var req = DATA.bizUpgradeRequests.find(function(r){return r.id===paymentId;});
    if(req) req.status='paid';
    DATA.businessSubs = DATA.businessSubs.map(function(s){
      if(s.business_id===businessId&&s.status==='active') s.status='downgraded'; return s;
    });
    DATA.businessSubs.push({business_id:businessId,plan_id:planId,billing_cycle:'monthly',status:'active'});
    if(biz) biz.plan_id=planId;
    auditLog('approve_upgrade','business_payments',paymentId,{status:'pending'},{status:'paid',plan:planId},null);
    if(COUNTS.upgradesPending) COUNTS.upgradesPending--;
    toast('Plan activated: '+(planId.charAt(0).toUpperCase()+planId.slice(1))+' for '+(biz?biz.name:'business'));
    updateBadges(); renderBusinesses();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function declineBizUpgrade(paymentId) {
  var req = DATA.bizUpgradeRequests.find(function(r){return r.id===paymentId;});
  var biz = req && DATA.businesses.find(function(b){return b.id===req.business_id;});
  var confirmed = await confirm2('Decline Request','Decline the upgrade request'+(biz?' for '+biz.name:'')+' and mark it as failed?','Decline','confirm-ok');
  if(!confirmed) return;
  try {
    var rp = await sb.from('business_payments').update({status:'failed'}).eq('id',paymentId);
    if(rp.error) throw rp.error;
    if(req) req.status='failed';
    auditLog('decline_upgrade','business_payments',paymentId,{status:'pending'},{status:'failed'},null);
    if(COUNTS.upgradesPending) COUNTS.upgradesPending--;
    toast('Upgrade request declined');
    updateBadges(); renderBusinesses();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function bizExpiredSubs(){

async function bizExpireOverdue(){
  if(!requirePerm('businesses.billing')) return;
  var expired = bizExpiredSubs();
  if(!expired.length){ toast('No overdue subscriptions','info'); return; }
  var ok = await confirm2('Expire Overdue Subscriptions','Downgrade '+expired.length+' overdue subscription(s) to free? Owners keep their business; paid features stop.','Downgrade','red');
  if(!ok) return;
  var done=0;
  for(var i=0;i<expired.length;i++){
    var s = expired[i];
    try {
      await sb.from('business_subscriptions').update({status:'expired'}).eq('business_id',s.business_id).eq('status','active');
      await sb.from('businesses').update({plan_id:'free'}).eq('id',s.business_id);
      auditLog('expire_subscription','business_subscriptions',s.business_id,{plan:s.plan_id,ended:s.current_period_end},{plan:'free'},'past current_period_end');
      done++;
    } catch(e){}
  }
  toast(done+' subscription(s) downgraded');
  loadBusinesses().then(renderBusinesses);
}

// Business CRM detail: lifetime revenue, conversion, payment + audit history.
async function loadBizCRM(id){
  try {
    var res = await Promise.allSettled([
      sb.from('business_payments').select('amount,status,type,created_at').eq('business_id',id).order('created_at',{ascending:false}).limit(50),
      cnt('business_leads',function(q){return q.eq('business_id',id);}),
      cnt('business_leads',function(q){return q.eq('business_id',id).eq('status','converted');}),
      cnt('listings',function(q){return q.eq('business_id',id);}),
      sb.from('admin_audit_logs').select('action,reason,actor_email,created_at').eq('entity','businesses').eq('entity_id',id).order('created_at',{ascending:false}).limit(8)
    ]);
    var pays = (res[0].value&&res[0].value.data)||[];
    var leads = res[1].value, converted = res[2].value, listings = res[3].value;
    var audit = (res[4].status==='fulfilled'&&res[4].value&&!res[4].value.error)?(res[4].value.data||[]):null;
    var lifetime = pays.filter(function(p){return p.status==='paid';}).reduce(function(a,p){return a+(+p.amount||0);},0);
    var convRate = leads ? Math.round((converted/leads)*100) : 0;
    var el = document.getElementById('bizCRM'); if(!el) return;

async function _doDeleteBusiness(id) {
  if(!requirePerm('*')) return;
  var b = DATA.businesses.find(function(x){return x.id===id;});
  if(!(await reauth('permanently delete the business "'+(b?b.name:'')+'"'))) return;
  try {
    var r = await sb.from('businesses').delete().eq('id',id);
    if(r.error) throw r.error;
    DATA.businesses = DATA.businesses.filter(function(x){return x.id!==id;});
    auditLog('delete_business','businesses',id,{name:b&&b.name,status:b&&b.status,plan:b&&b.plan_id},null,null);
    renderBusinesses(); toast('Business deleted');
  } catch(e){ toast('Error: '+(e.message||'Failed'),'error'); }
}

function bizSetPlan(id) {
  var cur = bizActivePlan(id);
  var b = DATA.businesses.find(function(x){return x.id===id;}); if(!b) return;
  var rows = BIZ_PLANS.map(function(p){
    var price = BIZ_PLAN_PRICES[p] || 0;

async function doSetPlan(id, next) {
  closeModal();
  try {
    await sb.from('business_subscriptions').update({status:'downgraded'}).eq('business_id',id).eq('status','active');
    var now = new Date(); now.setMonth(now.getMonth()+1);
    var r = await sb.from('business_subscriptions').insert({business_id:id,plan_id:next,billing_cycle:'monthly',status:'active',current_period_end:now.toISOString()});
    if(r.error) throw r.error;
    await sb.from('businesses').update({plan_id:next}).eq('id',id);
    DATA.businessSubs = DATA.businessSubs.map(function(s){
      if(s.business_id===id&&s.status==='active') s.status='downgraded'; return s;
    });
    DATA.businessSubs.push({business_id:id,plan_id:next,billing_cycle:'monthly',status:'active'});
    var biz = DATA.businesses.find(function(b){return b.id===id;});
    var prevPlan = biz ? biz.plan_id : null;
    if(biz) biz.plan_id=next;
    auditLog('override_plan','businesses',id,{plan:prevPlan},{plan:next},'admin manual override');
    renderBusinesses(); toast('Plan overridden to '+next);
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function updateBadges() {
  // Badges are driven by server-side counts (loadCounts) — never by the size
  // of whatever page of data happens to be loaded in memory.
  var pendingL = COUNTS.listingsPending||0;
  var pendingV = COUNTS.verifPending||0;
  var openR    = COUNTS.reportsOpen||0;
  var pendingC = COUNTS.contactsPending||0;

  function setBadge(id, count) {
    var el=document.getElementById(id); if(!el) return;
    el.textContent=count; el.style.display=count>0?'':'none';
  }
  setBadge('badge-listings', pendingL);
  setBadge('badge-verif', pendingV);
  setBadge('badge-reports', openR);
  setBadge('badge-contacts', pendingC);
  setBadge('badge-biz-upgrades', COUNTS.upgradesPending||0);
  setBadge('badge-rental-pending', RA_DATA.summary ? RA_DATA.summary.pending_listings : 0);
  setBadge('badge-rental-reports', RA_DATA.summary ? RA_DATA.summary.open_reports : 0);
  setBadge('badge-support', COUNTS.supportOpen||0);
  setBadge('badge-modinbox', (pendingL||0)+(pendingV||0)+(openR||0)+(COUNTS.appealsOpen||0));
  var ob = document.getElementById('badge-overview');
  if(ob) ob.style.display = (pendingL||pendingV||openR||pendingC) ? '' : 'none';
}

var _ovAuto = false, _ovAutoTimer = null;

// Bulk moderation over the selected page rows; per-row checked writes + audit.
async function bulkListings(kind){
  if(!requirePerm('listings.moderate')) return;
  var ids = Object.keys(_lstSelected).filter(function(k){return _lstSelected[k];});
  if(!ids.length){ toast('Nothing selected','error'); return; }
  var reason = '';
  if(kind==='reject'){
    reason = await confirm2('Bulk Reject','Reject '+ids.length+' listing(s). Reason (sent to sellers):','Reject','red',true,'e.g. Prohibited item');
    if(reason===null) return;
  } else if(kind==='delete'){
    if(!(await reauth('permanently delete '+ids.length+' listings'))) return;
  } else {
    var ok = await confirm2('Bulk Approve','Approve and publish '+ids.length+' listing(s)?','Approve','green');
    if(!ok) return;
  }
  var done=0, failed=0;
  for(var i=0;i<ids.length;i++){
    var id = ids[i];
    var l = (DATA.listings||[]).find(function(x){return x.id===id;});
    try {
      if(kind==='delete'){
        var dr = await sb.from('listings').delete().eq('id',id);
        if(dr.error) throw dr.error;
        auditLog('bulk_delete_listing','listings',id,{title:l&&l.title},null,null);
      } else {
        var st = kind==='approve' ? 'active' : 'rejected';
        await updRow('listings', id, {status:st});
        auditLog('bulk_'+kind+'_listing','listings',id,{status:l&&l.status},{status:st},reason||null);
        if(l && l.sellerId){
          try { await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:kind==='approve'?'Listing Approved!':'Listing Not Approved',body:kind==='approve'?('Your listing "'+(l.title||'')+'" is now live.'):('Your listing "'+(l.title||'')+'" was not approved.'+(reason?' Reason: '+reason:'')),type:kind==='approve'?'info':'report',read:false,created_at:Date.now()}); } catch(e){}
        }
      }
      done++;
    } catch(e){ failed++; }
  }
  _lstSelected = {};
  toast(done+' done'+(failed?', '+failed+' failed':''), failed?'error':'success');
  loadCounts().then(updateBadges);
  loadListings().then(renderListings);
}

// Seller history: server-side aggregation of a seller's track record.
async function sellerHistory(sellerId, sellerName){
  if(!sellerId){ toast('No seller ID on this listing','info'); return; }
  openModal('<div class="modal-title">Seller History<button class="modal-close" onclick="closeModal()">×</button></div><div class="loading-msg">Loading…</div>');
  try {
    var res = await Promise.allSettled([
      cnt('listings',function(q){return q.eq('seller_id',sellerId);}),
      cnt('listings',function(q){return q.eq('seller_id',sellerId).eq('status','active');}),
      cnt('listings',function(q){return q.eq('seller_id',sellerId).eq('status','rejected');}),
      cnt('reports',function(q){return q.eq('target_id',sellerId).eq('target_type','user');}),
      sb.from('listings').select('id,title,status,created_at').eq('seller_id',sellerId).order('created_at',{ascending:false}).limit(10)
    ]);
    var total=res[0].value, act=res[1].value, rej=res[2].value, reps=res[3].value;
    var recent=(res[4].value&&res[4].value.data)||[];
    var html = '<div class="modal-title">'+esc(sellerName||'Seller')+'<button class="modal-close" onclick="closeModal()">×</button></div>';
    html += '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
    function chip(v,l,c){ return '<div style="flex:1;min-width:80px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+(c||'var(--text)')+'">'+fmtCnt(v)+'</div><div style="font-size:10px;color:var(--sub);text-transform:uppercase">'+l+'</div></div>'; }
    html += chip(total,'Listings')+chip(act,'Active','var(--green)')+chip(rej,'Rejected',rej>0?'var(--red)':null)+chip(reps,'Reports vs',reps>0?'var(--red)':null);
    html += '</div>';
    recent.forEach(function(l){ html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">'+esc(l.title)+'</span><span><span class="badge badge-'+(l.status==='active'?'active':l.status==='rejected'?'rejected':'pending')+'">'+esc(l.status)+'</span> <span style="color:var(--sub);font-size:11px">'+fmtDate(l.created_at)+'</span></span></div>'; });
    html += '<button class="ab ab-view" style="margin-top:12px;padding:9px 14px" onclick="closeModal();viewUser(\''+esc(sellerId)+'\')">Full user profile</button>';
    openModal(html);
  } catch(e){ openModal('<div class="modal-title">Seller History<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">'+esc(e.message)+'</div>'); }
}

async function viewListing(id) {
  var l = (DATA.listings||[]).find(function(x){ return x.id===id; });

  }

    + '<div style="font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:12px">'+esc(l.desc||'')+'</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<span class="badge badge-info">'+esc(l.cat||'—')+'</span>'
    + '<span class="badge badge-info">'+esc(l.city||'')+'</span>'
    + (l.price!=null?'<span class="badge badge-info">$'+fmt(l.price)+'</span>':'')
    + '<span class="badge badge-info">'+fmtCnt(l.views||0)+' views</span>'
    + '<span class="badge badge-'+(l.status||'pending')+'">'+esc(l.status||'—')+'</span>'
    + '</div>'
    + '<div id="dupCheck" style="font-size:12px;color:var(--sub);margin-top:10px">Checking for duplicates…</div>'
    + '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
    + '<button class="ab ab-view" style="padding:8px 13px" onclick="sellerHistory(\''+esc(l.sellerId||'')+'\',\''+esc((l.sellerName||'').replace(/'/g,''))+'\')">Seller history</button>'
    + '<button class="ab ab-view" style="padding:8px 13px" onclick="listingTimeline(\''+esc(l.id)+'\')">Moderation timeline</button>'
    + '</div>'
    + (l.status==='pending'?'<div style="display:flex;gap:10px;margin-top:16px"><button class="btn-verif-approve" onclick="approveListing(\''+l.id+'\');closeModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> Approve</button><button class="btn-verif-reject" onclick="rejectListing(\''+l.id+'\');closeModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Reject</button></div>':'')
  );
  // Duplicate detection: same seller + same (or very similar) title, server-side.
  try {
    var t = likeSafe((l.title||'').slice(0,40));
    if(l.sellerId && t){
      var dq = await sb.from('listings').select('id,title,status,created_at').eq('seller_id',l.sellerId).ilike('title','%'+t+'%').neq('id',l.id).limit(5);
      var el = document.getElementById('dupCheck');
      if(el){
        if(!dq.error && dq.data && dq.data.length){
          el.innerHTML = '<span style="color:var(--amber);font-weight:700">Possible duplicates from this seller:</span> '
            + dq.data.map(function(d){ return esc(d.title)+' <span class="badge badge-'+(d.status==='active'?'active':'pending')+'">'+esc(d.status)+'</span>'; }).join(' · ');
        } else el.innerHTML = '<span style="color:var(--green)">No duplicate titles from this seller.</span>';
      }
    } else { var el2=document.getElementById('dupCheck'); if(el2) el2.textContent=''; }
  } catch(e){}
}

// Per-listing moderation timeline from the unified audit trail.
async function listingTimeline(id) {
  openModal('<div class="modal-title">Moderation Timeline<button class="modal-close" onclick="closeModal()">×</button></div><div class="loading-msg">Loading…</div>');
  try {
    var r = await sb.from('admin_audit_logs').select('action,reason,actor_email,before_state,after_state,created_at').eq('entity','listings').eq('entity_id',id).order('created_at',{ascending:false}).limit(30);
    var body;
    if(r.error) body = '<div class="empty-msg">Audit table not installed — run ADMIN_ENTERPRISE_UPGRADE.sql.</div>';
    else if(!r.data||!r.data.length) body = '<div class="empty-msg">No recorded moderation actions for this listing.</div>';
    else body = r.data.map(function(a){
      return '<div style="border-left:2px solid var(--border);padding:8px 0 8px 12px;margin-left:4px">'
        + '<div style="font-weight:700;font-size:13px">'+esc(a.action)+'</div>'

    }).join('');

}

async function approveListing(id) {
  if(!requirePerm('listings.moderate')) return;
  try {
    var l = (DATA.listings||[]).find(function(x){ return x.id===id; });
    await updRow('listings', id, {status:'active'});
    var prev = l ? l.status : null;
    if(l){ l.status='active'; }
    if(l && l.sellerId) {
      await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:'Listing Approved!',body:'Your listing "'+l.title+'" is now live.',type:'info',read:false,created_at:Date.now()});
    }
    auditLog('approve_listing','listings',id,{status:prev},{status:'active'},null);
    if(COUNTS.listingsPending) COUNTS.listingsPending--;
    _ovQueue = null;
    updateBadges(); renderTab(); toast('Listing approved and seller notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rejectListing(id) {
  if(!requirePerm('listings.moderate')) return;
  var note = await confirm2('Reject Listing','Provide a reason (sent to the seller)','Reject','red',true,'e.g. Prohibited item');
  if(note===null) return;
  try {
    var l = (DATA.listings||[]).find(function(x){ return x.id===id; });
    await updRow('listings', id, {status:'rejected'});
    var prev = l ? l.status : null;
    if(l){ l.status='rejected'; }
    if(l && l.sellerId) {
      await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:'Listing Not Approved',body:'Your listing "'+l.title+'" was not approved.'+(note?' Reason: '+note:''),type:'report',read:false,created_at:Date.now()});
    }
    auditLog('reject_listing','listings',id,{status:prev},{status:'rejected'},note||null);
    if(prev==='pending' && COUNTS.listingsPending) COUNTS.listingsPending--;
    _ovQueue = null;
    updateBadges(); renderTab(); toast('Listing rejected','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function deleteListing(id) {
  if(!requirePerm('*')) return;
  var ok = await confirm2('Delete Listing','This cannot be undone.','Delete','red');
  if(!ok) return;
  try {
    var l = (DATA.listings||[]).find(function(x){ return x.id===id; });
    var r = await sb.from('listings').delete().eq('id',id);
    if(r.error) throw r.error;
    DATA.listings = (DATA.listings||[]).filter(function(x){ return x.id!==id; });
    auditLog('delete_listing','listings',id,{title:l&&l.title,status:l&&l.status},null,null);
    updateBadges(); renderTab(); toast('Listing deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

    else html += '<button class="ab ab-ban" onclick="banUser(\''+u.id+'\')">Ban</button>';
    if(!u.verified) html += '<button class="ab ab-approve" onclick="verifyUser(\''+u.id+'\')">Verify</button>';
    html += '<button class="ab ab-view" onclick="msgUser(\''+u.id+'\',\''+esc(u.name||'User')+'\')">Notify</button>';
    html += '</div></td></tr>';
  });
  html += '</tbody></table></div>';
  html += pagerHtml(_userPage, USERS_PAGE, _usersTotal, list.length, 'usersGo');
  document.getElementById('mainContent').innerHTML = html;
}

// Full user drill-down: profile, listings, businesses, reports (by + against),
// verification history, warnings/notes from the admin audit trail.
async function viewUser(userId) {
  openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="loading-msg">Loading…</div>');
  try {
    var res = await Promise.allSettled([
      sb.from('profiles').select('*').eq('id',userId).single(),
      sb.from('listings').select('id,title,status,created_at').eq('seller_id',userId).order('created_at',{ascending:false}).limit(8),
      cnt('listings',function(q){return q.eq('seller_id',userId);}),
      cnt('listings',function(q){return q.eq('seller_id',userId).eq('status','rejected');}),
      sb.from('businesses').select('id,name,status').eq('owner_user_id',userId).limit(5),
      cnt('reports',function(q){return q.eq('reporter_id',userId);}),
      cnt('reports',function(q){return q.eq('target_id',userId).eq('target_type','user');}),
      sb.from('verifications').select('status,submitted_at,admin_note').eq('user_id',userId).order('submitted_at',{ascending:false}).limit(3),
      sb.from('admin_audit_logs').select('action,reason,actor_email,created_at').eq('entity','profiles').eq('entity_id',userId).order('created_at',{ascending:false}).limit(10),
      cnt('reviews',function(q){return q.eq('seller_id',userId);}),
      cnt('messages',function(q){return q.eq('sender_id',userId);}),
      cnt('contact_requests',function(q){return q.eq('requester_id',userId);})
    ]);
    var u = res[0].value && res[0].value.data; if(!u){ openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">User not found.</div>'); return; }
    var lst = (res[1].value&&res[1].value.data)||[];
    var lTotal = res[2].value, lRejected = res[3].value;
    var bizs = (res[4].value&&res[4].value.data)||[];
    var repBy = res[5].value, repAgainst = res[6].value;
    var verifs = (res[7].value&&res[7].value.data)||[];
    var notes = (res[8].status==='fulfilled'&&res[8].value&&!res[8].value.error) ? (res[8].value.data||[]) : null;
    var revCount = res[9].value;
    var msgCount = res[10].value, unlockCount = res[11].value;
    var ageDays = (Date.now()-new Date(u.created_at).getTime())/864e5;
    var warns = (notes||[]).filter(function(n){return n.action==='warn_user';}).length;

    // Shared trust + fraud scoring (transparent heuristics, see infra v2).
    var sig = {verified:u.verified, ageDays:ageDays, rejected:lRejected, reportsAgainst:repAgainst, warnings:warns, banned:u.status==='banned'};
    var trust = computeTrust(sig), risk = computeRisk(sig);
    var tColor = trust>=70?'var(--green)':trust>=40?'var(--amber)':'var(--red)';
    var rColor = risk>=60?'var(--red)':risk>=30?'var(--amber)':'var(--green)';

    var html = '<div class="modal-title">'+esc(u.name||'User')+(u.mfa_secret?' <span class="badge badge-verified">2FA</span>':'')+'<button class="modal-close" onclick="closeModal()">×</button></div>';
    html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">';
    function chip(v,l,c){ return '<div style="flex:1;min-width:74px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 11px;text-align:center"><div style="font-size:16px;font-weight:800;color:'+(c||'var(--text)')+'">'+v+'</div><div style="font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px">'+l+'</div></div>'; }
    html += chip(trust, 'Trust', tColor) + chip(risk, 'Fraud risk', rColor) + chip(fmtCnt(lTotal),'Listings',null) + chip(fmtCnt(lRejected),'Rejected',(lRejected>0?'var(--red)':null))
      + chip(fmtCnt(repAgainst),'Reports vs',(repAgainst>0?'var(--red)':null)) + chip(fmtCnt(repBy),'Reports by',null)
      + chip(warns,'Warnings',(warns>0?'var(--amber)':null)) + chip(fmtCnt(revCount),'Reviews',null)
      + chip(fmtCnt(msgCount),'Messages',null) + chip(fmtCnt(unlockCount),'Unlocks',null);
    html += '</div>';
    // Fraud reasoning line
    var flags=[]; if(ageDays<2) flags.push('account < 48h old'); if(repAgainst>0) flags.push(repAgainst+' report(s) against'); if(lRejected>1) flags.push(lRejected+' rejected listings'); if(!u.verified) flags.push('unverified');
    if(flags.length) html += '<div style="font-size:11.5px;color:'+rColor+';margin:-4px 0 12px">Risk factors: '+flags.join(' · ')+'</div>';
    html += '<div style="font-size:13px;color:var(--sub);line-height:1.9;margin-bottom:12px">'
      + '<div><b>Contact:</b> '+esc(u.phone||'—')+' · '+esc(u.email||'—')+'</div>'
      + '<div><b>Role:</b> '+esc(u.role||'user')+' &nbsp; <b>Status:</b> '+esc(u.status||'active')+(u.ban_reason?' — '+esc(u.ban_reason):'')+(u.ban_until?' (until '+fmtDate(u.ban_until)+')':'')+'</div>'
      + '<div><b>Joined:</b> '+fmtDate(u.created_at)+' &nbsp; <b>Verified:</b> '+(u.verified?'yes':'no')+(u.verification_pending?' (review pending)':'')+'</div>'
      + (u.last_seen_at?'<div><b>Last active:</b> '+ago(u.last_seen_at)+' ago ('+fmtDateTime(u.last_seen_at)+')</div>':'')
      + '<div><b>User ID:</b> <span style="font-size:11px">'+esc(u.id)+'</span></div>'
      + '</div>';
    if(lst.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Recent Listings</div>';
      lst.forEach(function(l){ html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">'+esc(l.title)+'</span><span><span class="badge badge-'+(l.status==='active'?'active':l.status==='rejected'?'rejected':'pending')+'">'+esc(l.status)+'</span> <span style="color:var(--sub);font-size:11px">'+fmtDate(l.created_at)+'</span></span></div>'; });
    }
    if(bizs.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Businesses</div>';
      bizs.forEach(function(b){ html += '<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px"><span>'+esc(b.name||'—')+'</span><span class="badge badge-'+(b.status==='active'?'active':'pending')+'">'+esc(b.status||'—')+'</span></div>'; });
    }
    if(verifs.length){
      html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Verification History</div>';
      verifs.forEach(function(v){ html += '<div style="font-size:12.5px;padding:4px 0;color:var(--sub)">'+fmtDate(v.submitted_at)+' — <span class="badge badge-'+(v.status==='approved'?'active':v.status==='rejected'?'rejected':'pending')+'">'+esc(v.status)+'</span>'+(v.admin_note?' · '+esc(v.admin_note):'')+'</div>'; });
    }
    html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 6px">Admin Notes &amp; Actions</div>';
    if(notes===null) html += '<div style="font-size:12px;color:var(--sub)">Audit table not installed — run ADMIN_ENTERPRISE_UPGRADE.sql to enable notes and action history.</div>';
    else if(!notes.length) html += '<div style="font-size:12px;color:var(--sub)">No recorded actions for this user.</div>';
    else notes.forEach(function(n){ html += '<div style="font-size:12px;padding:4px 0;border-left:2px solid var(--border);padding-left:8px;margin-bottom:4px"><b>'+esc(n.action)+'</b>'+(n.reason?' — '+esc(n.reason):'')+'<div style="color:var(--sub2);font-size:11px">'+esc((n.actor_email||'').split('@')[0])+' · '+fmtDateTime(n.created_at)+'</div></div>'; });

    html += '<div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">';
    html += '<button class="ab ab-edit" style="padding:9px 14px" onclick="warnUser(\''+u.id+'\')">Issue Warning</button>';
    html += '<button class="ab ab-view" style="padding:9px 14px" onclick="addUserNote(\''+u.id+'\')">Add Note</button>';
    if(u.status==='banned') html += '<button class="ab ab-approve" style="padding:9px 14px" onclick="closeModal();unbanUser(\''+u.id+'\')">Unban</button>';
    else html += '<button class="ab ab-ban" style="padding:9px 14px" onclick="closeModal();banUser(\''+u.id+'\')">Ban</button>';
    if(!u.verified) html += '<button class="ab ab-approve" style="padding:9px 14px" onclick="closeModal();verifyUser(\''+u.id+'\')">Verify</button>';
    html += '</div>';
    openModal(html);
  } catch(e) {
    openModal('<div class="modal-title">User Profile<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">Could not load: '+esc(e.message)+'</div>');
  }

// Warning system: notify the user + record a strike in the audit trail.
async function warnUser(userId) {
  if(!requirePerm('users.warn')) return;
  var reason = await confirm2('Issue Warning','This sends the user a formal warning notification and records a strike. Reason:','Warn','red',true,'e.g. Repeated prohibited listings');
  if(reason===null) return;
  if(!String(reason).trim()){ toast('A warning reason is required','error'); return; }
  try {
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Official Warning',body:'You have received a warning from PaMarket moderators. Reason: '+reason+'. Further violations may lead to suspension.',type:'report',read:false,created_at:Date.now()});
    auditLog('warn_user','profiles',userId,null,null,String(reason).trim());
    closeModal(); toast('Warning sent and recorded');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function addUserNote(userId) {
  var note = await confirm2('Add Internal Note','Visible to admins only (stored in the audit trail):','Save Note','green',true,'e.g. Called user about duplicate account');
  if(note===null || !String(note).trim()) return;
  await auditLog('admin_note','profiles',userId,null,null,String(note).trim());
  if(AUDIT_OK===false) toast('Audit table missing — run ADMIN_ENTERPRISE_UPGRADE.sql','error');
  else toast('Note saved');
}

async function banUser(userId) {
  if(!requirePerm('*')) return;
  var reason = await confirm2('Ban User','Enter reason for ban:','Next','red',true,'e.g. Spam, fraudulent listing');
  if(reason===null) return;
  var dur = await confirm2('Ban Duration','Enter days (e.g. 7, 30) or "permanent":','Ban','red',true,'30');
  if(dur===null) return;
  var perm = /^perm/i.test(String(dur).trim());
  var days = perm ? null : (parseInt(dur)||30);
  if(perm && !(await reauth('permanently ban this user'))) return;
  try {
    var u = getUser(userId)||{};
    var prevStatus = u.status||'active';
    var banUntil = perm ? null : new Date(Date.now()+days*24*3600*1000).toISOString();
    await updRow('profiles', userId, {status:'banned',ban_reason:reason||'Policy violation',ban_until:banUntil});
    if(u){ u.status='banned'; u.ban_reason=reason; u.ban_until=banUntil; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Suspended',body:'Your account has been suspended'+(perm?' permanently':' until '+fmtDate(banUntil))+'.'+(reason?' Reason: '+reason:''),type:'ban',read:false,created_at:Date.now()});
    auditLog('ban_user','profiles',userId,{status:prevStatus},{status:'banned',ban_until:banUntil,permanent:perm},reason||null);
    renderTab(); toast(perm?'User permanently banned':'User banned for '+days+' days');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function unbanUser(userId) {
  var ok = await confirm2('Unban User','Remove ban from this user?','Unban','green');
  if(!ok) return;
  try {
    await updRow('profiles', userId, {status:'active',ban_reason:null,ban_until:null});
    var u = getUser(userId);
    if(u){ u.status='active'; u.ban_reason=null; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Reinstated',body:'Your account ban has been removed. Welcome back!',type:'info',read:false,created_at:Date.now()});
    auditLog('unban_user','profiles',userId,{status:'banned'},{status:'active'},null);
    renderTab(); toast('User unbanned');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function verifyUser(userId) {
  if(!requirePerm('verifications.manage')) return;
  var ok = await confirm2('Verify User','Grant verified badge to this user?','Verify','green');
  if(!ok) return;
  try {
    await updRow('profiles', userId, {verified:true,verification_pending:false});
    var u = getUser(userId);
    if(u){ u.verified=true; u.verification_pending=false; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Congratulations! Your blue verified badge is now active.',type:'verify',read:false,created_at:Date.now()});
    auditLog('verify_user','profiles',userId,{verified:false},{verified:true},null);
    renderTab(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

  var rejected = DATA.verifications.filter(function(v){ return v.status==='rejected'; });

    html += '<strong style="color:#fbbf24"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ID photos not available</strong><br>';

    html += '<strong style="color:var(--text)">To enable photo verification, run this SQL in your Supabase SQL editor:</strong><br>';
    html += '<code style="display:block;margin-top:6px;padding:8px;background:rgba(0,0,0,.3);border-radius:6px;font-size:11px;white-space:pre-wrap">CREATE TABLE IF NOT EXISTS verifications (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid REFERENCES profiles(id),\n  id_doc text,\n  selfie text,\n  status text DEFAULT \'pending\',\n  submitted_at timestamptz DEFAULT now(),\n  admin_note text,\n  UNIQUE(user_id)\n);\nALTER TABLE verifications ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "Admin reads verifications" ON verifications FOR SELECT USING (true);\nCREATE POLICY "User inserts own" ON verifications FOR INSERT WITH CHECK (auth.uid() = user_id);\nCREATE POLICY "User upserts own" ON verifications FOR UPDATE USING (auth.uid() = user_id);</code>';
    html += '</div>';
  }

  var total = pendingFromTable.length + pendingFromProfiles.length;
  if(!total) {
    html += '<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:12px;padding:20px;text-align:center;color:var(--green);font-weight:700;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> No pending verification requests</div>';

function companyVerifCard(cv, u) {
  var isSoleTrader = (cv.company_name||'').startsWith('SOLE TRADER:');
  var displayName  = isSoleTrader
    ? (cv.company_name||'').replace(/^SOLE TRADER:\s*/,'')
    : (cv.company_name||'Company');
  var typeBadge = isSoleTrader
    ? '<span class="badge" style="background:rgba(124,58,237,.15);color:#7c3aed">Sole Trader</span>'
    : '<span class="badge badge-info">Company</span>';

  var docs = isSoleTrader
    ? [['Owner ID / National ID', cv._ownerUrl]]
    : [
        ['Certificate of Incorporation', cv._regUrl],
        ['Tax Clearance',                cv._taxUrl],
        ['Business Premises',            cv._premisesUrl]
      ];

  var html = '<div class="verif-card">';
  html += '<div class="verif-header">';
  html += '<div class="verif-user"><div class="verif-avatar">'+initials(displayName||u.name||'C')+'</div>';
  html += '<div><div class="verif-name">'+esc(displayName)+'</div>';
  html += '<div class="verif-meta">'+esc(u.name||'')+' · '+esc(u.email||u.phone||'')+' · Submitted '+fmtDate(cv.submitted_at)+'</div></div></div>';
  html += '<div style="display:flex;gap:6px;align-items:center">'+typeBadge+'<span class="badge badge-pending">Pending</span></div>';
  html += '</div>';

  html += '<div class="verif-docs">';
  docs.forEach(function(d){
    html += '<div class="verif-doc-box"><div class="verif-doc-label">'+esc(d[0])+'</div>';
    if(d[1]) html += '<img class="verif-doc-img" src="'+esc(d[1])+'" onclick="openVerifPhoto(this,false)" onerror="this.style.opacity=\'.3\'">';
    else html += '<div style="padding:20px;text-align:center;color:var(--sub);font-size:12px">Not submitted</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="verif-actions">';
  html += '<button class="btn-verif-approve" onclick="approveCompany(\''+esc(cv.user_id)+'\')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> Approve</button>';
  html += '<button class="btn-verif-reject" onclick="rejectCompany(\''+esc(cv.user_id)+'\')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Reject</button>';
  html += '</div></div>';
  return html;
}

async function approveCompany(userId) {
  var ok = await confirm2('Approve Company','Grant the Verified Business badge to this company?','Approve','green');
  if(!ok) return;
  try {
    await sb.from('company_verifications').update({status:'approved',reviewed_at:new Date().toISOString()}).eq('user_id',userId);
    await sb.from('profiles').update({company_verified:true,company_verification_pending:false}).eq('id',userId);
