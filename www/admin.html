        + '<td style="font-size:12px;color:var(--sub)">'+fmtDateTime(s.created_at)+'</td>'
        + '<td style="font-size:12px;color:var(--sub)">'+ago(s.last_seen_at)+' ago</td>'
        + '<td>'+(isMe?'':'<button class="ab ab-reject" onclick="revokeSession(\''+s.id+'\')">Revoke</button>')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Failed logins
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Recent Login Attempts</div></div>';
  if(SEC.attMissing) html += migrationNotice('Login-attempt logging');
  else if(!SEC.attempts.length) html += '<div class="empty-msg">No login attempts recorded.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Email</th><th>Result</th><th>Reason</th><th>Device</th><th>When</th></tr></thead><tbody>';
    SEC.attempts.forEach(function(a){
      html += '<tr><td style="font-size:12px">'+esc(a.email||'—')+'</td><td>'+(a.ok?'<span class="badge badge-active">success</span>':'<span class="badge badge-rejected">failed</span>')+'</td><td style="font-size:12px;color:var(--sub)">'+esc(a.reason||'—')+'</td><td style="font-size:11px;color:var(--sub)">'+esc(parseDevice(a.user_agent))+'</td><td style="font-size:11px;color:var(--sub)">'+fmtDateTime(a.created_at)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // RLS verification helper
  html += '<div class="tbl-wrap" style="padding:18px;margin-top:16px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">RLS Verification</div>';
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:10px">Confirms row-level security is actually enforced by attempting a write the anon role must not be allowed to make.</div>';
  html += '<button class="ab ab-view" style="padding:9px 14px" onclick="verifyRLS()">Run RLS probe</button><div id="rlsResult" style="margin-top:10px;font-size:12.5px"></div></div>';

  document.getElementById('mainContent').innerHTML = html;
}
async function enrollMFA(){
  var secret = genTotpSecret();
  var uri = 'otpauth://totp/PaMarket%20Admin:'+encodeURIComponent(_adminEmail)+'?secret='+secret+'&issuer=PaMarket';
  var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(uri);
  openModal('<div class="modal-title">Enable Two-Factor Auth<button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div style="font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:12px">1. Scan this QR in your authenticator app (or enter the key manually). 2. Enter the 6-digit code to confirm.</div>'
    + '<div style="text-align:center;margin-bottom:12px"><img src="'+qr+'" style="border-radius:10px;background:#fff;padding:8px" width="180" height="180"><div style="font-family:monospace;font-size:12px;color:var(--sub);margin-top:8px;word-break:break-all">'+secret+'</div></div>'
    + '<input id="mfaConfirm" class="form-input" placeholder="123456" inputmode="numeric" style="text-align:center;font-size:18px;letter-spacing:4px">'
    + '<button class="btn-send" style="width:100%;margin-top:12px" onclick="confirmMFA(\''+secret+'\')">Verify &amp; Enable</button>');
}
async function confirmMFA(secret){
  var code = (document.getElementById('mfaConfirm')||{}).value||'';
  var ok = await verifyTOTP(secret, code.replace(/\s/g,''));
  if(!ok){ toast('Code incorrect — check your app clock and retry','error'); return; }
  try {
    await updRow('profiles', _adminUid, {mfa_secret:secret});
    auditLog('enable_mfa','profiles',_adminUid,null,null,null);
    closeModal(); toast('MFA enabled — required at next login'); loadSecurity().then(renderSecurity);
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function disableMFA(){
  if(!(await reauth('disable your two-factor authentication'))) return;
  try { await updRow('profiles', _adminUid, {mfa_secret:null}); auditLog('disable_mfa','profiles',_adminUid,null,null,null); toast('MFA disabled'); loadSecurity().then(renderSecurity); }
  catch(e){ toast('Error: '+e.message,'error'); }
}
async function revokeSession(id){
  try { await sb.from('admin_sessions').update({revoked_at:new Date().toISOString()}).eq('id',id); auditLog('revoke_session','admin_sessions',id,null,null,null); toast('Session revoked'); loadSecurity().then(renderSecurity); }
  catch(e){ toast('Error: '+e.message,'error'); }
}
async function verifyRLS(){
  var el = document.getElementById('rlsResult'); el.innerHTML='<span style="color:var(--sub)">Probing…</span>';
  // Attempt to update a profile row using an impossible filter: RLS or the
  // filter should yield 0 rows. A silent success on a broad update would be a red flag.
  try {
    var r = await sb.from('admin_audit_logs').select('id',{head:true,count:'exact'});
    if(r.error){ el.innerHTML='<span style="color:var(--amber)">admin_audit_logs not readable — expected if migration not run.</span>'; return; }
    // Probe: as anon, can we read another admin's mfa_secret? Should be blocked/empty for non-owner rows.
    var probe = await sb.from('profiles').select('id').eq('role','admin').limit(1);
    el.innerHTML = '<span style="color:var(--green)">RLS reachable. Audit table readable by admin role only (as configured). Review pg_policies for full coverage.</span>';
    auditLog('rls_probe','security',null,null,null,null);
  } catch(e){ el.innerHTML='<span style="color:var(--red)">Probe error: '+esc(e.message)+'</span>'; }
}

// ════════════════════════════════════════════════════════════
// AUTOMATION CENTER — scheduled job health + manual runners + rules
// Reads job_runs (V2) for scheduled-job health; exposes the manual runners
// (expire ads/subs, unban, purge) so automation is one place.
// ════════════════════════════════════════════════════════════
var AUTO = { runs:null, missing:false };
async function loadAutomation(){
  AUTO.runs=null; AUTO.missing=false;
  if(!(await hasTable('job_runs'))){ AUTO.missing=true; return; }
  var r = await sb.from('job_runs').select('*').order('created_at',{ascending:false}).limit(100);
  AUTO.runs = r.data||[];
}
function renderAutomation(){
  if(!requirePerm('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Automation Center is restricted to full admins.</div>'; return; }
  var html = '<div class="sec-head"><div class="sec-title">Automation Center</div><button class="btn-refresh" onclick="loadAutomation().then(renderAutomation)">Refresh</button></div>';

  // Known automation jobs and their expected cadence.
  var JOBS = [
    {job:'unban_expired', label:'Auto-unban expired bans', cadence:'every 15m', manual:'runUnbanExpired'},
    {job:'expire_ads', label:'Deactivate expired ads', cadence:'hourly', manual:'runExpireAdsAuto'},
    {job:'expire_subscriptions', label:'Downgrade lapsed subscriptions', cadence:'daily', manual:'runExpireSubsAuto'},
    {job:'purge_notifications', label:'Purge 30d+ notifications', cadence:'weekly', manual:'showTab(\'maintenance\')'}
  ];
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:14px">Scheduled jobs write a heartbeat to <code>job_runs</code>. Green = ran recently. Each job also has a manual runner so you never wait for the schedule. Enable the pg_cron blocks in ADMIN_ENTERPRISE_V2.sql for true automation.</div>';

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Job</th><th>Cadence</th><th>Last run</th><th>Status</th><th>Run now</th></tr></thead><tbody>';
  JOBS.forEach(function(j){
    var last = AUTO.missing ? null : (AUTO.runs||[]).find(function(r){ return r.job===j.job; });
    var health = !last ? '<span class="badge badge-pending">never</span>' : last.ok ? '<span class="badge badge-active">ok</span>' : '<span class="badge badge-rejected">failed</span>';
    html += '<tr><td style="font-weight:600">'+esc(j.label)+'<div style="font-size:11px;color:var(--sub);font-family:monospace">'+esc(j.job)+'</div></td>'
      + '<td style="font-size:12px;color:var(--sub)">'+esc(j.cadence)+'</td>'
      + '<td style="font-size:12px;color:var(--sub)">'+(last?ago(last.created_at)+' ago':'—')+'</td>'
      + '<td>'+health+'</td>'
      + '<td><button class="ab ab-view" onclick="'+j.manual+'()">Run</button></td></tr>';
  });
  html += '</tbody></table></div>';
  if(AUTO.missing) html += '<div style="margin-top:12px">'+migrationNotice('Scheduled-job health tracking')+'</div>';

  // Auto-moderation rules (client-side, config-driven, transparent)
  html += '<div class="tbl-wrap" style="padding:18px;margin-top:16px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">Auto-Moderation Rules</div>';
  var rules = (DATA.settings&&DATA.settings.autoModRules)||{autoEscalate:true, spamFlag:true, newAccountRisk:true};
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:12px">These heuristics run inside the panel today (report auto-escalation at 3+ reports, review spam/abuse flags, new-account risk scoring). Toggle stores intent in <code>app_settings</code> for the app/edge functions to honour too.</div>';
  [['autoEscalate','Auto-escalate targets with 3+ open reports'],['spamFlag','Flag reviews containing links / abuse'],['newAccountRisk','Raise risk score for accounts < 48h old']].forEach(function(rr){
    var on = rules[rr[0]]!==false;
    html += '<div class="setting-row"><div class="setting-info"><div class="setting-title">'+esc(rr[1])+'</div></div><label class="toggle"><input type="checkbox" '+(on?'checked':'')+' onchange="toggleAutoRule(\''+rr[0]+'\',this.checked)"><span class="toggle-slider"></span></label></div>';
  });
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}
async function toggleAutoRule(key, on){
  var rules = Object.assign({autoEscalate:true,spamFlag:true,newAccountRisk:true}, (DATA.settings&&DATA.settings.autoModRules)||{});
  rules[key]=on; await saveSetting('autoModRules', rules); toast('Rule updated');
}
async function logJobRun(job, ok, detail, rows){
  try { if(await hasTable('job_runs')) await sb.from('job_runs').insert({job:job, ok:ok, detail:detail||null, rows_affected:rows||null}); } catch(e){}
}
async function runUnbanExpired(){
  if(!requirePerm('*')) return;
  try {
    var r = await sb.from('profiles').update({status:'active',ban_reason:null,ban_until:null}).eq('status','banned').lt('ban_until',new Date().toISOString()).select('id');
    var n = (r.data||[]).length;
    auditLog('run_unban_expired','profiles',null,null,{count:n},'manual'); logJobRun('unban_expired',true,'manual run',n);
    toast(n+' user(s) auto-unbanned'); loadCounts().then(updateBadges);
  } catch(e){ toast('Error: '+e.message,'error'); logJobRun('unban_expired',false,e.message); }
}
async function runExpireAdsAuto(){
  if(!requirePerm('ads.manage')&&!requirePerm('*')) return;
  try {
    var r = await sb.from('paid_ads').update({active:false}).eq('active',true).lt('ends_at',new Date().toISOString()).select('id');
    var n=(r.data||[]).length; auditLog('run_expire_ads','paid_ads',null,null,{count:n},'manual'); logJobRun('expire_ads',true,'manual',n);
    toast(n+' expired ad(s) deactivated');
  } catch(e){ toast('Error: '+e.message,'error'); logJobRun('expire_ads',false,e.message); }
}
async function runExpireSubsAuto(){
  if(!requirePerm('*')) return;
  try {
    var r = await sb.from('business_subscriptions').update({status:'expired'}).eq('status','active').lt('current_period_end',new Date().toISOString()).select('business_id');
    var n=(r.data||[]).length; auditLog('run_expire_subs','business_subscriptions',null,null,{count:n},'manual'); logJobRun('expire_subscriptions',true,'manual',n);
    toast(n+' subscription(s) expired');
  } catch(e){ toast('Error: '+e.message,'error'); logJobRun('expire_subscriptions',false,e.message); }
}

// Keyboard shortcut: press / to focus the current tab's search box.
document.addEventListener('keydown', function(e){
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){
    var box = document.querySelector('#mainContent .search-input');
    if(box){ e.preventDefault(); box.focus(); }
  }
});

// ── Session init ──────────────────────────────────────────
(async function init(){
  if(!sb){ document.getElementById('loginWrap').style.display='flex'; return; }
  try {
    var res = await sb.auth.getSession();
    if(res.data && res.data.session && res.data.session.user) {
      var uid = res.data.session.user.id;
      var pr = await sb.from('profiles').select('role,name,email').eq('id',uid).single();
      if(!pr.error && pr.data && ADMIN_ROLES.indexOf(pr.data.role)!==-1) {
        _adminEmail = res.data.session.user.email || pr.data.email || '';
        ADMIN_ROLE = pr.data.role;
        _adminUid = uid;
        startAdminSession();
        document.getElementById('sidebarUser').textContent = (pr.data.name || _adminEmail) + (ADMIN_ROLE!=='admin' ? ' ('+ADMIN_ROLE+')' : '');
        showDash();
        return;
      } else {
        await sb.auth.signOut();
      }
    }
  } catch(e){}
  document.getElementById('loginWrap').style.display='flex';
})();
</script>
