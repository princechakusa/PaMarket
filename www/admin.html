async function approveVerification(userId, verifId) {
  var ok = await confirm2('Approve Verification','Grant verified badge to this user?','Approve','green');
  if(!ok) return;
  try {
    var r = await sb.from('profiles').update({verified:true,verification_pending:false,updated_at:new Date().toISOString()}).eq('id',userId).select('id');
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('Could not update the user — run FIX_ADMIN_PROFILE_UPDATE.sql so admins can verify other users.');
    if(verifId) await sb.from('verifications').update({status:'approved',admin_note:'Approved by admin'}).eq('id',verifId);
    var u = getUser(userId); if(u){ u.verified=true; u.verification_pending=false; }
    DATA.pendingProfiles = (DATA.pendingProfiles||[]).filter(function(p){ return p.id!==userId; });
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='approved';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Your blue verified badge is now active on all your listings.',type:'verify',read:false,created_at:Date.now()});
    auditLog('approve_verification','profiles',userId,{verified:false},{verified:true},null);
    if(COUNTS.verifPending) COUNTS.verifPending--;
    updateBadges(); renderVerifications(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rejectVerification(userId, verifId) {
  var note = await confirm2('Reject Verification','Reason for rejection (will be sent to user):','Reject','red',true,'e.g. ID photo blurry, face not visible');
  if(note===null) return;
  try {
    await sb.from('profiles').update({verification_pending:false}).eq('id',userId);
    if(verifId) await sb.from('verifications').update({status:'rejected',admin_note:note||'Documents unclear'}).eq('id',verifId);
    var u = getUser(userId); if(u) u.verification_pending=false;
    DATA.pendingProfiles = (DATA.pendingProfiles||[]).filter(function(p){ return p.id!==userId; });
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='rejected';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Verification Not Approved',body:'Your ID was not approved.'+(note?' Reason: '+note+'. Please resubmit with clearer photos.':' Please resubmit.'),type:'report',read:false,created_at:Date.now()});
    auditLog('reject_verification','profiles',userId,null,null,note||null);
    if(COUNTS.verifPending) COUNTS.verifPending--;
    updateBadges(); renderVerifications(); toast('Verification rejected, user notified','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function onNotifTargetChange() {
  var target = (document.getElementById('notifTarget')||{}).value;
  var row = document.getElementById('provinceFilterRow');
  // Hide province filter for individual user targets (UUIDs are 36 chars)
  if(row) row.style.display = (target && target.length === 36) ? 'none' : '';
  previewAudience(target);
}

// Server-counted audience size so admins see reach before sending.
async function previewAudience(target) {
  var el = document.getElementById('audCount'); if(!el) return;
  if(target && target.length===36){ el.textContent='(1 user)'; return; }
  el.textContent='(counting…)';
  var n = null;
  if(target==='all')        n = await cnt('profiles');
  else if(target==='verified')   n = await cnt('profiles',function(q){return q.eq('verified',true);});
  else if(target==='unverified') n = await cnt('profiles',function(q){return q.eq('verified',false);});
  else n = null; // sellers/buyers need a join — resolved by the Edge Function at send time
  el.textContent = n==null ? '(resolved at send time)' : '(~'+fmtCnt(n)+' users)';
}

// ── Notification templates (stored in app_settings.notifTemplates) ──
function applyNotifTemplate(idx) {
  if(idx==='') return;
  var t = ((DATA.settings&&DATA.settings.notifTemplates)||[])[parseInt(idx)];
  if(!t) return;
  var set = function(id,v){ var el=document.getElementById(id); if(el) el.value=v||''; };
  set('notifTitle', t.title); set('notifBody', t.body);
  if(t.type){ var ty=document.getElementById('notifType'); if(ty) ty.value=t.type; }
  set('notifDeepLink', t.deepLink); set('notifImageUrl', t.imageUrl);
  updateNotifPreview();
  var tc=document.getElementById('titleCount'); if(tc) tc.textContent=(t.title||'').length+'/80';
  var bc=document.getElementById('bodyCount'); if(bc) bc.textContent=(t.body||'').length+'/200';
}
async function saveNotifTemplate() {
  var title = (document.getElementById('notifTitle')||{}).value||'';
  var body  = (document.getElementById('notifBody')||{}).value||'';
  if(!title.trim()||!body.trim()){ toast('Fill in title and message first','error'); return; }
  var name = await confirm2('Save Template','Template name:','Save','green',true,'e.g. Weekly digest');
  if(name===null || !String(name).trim()) return;
  var tpls = (DATA.settings.notifTemplates||[]).slice();
  tpls.push({ name:String(name).trim(), title:title, body:body,
    type:(document.getElementById('notifType')||{}).value||'info',
    deepLink:(document.getElementById('notifDeepLink')||{}).value||'',
    imageUrl:(document.getElementById('notifImageUrl')||{}).value||'' });
  await saveSetting('notifTemplates', tpls);
  auditLog('save_notif_template','app_settings','1',null,{name:String(name).trim()},null);
  renderNotifications();
}
async function deleteNotifTemplate() {
  var sel = document.getElementById('notifTemplate');
  var idx = sel ? parseInt(sel.value) : NaN;
  if(isNaN(idx)){ toast('Select a template to delete','info'); return; }
  var tpls = (DATA.settings.notifTemplates||[]).slice();
  var removed = tpls.splice(idx,1);
  await saveSetting('notifTemplates', tpls);
  auditLog('delete_notif_template','app_settings','1',{name:removed[0]&&removed[0].name},null,null);
  renderNotifications();
}

function onScheduleChange() {
  var later = document.getElementById('schedLater');
  var picker = document.getElementById('notifScheduledFor');
  var btn = document.getElementById('sendNotifBtn');
  if(!later || !picker) return;
  picker.style.display = later.checked ? '' : 'none';
  if(btn) btn.textContent = later.checked ? 'Schedule Notification' : 'Send Notification';
}

async function sendNotification() {
  var target       = document.getElementById('notifTarget').value;
  var title        = document.getElementById('notifTitle').value.trim();
  var body         = document.getElementById('notifBody').value.trim();
  var type         = document.getElementById('notifType').value;
  var deepLink     = (document.getElementById('notifDeepLink')||{}).value||'';
  var imageUrl     = (document.getElementById('notifImageUrl')||{}).value||'';
  var schedLater   = document.getElementById('schedLater');
  var scheduledFor = (schedLater && schedLater.checked)
    ? (document.getElementById('notifScheduledFor')||{}).value || '' : '';

  if(!title){ toast('Enter a notification title','error'); return; }
  if(!body){  toast('Enter a message','error'); return; }
  if(schedLater && schedLater.checked && !scheduledFor){ toast('Select a date and time to schedule','error'); return; }

  // Collect province checkboxes
  var provinces = [];
  document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ provinces.push(cb.value); });

  var btn = document.getElementById('sendNotifBtn');
  var status = document.getElementById('sendStatus');
  btn.disabled = true;
  btn.textContent = scheduledFor ? 'Scheduling…' : 'Sending…';

  try {
    var sess = await sb.auth.getSession();
    var jwt = sess && sess.data && sess.data.session && sess.data.session.access_token;
    if(!jwt) throw new Error('Not authenticated — please sign in again');

    var payload = {
      target:       target,
      title:        title,
      body:         body,
      type:         type,
      deepLink:     deepLink  || null,
      imageUrl:     imageUrl  || null,
      provinces:    provinces.length ? provinces : null,
      scheduledFor: scheduledFor || null,
    };

    if(status) status.textContent = 'Calling FCM…';
    var res = await fetch(SUPABASE_URL + '/functions/v1/send-push', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + jwt,
        'Content-Type':  'application/json',
        'apikey':        SUPABASE_ANON,
      },
      body: JSON.stringify(payload),
    });

    var result = await res.json();
    if(!res.ok) throw new Error(result.error || ('HTTP ' + res.status));

    btn.disabled = false;
    btn.textContent = schedLater && schedLater.checked ? 'Schedule Notification' : 'Send Notification';
    if(status) status.textContent = '';

    // Clear form
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifBody').value  = '';
    if(document.getElementById('notifDeepLink'))  document.getElementById('notifDeepLink').value  = '';
    if(document.getElementById('notifImageUrl'))  document.getElementById('notifImageUrl').value  = '';
    document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ cb.checked = false; });
    updateNotifPreview();

    auditLog('send_notification','notifications',null,null,{target:target,title:title,scheduled:!!scheduledFor,sent:result.total_users||0},null);
    if(result.scheduled) {
      toast('Scheduled for '+new Date(scheduledFor).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}));
    } else {
      var msg = 'Sent to '+result.total_users+' user'+(result.total_users!==1?'s':'');
      if(result.fcm_sent  > 0) msg += ' · '+result.fcm_sent+' FCM delivered';
      if(result.no_token  > 0) msg += ' · '+result.no_token+' no device token';
      if(result.fcm_failed> 0) msg += ' · '+result.fcm_failed+' FCM failed';
      toast(msg);
    }

    await loadNotifHistory();
    renderNotifications();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Send Notification';
    if(status) status.textContent = '';
    toast('Error: '+e.message,'error');
  }
}

async function resolveReport(id) {
  if(!requirePerm('reports.manage')) return;
  try {
    await updRow('reports', id, {status:'resolved'});
    var rr=DATA.reports.find(function(x){return x.id===id;}); if(rr) rr.status='resolved';
    auditLog('resolve_report','reports',id,{status:'open'},{status:'resolved'},null);
    if(COUNTS.reportsOpen) COUNTS.reportsOpen--;
    updateBadges(); renderReports(); toast('Report resolved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function dismissReport(id) {
  if(!requirePerm('reports.manage')) return;
  try {
    var finalStatus = 'dismissed';
    var r = await sb.from('reports').update({status:'dismissed'}).eq('id',id).select('id');
    if(r.error){ // some databases restrict status to open/resolved — fall back gracefully
      finalStatus = 'resolved';
      r = await sb.from('reports').update({status:'resolved'}).eq('id',id).select('id');
      if(r.error) throw r.error;
    }
    if(!r.data || !r.data.length) throw new Error('Update matched 0 rows — blocked by RLS');
    var rr=DATA.reports.find(function(x){return x.id===id;});
    if(rr){ var wasOpen = rr.status==='open'; rr.status=finalStatus; if(wasOpen && COUNTS.reportsOpen) COUNTS.reportsOpen--; }
    auditLog('dismiss_report','reports',id,null,{status:finalStatus},null);
    updateBadges(); renderReports(); toast('Report dismissed','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

}

}
async function reportNote(id) {
  var note = await confirm2('Internal Note','Add an investigation note (admins only, stored in the audit trail):','Save','green',true,'e.g. Contacted seller, awaiting response');
  if(note===null || !String(note).trim()) return;
  await auditLog('report_note','reports',id,null,null,String(note).trim());
  if(AUDIT_OK===false) toast('Audit table missing — run ADMIN_ENTERPRISE_UPGRADE.sql','error');

async function decideContact(id, status) {
  try {
    var c = DATA.contactRequests.find(function(x){ return x.id===id; });
    var r = await sb.from('contact_requests').update({ status:status, decided_at:new Date().toISOString() }).eq('id',id);
    if(r.error) throw r.error;
    if(c) { c.status=status; c.decided_at=new Date().toISOString(); }
    // Notify the employer that their request was reviewed (best-effort; ignore failures)
    auditLog('contact_request_'+status,'contact_requests',id,null,{status:status},null);
    if(c && c.requester_id) {
      try {
        var candName = (c.candidate_name) || ((getUser(c.candidate_id)||{}).name) || 'the candidate';
        await sb.from('notifications').insert({
          id: notifId(), user_id: c.requester_id, type: 'contact',
          title: status==='approved' ? 'Contact unlocked' : 'Contact request declined',
          body: status==='approved'
            ? ('You can now view '+candName+'’s contact details in Hire Talent.')
            : ('Your request to contact '+candName+' was not approved.'),
          created_at: Date.now()
        });
      } catch(e){}
    }
    updateBadges(); renderContactRequests();
    toast(status==='approved' ? 'Contact unlocked for employer' : 'Request declined', status==='approved'?'success':'info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function toggleAd(id, active) {
  if(!requirePerm('ads.manage')) return;
  try {
    var on = active==='true'||active===true;
    await updRow('paid_ads', id, {active:on});
    var a=DATA.ads.find(function(x){return x.id===id;}); if(a) a.active=on;
    auditLog(on?'activate_ad':'pause_ad','paid_ads',id,{active:!on},{active:on},null);
    renderAds(); toast(on?'Ad activated':'Ad paused','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function deactivateExpiredAds() {
  if(!requirePerm('ads.manage')) return;
  var expired = DATA.ads.filter(function(a){ return a.active && a.ends_at && new Date(a.ends_at).getTime() < Date.now(); });
  var ok = await confirm2('Deactivate Expired','Pause '+expired.length+' expired ad(s)?','Deactivate','red');
  if(!ok) return;
  var done=0;
  for(var i=0;i<expired.length;i++){
    try { await updRow('paid_ads', expired[i].id, {active:false}); expired[i].active=false; done++;
      auditLog('expire_ad','paid_ads',expired[i].id,{active:true},{active:false},'past ends_at'); } catch(e){}
  }
  renderAds(); toast(done+' expired ad(s) deactivated');
}

async function deleteAd(id) {
  if(!requirePerm('ads.manage')) return;
  var ok = await confirm2('Delete Ad','Remove this ad permanently?','Delete','red');
  if(!ok) return;
  try {
    var a=DATA.ads.find(function(x){return x.id===id;});
    await sb.from('paid_ads').delete().eq('id',id);
    DATA.ads=DATA.ads.filter(function(x){return x.id!==id;});
    auditLog('delete_ad','paid_ads',id,{headline:a&&a.headline,business:a&&a.business_name},null,null);
    renderAds(); toast('Ad deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// Upload the compressed creative to Cloudflare R2 (same path the app uses for
// all media). Falls back to inline base64 only if the R2 Edge Function fails,
// so ad creation never hard-blocks on storage.
async function _adUploadToR2(blob, contentType) {
  var sess = await sb.auth.getSession();
  var tok = sess && sess.data && sess.data.session && sess.data.session.access_token;
  if(!tok) throw new Error('Not authenticated');
  var key = 'ads/' + (crypto.randomUUID ? crypto.randomUUID() : Date.now()) + '.jpg';
  var res = await fetch(SUPABASE_URL + '/functions/v1/get-r2-upload-url', {
    method:'POST', headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},
    body: JSON.stringify({ key:key, contentType:contentType })
  });
  if(!res.ok) throw new Error('R2 upload-url error: '+res.status);
  var payload = await res.json();
  var up = await fetch(payload.signedUrl, { method:'PUT', headers:{'Content-Type':contentType}, body:blob });
  if(!up.ok) throw new Error('R2 PUT failed: '+up.status);
  if(!payload.publicUrl) throw new Error('No public URL returned');
  return payload.publicUrl;
}

window._adLoadImage = function(e) {
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    var img = new Image();
    img.onload = function() {
      var MAX_W = 800, MAX_H = 400;
      var w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.72);
      var prev = document.getElementById('adImgPreview');
      if(prev) prev.innerHTML = '<img src="'+compressed+'" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:contain"><div style="font-size:11px;color:var(--sub);margin-top:4px">Uploading to R2…</div>';
      canvas.toBlob(async function(blob){
        var stored = compressed, note = '~'+Math.round(compressed.length*0.75/1024)+' KB inline (R2 unavailable)';
        try { stored = await _adUploadToR2(blob, 'image/jpeg'); note = 'stored on R2'; }
        catch(err){ console.warn('ad R2 upload failed, falling back to inline:', err.message); }
        var fld = document.getElementById('adImg'); if(fld) fld.value = stored;
        var pv = document.getElementById('adImgPreview');
        if(pv) pv.innerHTML = '<img src="'+compressed+'" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:contain"><div style="font-size:11px;color:var(--sub);margin-top:4px">'+w+'×'+h+' px · '+note+'</div>';
      }, 'image/jpeg', 0.72);
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(f);
};

// ── CHATS ─────────────────────────────────────────────────
// Redesigned as a proper messenger UI (list + thread, like a SaaS inbox)
// backed by real pagination instead of a flat "last 600 messages app-wide"
// query — that old approach silently dropped older conversations and
// truncated long threads whenever they fell outside the global cap.
var CHAT_PAGE = 20;
var _chatPage = 0, _chatsTotal = null, _chatSearch = '';
var _openChatId = null;
var _chatMsgs = [];          // messages currently loaded for the open thread, oldest first
var _chatMsgsHasMore = false;
var _chatMsgsOldestAt = null; // cursor for "load older"

async function loadChats() {
  try {
    var from = _chatPage * CHAT_PAGE, to = from + CHAT_PAGE - 1;
    var r = await sb.from('conversations')
      .select('id,members,listing_id,updated_at,created_at', {count:'exact'})
      .order('updated_at', {ascending:false})
      .range(from, to);
    if(r.error||!r.data){ DATA.chats=[]; _chatsTotal=null; return; }
    DATA.chats = r.data;
    _chatsTotal = r.count!=null ? r.count : null;

    var uids = [];
    DATA.chats.forEach(function(c){ (c.members||[]).forEach(function(m){ uids.push(m); }); });
    await ensureProfiles(uids);

    var convIds = DATA.chats.map(function(c){ return c.id; });
    if(convIds.length){
      var lastRes = await sb.from('messages').select('conversation_id,text,image,created_at,read,sender_id')
        .in('conversation_id', convIds).order('created_at',{ascending:false}).limit(convIds.length*4);
      var lastByConv = {}, unreadByConv = {};
      (lastRes.data||[]).forEach(function(m){
        if(!lastByConv[m.conversation_id]) lastByConv[m.conversation_id]=m;
        if(!m.read) unreadByConv[m.conversation_id]=(unreadByConv[m.conversation_id]||0)+1;
      });
      DATA.chats.forEach(function(c){ c.lastMsg=lastByConv[c.id]||null; c.unread=unreadByConv[c.id]||0; });
    }
  } catch(e){ DATA.chats=[]; _chatsTotal=null; }
}

function chatsGo(page){ _chatPage=page; loadChats().then(renderChats); }
function chatsSearchInput(v){ _chatSearch=v; debounce('chatSearch', function(){ renderChats(); var s=document.getElementById('chatSearchIn'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length); } }); }

function _chatParticipants(c){
  return (c.members||[]).map(function(id){ return getUser(id); }).filter(Boolean);
}
function _chatTitle(c){
  var names = _chatParticipants(c).map(function(u){ return u.name||u.email||u.phone; }).filter(Boolean);
  return names.length ? names.join(' ↔ ') : c.id;
}
function _avatarChip(name, size){
  size = size||36;
  var initial = (name||'?').trim().charAt(0).toUpperCase()||'?';
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:'+Math.round(size*0.4)+'px;font-weight:800;color:#fff;flex-shrink:0">'+esc(initial)+'</div>';
}

// Loads one page of a single conversation's message history, oldest-first
// within the page. Called on open, and again by "Load older" — so a long
// thread's full history is reachable instead of being cut off by a global cap.
async function _loadChatMessages(convId, before){
  var q = sb.from('messages').select('id,sender_id,sender_name,text,image,created_at,read')
    .eq('conversation_id', convId).order('created_at',{ascending:false}).limit(50);
  if(before) q = q.lt('created_at', before);
  var r = await q;
  if(r.error||!r.data) return {rows:[], hasMore:false};
  var rows = r.data.slice().reverse(); // oldest-first for rendering
  return {rows: rows, hasMore: r.data.length===50};
}

async function openChat(id){
  _openChatId = id;
  _chatMsgs = []; _chatMsgsHasMore = false; _chatMsgsOldestAt = null;
  renderChats(); // show loading shell immediately
  var page = await _loadChatMessages(id, null);
  _chatMsgs = page.rows;
  _chatMsgsHasMore = page.hasMore;
  _chatMsgsOldestAt = _chatMsgs.length ? _chatMsgs[0].created_at : null;
  var cv = DATA.chats.find(function(c){ return c.id===id; });
  if(cv && window._lastAuditedChat !== id){
    window._lastAuditedChat = id;
    auditLog('view_chat','messages',id,null,{participants:_chatParticipants(cv).map(function(u){return u.name;})},null);
  }
  renderChats();
}

async function loadOlderChatMessages(){
  if(!_openChatId || !_chatMsgsHasMore) return;
  var page = await _loadChatMessages(_openChatId, _chatMsgsOldestAt);
  _chatMsgs = page.rows.concat(_chatMsgs);
  _chatMsgsHasMore = page.hasMore;
  _chatMsgsOldestAt = page.rows.length ? page.rows[0].created_at : _chatMsgsOldestAt;
  renderChats();
}

function closeChat(){ _openChatId=null; _chatMsgs=[]; renderChats(); }

function renderChats() {
  var html='<div class="sec-head"><div class="sec-title">User Chats</div>'
    +'<div class="sec-actions"><button class="filter-btn on" onclick="loadChats().then(renderChats)">'
    +'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Refresh</button></div></div>';

  if(!DATA.chats.length && !_chatSearch){
    html+='<div class="empty-msg">No conversations found yet.</div>';
    document.getElementById('mainContent').innerHTML=html; return;
  }

  var q = _chatSearch.trim().toLowerCase();
  var filtered = q ? DATA.chats.filter(function(c){ return _chatTitle(c).toLowerCase().indexOf(q)!==-1; }) : DATA.chats;

  html += '<div class="chat-shell">';

  // ── Left pane: conversation list ──
  html += '<div class="chat-list-pane">';
  html += '<div class="chat-search-wrap"><input id="chatSearchIn" class="fi" placeholder="Search by participant name…" value="'+esc(_chatSearch)+'" oninput="chatsSearchInput(this.value)"></div>';
  html += '<div class="chat-list-scroll">';
  if(!filtered.length){
    html += '<div class="empty-msg" style="padding:24px 16px">No conversations match "'+esc(_chatSearch)+'".</div>';
  }
  filtered.forEach(function(c){
    var title = _chatTitle(c);
    var lm = c.lastMsg;
    var preview = lm ? (lm.image ? 'Photo' : (lm.text||'').slice(0,54)+((lm.text||'').length>54?'…':'')) : 'No messages yet';
    var isActive = c.id===_openChatId;
    html += '<div class="chat-list-row'+(isActive?' active':'')+'" onclick="openChat(\''+esc(c.id)+'\')">';
    html += _avatarChip(title, 40);
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="display:flex;justify-content:space-between;gap:8px"><div class="chat-list-name">'+esc(title)+'</div>';
    html += '<div class="chat-list-time">'+(lm?fmtDateTime(lm.created_at):'')+'</div></div>';
    html += '<div style="display:flex;justify-content:space-between;gap:8px"><div class="chat-list-preview">'+esc(preview)+'</div>';
    html += (c.unread?'<span class="badge badge-pending">'+c.unread+'</span>':'')+'</div>';
    html += '</div></div>';
  });
  html += '</div>';
  html += pagerHtml(_chatPage, CHAT_PAGE, _chatsTotal, DATA.chats.length, 'chatsGo');
  html += '</div>';

  // ── Right pane: thread view ──
  html += '<div class="chat-thread-pane">';
  if(!_openChatId){
    html += '<div class="chat-thread-empty">'
      + '<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.35;margin-bottom:10px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
      + '<div>Select a conversation to view messages</div></div>';
  } else {
    var cv = DATA.chats.find(function(c){ return c.id===_openChatId; });
    var title = cv ? _chatTitle(cv) : _openChatId;
    var participants = cv ? _chatParticipants(cv) : [];
    html += '<div class="chat-thread-hdr">';
    html += _avatarChip(title, 38);
    html += '<div style="flex:1;min-width:0">';
    html += '<div style="font-size:14px;font-weight:700;color:var(--text)">'+esc(title)+'</div>';
    html += '<div style="font-size:11.5px;color:var(--sub)">'+participants.length+' participant'+(participants.length===1?'':'s')+' · conversation '+esc(String(_openChatId).slice(0,12))+'</div>';
    html += '</div>';
    html += '<button class="filter-btn" onclick="closeChat()">Close</button>';
    html += '</div>';

    html += '<div class="chat-thread-scroll" id="chatThreadScroll">';
    if(_chatMsgsHasMore){
      html += '<div style="text-align:center;padding:6px 0 14px"><button class="filter-btn" onclick="loadOlderChatMessages()">Load older messages</button></div>';
    }
    if(!_chatMsgs.length){
      html += '<div class="empty-msg">No messages yet.</div>';
    }
    _chatMsgs.forEach(function(m){
      var sender = getUser(m.sender_id);
      var name = esc(sender ? (sender.name||sender.email||sender.phone) : (m.sender_name||String(m.sender_id).slice(-6)));
      var mine = participants.length && m.sender_id === participants[0].id; // left/right split by first participant, purely visual
      html += '<div class="chat-bubble-row'+(mine?' mine':'')+'">';
      html += '<div class="chat-bubble">';
      html += '<div class="chat-bubble-name">'+name+'</div>';
      if(m.image) html += '<img src="'+esc(m.image)+'" style="max-width:220px;border-radius:8px;display:block;margin-bottom:4px">';
      if(m.text) html += '<div class="chat-bubble-text">'+esc(m.text)+'</div>';
      html += '<div class="chat-bubble-time">'+fmtDateTime(m.created_at)+(m.read?' · Read':'')+'</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }
  html += '</div>'; // .chat-thread-pane
  html += '</div>'; // .chat-shell

  document.getElementById('mainContent').innerHTML=html;
  if(_openChatId){
    var scroller = document.getElementById('chatThreadScroll');
    if(scroller) scroller.scrollTop = scroller.scrollHeight;
  }
}

// ── ANALYTICS ─────────────────────────────────────────────
// Every number here is a server-side count/aggregate — nothing is derived from
// paged in-memory arrays, so charts stay correct at any scale.
var ANALYTICS = null;
var _anWindow = 14; // growth chart window in days
async function loadAnalytics() {
  var winDays = _anWindow;
  // Per-category + per-province counts (parallel head counts).
  var catJobs  = MK_CATEGORIES.map(function(c){ return cnt('listings',function(q){return q.eq('category',c);}); });
  var provJobs = PROVINCES.map(function(p){ return cnt('listings',function(q){return q.eq('province',p);}); });
  // Daily new users + listings for the growth chart.
  var dayBounds = [];
  for(var i=winDays-1;i>=0;i--){
    var s = new Date(Date.now()-i*864e5); s.setHours(0,0,0,0);
    var e = new Date(s); e.setDate(e.getDate()+1);
    dayBounds.push([s,e]);
  }
  var userDayJobs = dayBounds.map(function(b){ return cnt('profiles',function(q){return q.gte('created_at',b[0].toISOString()).lt('created_at',b[1].toISOString());}); });
  var lstDayJobs  = dayBounds.map(function(b){ return cnt('listings',function(q){return q.gte('created_at',b[0].toISOString()).lt('created_at',b[1].toISOString());}); });
  var d30 = new Date(Date.now()-30*864e5).toISOString();
  var d7  = new Date(Date.now()-7*864e5).toISOString();
  var extra = Promise.allSettled([
    cnt('verifications',function(q){return q.eq('status','pending');}),
    cnt('verifications',function(q){return q.eq('status','approved');}),
    cnt('verifications',function(q){return q.eq('status','rejected');}),
    sb.from('business_payments').select('amount,created_at').eq('status','paid').gte('created_at',d30).limit(2000),
    sb.from('paid_ads').select('price_paid').limit(1000),
    cnt('admin_audit_logs',function(q){return q.gte('created_at',d7);}),
    cnt('admin_audit_logs',function(q){return q.gte('created_at',d7).in('action',['approve_listing','reject_listing','bulk_approve_listing','bulk_reject_listing']);}),
    cnt('messages',function(q){return q.gte('created_at',d7);}),
    cnt('reports'),
    cnt('reports',function(q){return q.eq('status','resolved');}),
    cnt('reviews'),
    cnt('rental_vehicle_listings',function(q){return q.eq('status','active').eq('admin_status','approved');}),
    cnt('business_subscriptions',function(q){return q.eq('status','active').neq('plan_id','free');})
  ]);
  // Analytics Center extras: funnel counts, cohort retention (RPC), search analytics.
  var d90 = new Date(Date.now()-90*864e5).toISOString();
  var centerP = Promise.allSettled([
    cnt('profiles'),                                                  // funnel: registered
    cnt('profiles',function(q){return q.gt('last_seen_at','1970-01-01');}), // engaged (has activity) — needs V2 col
    cnt('listings'),                                                  // created a listing (proxy: any listing exists per seller not counted here)
    cnt('profiles',function(q){return q.eq('verified',true);}),      // verified
    cnt('business_subscriptions',function(q){return q.eq('status','active').neq('plan_id','free');}), // paid
    rpc('admin_cohorts',{weeks:8}),
    // Search analytics (optional table)
    hasTable('search_logs') ? sb.from('search_logs').select('term,results').gte('created_at',d30).limit(5000) : Promise.resolve({error:{missing:true}})
  ]);
  var res = await Promise.all([Promise.all(catJobs), Promise.all(provJobs), Promise.all(userDayJobs), Promise.all(lstDayJobs), extra, centerP]);
  var ex = res[4].map(function(x){ return x.value; });
  var ce = res[5];
  // Cohorts via RPC (or null → notice).
  var cohorts = (ce[5].value && ce[5].value.data) || (ce[5].value && ce[5].value.missing ? 'missing' : null);
  // Search analytics rollup.
  var searchData = null, searchMissing = false;
  var sr = ce[6].value;
  if(sr && sr.error && sr.error.missing) searchMissing = true;
  else if(sr && sr.data){
    var top={}, failed={};
    sr.data.forEach(function(x){ var t=(x.term||'').trim().toLowerCase(); if(!t) return; top[t]=(top[t]||0)+1; if((x.results||0)===0) failed[t]=(failed[t]||0)+1; });
    searchData = {
      total: sr.data.length,
      failRate: sr.data.length ? Math.round(sr.data.filter(function(x){return (x.results||0)===0;}).length/sr.data.length*100) : 0,
      top: Object.keys(top).map(function(k){return {term:k,n:top[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,10),
      failed: Object.keys(failed).map(function(k){return {term:k,n:failed[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,10)
    };
  }
  ANALYTICS = {
    windowDays: winDays,
    cats: MK_CATEGORIES.map(function(c,i){ return {name:c, n:res[0][i]||0}; }).sort(function(a,b){return b.n-a.n;}),
    provs: PROVINCES.map(function(p,i){ return {name:p, n:res[1][i]||0}; }).sort(function(a,b){return b.n-a.n;}),
    days: dayBounds.map(function(b,i){ return {label:b[0].toLocaleDateString('en-GB',{day:'2-digit',month:'short'}), users:res[2][i]||0, listings:res[3][i]||0}; }),
    vPending:ex[0], vApproved:ex[1], vRejected:ex[2],
    subsRev30:(ex[3]&&ex[3].data||[]).reduce(function(s,p){return s+(parseFloat(p.amount)||0);},0),
    adsRev:(ex[4]&&ex[4].data||[]).reduce(function(s,a){return s+(parseFloat(a.price_paid)||0);},0),
    adminActions7:ex[5], modDecisions7:ex[6], messages7:ex[7],
    reportsTotal:ex[8], reportsResolved:ex[9], mkReviews:ex[10],
    rentalsLive:ex[11], paidSubs:ex[12],
    funnel:{ registered:ce[0].value, engaged:ce[1].value, listings:ce[2].value, verified:ce[3].value, paid:ce[4].value },
    cohorts:cohorts, searchData:searchData, searchMissing:searchMissing,
    loadedAt:new Date()
  };
  if(currentTab==='analytics') renderAnalytics();
}

// Merge-safe save: re-fetch the settings row first and change only this key,
// so two admins editing different settings can't clobber each other's writes.
async function saveSetting(key, value) {
  try {
    var cur = {};
    try { var rr = await sb.from('app_settings').select('settings').eq('id',1).single(); cur = (!rr.error && rr.data && rr.data.settings) || {}; } catch(e){}
    var prev = cur[key];
    cur[key] = value;
    var sr = await sb.from('app_settings').upsert({id:1,settings:cur,updated_at:new Date().toISOString()});
    if(sr.error) throw sr.error;
    DATA.settings = cur;
    auditLog('change_setting','app_settings','1',{key:key,value:prev},{key:key,value:value},null);
    toast('Setting saved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// ── Feature flags (arbitrary toggles under settings.featureFlags) ──
async function addFeatureFlag() {
  var name = await confirm2('New Feature Flag','Flag key (lowercase, no spaces). The app reads it from app_settings.settings.featureFlags:','Create','green',true,'e.g. enable_rentals_v2');
  if(name===null) return;
  name = String(name).trim().toLowerCase().replace(/\s+/g,'_');
  if(!name){ toast('Enter a flag name','error'); return; }
  var flags = Object.assign({}, DATA.settings.featureFlags||{});
  if(flags.hasOwnProperty(name)){ toast('Flag already exists','error'); return; }
  flags[name] = false;
  await saveSetting('featureFlags', flags);
  renderSettings();
}
async function toggleFeatureFlag(name, on) {
  var flags = Object.assign({}, DATA.settings.featureFlags||{});
  flags[name] = on;
  await saveSetting('featureFlags', flags);
}
async function deleteFeatureFlag(name) {
  var ok = await confirm2('Delete Flag','Remove feature flag "'+name+'"? The app will treat it as off.','Delete','red');
  if(!ok) return;
  var flags = Object.assign({}, DATA.settings.featureFlags||{});
  delete flags[name];
  await saveSetting('featureFlags', flags);
  renderSettings();
}

// Settings change history from the unified audit trail.
async function settingsHistory() {
  openModal('<div class="modal-title">Settings Change History<button class="modal-close" onclick="closeModal()">×</button></div><div class="loading-msg">Loading…</div>');
  try {
    var r = await sb.from('admin_audit_logs').select('action,actor_email,before_state,after_state,created_at').eq('entity','app_settings').order('created_at',{ascending:false}).limit(40);

      var k = (a.after_state&&a.after_state.key)||'';

    }).join('');
    openModal('<div class="modal-title">Settings Change History<button class="modal-close" onclick="closeModal()">×</button></div>'+body);
  } catch(e){ openModal('<div class="modal-title">Settings Change History<button class="modal-close" onclick="closeModal()">×</button></div><div class="empty-msg">'+esc(e.message)+'</div>'); }
}

async function saveFxRate() {
  var v = parseFloat((document.getElementById('fxRateInput')||{}).value);
  if (!v || v <= 0) { toast('Enter a valid rate','error'); return; }
  try {
    var cur = {};
    try { var rr = await sb.from('app_settings').select('settings').eq('id',1).single(); cur = (!rr.error && rr.data && rr.data.settings) || {}; } catch(e){}
    var prev = cur.fxRate;
    cur.fxRate = v;
    cur.fxRateUpdatedAt = new Date().toISOString();
    var sr = await sb.from('app_settings').upsert({id:1,settings:cur,updated_at:new Date().toISOString()});
    if (sr.error) throw sr.error;
    DATA.settings = cur;
    auditLog('change_setting','app_settings','1',{key:'fxRate',value:prev},{key:'fxRate',value:v},null);
    toast('Exchange rate updated');
    renderSettings();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function saveSupportWa() {

    await saveSetting('supportWhatsapp', raw);
    toast(raw ? 'Support number saved' : 'Support number cleared');
    renderSettings();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

var _maintStats = null;

async function loadMaintenanceStats() {
  _maintStats = { errorLogs: '...', oldNotifs: '...', convTombs: '...' };
  try {
    var r1 = await sb.from('error_logs').select('id', { count: 'exact', head: true });
    _maintStats.errorLogs = r1.error ? '?' : (r1.count || 0);
  } catch(e) { _maintStats.errorLogs = '?'; }
  try {
    var cutoff30 = Date.now() - 30 * 86400000;
    var r2 = await sb.from('notifications').select('id', { count: 'exact', head: true }).lt('created_at', cutoff30);
    _maintStats.oldNotifs = r2.error ? '?' : (r2.count || 0);
  } catch(e) { _maintStats.oldNotifs = '?'; }
  try {
    var r3 = await sb.from('conversation_deletions').select('user_id', { count: 'exact', head: true });
    _maintStats.convTombs = r3.error ? '?' : (r3.count || 0);
  } catch(e) { _maintStats.convTombs = '?'; }
}

async function runClearErrorLogs() {
  if(!requirePerm('*')) return;
  var ok = await confirm2('Clear Error Logs', 'Delete all rows from error_logs? This cannot be undone.', 'Clear All', 'confirm-ok red');
  if (!ok) return;
  auditLog('purge_error_logs','error_logs',null,{rows:_maintStats&&_maintStats.errorLogs},null,null);
  _maintLog('Clearing error_logs...');
  try {
    // Delete every row via the uuid primary key — a type-agnostic filter that
    // never trips an "invalid input syntax" cast error, regardless of how the
    // created_at column is typed.
    var r = await sb.from('error_logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (r.error) throw r.error;
    _maintStats.errorLogs = 0;
    _maintLog('Done. error_logs cleared.');
    toast('Error logs cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runClearOldNotifs() {
  var cutoff = Date.now() - 30 * 86400000;
  var ok = await confirm2('Delete Old Notifications', 'Delete all notifications older than 30 days?', 'Delete', 'confirm-ok');
  if (!ok) return;
  auditLog('purge_old_notifications','notifications',null,{rows:_maintStats&&_maintStats.oldNotifs},null,'older than 30 days');
  _maintLog('Deleting notifications older than 30 days...');
  try {
    var r = await sb.from('notifications').delete().lt('created_at', cutoff);
    if (r.error) throw r.error;
    _maintStats.oldNotifs = 0;
    _maintLog('Done. Old notifications deleted.');
    toast('Old notifications cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runClearConvTombstones() {
  var ok = await confirm2('Clear Conversation Tombstones', 'Delete all rows from conversation_deletions? Users who hid conversations may see them reappear temporarily.', 'Clear', 'confirm-ok');
  if (!ok) return;
  _maintLog('Clearing conversation_deletions...');
  try {
    var r = await sb.from('conversation_deletions').delete().neq('user_id', '00000000-0000-0000-0000-000000000000');
    if (r.error) throw r.error;
    _maintStats.convTombs = 0;
    _maintLog('Done. Conversation tombstones cleared.');
    toast('Tombstones cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runPurgeOrphanedPhotos() {
  var ok = await confirm2(
    'Purge Orphaned Photos',
    'Scan the listings-photos bucket and delete files not referenced by any listing. This may take a moment.',
    'Scan & Purge', 'confirm-ok'
  );
  if (!ok) return;
  if (!(await reauth('purge orphaned photos from storage'))) return;
  auditLog('purge_orphaned_photos','storage',null,null,null,null);

  var PHOTO_BASE = 'https://gxgytumhknmnwspxjzxw.supabase.co/storage/v1/object/public/listings-photos/';
  _maintLog('Step 1: Fetching all listing photo URLs from database...');

  var activeUrls = new Set();
  try {
    var page = 0, PAGE = 1000;
    while (true) {
      var r = await sb.from('listings').select('photos').range(page * PAGE, (page + 1) * PAGE - 1);
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) break;
      r.data.forEach(function(row) {
        (row.photos || []).forEach(function(url) {
          if (typeof url === 'string' && url.startsWith(PHOTO_BASE)) {
            activeUrls.add(url.split('?')[0]);
          }
        });
      });
      if (r.data.length < PAGE) break;
      page++;
    }
    _maintLog('Found ' + activeUrls.size + ' referenced photos across all listings.');
  } catch(e) {
    _maintLog('Error fetching listings: ' + e.message);
    toast('Scan failed', 'error'); return;
  }

  _maintLog('Step 2: Listing files in storage bucket...');
  var toDelete = [];
  try {
    var rootList = await sb.storage.from('listings-photos').list('', { limit: 1000 });
    if (rootList.error) throw rootList.error;
    var folders = (rootList.data || []).filter(function(item) { return item.id == null; });
    _maintLog('Found ' + folders.length + ' user folder(s) in bucket.');
    for (var fi = 0; fi < folders.length; fi++) {
      var fname = folders[fi].name;
      var flist = await sb.storage.from('listings-photos').list(fname, { limit: 1000 });
      if (flist.error) { _maintLog('Skipping ' + fname + ': ' + flist.error.message); continue; }
      (flist.data || []).forEach(function(file) {
        if (!file.name) return;
        var url = PHOTO_BASE + fname + '/' + file.name;
        if (!activeUrls.has(url)) toDelete.push(fname + '/' + file.name);
      });
    }
    _maintLog('Found ' + toDelete.length + ' orphaned file(s) to delete.');
  } catch(e) {
    _maintLog('Error listing bucket: ' + e.message);
    toast('Scan failed', 'error'); return;
  }

  if (!toDelete.length) {
    _maintLog('Bucket is clean — no orphaned files.');
    toast('Bucket is clean'); return;
  }

  _maintLog('Step 3: Deleting ' + toDelete.length + ' orphaned file(s)...');
  var deleted = 0, BATCH = 100;
  for (var i = 0; i < toDelete.length; i += BATCH) {
    var batch = toDelete.slice(i, i + BATCH);
    var dr = await sb.storage.from('listings-photos').remove(batch);
    if (dr.error) { _maintLog('Batch error: ' + dr.error.message); }
    else { deleted += batch.length; _maintLog('Deleted ' + deleted + ' / ' + toDelete.length + '...'); }
  }
  _maintLog('Done. Deleted ' + deleted + ' orphaned photo(s).');
  toast('Purged ' + deleted + ' orphaned photos');
}

// Module 2: per-listing approval history timeline (from rental_audit_logs).
async function raShowListingHistory(id) {
  openModal('<div class="confirm-title">Approval History</div><div class="loading-msg">Loading…</div>');
  try {
    var { data, error } = await sb.from('rental_audit_logs')
      .select('action,actor_id,actor_role,after_state,created_at')
      .eq('target_table','rental_vehicle_listings').eq('target_id',id)
      .order('created_at',{ascending:false}).limit(50);
    if (error) throw error;
    var rows = data||[];
    var body = rows.length ? rows.map(function(l){
      var reason = l.after_state && l.after_state.reason ? l.after_state.reason : '';
      var actor  = l.actor_id ? String(l.actor_id).slice(0,8)+'…' : (l.actor_role||'system');
      return '<div style="border-left:2px solid var(--border);padding:8px 0 8px 12px;margin-left:4px">'
        + '<div style="font-weight:700;font-size:13px">'+esc(l.action||'')+'</div>'
        + (reason?'<div style="font-size:12px;color:var(--sub);margin-top:2px">Reason: '+esc(reason)+'</div>':'')
        + '<div style="font-size:11px;color:var(--sub);margin-top:2px">'+esc(actor)+' · '+fmtDateTime(l.created_at)+'</div>'
        + '</div>';
    }).join('') : '<div class="empty-msg">No recorded actions for this listing yet.</div>';

function renderRentalCompanies() {
  if (!RA_DATA.companies.length) { raLoadCompanies(); }
  var companies = RA_DATA.companies;
  var pending   = companies.filter(function(c){return c.status==='pending';});
  var active    = companies.filter(function(c){return c.status==='active';});
  var suspended = companies.filter(function(c){return c.status==='suspended';});

  // Module 3: search across loaded companies.
  var q = (_raCompanySearch||'').trim().toLowerCase();
  if (q) { pending=pending.filter(coMatch); active=active.filter(coMatch); suspended=suspended.filter(coMatch); }
  function coMatch(c){ return ((c.name||'')).toLowerCase().indexOf(q)!==-1; }

  function coCard(c) {
    return '<div class="verif-card">'
      + '<div class="verif-header"><div class="verif-user"><div class="verif-avatar">'+initials(c.name||'C')+'</div>'
      + '<div><div class="verif-name">'+esc(c.name||'Unnamed')+'</div>'
      + '<div class="verif-meta">'+fmt(c.fleet_count||0)+' vehicles · '+(c.avg_rating?Number(c.avg_rating).toFixed(1)+' avg':'no rating')+' · '+fmt(c.review_count||0)+' reviews</div></div></div>'
      + raPill(c.status)+'</div>'
      + '<div class="verif-actions" style="gap:6px">'
      + '<button class="ab ab-view" onclick="raShowCompanyDeep(\''+esc(c.id)+'\')">View</button>'
      + (c.status==='pending'   ? '<button class="btn-verif-approve" onclick="raSetCompanyStatus(\''+esc(c.id)+'\',\'active\')">Verify</button>' : '')
      + (c.status==='pending'   ? '<button class="btn-verif-reject" onclick="raSetCompanyStatus(\''+esc(c.id)+'\',\'rejected\')">Reject</button>' : '')
      + (c.status==='active'    ? '<button class="btn-verif-reject" onclick="raSetCompanyStatus(\''+esc(c.id)+'\',\'suspended\')">Suspend</button>' : '')
      + (c.status==='suspended' ? '<button class="btn-verif-approve" onclick="raSetCompanyStatus(\''+esc(c.id)+'\',\'active\')">Restore</button>' : '')

  }

  var html = '<div class="sec-head"><div class="sec-title">Companies</div><button class="btn-refresh" onclick="RA_DATA.companies=[];raLoadCompanies()">Refresh</button></div>';
  html += '<div style="margin-bottom:12px"><input id="raCompanySearch" class="search-input" placeholder="Search companies…" value="'+esc(_raCompanySearch)+'" oninput="_raCompanySearch=this.value;renderRentalCompanies();var el=document.getElementById(\'raCompanySearch\');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}" style="width:100%;max-width:320px"></div>';
  if (pending.length)   html += '<div class="sec-head" style="margin-top:8px"><div class="sec-title" style="font-size:13px;color:var(--amber)">Pending Verification ('+pending.length+')</div></div>' + pending.map(coCard).join('');
  if (suspended.length) html += '<div class="sec-head" style="margin-top:8px"><div class="sec-title" style="font-size:13px;color:var(--red)">Suspended ('+suspended.length+')</div></div>' + suspended.map(coCard).join('');
  if (active.length)    html += '<div class="sec-head" style="margin-top:8px"><div class="sec-title" style="font-size:13px">Active ('+active.length+')</div></div>' + active.map(coCard).join('');
  if (!companies.length) html += '<div class="empty-msg">Loading…</div>';
  else if (!pending.length && !active.length && !suspended.length) html += '<div class="empty-msg">No companies match.</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// Module 3: company deep view — real per-company fleet + engagement metrics
// aggregated from rental_vehicle_listings (no revenue/booking tables exist, so
// inquiries/views are the honest proxies).
async function raShowCompanyDeep(companyId) {
  openModal('<div class="confirm-title">Company Overview</div><div class="loading-msg">Loading…</div>');
  try {
    var co = (RA_DATA.companies||[]).find(function(c){return c.id===companyId;}) || {};
    var { data, error } = await sb.from('rental_vehicle_listings')
      .select('id,model,admin_status,status,view_count,inquiry_count,is_available')
      .eq('company_id', companyId).is('deleted_at',null).limit(500);
    if (error) throw error;
    var rows = data||[];
    var total     = rows.length;
    var activeL   = rows.filter(function(l){return l.admin_status==='approved'&&l.status==='active';}).length;
    var pendingL  = rows.filter(function(l){return l.admin_status==='pending_review';}).length;
    var inquiries = rows.reduce(function(s,l){return s+(l.inquiry_count||0);},0);
    var views     = rows.reduce(function(s,l){return s+(l.view_count||0);},0);
    var convRate  = views ? Math.round((inquiries/views)*100) : 0;
    function stat(v,l){return '<div style="flex:1;min-width:90px;background:var(--paper,#F8FAFC);border:1px solid var(--border);border-radius:10px;padding:10px 12px"><div style="font-size:18px;font-weight:800;color:var(--text)">'+v+'</div><div style="font-size:11px;color:var(--sub)">'+l+'</div></div>';}
    var body = '<div style="font-size:15px;font-weight:800;margin-bottom:4px">'+esc(co.name||'Company')+' '+raPill(co.status||'')+'</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">'
      + stat(fmt(total),'Total listings')+stat(fmt(activeL),'Active')+stat(fmt(pendingL),'Pending')
      + stat(co.avg_rating?Number(co.avg_rating).toFixed(1):'—','Rating')+stat(fmt(co.review_count||0),'Reviews')
      + stat(fmt(inquiries),'Inquiries')+stat(fmt(views),'Views')+stat(convRate+'%','Inquiry rate')
      + '</div>'
      + '<div style="font-size:11.5px;color:var(--sub);margin-top:4px">Inquiries/views are engagement proxies — PaMarket rentals are inquiry-based, there is no booking/revenue data.</div>';
    openModal('<div class="confirm-title">Company Overview</div>'+body+'<div class="confirm-btns"><button class="confirm-cancel" onclick="closeModal()">Close</button></div>');
  } catch(e) {
    openModal('<div class="confirm-title">Company Overview</div><div class="empty-msg">Could not load: '+esc(e.message)+'</div><div class="confirm-btns"><button class="confirm-cancel" onclick="closeModal()">Close</button></div>');
  }
}

// Listing health flags (Module 4): returns array of {label,color}
function raListingHealth(v) {
  var flags = [];
  if (!v._hasMedia) flags.push({label:'No images', color:'#DC2626', bg:'#FEE2E2', key:'no_images'});
  if ((v.view_count||0) < 5 && v.admin_status==='approved') flags.push({label:'Low engagement', color:'#B45309', bg:'#FEF3C7', key:'low_engagement'});
  if (v.is_available===false) flags.push({label:'Unavailable', color:'#6B7280', bg:'#F3F4F6', key:'unavailable'});
  return flags;
}

// Bulk action over selected listings (Module 4). Each item goes through the SAME
// RLS-guarded update the single-item actions use, so server authorization is
// unchanged — a non-admin's updates match 0 rows and are counted as failures.
async function raBulkAction(kind) {
  var ids = Object.keys(_raSelected).filter(function(k){return _raSelected[k];});
  if (!ids.length) { toast('Nothing selected','error'); return; }
  var labels = {approve:'Approve', reject:'Reject', feature:'Feature', unavailable:'Mark Unavailable'};
  var reason = '';
  if (kind === 'reject') {
    reason = await confirm2('Bulk Reject', 'Reject '+ids.length+' listing(s). Reason (optional):', 'Reject', 'red', true, 'e.g. Prohibited content');
    if (reason === null) return;
  } else {
    var ok = await confirm2('Bulk '+labels[kind], labels[kind]+' '+ids.length+' listing(s)?', labels[kind], kind==='approve'?'green':'red');
    if (!ok) return;
  }
  var done = 0, failed = 0;
  for (var i=0;i<ids.length;i++) {
    var id = ids[i];
    try {
      var r;
      if (kind==='approve') {
        r = await sb.from('rental_vehicle_listings').update({admin_status:'approved',status:'active'}).eq('id',id).select('id');
      } else if (kind==='reject') {
        r = await sb.from('rental_vehicle_listings').update({admin_status:'rejected',status:'paused'}).eq('id',id).select('id');
      } else if (kind==='unavailable') {
        r = await sb.from('rental_vehicle_listings').update({is_available:false}).eq('id',id).select('id');
      } else if (kind==='feature') {
        var lst = await sb.from('rental_vehicle_listings').select('company_id').eq('id',id).single();
        if (lst.error || !lst.data) { failed++; continue; }
        var now = new Date(); var end = new Date(now.getTime()+7*864e5);
        r = await sb.from('rental_featured_listings').insert({listing_id:id,company_id:lst.data.company_id,starts_at:now.toISOString(),ends_at:end.toISOString(),priority:10,is_active:true}).select('id');
      }
      if (r && !r.error && r.data && r.data.length) {
        done++;
        try { await sb.from('rental_audit_logs').insert({action:'bulk_'+kind+'_listing',target_table:'rental_vehicle_listings',target_id:id}); } catch(e){}
      } else { failed++; }
    } catch(e) { failed++; }
  }
  _raSelected = {};
  RA_DATA.allListings = []; RA_DATA.summary = null; RA_DATA.featured = [];
  toast(done+' done'+(failed?', '+failed+' failed (RLS/permission?)':''), failed?'error':'info');
  updateBadges();
  raLoadAllListings();
}

// Module 5: set report severity (admin-only via existing rental_reports RLS).
async function raSetReportSeverity(id, sev) {

    if (r.error) throw r.error;

    var rp = RA_DATA.reports.find(function(x){return x.id===id;}); if (rp) rp.severity=sev;

// ── Render: Reviews ───────────────────────────────────────
// Module 6: auto-flag heuristics (client-side; no schema change). Returns array
// of flag labels. Duplicate detection uses the full loaded set (passed in).
function raReviewFlags(r, allReviews) {
  var flags = [];
  var body = (r.body||'').trim();
  var low  = body.toLowerCase();
  // Spam: contains a URL, or long runs of repeated chars.
  if (/https?:\/\/|www\.|\b\w+\.(com|net|co|xyz)\b/i.test(body) || /(.)\1{5,}/.test(body)) flags.push('spam');
  // Abuse: crude profanity match (kept minimal + non-explicit here).
  if (/\b(scam|fraud|idiot|stupid|thief|thieves)\b/i.test(low)) flags.push('abuse');
  // Duplicate: same reviewer posted an identical body more than once.
  if (body && allReviews.filter(function(x){return x.reviewer_id===r.reviewer_id && (x.body||'').trim()===body;}).length > 1) flags.push('duplicate');
  return flags;
}

function renderRentalReviews() {
  if (!RA_DATA.reviews.length) { raLoadReviews(); }
  var reviews = RA_DATA.reviews;
  var tab = _raReviewTab || 'flagged';
  // Precompute flags for each review.
  reviews.forEach(function(r){ r._flags = raReviewFlags(r, reviews); });

  var counts = {
    flagged:   reviews.filter(function(r){return r._flags.length;}).length,
    published: reviews.filter(function(r){return r.status==='published';}).length,
    hidden:    reviews.filter(function(r){return r.status==='hidden';}).length,
    removed:   reviews.filter(function(r){return r.status==='removed';}).length,
    all:       reviews.length
  };
  var filtered = tab==='flagged' ? reviews.filter(function(r){return r._flags.length;})
    : tab==='all' ? reviews
    : reviews.filter(function(r){return r.status===tab;});

  function qBtn(val,label){ return '<button onclick="_raReviewTab=\''+val+'\';renderRentalReviews()" class="filter-btn'+(tab===val?' on':'')+'">'+label+' ('+counts[val]+')</button>'; }

  var html = '<div class="sec-head"><div class="sec-title">Review Moderation</div><div class="sec-actions">'
    + qBtn('flagged','Flagged')+qBtn('published','Published')+qBtn('hidden','Hidden')+qBtn('removed','Removed')+qBtn('all','All')
    + '<button class="btn-refresh" onclick="RA_DATA.reviews=[];raLoadReviews()">Refresh</button></div></div>';
  if (!reviews.length) { html += '<div class="loading-msg">Loading…</div>'; document.getElementById('mainContent').innerHTML=html; return; }
  if (!filtered.length) { html += '<div class="empty-msg">No reviews in this queue.</div>'; document.getElementById('mainContent').innerHTML=html; return; }
  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Company</th><th>Rating</th><th>Body</th><th>Flags</th><th>Reviewer</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  filtered.forEach(function(r) {
    var stars = [1,2,3,4,5].map(function(n){return '<svg viewBox="0 0 24 24" width="10" height="10" fill="'+(n<=r.rating?'var(--amber)':'none')+'" stroke="var(--amber)" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';}).join('');
    var flagHtml = (r._flags&&r._flags.length)
      ? r._flags.map(function(f){return '<span style="font-size:10px;font-weight:700;color:#DC2626;background:#FEE2E2;padding:2px 6px;border-radius:5px;text-transform:uppercase">'+esc(f)+'</span>';}).join(' ')
      : '<span style="font-size:11px;color:#16A34A">clean</span>';
    html += '<tr>'
      + '<td style="font-weight:600">'+esc(r.company_name||'—')+'</td>'
      + '<td style="white-space:nowrap">'+stars+' '+r.rating+'/5</td>'
      + '<td style="color:var(--sub);font-size:12px;max-width:180px">'+esc((r.body||'').slice(0,80))+'</td>'
      + '<td>'+flagHtml+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(r.reviewer_name||'—')+'</td>'
      + '<td>'+raPill(r.status)+'</td>'
      + '<td><div style="display:flex;gap:4px">'
      + (r.status!=='published' ? '<button class="ab ab-approve" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'published\')">'+(r.status==='removed'?'Restore':'Publish')+'</button>' : '')
      + (r.status!=='hidden'    ? '<button class="ab ab-view" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'hidden\')">Hide</button>' : '')
      + (r.status!=='removed'   ? '<button class="ab ab-reject" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'removed\')">Remove</button>' : '')
      + '</div></td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}

// ── Render: Featured ──────────────────────────────────────
function renderRentalFeatured() {
  if (!RA_DATA.featured.length) { raLoadFeatured(); }
  var html = '<div class="sec-head"><div class="sec-title">Featured Listings</div><button class="btn-refresh" onclick="raLoadFeatured()">Refresh</button></div>';
  html += '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px">';
  html += '<div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px">Add Featured Listing</div>';
  html += '<input id="raFeatId" placeholder="Listing ID (UUID)" style="width:100%;padding:9px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;box-sizing:border-box;margin-bottom:8px">';
  html += '<div style="display:flex;gap:8px;margin-bottom:8px"><input id="raFeatStart" type="date" style="flex:1;padding:9px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit"><input id="raFeatEnd" type="date" style="flex:1;padding:9px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit"></div>';
  html += '<input id="raFeatPriority" type="number" min="1" max="100" placeholder="Priority (1-100)" style="width:100%;padding:9px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:inherit;box-sizing:border-box;margin-bottom:8px">';
  html += '<button class="btn-verif-approve" onclick="raAddFeatured()" style="width:100%">Feature This Listing</button></div>';
  if (!RA_DATA.featured.length) { html += '<div class="empty-msg">No featured listings.</div>'; document.getElementById('mainContent').innerHTML=html; return; }
  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Listing</th><th>Company</th><th>Period</th><th>Expiry</th><th>Performance</th><th>Priority</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  var now = Date.now();
  RA_DATA.featured.forEach(function(f) {
    // Module 7: expiry tracking derived from ends_at.
    var endT = f.ends_at ? new Date(f.ends_at).getTime() : 0;
    var startT = f.starts_at ? new Date(f.starts_at).getTime() : 0;
    var expiry;
    if (endT && endT < now) expiry = '<span style="color:#DC2626;font-weight:700;font-size:11px">Expired</span>';
    else if (startT && startT > now) expiry = '<span style="color:#6B7280;font-size:11px">Scheduled</span>';
    else if (endT) { var days=Math.ceil((endT-now)/86400000); expiry = '<span style="color:'+(days<=3?'#B45309':'#16A34A')+';font-size:11px">Ends in '+days+'d</span>'; }
    else expiry = '<span style="color:var(--sub);font-size:11px">—</span>';
    var perf = fmt(f._views||0)+' views · '+fmt(f._inq||0)+' inq';
    html += '<tr>'
      + '<td style="font-weight:600">'+esc(f.listing_title||f.listing_id)+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(f.company_name||'—')+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+fmtDate(f.starts_at)+' → '+fmtDate(f.ends_at)+'</td>'
      + '<td>'+expiry+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+perf+'</td>'
      + '<td>'+esc(String(f.priority||0))+'</td>'
      + '<td><span class="badge '+(f.is_active?'badge-active':'badge-pending')+'">'+(f.is_active?'Active':'Inactive')+'</span></td>'
      + '<td><div style="display:flex;gap:4px">'
      + (f.is_active ? '<button class="ab ab-reject" onclick="raSetFeaturedActive(\''+esc(f.id)+'\',false)">Deactivate</button>' : '<button class="ab ab-approve" onclick="raSetFeaturedActive(\''+esc(f.id)+'\',true)">Activate</button>')
      + '<button class="ab ab-delete" onclick="raRemoveFeatured(\''+esc(f.id)+'\')">Remove</button>'
      + '</div></td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}

// ── Render: Analytics ─────────────────────────────────────
function renderRentalAnalytics() {
  if (!RA_DATA.analytics) { raLoadAnalytics(); }
  var a = RA_DATA.analytics || {};
  function row(label, val) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.05)">'
      + '<span style="font-size:13px;color:var(--sub)">'+esc(label)+'</span>'
      + '<span style="font-size:14px;font-weight:800;color:var(--text)">'+val+'</span></div>';
  }
  var win = a.window_days || _raAnalyticsWindow || 7;
  function wBtn(d,label){ return '<button onclick="_raAnalyticsWindow='+d+';RA_DATA.analytics=null;raLoadAnalytics()" class="filter-btn'+((_raAnalyticsWindow||7)===d?' on':'')+'">'+label+'</button>'; }
  var suffix = '('+win+'d)';
  var html = '<div class="sec-head"><div class="sec-title">Rental Analytics</div><div class="sec-actions">'
    + wBtn(7,'7d')+wBtn(30,'30d')+wBtn(90,'90d')
    + '<button class="btn-refresh" onclick="RA_DATA.analytics=null;raLoadAnalytics()">Refresh</button></div></div>';
  html += '<div class="stats-grid">';
  html += raStatCard(fmt(a.total_views_7d||0),'Views '+suffix,null);
  html += raStatCard(fmt(a.total_inquiries_7d||0),'Inquiries '+suffix,null);
  html += raStatCard(fmt(a.total_favorites_7d||0),'Saves '+suffix,null);
  html += raStatCard((a.conversion_rate_7d||0)+'%','Conversion','Inquiry / View');
  html += '</div>';
  html += '<div class="tbl-wrap" style="margin-bottom:16px"><div style="font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--border)">Platform Stats</div>';
  html += row('Active listings', fmt(a.active_listings||0));
  html += row('Active companies', fmt(a.active_companies||0));
  html += row('Total reviews', fmt(a.total_reviews||0));
  html += row('Avg daily rate', '$'+fmt(a.avg_daily_rate||0));
  html += '</div>';

  // Module 8: top-performing vehicles + company ranking (by inquiries, then views).
  function rankTable(title, items) {
    var h = '<div class="tbl-wrap" style="margin-bottom:16px"><table class="tbl"><thead><tr><th>#</th><th>'+title+'</th><th>Inquiries</th><th>Views</th></tr></thead><tbody>';
    if (!items || !items.length) h += '<tr><td colspan="4"><div class="empty-msg">No activity in this window.</div></td></tr>';
    else items.forEach(function(it,i){ h += '<tr><td style="color:var(--sub)">'+(i+1)+'</td><td style="font-weight:600">'+esc(it.name)+'</td><td style="font-weight:700">'+fmt(it.inq)+'</td><td style="color:var(--sub)">'+fmt(it.views)+'</td></tr>'; });
    return h+'</tbody></table></div>';
  }
  html += rankTable('Top Vehicles '+suffix, a.top_listings);
  html += rankTable('Company Ranking '+suffix, a.top_companies);
  html += '<div style="font-size:11.5px;color:var(--sub);padding:0 2px 8px">Metrics are engagement proxies (views/inquiries from activity logs). PaMarket rentals are inquiry-based — there is no booking or revenue data.</div>';
  if (!RA_DATA.analytics) html += '<div class="loading-msg">Loading…</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// ── Render: Audit Logs ────────────────────────────────────
function renderRentalAuditLogs() {
  if (!RA_DATA.auditLogs.length) { raLoadAuditLogs(); }
  var logs = RA_DATA.auditLogs;
  // Module 9: searchable audit trail (action / table / target / actor).
  var q = (_raAuditSearch||'').trim().toLowerCase();
  var actionFilter = _raAuditAction || '';
  var actions = [...new Set(logs.map(function(l){return l.action;}).filter(Boolean))].sort();
  var filtered = logs.filter(function(l){
    if (actionFilter && l.action !== actionFilter) return false;
    if (q) {
      var hay = ((l.action||'')+' '+(l.target_table||'')+' '+(l.target_id||'')+' '+(l.actor_id||'')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  var html = '<div class="sec-head"><div class="sec-title">Rental Audit Logs</div><div class="sec-actions"><button class="filter-btn" onclick="raExportAuditCsv()">Export CSV</button><button class="btn-refresh" onclick="RA_DATA.auditLogs=[];raLoadAuditLogs()">Refresh</button></div></div>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">'
    + '<input id="raAuditSearch" class="search-input" placeholder="Search action, target, actor…" value="'+esc(_raAuditSearch)+'" oninput="_raAuditSearch=this.value;renderRentalAuditLogs();var el=document.getElementById(\'raAuditSearch\');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}" style="min-width:220px;flex:1">'
    + '<select onchange="_raAuditAction=this.value;renderRentalAuditLogs()"><option value="">All actions</option>'+actions.map(function(a){return '<option value="'+esc(a)+'"'+(actionFilter===a?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select>'
    + '</div>';
  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Action</th><th>Table</th><th>Target</th><th>Actor</th><th>When</th></tr></thead><tbody>';
  if (!logs.length) html += '<tr><td colspan="5"><div class="loading-msg">Loading…</div></td></tr>';
  else if (!filtered.length) html += '<tr><td colspan="5"><div class="empty-msg">No log entries match.</div></td></tr>';
  filtered.forEach(function(l) {
    html += '<tr>'
      + '<td style="font-weight:700">'+esc(l.action||'')+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(l.target_table||'')+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(String(l.target_id||'').slice(0,8))+'…</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(l.actor_id?userLabel(l.actor_id):'system')+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+fmtDateTime(l.created_at)+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += '<div style="margin-top:12px;text-align:center"><button class="btn-refresh" onclick="raLoadAuditLogs()">Load More</button></div>';
  document.getElementById('mainContent').innerHTML = html;
}

function raExportAuditCsv() {
  var rows = [['Action','Table','Target','Actor','When']];
  (RA_DATA.auditLogs||[]).forEach(function(l){
    rows.push([l.action||'', l.target_table||'', l.target_id||'', l.actor_id?userLabel(l.actor_id):'system', l.created_at||'']);
  });
  if(rows.length===1){ toast('Nothing to export','info'); return; }
  downloadCSV('pamarket-rental-audit-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  toast('Exported '+(rows.length-1)+' entries');
}

// ── Data loaders ──────────────────────────────────────────
async function raLoadSummary() {
  if (!sb) return;
  try {
    var [pendingL, pendingC, openR, activeL, totalC, totalRev] = await Promise.all([
      sb.from('rental_vehicle_listings').select('id',{count:'exact',head:true}).eq('admin_status','pending_review').is('deleted_at',null),
      sb.from('rental_companies').select('id',{count:'exact',head:true}).eq('status','pending').is('deleted_at',null),
      sb.from('rental_reports').select('id',{count:'exact',head:true}).eq('status','open'),
      sb.from('rental_vehicle_listings').select('id',{count:'exact',head:true}).eq('status','active').eq('admin_status','approved').is('deleted_at',null),
      sb.from('rental_companies').select('id',{count:'exact',head:true}).is('deleted_at',null),
      sb.from('rental_reviews').select('id',{count:'exact',head:true}).eq('status','published'),
    ]);
    RA_DATA.summary = {
      pending_listings:  pendingL.count||0, pending_companies: pendingC.count||0,
      open_reports:      openR.count||0,    active_listings:   activeL.count||0,
      total_companies:   totalC.count||0,   total_reviews:     totalRev.count||0,
    };
  } catch(e) { console.warn('ra summary:', e); }
  updateBadges();
  if (currentTab === 'rentalDashboard') renderRentalDashboard();
}

async function raLoadPendingListings() {
  if (!sb) return;
  _raLoadingApprovals = true;
  try {
    var {data, error} = await sb.from('rental_vehicle_listings')
      .select('id,model,year,daily_rate,description,admin_status,status,created_at,brand_id,company_id,location_id')
      .eq('admin_status','pending_review').is('deleted_at',null).order('created_at',{ascending:true}).limit(30);
    if (error) throw error;
    var rows = data||[];
    var brandIds = [...new Set(rows.map(function(r){return r.brand_id;}).filter(Boolean))];
    var coIds    = [...new Set(rows.map(function(r){return r.company_id;}).filter(Boolean))];
    var locIds   = [...new Set(rows.map(function(r){return r.location_id;}).filter(Boolean))];
    var listIds  = rows.map(function(r){return r.id;});
    var [brands, companies, locs, covers] = await Promise.all([
      sb.from('rental_brands').select('id,slug,label').in('id', brandIds.length?brandIds:['00000000-0000-0000-0000-000000000000']),
      sb.from('rental_companies').select('id,business_id').in('id', coIds.length?coIds:['00000000-0000-0000-0000-000000000000']),
      sb.from('rental_locations').select('id,city').in('id', locIds.length?locIds:['00000000-0000-0000-0000-000000000000']),
      sb.from('rental_vehicle_media').select('listing_id,url').eq('is_cover',true).in('listing_id', listIds.length?listIds:['00000000-0000-0000-0000-000000000000']),
    ]);
    var bizIds = (companies.data||[]).map(function(c){return c.business_id;}).filter(Boolean);
    var bizRes = bizIds.length ? await sb.from('businesses').select('id,name').in('id',bizIds) : {data:[]};
    var brandMap = Object.fromEntries((brands.data||[]).map(function(b){return [b.id,b];}));
    var coMap    = Object.fromEntries((companies.data||[]).map(function(c){return [c.id,c];}));
    var locMap   = Object.fromEntries((locs.data||[]).map(function(l){return [l.id,l];}));
    var coverMap = Object.fromEntries((covers.data||[]).map(function(m){return [m.listing_id,m.url];}));
    var bizMap   = Object.fromEntries((bizRes.data||[]).map(function(b){return [b.id,b.name];}));
    RA_DATA.pendingListings = rows.map(function(r){
      return Object.assign({},r,{
        brand_label:  brandMap[r.brand_id]&&brandMap[r.brand_id].label,
        city:         locMap[r.location_id]&&locMap[r.location_id].city,
        company_name: bizMap[coMap[r.company_id]&&coMap[r.company_id].business_id],
        cover_url:    coverMap[r.id]||null,
      });
    });
  } catch(e) { console.warn('ra pending:', e); }
  _raLoadingApprovals = false;
  if (currentTab === 'rentalApprovals') renderRentalApprovals();
}

async function raLoadCompanies() {
  if (!sb) return;
  try {
    var {data, error} = await sb.from('rental_companies')
      .select('id,status,avg_rating,review_count,fleet_count,created_at,business_id')
      .is('deleted_at',null).order('created_at',{ascending:false}).limit(50);
    if (error) throw error;
    var bizIds = (data||[]).map(function(c){return c.business_id;}).filter(Boolean);
    var bizRes = bizIds.length ? await sb.from('businesses').select('id,name').in('id',bizIds) : {data:[]};
    var bizMap = Object.fromEntries((bizRes.data||[]).map(function(b){return [b.id,b.name];}));
    RA_DATA.companies = (data||[]).map(function(c){return Object.assign({},c,{name:bizMap[c.business_id]||'—'});});

async function raLoadAnalytics() {
  if (!sb) return;
  try {
    // Module 8: time window driven by _raAnalyticsWindow (7/30/90 days).
    var days = _raAnalyticsWindow || 7;
    var since7d = new Date(Date.now()-days*86400000).toISOString();
    var [evtsRes, activeL, activeC, reviews, avgRate] = await Promise.all([
      sb.from('rental_activity_logs').select('event_type,listing_id,company_id').gte('created_at',since7d).limit(8000),
      sb.from('rental_vehicle_listings').select('id',{count:'exact',head:true}).eq('status','active').eq('admin_status','approved').is('deleted_at',null),
      sb.from('rental_companies').select('id',{count:'exact',head:true}).eq('status','active').is('deleted_at',null),
      sb.from('rental_reviews').select('id',{count:'exact',head:true}).eq('status','published'),
      sb.from('rental_vehicle_listings').select('daily_rate').eq('status','active').eq('admin_status','approved').is('deleted_at',null).limit(200),
    ]);
    var evts  = evtsRes.data||[];
    var v7d   = evts.filter(function(e){return e.event_type==='view';}).length;
    var inq7d = evts.filter(function(e){return ['chat_open','whatsapp_click','call_click'].includes(e.event_type);}).length;
    var fav7d = evts.filter(function(e){return e.event_type==='save';}).length;
    var rates = (avgRate.data||[]).map(function(r){return r.daily_rate;}).filter(Boolean);
    var avgDR = rates.length ? Math.round(rates.reduce(function(a,b){return a+b;},0)/rates.length) : 0;

    // Rankings from the event stream (Module 8): inquiry events per listing/company.
    var inqEvents = ['chat_open','whatsapp_click','call_click'];
    var byListing = {}, byCompany = {};
    evts.forEach(function(e){
      var isInq = inqEvents.indexOf(e.event_type)!==-1;
      if (e.listing_id) { byListing[e.listing_id]=byListing[e.listing_id]||{v:0,i:0}; if(e.event_type==='view')byListing[e.listing_id].v++; if(isInq)byListing[e.listing_id].i++; }
      if (e.company_id) { byCompany[e.company_id]=byCompany[e.company_id]||{v:0,i:0}; if(e.event_type==='view')byCompany[e.company_id].v++; if(isInq)byCompany[e.company_id].i++; }
    });
    var topListingIds = Object.keys(byListing).sort(function(a,b){return byListing[b].i-byListing[a].i||byListing[b].v-byListing[a].v;}).slice(0,5);
    var topCompanyIds = Object.keys(byCompany).sort(function(a,b){return byCompany[b].i-byCompany[a].i||byCompany[b].v-byCompany[a].v;}).slice(0,5);
    // Resolve names for the top entities.
    var lRes = topListingIds.length ? await sb.from('rental_vehicle_listings').select('id,model,brand_id').in('id',topListingIds) : {data:[]};
    var brandIds = [...new Set((lRes.data||[]).map(function(l){return l.brand_id;}).filter(Boolean))];
    var brRes = brandIds.length ? await sb.from('rental_brands').select('id,label').in('id',brandIds) : {data:[]};
    var brMap = Object.fromEntries((brRes.data||[]).map(function(b){return [b.id,b.label];}));
    var lNameMap = Object.fromEntries((lRes.data||[]).map(function(l){return [l.id,((brMap[l.brand_id]||'')+' '+(l.model||'')).trim()];}));
    var cRes = topCompanyIds.length ? await sb.from('rental_companies').select('id,business_id').in('id',topCompanyIds) : {data:[]};
    var cbizIds = (cRes.data||[]).map(function(c){return c.business_id;}).filter(Boolean);
    var cbRes = cbizIds.length ? await sb.from('businesses').select('id,name').in('id',cbizIds) : {data:[]};
    var cbMap = Object.fromEntries((cbRes.data||[]).map(function(b){return [b.id,b.name];}));
    var cbiz  = Object.fromEntries((cRes.data||[]).map(function(c){return [c.id,cbMap[c.business_id]||'—'];}));

    RA_DATA.analytics = {
      window_days: days,
      total_views_7d:v7d, total_inquiries_7d:inq7d, total_favorites_7d:fav7d,
      conversion_rate_7d: v7d ? Math.round((inq7d/v7d)*100) : 0,
      active_listings: activeL.count||0, active_companies: activeC.count||0,
      total_reviews: reviews.count||0, avg_daily_rate: avgDR,
      top_listings: topListingIds.map(function(id){return {name:lNameMap[id]||String(id).slice(0,8), views:byListing[id].v, inq:byListing[id].i};}),
      top_companies: topCompanyIds.map(function(id){return {name:cbiz[id]||String(id).slice(0,8), views:byCompany[id].v, inq:byCompany[id].i};}),
    };
  } catch(e) { console.warn('ra analytics:', e); }
  if (currentTab === 'rentalAnalytics') renderRentalAnalytics();
}
