function _onAdTypeChange(){
  var t = (document.getElementById('adType')||{}).value||'banner';
  var placRow = document.getElementById('adPlacementRow');
  var catRow  = document.getElementById('adCatRow');
  var desc    = document.getElementById('adTypeDesc');
  var descMap = {
    banner:       'Appears in the Featured Partners carousel on Home.',
    spotlight:    'Appears in the category page carousel + Home carousel.',
    announcement: 'Shows as a dismissible popup notification for all users. Users can tap X to dismiss permanently.',
    halfscreen:   'Shows as a half-screen bottom sheet with a full image when triggered.'
  };
  if(desc) desc.textContent = descMap[t]||'';
  var showPlacement = (t==='banner'||t==='spotlight');
  if(placRow) placRow.style.display = showPlacement ? '' : 'none';
  if(catRow && !showPlacement) catRow.style.display = 'none';
}
function _onAdPlacementChange(){
  var p = (document.getElementById('adPlacement')||{}).value;
  var row = document.getElementById('adCatRow');
  if(row) row.style.display = (p==='category') ? '' : 'none';
}
function _onAdActionChange(){
  var v = (document.querySelector('input[name="adAction"]:checked')||{}).value||'none';
  ['adListingRow','adLinkRow','adActionCatRow','adInappRow'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display='none'; });
  if(v==='listing') (document.getElementById('adListingRow')||{style:{}}).style.display='';
  if(v==='link')    (document.getElementById('adLinkRow')||{style:{}}).style.display='';
  if(v==='cat')     (document.getElementById('adActionCatRow')||{style:{}}).style.display='';
  if(v==='inapp')   (document.getElementById('adInappRow')||{style:{}}).style.display='';
}

window._adLoadImage = function(e) {
  var f = e.target.files[0]; if(!f) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    // Compress via canvas so we stay under 80KB in the DB.
    // Base64 at 80KB raw ≈ 60KB image — fine for a banner/logo.
    var img = new Image();
    img.onload = function() {
      var MAX_W = 800, MAX_H = 400;
      var w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
      if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      var compressed = canvas.toDataURL('image/jpeg', 0.72);
      var kb = Math.round(compressed.length * 0.75 / 1024);
      document.getElementById('adImg').value = compressed;
      var prev = document.getElementById('adImgPreview');
      prev.innerHTML = '<img src="'+compressed+'" style="max-width:100%;max-height:120px;border-radius:8px;object-fit:contain">'
        + '<div style="font-size:11px;color:var(--sub);margin-top:4px">'+w+'×'+h+' px · ~'+kb+' KB stored</div>';
    };
    img.src = dataUrl;
  };
  reader.readAsDataURL(f);
};

async function saveNewAd() {
  var _advertRaw = (document.getElementById('adAdvertiser')||{}).value||'';
  var advertId = (_advertRaw && _advertRaw !== '__pamarket__') ? _advertRaw : null;
  var biz = (document.getElementById('adBiz')||{}).value.trim();
  var head = (document.getElementById('adHead')||{}).value.trim();
  if(!biz){ toast('Enter business name','error'); return; }
  if(!head){ toast('Enter a headline for the ad','error'); return; }
  try {
    var adAction = (document.querySelector('input[name="adAction"]:checked')||{}).value||'none';
    var listingId = adAction==='listing' ? ((document.getElementById('adListingId')||{}).value||'').trim()||null : null;
    var linkUrl   = adAction==='link'    ? ((document.getElementById('adLinkUrl')||{}).value||'').trim()||null
                  : adAction==='inapp'   ? ((document.getElementById('adInappPage')||{}).value||null)
                  : null;
    var actionCat = adAction==='cat'     ? ((document.getElementById('adActionCatVal')||{}).value||null) : null;
    var placement = (document.getElementById('adPlacement')||{}).value;
    var placementCat = (placement==='category') ? ((document.getElementById('adCat')||{}).value||'other') : null;
    var targetCat = actionCat || placementCat || null;
    var bgColor = (document.getElementById('adBgColor')||{}).value||'#1A3A8F';
    var rec = {
      id: crypto.randomUUID ? crypto.randomUUID() : Date.now()+'',
      business_name: biz,
      advertiser_id: advertId||null,
      headline: head,
      tagline: (document.getElementById('adTag')||{}).value.trim(),
      image_url: (document.getElementById('adImg')||{}).value||null,
      bg_color: bgColor,
      type: (document.getElementById('adType')||{}).value||'banner',
      target_cat: targetCat,
      listing_id: listingId,
      link_url: linkUrl,
      starts_at: (document.getElementById('adStart')||{}).value
        ? (document.getElementById('adStart')||{}).value + 'T00:00:00Z' : null,
      ends_at: (document.getElementById('adEnd')||{}).value
        ? (document.getElementById('adEnd')||{}).value + 'T23:59:59Z' : null,
      price_paid: parseFloat((document.getElementById('adPrice')||{}).value)||0,
      active: true, impressions: 0, clicks: 0,
      created_at: new Date().toISOString()
    };
    var r = await sb.from('paid_ads').insert(rec);
    if(r.error) throw r.error;
    DATA.ads.unshift(rec);
    closeModal(); renderAds(); toast('Ad created');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function loadChats() {
  try {
    var r = await sb.from('messages')
      .select('id,conversation_id,sender_id,sender_name,text,created_at,read')
      .order('created_at',{ascending:false})
      .limit(600);
    if(r.error||!r.data){ DATA.chats=[]; return; }
    var convMap={};
    r.data.forEach(function(m){
      if(!convMap[m.conversation_id]) convMap[m.conversation_id]={id:m.conversation_id,messages:[],participants:{}};
      convMap[m.conversation_id].messages.push(m);
      if(m.sender_name) convMap[m.conversation_id].participants[m.sender_id]=m.sender_name;
    });
    DATA.chats = Object.values(convMap).map(function(c){
      c.messages.sort(function(a,b){ return new Date(b.created_at)-new Date(a.created_at); });
      c.lastMsg = c.messages[0];
      c.participantNames = Object.values(c.participants);
      c.unread = c.messages.filter(function(m){ return !m.read; }).length;
      return c;
    }).sort(function(a,b){ return new Date(b.lastMsg.created_at)-new Date(a.lastMsg.created_at); });
  } catch(e){ DATA.chats=[]; }
}

// ── ANALYTICS ─────────────────────────────────────────────
function renderAnalytics() {
  var catCounts = {};
  DATA.listings.forEach(function(l){ catCounts[l.cat||'other']=(catCounts[l.cat||'other']||0)+1; });
  var cats = Object.keys(catCounts).sort(function(a,b){ return catCounts[b]-catCounts[a]; });
  var maxCat = cats.length ? catCounts[cats[0]] : 1;

  var provCounts = {};
  DATA.listings.forEach(function(l){ provCounts[l.prov||'Unknown']=(provCounts[l.prov||'Unknown']||0)+1; });
  var provs = Object.keys(provCounts).sort(function(a,b){ return provCounts[b]-provCounts[a]; }).slice(0,10);
  var maxProv = provs.length ? provCounts[provs[0]] : 1;

  var now = Date.now();
  var days = [0,1,2,3,4,5,6].map(function(i){
    var d = new Date(now - i*86400000);
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit'});
  }).reverse();
  var dayCounts = days.map(function(label, i){
    var dayStart = new Date(now - (6-i)*86400000); dayStart.setHours(0,0,0,0);
    var dayEnd = new Date(dayStart); dayEnd.setHours(23,59,59,999);
    return DATA.users.filter(function(u){
      var t=new Date(u.created_at).getTime();
      return t>=dayStart.getTime()&&t<=dayEnd.getTime();
    }).length;
  });
  var maxDay = Math.max.apply(null, dayCounts.concat([1]));

  var totalAdsRev = DATA.ads.reduce(function(s,a){return s+parseFloat(a.price_paid||0);},0);

  var html = '<div class="stats-grid">';
  html+=statCard('Total Users','blue',DATA.users.length,'');
  html+=statCard('Total Listings','green',DATA.listings.length,'');
  html+=statCard('Ads Revenue','amber','$'+fmt(totalAdsRev),'from paid ads');
  html+='</div>';

  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">';

  // Cat chart
  html+='<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Listings by Category</div>';
  cats.forEach(function(c){ html+='<div class="bar-row"><div class="bar-label">'+esc(c)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(catCounts[c]/maxCat*100)+'%"></div></div><div class="bar-val">'+catCounts[c]+'</div></div>'; });
  if(!cats.length) html+='<div style="color:var(--sub);font-size:13px">No data</div>';
  html+='</div>';

  // Province chart
  html+='<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Listings by Province</div>';
  provs.forEach(function(p){ html+='<div class="bar-row"><div class="bar-label">'+esc(p)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(provCounts[p]/maxProv*100)+'%;background:var(--green)"></div></div><div class="bar-val">'+provCounts[p]+'</div></div>'; });
  if(!provs.length) html+='<div style="color:var(--sub);font-size:13px">No data</div>';
  html+='</div>';

  // User growth
  html+='<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">New Users (Last 7 Days)</div>';
  days.forEach(function(d,i){ html+='<div class="bar-row"><div class="bar-label" style="font-size:11px">'+d+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(dayCounts[i]/maxDay*100)+'%;background:var(--amber)"></div></div><div class="bar-val">'+dayCounts[i]+'</div></div>'; });
  html+='</div>';

  // Verification stats
  var vPending=DATA.verifications.filter(function(v){return v.status==='pending';}).length;
  var vApproved=DATA.verifications.filter(function(v){return v.status==='approved';}).length;
  var vRejected=DATA.verifications.filter(function(v){return v.status==='rejected';}).length;
  var vMax=Math.max(vPending,vApproved,vRejected,1);
  html+='<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Verification Status</div>';
  [['Pending',vPending,'var(--amber)'],['Approved',vApproved,'var(--green)'],['Rejected',vRejected,'var(--red)']].forEach(function(row){
    html+='<div class="bar-row"><div class="bar-label">'+row[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(row[1]/vMax*100)+'%;background:'+row[2]+'"></div></div><div class="bar-val">'+row[1]+'</div></div>';
  });
  html+='</div>';

  html+='</div>';
  document.getElementById('mainContent').innerHTML=html;
}

async function saveSetting(key, value) {
  try {
    DATA.settings = DATA.settings || {};
    DATA.settings[key] = value;
    var sr = await sb.from('app_settings').upsert({id:1,settings:DATA.settings,updated_at:new Date().toISOString()});
    if(sr.error) throw sr.error;
    toast('Setting saved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function saveFxRate() {
  var v = parseFloat((document.getElementById('fxRateInput')||{}).value);
  if (!v || v <= 0) { toast('Enter a valid rate','error'); return; }
  try {
    DATA.settings = DATA.settings || {};
    DATA.settings.fxRate = v;
    DATA.settings.fxRateUpdatedAt = new Date().toISOString();
    var sr = await sb.from('app_settings').upsert({id:1,settings:DATA.settings,updated_at:new Date().toISOString()});
    if (sr.error) throw sr.error;
    toast('Exchange rate updated');
    renderSettings();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function saveSupportWa() {
  var raw = ((document.getElementById('supportWaInput')||{}).value || '').replace(/\D/g,'');
  try {
    DATA.settings = DATA.settings || {};
    DATA.settings.supportWhatsapp = raw;
    var sr = await sb.from('app_settings').upsert({id:1,settings:DATA.settings,updated_at:new Date().toISOString()});
    if (sr.error) throw sr.error;
    toast(raw ? 'Support number saved' : 'Support number cleared');
    renderSettings();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// ── MAINTENANCE ───────────────────────────────────────────
var _maintStats = null;

async function loadMaintenanceStats() {
  _maintStats = { errorLogs: '...', oldNotifs: '...', convTombs: '...' };
  try {
    var r1 = await sb.from('error_logs').select('id', { count: 'exact', head: true });
    _maintStats.errorLogs = r1.error ? '?' : (r1.count || 0);
  } catch(e) { _maintStats.errorLogs = '?'; }
  try {
    var cutoff30 = Date.now() - 30 * 86400000;
    var r2 = await sb.from('notifications').select('id', { count: 'exact', head: true }).lt('created_at', cutoff30);
    _maintStats.oldNotifs = r2.error ? '?' : (r2.count || 0);
  } catch(e) { _maintStats.oldNotifs = '?'; }
  try {
    var r3 = await sb.from('conversation_deletions').select('user_id', { count: 'exact', head: true });
    _maintStats.convTombs = r3.error ? '?' : (r3.count || 0);
  } catch(e) { _maintStats.convTombs = '?'; }
}

async function renderMaintenance() {
  document.getElementById('mainContent').innerHTML = '<div class="loading-msg">Loading stats...</div>';
  await loadMaintenanceStats();
  _doRenderMaintenance();
}

async function runClearErrorLogs() {
  var ok = await confirm2('Clear Error Logs', 'Delete all rows from error_logs? This cannot be undone.', 'Clear All', 'confirm-ok red');
  if (!ok) return;
  _maintLog('Clearing error_logs...');
  try {
    // Delete every row via the uuid primary key — a type-agnostic filter that
    // never trips an "invalid input syntax" cast error, regardless of how the
    // created_at column is typed.
    var r = await sb.from('error_logs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (r.error) throw r.error;
    _maintStats.errorLogs = 0;
    _maintLog('Done. error_logs cleared.');
    toast('Error logs cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runClearOldNotifs() {
  var cutoff = Date.now() - 30 * 86400000;
  var ok = await confirm2('Delete Old Notifications', 'Delete all notifications older than 30 days?', 'Delete', 'confirm-ok');
  if (!ok) return;
  _maintLog('Deleting notifications older than 30 days...');
  try {
    var r = await sb.from('notifications').delete().lt('created_at', cutoff);
    if (r.error) throw r.error;
    _maintStats.oldNotifs = 0;
    _maintLog('Done. Old notifications deleted.');
    toast('Old notifications cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runClearConvTombstones() {
  var ok = await confirm2('Clear Conversation Tombstones', 'Delete all rows from conversation_deletions? Users who hid conversations may see them reappear temporarily.', 'Clear', 'confirm-ok');
  if (!ok) return;
  _maintLog('Clearing conversation_deletions...');
  try {
    var r = await sb.from('conversation_deletions').delete().neq('user_id', '00000000-0000-0000-0000-000000000000');
    if (r.error) throw r.error;
    _maintStats.convTombs = 0;
    _maintLog('Done. Conversation tombstones cleared.');
    toast('Tombstones cleared');
  } catch(e) {
    _maintLog('Failed: ' + e.message);
    toast('Failed: ' + e.message, 'error');
  }
}

async function runPurgeOrphanedPhotos() {
  var ok = await confirm2(
    'Purge Orphaned Photos',
    'Scan the listings-photos bucket and delete files not referenced by any listing. This may take a moment.',
    'Scan & Purge', 'confirm-ok'
  );
  if (!ok) return;

  var PHOTO_BASE = 'https://gxgytumhknmnwspxjzxw.supabase.co/storage/v1/object/public/listings-photos/';
  _maintLog('Step 1: Fetching all listing photo URLs from database...');

  var activeUrls = new Set();
  try {
    var page = 0, PAGE = 1000;
    while (true) {
      var r = await sb.from('listings').select('photos').range(page * PAGE, (page + 1) * PAGE - 1);
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) break;
      r.data.forEach(function(row) {
        (row.photos || []).forEach(function(url) {
          if (typeof url === 'string' && url.startsWith(PHOTO_BASE)) {
            activeUrls.add(url.split('?')[0]);
          }
        });
      });
      if (r.data.length < PAGE) break;
      page++;
    }
    _maintLog('Found ' + activeUrls.size + ' referenced photos across all listings.');
  } catch(e) {
    _maintLog('Error fetching listings: ' + e.message);
    toast('Scan failed', 'error'); return;
  }

  _maintLog('Step 2: Listing files in storage bucket...');
  var toDelete = [];
  try {
    var rootList = await sb.storage.from('listings-photos').list('', { limit: 1000 });
    if (rootList.error) throw rootList.error;
    var folders = (rootList.data || []).filter(function(item) { return item.id == null; });
    _maintLog('Found ' + folders.length + ' user folder(s) in bucket.');
    for (var fi = 0; fi < folders.length; fi++) {
      var fname = folders[fi].name;
      var flist = await sb.storage.from('listings-photos').list(fname, { limit: 1000 });
      if (flist.error) { _maintLog('Skipping ' + fname + ': ' + flist.error.message); continue; }
      (flist.data || []).forEach(function(file) {
        if (!file.name) return;
        var url = PHOTO_BASE + fname + '/' + file.name;
        if (!activeUrls.has(url)) toDelete.push(fname + '/' + file.name);
      });
    }
    _maintLog('Found ' + toDelete.length + ' orphaned file(s) to delete.');
  } catch(e) {
    _maintLog('Error listing bucket: ' + e.message);
    toast('Scan failed', 'error'); return;
  }

  if (!toDelete.length) {
    _maintLog('Bucket is clean — no orphaned files.');
    toast('Bucket is clean'); return;
  }

  _maintLog('Step 3: Deleting ' + toDelete.length + ' orphaned file(s)...');
  var deleted = 0, BATCH = 100;
  for (var i = 0; i < toDelete.length; i += BATCH) {
    var batch = toDelete.slice(i, i + BATCH);
    var dr = await sb.storage.from('listings-photos').remove(batch);
    if (dr.error) { _maintLog('Batch error: ' + dr.error.message); }
    else { deleted += batch.length; _maintLog('Deleted ' + deleted + ' / ' + toDelete.length + '...'); }
  }
  _maintLog('Done. Deleted ' + deleted + ' orphaned photo(s).');
  toast('Purged ' + deleted + ' orphaned photos');
}

// ── Session init ──────────────────────────────────────────
(async function init(){
  if(!sb){ document.getElementById('loginWrap').style.display='flex'; return; }
  try {
    var res = await sb.auth.getSession();
    if(res.data && res.data.session && res.data.session.user) {
      var uid = res.data.session.user.id;
      var pr = await sb.from('profiles').select('role,name,email').eq('id',uid).single();
      if(!pr.error && pr.data && pr.data.role==='admin') {
        _adminEmail = res.data.session.user.email || pr.data.email || '';
        document.getElementById('sidebarUser').textContent = pr.data.name || _adminEmail;
        showDash();
        return;
      } else {
        await sb.auth.signOut();
      }
    }
  } catch(e){}
  document.getElementById('loginWrap').style.display='flex';
})();
</script>
