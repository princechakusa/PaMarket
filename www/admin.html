async function raApproveListing(id) {
  var ok = await confirm2('Approve Listing','Approve and publish this vehicle listing?','Approve','green');
  if (!ok) return;
  try {
    var r = await sb.from('rental_vehicle_listings').update({admin_status:'approved',status:'active'}).eq('id',id).select('id');
    if (r.error) throw r.error;
    if (!r.data || !r.data.length) throw new Error('Update matched 0 rows — RLS blocked it (check your profile role is admin and the "rvl: admin all" policy exists)');
    try { await sb.from('rental_audit_logs').insert({action:'approve_listing',target_table:'rental_vehicle_listings',target_id:id,after_state:{admin_status:'approved'}}); } catch(e){}
    RA_DATA.pendingListings = RA_DATA.pendingListings.filter(function(l){return l.id!==id;});
    RA_DATA.summary = null; RA_DATA.allListings = [];
    toast('Listing approved and published');
    updateBadges();
    if (currentTab==='rentalApprovals') renderRentalApprovals();
    if (currentTab==='rentalListings')  renderRentalListings();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

async function raModerateListing(id, newStatus) {
  var reason = await confirm2(newStatus==='rejected'?'Reject Listing':'Remove Listing','Reason (required for the record):',newStatus==='rejected'?'Reject':'Remove','red',true,'e.g. Prohibited content, misleading photos');
  if (reason===null) return;
  // Module 2: rejection reason is now REQUIRED and logged (was captured then dropped).
  if (newStatus==='rejected' && !String(reason).trim()) { toast('A rejection reason is required','error'); return; }
  try {
    var update = newStatus==='rejected'
      ? {admin_status:'rejected',status:'paused',admin_note:String(reason).trim()}
      : {admin_status:'rejected',status:'archived',deleted_at:new Date().toISOString(),admin_note:String(reason).trim()};
    var r = await sb.from('rental_vehicle_listings').update(update).eq('id',id).select('id');
    if (r.error) throw r.error;
    if (!r.data || !r.data.length) throw new Error('Update matched 0 rows — RLS blocked it (check your profile role is admin and the "rvl: admin all" policy exists)');
    // Store the reason in the audit trail (after_state jsonb) so the per-listing
    // approval timeline can show WHY it was rejected — no new columns needed.
    try { await sb.from('rental_audit_logs').insert({action:newStatus+'_listing',target_table:'rental_vehicle_listings',target_id:id,after_state:{admin_status:newStatus,reason:String(reason).trim()}}); } catch(e){}
    RA_DATA.pendingListings = RA_DATA.pendingListings.filter(function(l){return l.id!==id;});
    RA_DATA.summary = null; RA_DATA.allListings = [];
    toast('Listing '+newStatus,'info');
    updateBadges();
    if (currentTab==='rentalApprovals') renderRentalApprovals();
    if (currentTab==='rentalListings')  renderRentalListings();
  } catch(e) { toast('Error: '+e.message,'error'); }
}

      payload={slug:slug.trim().toLowerCase(),label:label.trim(),sort_order:99,is_active:true};
    } else if (table==='rental_brands') {
      var slug=(document.getElementById('raBrandSlug')||{}).value||'';
      var label=(document.getElementById('raBrandLabel')||{}).value||'';
      if (!slug||!label) { toast('Slug and label required','error'); return; }
      payload={slug:slug.trim().toLowerCase(),label:label.trim(),is_active:true};
    } else {
      var city=(document.getElementById('raLocCity')||{}).value||'';
      var prov=(document.getElementById('raLocProv')||{}).value||'';
      if (!city) { toast('City name required','error'); return; }
      var autoSlug = city.trim().toLowerCase().replace(/\s+/g,'-');
      payload={city:city.trim(),slug:autoSlug,province:prov.trim()||null,is_active:true};
    }
    var r = await sb.from(table).insert(payload);
    if (r.error) throw r.error;
    toast('Added successfully');
    RA_DATA.categories=[]; RA_DATA.brands=[]; RA_DATA.locations=[];
    raLoadLookups();
  } catch(e) {
    if (e.code==='23505') toast('Duplicate slug — already exists','error');
    else toast('Error: '+e.message,'error');
  }
}

// ════════════════════════════════════════════════════════════
// VERTICAL ADMIN: Jobs · Services · Property · Vehicle Sales
// Verticals are marketplace listings filtered by category server-side, with
// per-vertical counts, moderation, staleness detection and top-poster stats.
// ════════════════════════════════════════════════════════════
var VERT = { cat:null, rows:[], total:null, page:0, filter:'all', search:'', counts:{}, top:[] };
var VERT_LABELS = { jobs:'Jobs', services:'Services', property:'Property', vehicles:'Vehicle Sales' };
var VERT_POSTER = { jobs:'Employers', services:'Providers', property:'Agents / Sellers', vehicles:'Dealers / Sellers' };

async function loadVertical(cat) {
  if(VERT.cat!==cat){ VERT = { cat:cat, rows:[], total:null, page:0, filter:'all', search:'', counts:{}, top:[] }; }
  var d7 = new Date(Date.now()-7*864e5).toISOString();
  var d60 = new Date(Date.now()-60*864e5).toISOString();
  var countsP = Promise.all([
    cnt('listings',function(q){return q.eq('category',cat);}),
    cnt('listings',function(q){return q.eq('category',cat).eq('status','pending');}),
    cnt('listings',function(q){return q.eq('category',cat).eq('status','active');}),
    cnt('listings',function(q){return q.eq('category',cat).eq('status','rejected');}),
    cnt('listings',function(q){return q.eq('category',cat).gte('created_at',d7);}),
    cnt('listings',function(q){return q.eq('category',cat).eq('status','active').lt('created_at',d60);})
  ]);
  var q = sb.from('listings')
    .select('id,title,price,currency,city,prov:province,photos,status,sellerId:seller_id,sellerName:seller_name,createdAt:created_at,views,desc:description',{count:'exact'})
    .eq('category',cat).order('created_at',{ascending:false});
  if(VERT.filter!=='all') q = q.eq('status',VERT.filter);
  var s = likeSafe(VERT.search);
  if(s) q = q.or('title.ilike.%'+s+'%,seller_name.ilike.%'+s+'%');
  q = q.range(VERT.page*50, VERT.page*50+49);
  var [counts, r] = await Promise.all([countsP, q]);
  VERT.counts = { all:counts[0], pending:counts[1], active:counts[2], rejected:counts[3], new7:counts[4], stale:counts[5] };
  if(!r.error && r.data){ VERT.rows = r.data; VERT.total = r.count; }
  // Top posters in this vertical, derived from the loaded page (labelled as such).
  var by = {};
  VERT.rows.forEach(function(l){ var k=l.sellerName||'—'; by[k]=(by[k]||0)+1; });
  VERT.top = Object.keys(by).map(function(k){return {name:k,n:by[k]};}).sort(function(a,b){return b.n-a.n;}).slice(0,5);
}
function vertGo(page){ VERT.page=page; loadVertical(VERT.cat).then(function(){ renderVertical(VERT.cat); }); }
function vertSetFilter(f){ VERT.filter=f; VERT.page=0; loadVertical(VERT.cat).then(function(){ renderVertical(VERT.cat); }); }
function vertSearch(v){ VERT.search=v; VERT.page=0; debounce('vertSearch', function(){ loadVertical(VERT.cat).then(function(){ renderVertical(VERT.cat); var el=document.getElementById('vertSearch'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }); }); }

  var c = VERT.counts;

  });

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Photo</th><th>Title</th><th>'+VERT_POSTER[cat].split(' ')[0]+'</th><th>Price</th><th>Location</th><th>Status</th><th>Age</th><th>Actions</th></tr></thead><tbody>';
  if(!VERT.rows.length) html += '<tr><td colspan="8"><div class="empty-msg">No '+VERT_LABELS[cat].toLowerCase()+' posts match.</div></td></tr>';
  VERT.rows.forEach(function(l){

    html += '<tr>';
    html += '<td>'+thumb+'</td>';
    html += '<td style="max-width:200px"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">'+esc(l.title)+'</div></td>';
    html += '<td style="color:var(--sub);font-size:12px;cursor:pointer" onclick="sellerHistory(\''+esc(l.sellerId||'')+'\',\''+esc((l.sellerName||'').replace(/'/g,''))+'\')">'+esc(l.sellerName||'—')+'</td>';
    html += '<td style="font-weight:700;font-size:12px">'+(l.price!=null?'$'+fmt(l.price):'—')+'</td>';
    html += '<td style="color:var(--sub);font-size:12px">'+esc((l.city||'')+(l.prov?', '+l.prov:''))+'</td>';
    html += '<td><span class="badge badge-'+(l.status||'pending')+'">'+esc(l.status||'pending')+'</span></td>';
    html += '<td>'+(l.status==='pending'?ageChip(l.createdAt,24,48):'<span style="color:var(--sub2);font-size:11px">'+ago(l.createdAt)+'</span>')+'</td>';
    html += '<td><div style="display:flex;gap:4px;flex-wrap:wrap">';
    html += '<button class="ab ab-view" onclick="viewListing(\''+l.id+'\')">View</button>';
    if(l.status==='pending'){ html += '<button class="ab ab-approve" onclick="vertModerate(\''+l.id+'\',\'active\')">Approve</button><button class="ab ab-reject" onclick="vertModerate(\''+l.id+'\',\'rejected\')">Reject</button>'; }
    if(l.status==='active') html += '<button class="ab ab-reject" onclick="vertModerate(\''+l.id+'\',\'rejected\')">Remove</button>';
    html += '</div></td></tr>';
  });
  html += '</tbody></table></div>';
  html += pagerHtml(VERT.page, 50, VERT.total, VERT.rows.length, 'vertGo');

  if(VERT.top.length){
    html += '<div class="tbl-wrap" style="padding:16px;margin-top:8px"><div style="font-size:12px;font-weight:800;margin-bottom:10px">Top '+VERT_POSTER[cat]+' <span style="font-weight:400;color:var(--sub)">(current page)</span></div>';
    VERT.top.forEach(function(t){ html += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px"><span>'+esc(t.name)+'</span><b>'+t.n+'</b></div>'; });
    html += '</div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}

async function vertModerate(id, status) {
  if(!requirePerm('listings.moderate')) return;
  var reason = null;
  if(status==='rejected'){
    reason = await confirm2('Reject Post','Reason (sent to the poster):','Reject','red',true,'e.g. Misleading information');
    if(reason===null) return;
  }
  try {
    var l = VERT.rows.find(function(x){return x.id===id;});
    await updRow('listings', id, {status:status});
    var prev = l ? l.status : null;
    if(l) l.status = status;
    if(l && l.sellerId){
      try { await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:status==='active'?'Post Approved!':'Post Not Approved',body:status==='active'?('Your post "'+(l.title||'')+'" is now live.'):('Your post "'+(l.title||'')+'" was not approved.'+(reason?' Reason: '+reason:'')),type:status==='active'?'info':'report',read:false,created_at:Date.now()}); } catch(e){}
    }
    auditLog((status==='active'?'approve':'reject')+'_'+VERT.cat+'_post','listings',id,{status:prev},{status:status},reason||null);
    renderVertical(VERT.cat); toast('Post '+(status==='active'?'approved':'rejected'));
    loadCounts().then(updateBadges);
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// Shared spam/abuse/duplicate heuristics (same rules the rental module uses).
function reviewFlags(body, reviewerId, all, getBody, getReviewer) {
  var flags = [];
  var b = (body||'').trim();
  if (/https?:\/\/|www\.|\b\w+\.(com|net|co|xyz)\b/i.test(b) || /(.)\1{5,}/.test(b)) flags.push('spam');
  if (/\b(scam|fraud|idiot|stupid|thief|thieves)\b/i.test(b.toLowerCase())) flags.push('abuse');
  if (b && all.filter(function(x){ return getReviewer(x)===reviewerId && (getBody(x)||'').trim()===b; }).length > 1) flags.push('duplicate');
  return flags;
}

  var html = '<div class="sec-head"><div class="sec-title">Reviews Center</div><div class="sec-actions">'
    + '<button class="filter-btn'+(RC.source==='marketplace'?' on':'')+'" onclick="rcSetSource(\'marketplace\')">Marketplace ('+fmtCnt(COUNTS.mkReviews)+')</button>'

    var shown = RC.flagOnly ? reviews.filter(function(r){return r._flags.length;}) : reviews;

    if(!shown.length) html += '<tr><td colspan="7"><div class="empty-msg">No rental reviews'+(RC.flagOnly?' flagged':'')+'.</div></td></tr>';
    shown.forEach(function(r){
      var flagHtml = r._flags.length ? r._flags.map(function(f){return '<span style="font-size:10px;font-weight:700;color:#DC2626;background:#FEE2E2;padding:2px 6px;border-radius:5px;text-transform:uppercase">'+esc(f)+'</span>';}).join(' ') : '<span style="font-size:11px;color:var(--green)">clean</span>';
      html += '<tr><td style="font-weight:600">'+esc(r.company_name||'—')+'</td><td>'+r.rating+'/5</td>'
        + '<td style="color:var(--sub);font-size:12px;max-width:200px">'+esc((r.body||'').slice(0,90))+'</td>'
        + '<td>'+flagHtml+'</td>'
        + '<td style="color:var(--sub);font-size:12px;cursor:pointer" onclick="reviewerHistory(\''+esc(r.reviewer_id||'')+'\',\'rental\')">'+esc(r.reviewer_name||'—')+'</td>'
        + '<td>'+raPill(r.status)+'</td>'
        + '<td><div style="display:flex;gap:4px">'
        + (r.status!=='published' ? '<button class="ab ab-approve" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'published\')">Publish</button>' : '')
        + (r.status!=='hidden' ? '<button class="ab ab-view" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'hidden\')">Hide</button>' : '')
        + (r.status!=='removed' ? '<button class="ab ab-reject" onclick="raSetReviewStatus(\''+esc(r.id)+'\',\'removed\')">Remove</button>' : '')
        + '</div></td></tr>';
    });
    html += '</tbody></table></div>';
    document.getElementById('mainContent').innerHTML = html; return;
  }

  // Marketplace seller reviews
  if(RC.rows===null){ html+='<div class="loading-msg">Loading…</div>'; document.getElementById('mainContent').innerHTML=html; return; }
  if(RC.rows==='missing'){ html+='<div class="empty-msg">The <code>reviews</code> table is not readable with the current policies.</div>'; document.getElementById('mainContent').innerHTML=html; return; }

  rows.forEach(function(r){ r._flags = reviewFlags(r.text, r.reviewer_id, rows, function(x){return x.text;}, function(x){return x.reviewer_id;}); });
  var shown2 = RC.flagOnly ? rows.filter(function(r){return r._flags.length;}) : rows;
  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Seller</th><th>Reviewer</th><th>Rating</th><th>Review</th><th>Flags</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
  if(!shown2.length) html += '<tr><td colspan="7"><div class="empty-msg">No reviews'+(RC.flagOnly?' flagged':'')+' on this page.</div></td></tr>';
  shown2.forEach(function(r){
    var seller = getUser(r.seller_id)||{};
    var flagHtml = r._flags.length ? r._flags.map(function(f){return '<span style="font-size:10px;font-weight:700;color:#DC2626;background:#FEE2E2;padding:2px 6px;border-radius:5px;text-transform:uppercase">'+esc(f)+'</span>';}).join(' ') : '<span style="font-size:11px;color:var(--green)">clean</span>';

      + '<td>'+flagHtml+'</td>'
      + '<td style="color:var(--sub);font-size:11px">'+fmtDate(r.created_at)+'</td>'
      + '<td><button class="ab ab-delete" onclick="deleteMkReview(\''+key+'\')">Delete</button></td></tr>';
  });
  html += '</tbody></table></div>';
  html += pagerHtml(RC.page, 50, RC.total, rows.length, 'rcGo');
  document.getElementById('mainContent').innerHTML = html;
}

async function deleteMkReview(key) {
  if(!requirePerm('reviews.moderate')) return;
  var p = key.split('|');
  var ok = await confirm2('Delete Review','Remove this review permanently? The seller\'s average rating will update.','Delete','red');
  if(!ok) return;
  try {
    var r = await sb.from('reviews').delete().eq('seller_id',p[0]).eq('reviewer_id',p[1]);
    if(r.error) throw r.error;
    RC.rows = (RC.rows||[]).filter(function(x){ return !(x.seller_id===p[0] && x.reviewer_id===p[1]); });
    auditLog('delete_review','reviews',p[0]+'|'+p[1],null,null,null);
    renderReviewsCenter(); toast('Review deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

var AC = { source:'admin', rows:null, page:0, search:'', action:'' };

async function loadAuditCenter() {

      var r = await sb.from('rental_audit_logs').select('id,actor_id,action,target_table,target_id,after_state,created_at').order('created_at',{ascending:false}).range(AC.page*50, AC.page*50+49);

function acGo(page){ AC.page=page; AC.rows=null; renderAuditCenter(); loadAuditCenter().then(renderAuditCenter); }
function acSetSource(s){ AC.source=s; AC.page=0; AC.rows=null; renderAuditCenter(); loadAuditCenter().then(renderAuditCenter); }
function acSearch(v){ AC.search=v; debounce('acSearch', function(){ renderAuditCenter(); var el=document.getElementById('acSearchBox'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }, 250); }

function renderAuditCenter() {
  var html = '<div class="sec-head"><div class="sec-title">Audit Center</div><div class="sec-actions">'
    + '<button class="filter-btn'+(AC.source==='admin'?' on':'')+'" onclick="acSetSource(\'admin\')">Core Admin</button>'
    + '<button class="filter-btn'+(AC.source==='rental'?' on':'')+'" onclick="acSetSource(\'rental\')">Rental Admin</button>'
    + '<button class="filter-btn" onclick="acExport()">Export CSV</button>'
    + '<button class="btn-refresh" onclick="AC.rows=null;renderAuditCenter();loadAuditCenter().then(renderAuditCenter)">Refresh</button>'
    + '</div></div>';
  if(AC.rows===null){ html += '<div class="loading-msg">Loading audit trail…</div>'; document.getElementById('mainContent').innerHTML=html; return; }
  if(AC.rows==='missing'){
    html += '<div class="empty-msg">'+(AC.source==='admin'
      ? 'The <code>admin_audit_logs</code> table is not installed yet.<br><br>Run <b>supabase/ADMIN_ENTERPRISE_UPGRADE.sql</b> in the Supabase SQL Editor to enable the unified audit trail. Until then, admin actions are not being recorded.'
      : 'rental_audit_logs not readable.')+'</div>';
    document.getElementById('mainContent').innerHTML=html; return;
  }
  var rows = AC.rows;
  var actions = [...new Set(rows.map(function(l){return l.action;}).filter(Boolean))].sort();
  var q = (AC.search||'').toLowerCase();
  var filtered = rows.filter(function(l){
    if(AC.action && l.action!==AC.action) return false;
    if(q){
      var hay = ((l.action||'')+' '+(l.entity||'')+' '+(l.entity_id||'')+' '+(l.actor_email||'')+' '+(l.reason||'')).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">'
    + '<input id="acSearchBox" class="search-input" placeholder="Search action, entity, actor, reason…" value="'+esc(AC.search)+'" oninput="acSearch(this.value)" style="min-width:240px;flex:1">'
    + '<select class="form-select" style="width:auto;padding:7px 10px;font-size:12px" onchange="AC.action=this.value;renderAuditCenter()"><option value="">All actions</option>'+actions.map(function(a){return '<option value="'+esc(a)+'"'+(AC.action===a?' selected':'')+'>'+esc(a)+'</option>';}).join('')+'</select>'
    + '</div>';
  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Action</th><th>Entity</th><th>Target</th><th>Actor</th><th>Reason</th><th>When</th><th></th></tr></thead><tbody>';
  if(!filtered.length) html += '<tr><td colspan="7"><div class="empty-msg">No audit entries match.</div></td></tr>';
  filtered.forEach(function(l, i){
    var actor = l.actor_email ? esc(l.actor_email.split('@')[0]) : (l.actor_id ? esc(userLabel(l.actor_id)) : 'system');
    html += '<tr>'
      + '<td style="font-weight:700;font-size:12px">'+esc(l.action||'')+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+esc(l.entity||'')+'</td>'
      + '<td style="color:var(--sub);font-size:11px">'+esc(String(l.entity_id||'').slice(0,12))+'</td>'
      + '<td style="color:var(--sub);font-size:12px">'+actor+'</td>'
      + '<td style="color:var(--sub);font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(l.reason||'—')+'</td>'
      + '<td style="color:var(--sub);font-size:11px;white-space:nowrap">'+fmtDateTime(l.created_at)+'</td>'
      + '<td>'+((l.before_state||l.after_state)?'<button class="ab ab-view" onclick="acDetail('+i+')">Diff</button>':'')+'</td></tr>';
  });
  html += '</tbody></table></div>';
  html += pagerHtml(AC.page, 50, null, rows.length, 'acGo');
  document.getElementById('mainContent').innerHTML = html;
  window._acFiltered = filtered;
}
function acDetail(i) {
  var l = (window._acFiltered||[])[i]; if(!l) return;
  openModal('<div class="modal-title">'+esc(l.action||'Audit Entry')+'<button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div style="font-size:12px;color:var(--sub);margin-bottom:10px">'+esc(l.entity||'')+' · '+esc(String(l.entity_id||''))+' · '+fmtDateTime(l.created_at)+'</div>'
    + (l.reason?'<div style="font-size:13px;margin-bottom:10px"><b>Reason:</b> '+esc(l.reason)+'</div>':'')
    + '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;margin-bottom:4px">Before</div>'
    + '<pre style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:150px;color:var(--sub)">'+esc(JSON.stringify(l.before_state||null,null,2))+'</pre>'
    + '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;margin:8px 0 4px">After</div>'
    + '<pre style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:150px;color:var(--sub)">'+esc(JSON.stringify(l.after_state||null,null,2))+'</pre>');
}
function acExport() {
  var rows = [['Action','Entity','Target','Actor','Reason','When','Before','After']];
  (window._acFiltered||AC.rows||[]).forEach(function(l){
    if(typeof l !== 'object') return;
    rows.push([l.action||'', l.entity||'', l.entity_id||'', l.actor_email||l.actor_id||'', l.reason||'', l.created_at||'', JSON.stringify(l.before_state||''), JSON.stringify(l.after_state||'')]);
  });
  if(rows.length===1){ toast('Nothing to export','info'); return; }
  downloadCSV('pamarket-audit-'+AC.source+'-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  toast('Exported '+(rows.length-1)+' audit entries');
}

// OPERATIONS CENTER — platform health, Edge Functions, errors, DB
// ════════════════════════════════════════════════════════════
var OPS = null;

async function loadOps() {
  var t0 = Date.now();
  async function ping(fn){
    var start = Date.now();
    try { var r = await fetch(SUPABASE_URL+'/functions/v1/'+fn, {method:'OPTIONS'}); return {ok:r.status<500, status:r.status, ms:Date.now()-start}; }
    catch(e){ return {ok:false, status:'unreachable', ms:Date.now()-start}; }
  }
  var tables = ['profiles','listings','messages','notifications','reports','paid_ads','businesses','error_logs','rental_vehicle_listings','admin_audit_logs'];
  var res = await Promise.allSettled([
    ping('send-push'),
    ping('get-r2-upload-url'),
    Promise.all(tables.map(function(t){ return cnt(t); })),
    sb.from('error_logs').select('*').order('created_at',{ascending:false}).limit(25),
    cnt('notifications',function(q){return q.lt('created_at', Date.now()-30*864e5);}),
    sb.auth.getSession()
  ]);
  var dbLatency = Date.now()-t0;
  OPS = {
    push: res[0].value||{ok:false,status:'—'},
    r2:   res[1].value||{ok:false,status:'—'},
    tables: tables.map(function(t,i){ return {name:t, rows:(res[2].value||[])[i]}; }),
    errors: (res[3].value && !res[3].value.error) ? (res[3].value.data||[]) : 'missing',
    oldNotifs: res[4].value,
    session: !!(res[5].value && res[5].value.data && res[5].value.data.session),
    dbLatency: dbLatency,
    loadedAt: new Date()
  };
  if(currentTab==='opsCenter') renderOps();
}

function renderOps() {
  if(!OPS){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Checking platform health…</div>'; loadOps(); return; }
  var o = OPS;
  function health(label, ok, detail){
    return '<div class="stat-card '+(ok?'green':'red')+'"><div class="stat-label">'+label+'</div><div class="stat-val" style="font-size:16px">'+(ok?'Healthy':'Down')+'</div><div class="stat-sub">'+detail+'</div></div>';
  }
  var html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><div style="font-size:13px;font-weight:700;color:var(--sub)">System health · checked '+o.loadedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</div><button class="btn-refresh" onclick="OPS=null;renderOps()">Re-check</button></div>';
  html += '<div class="stats-grid">';
  html += health('Database', o.tables.some(function(t){return t.rows!=null;}), 'query round-trip '+o.dbLatency+'ms');
  html += health('Auth Session', o.session, 'admin session valid');
  html += health('Push Function', o.push.ok, 'send-push · '+o.push.status+' · '+o.push.ms+'ms');
  html += health('R2 Storage Function', o.r2.ok, 'get-r2-upload-url · '+o.r2.status+' · '+o.r2.ms+'ms');
  html += statCard('Old Notifications','amber',fmtCnt(o.oldNotifs),'30d+ · clean in Maintenance','maintenance');
  html += statCard('Audit Trail','accent',(o.tables.find(function(t){return t.name==='admin_audit_logs';})||{}).rows==null?'OFF':'ON','unified admin logging','auditCenter');
  html += '</div>';

  // Table row counts (DB monitoring)
  html += '<div class="tbl-wrap" style="margin-bottom:18px"><div style="font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--border)">Database Tables</div>';
  o.tables.forEach(function(t){
    html += '<div style="display:flex;justify-content:space-between;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px"><span style="color:var(--sub)">'+esc(t.name)+'</span><b>'+(t.rows==null?'<span style="color:var(--red)">not readable</span>':fmtCnt(t.rows))+'</b></div>';
  });
  html += '</div>';

  // Error log browser
  html += '<div class="sec-head"><div class="sec-title">Recent Client Errors</div><button class="filter-btn" onclick="showTab(\'maintenance\')">Cleanup tools →</button></div>';
  if(o.errors==='missing') html += '<div class="empty-msg">error_logs table not readable.</div>';
  else if(!o.errors.length) html += '<div class="empty-msg">No client errors logged. Clean bill of health.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Error</th><th>Context</th><th>When</th></tr></thead><tbody>';
    o.errors.forEach(function(e){
      var msg = e.message||e.error||e.msg||JSON.stringify(e).slice(0,120);
      html += '<tr><td style="font-size:12px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(String(msg).slice(0,140))+'</td><td style="color:var(--sub);font-size:11px">'+esc(e.context||e.page||e.source||'—')+'</td><td style="color:var(--sub);font-size:11px;white-space:nowrap">'+fmtDateTime(e.created_at||e.t)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}

// ════════════════════════════════════════════════════════════
// MODERATION INBOX — one queue across every moderatable entity, risk-ranked
// Pulls the oldest pending items from listings + verifications + reports +
// rental listings + appeals into a single SLA-ordered work list. Each row
// carries a risk score and inline actions so moderators never tab-hop.
// ════════════════════════════════════════════════════════════
var MI = { items:null, filter:'all', loadedAt:null };

async function loadModInbox() {
  MI.items = null;
  var res = await Promise.allSettled([
    sb.from('listings').select('id,title,seller_id,seller_name,created_at,category').eq('status','pending').order('created_at',{ascending:true}).limit(40),
    sb.from('verifications').select('id,user_id,submitted_at').eq('status','pending').order('submitted_at',{ascending:true}).limit(40),
    sb.from('reports').select('id,reason,target_type,target_id,severity,created_at,reporter_id').eq('status','open').order('created_at',{ascending:true}).limit(40),
    sb.from('rental_vehicle_listings').select('id,model,year,created_at,company_id').eq('admin_status','pending_review').is('deleted_at',null).order('created_at',{ascending:true}).limit(20),
    sb.from('moderation_appeals').select('id,entity,entity_id,reason,created_at,requester_id').eq('status','open').order('created_at',{ascending:true}).limit(20)
  ]);
  var items = [];
  ((res[0].value&&res[0].value.data)||[]).forEach(function(l){ items.push({kind:'listing', id:l.id, title:l.title||'Untitled', sub:'Marketplace listing · '+(l.category||''), who:l.seller_id, whoName:l.seller_name, at:l.created_at, sev:'medium'}); });
  ((res[1].value&&res[1].value.data)||[]).forEach(function(v){ items.push({kind:'verification', id:v.id, uid:v.user_id, title:'ID verification', sub:'Identity review', who:v.user_id, at:v.submitted_at, sev:'medium'}); });
  ((res[2].value&&res[2].value.data)||[]).forEach(function(r){ items.push({kind:'report', id:r.id, title:'Report: '+(r.reason||'—'), sub:(r.target_type||'')+' report', who:r.reporter_id, target:r.target_id, targetType:r.target_type, at:r.created_at, sev:r.severity||'high'}); });
  ((res[3].value&&res[3].value.data)||[]).forEach(function(v){ items.push({kind:'rental', id:v.id, title:(v.model||'Vehicle')+' '+(v.year||''), sub:'Rental listing review', at:v.created_at, sev:'medium'}); });
  ((res[4].value&&res[4].value.data)||[]).forEach(function(a){ items.push({kind:'appeal', id:a.id, title:'Appeal: '+(a.entity||''), sub:(a.reason||'').slice(0,60), who:a.requester_id, target:a.entity_id, at:a.created_at, sev:'high'}); });
  // Resolve names for actors we have ids for.
  await ensureProfiles(items.map(function(i){ return i.who; }).concat(items.map(function(i){ return i.uid; })));
  // Risk-rank: severity weight + age. Oldest & most severe float up.
  var sevW = {high:3, medium:2, low:1};
  items.forEach(function(i){
    var ageH = (Date.now()-new Date(i.at).getTime())/3600000;
    i.risk = Math.round((sevW[i.sev]||2)*20 + Math.min(40, ageH));
  });
  items.sort(function(a,b){ return b.risk - a.risk; });
  MI.items = items; MI.loadedAt = new Date();
}
function renderModInbox() {
  if(!requirePerm('reports.manage') && !requirePerm('listings.moderate')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Your role cannot access the moderation inbox.</div>'; return; }
  if(MI.items===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Assembling unified queue…</div>'; return; }
  var items = MI.items.filter(function(i){ return MI.filter==='all' || i.kind===MI.filter; });
  var kinds = {listing:0,verification:0,report:0,rental:0,appeal:0};
  MI.items.forEach(function(i){ kinds[i.kind]=(kinds[i.kind]||0)+1; });

  var html = '<div class="sec-head"><div class="sec-title">Moderation Inbox <span style="font-weight:400;color:var(--sub);font-size:12px">('+MI.items.length+' items · risk-ranked)</span></div><div class="sec-actions">';
  [['all','All'],['report','Reports ('+kinds.report+')'],['listing','Listings ('+kinds.listing+')'],['verification','Verifications ('+kinds.verification+')'],['rental','Rentals ('+kinds.rental+')'],['appeal','Appeals ('+kinds.appeal+')']].forEach(function(f){
    html += '<button class="filter-btn'+(MI.filter===f[0]?' on':'')+'" onclick="MI.filter=\''+f[0]+'\';renderModInbox()">'+f[1]+'</button>';
  });
  html += '<button class="btn-refresh" onclick="loadModInbox().then(renderModInbox)">Refresh</button></div></div>';
  html += '<div style="font-size:11px;color:var(--sub2);margin-bottom:12px">'+refreshStamp2(MI.loadedAt)+' · Sorted by risk = severity × age. Work top-down to hit SLA.</div>';

  if(!items.length){ html += '<div class="empty-msg" style="padding:30px">Inbox zero. Nothing awaits moderation.</div>'; document.getElementById('mainContent').innerHTML=html; return; }

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Risk</th><th>Type</th><th>Item</th><th>Actor</th><th>Waiting</th><th>Actions</th></tr></thead><tbody>';
  var iconMap = {listing:'▤',verification:'◉',report:'⚑',rental:'⛃',appeal:'⚖'};
  items.forEach(function(i){
    var riskColor = i.risk>=70?'var(--red)':i.risk>=45?'var(--amber)':'var(--sub2)';
    html += '<tr>';
    html += '<td><span style="display:inline-block;min-width:34px;text-align:center;font-weight:800;font-size:12px;color:#fff;background:'+riskColor+';border-radius:6px;padding:2px 0">'+i.risk+'</span></td>';
    html += '<td><span class="badge badge-info">'+(iconMap[i.kind]||'')+' '+i.kind+'</span></td>';
    html += '<td style="max-width:240px"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px">'+esc(i.title)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(i.sub||'')+'</div></td>';
    html += '<td style="font-size:12px;color:var(--sub)">'+(i.who?esc(i.whoName||userLabel(i.who)):'—')+'</td>';
    html += '<td>'+ageChip(i.at,24,72)+'</td>';
    html += '<td><div style="display:flex;gap:4px;flex-wrap:wrap">'+miActions(i)+'</div></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}
function refreshStamp2(d){ return d ? 'Updated '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : ''; }
function miActions(i){
  if(i.kind==='listing') return '<button class="ab ab-view" onclick="viewListing(\''+i.id+'\')">View</button><button class="ab ab-approve" onclick="miApprove(\'listing\',\''+i.id+'\')">Approve</button><button class="ab ab-reject" onclick="miReject(\'listing\',\''+i.id+'\')">Reject</button>';
  if(i.kind==='rental') return '<button class="ab ab-approve" onclick="raApproveListing(\''+i.id+'\').then(function(){loadModInbox().then(renderModInbox);})">Approve</button><button class="ab ab-reject" onclick="raModerateListing(\''+i.id+'\',\'rejected\').then(function(){loadModInbox().then(renderModInbox);})">Reject</button>';
  if(i.kind==='verification') return '<button class="ab ab-view" onclick="showTab(\'verifications\')">Open</button><button class="ab ab-approve" onclick="miApproveVerif(\''+i.uid+'\',\''+i.id+'\')">Approve</button>';
  if(i.kind==='report') return '<button class="ab ab-view" onclick="showTab(\'reports\')">Open</button><button class="ab ab-approve" onclick="miResolveReport(\''+i.id+'\')">Resolve</button>'+(i.targetType==='user'&&i.target?'<button class="ab ab-ban" onclick="banUser(\''+i.target+'\')">Ban target</button>':'');
  if(i.kind==='appeal') return '<button class="ab ab-approve" onclick="decideAppeal(\''+i.id+'\',\'granted\')">Grant</button><button class="ab ab-reject" onclick="decideAppeal(\''+i.id+'\',\'denied\')">Deny</button>';
  return '';
}
function miRemove(kind,id){ if(MI.items) MI.items = MI.items.filter(function(x){ return !(x.kind===kind && x.id===id); }); }
async function miApprove(kind, id){
  if(!requirePerm('listings.moderate')) return;
  try { await updRow('listings', id, {status:'active'});
    var l = (MI.items||[]).find(function(x){return x.kind===kind&&x.id===id;});
    if(l && l.who){ try{ await sb.from('notifications').insert({id:notifId(),user_id:l.who,title:'Listing Approved!',body:'Your listing is now live.',type:'info',read:false,created_at:Date.now()}); }catch(e){} }
    auditLog('approve_listing','listings',id,{status:'pending'},{status:'active'},'via inbox');
    if(COUNTS.listingsPending) COUNTS.listingsPending--;
    miRemove(kind,id); updateBadges(); renderModInbox(); toast('Approved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function miReject(kind, id){
  if(!requirePerm('listings.moderate')) return;
  var reason = await confirm2('Reject Listing','Reason (sent to seller):','Reject','red',true,'e.g. Prohibited item');
  if(reason===null) return;
  try { await updRow('listings', id, {status:'rejected'});
    var l = (MI.items||[]).find(function(x){return x.kind===kind&&x.id===id;});
    if(l && l.who){ try{ await sb.from('notifications').insert({id:notifId(),user_id:l.who,title:'Listing Not Approved',body:'Your listing was not approved.'+(reason?' Reason: '+reason:''),type:'report',read:false,created_at:Date.now()}); }catch(e){} }
    auditLog('reject_listing','listings',id,{status:'pending'},{status:'rejected'},reason||'via inbox');
    if(COUNTS.listingsPending) COUNTS.listingsPending--;
    miRemove(kind,id); updateBadges(); renderModInbox(); toast('Rejected');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function miApproveVerif(uid, vid){
  if(!requirePerm('verifications.manage')) return;
  try { await updRow('profiles', uid, {verified:true, verification_pending:false});
    if(vid) try{ await sb.from('verifications').update({status:'approved',admin_note:'Approved via inbox'}).eq('id',vid); }catch(e){}
    try{ await sb.from('notifications').insert({id:notifId(),user_id:uid,title:'Identity Verified',body:'Your blue verified badge is now active.',type:'verify',read:false,created_at:Date.now()}); }catch(e){}
    auditLog('approve_verification','profiles',uid,{verified:false},{verified:true},'via inbox');
    if(COUNTS.verifPending) COUNTS.verifPending--;
    miRemove('verification',vid); updateBadges(); renderModInbox(); toast('Verified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function miResolveReport(id){
  if(!requirePerm('reports.manage')) return;
  try { await updRow('reports', id, {status:'resolved'});
    auditLog('resolve_report','reports',id,{status:'open'},{status:'resolved'},'via inbox');
    if(COUNTS.reportsOpen) COUNTS.reportsOpen--;
    miRemove('report',id); updateBadges(); renderModInbox(); toast('Report resolved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function decideAppeal(id, decision){
  try {
    await updRow('moderation_appeals', id, {status:decision, decided_by:_adminUid, decided_at:new Date().toISOString()});
    auditLog('appeal_'+decision,'moderation_appeals',id,{status:'open'},{status:decision},null);
    if(COUNTS.appealsOpen) COUNTS.appealsOpen--;
    miRemove('appeal',id); updateBadges(); renderModInbox(); toast('Appeal '+decision);
  } catch(e){ toast('Appeals need ADMIN_ENTERPRISE_V2.sql: '+e.message,'error'); }
}

// ════════════════════════════════════════════════════════════
// SUPPORT CENTER — ticketing with SLA, priority, assignment, CSAT
// Uses support_tickets + support_ticket_messages (V2). Legacy support
// messages in `reports` (target_type='support') remain in the Reports tab.
// ════════════════════════════════════════════════════════════
var SUP = { tickets:null, total:null, page:0, status:'open', priority:'', assignee:'', openTicket:null, thread:null, missing:false };
var TICKET_TEMPLATES = [
  {name:'Acknowledge', body:'Thanks for reaching out — we\'ve received your request and are looking into it now. We\'ll update you shortly.'},
  {name:'Need more info', body:'To help you faster, could you share a bit more detail (screenshots, the listing link, and what you expected to happen)?'},
  {name:'Resolved', body:'We\'ve resolved this for you. If anything else comes up, just reply here. Thanks for using PaMarket!'},
  {name:'Escalated', body:'This has been escalated to a senior specialist who will follow up with you directly.'}
];

async function loadSupport(){
  SUP.tickets = null; SUP.missing = false;
  if(!(await hasTable('support_tickets'))){ SUP.missing = true; return; }
  var q = sb.from('support_tickets').select('*',{count:'exact'}).order('created_at',{ascending:false});
  if(SUP.status!=='all') q = q.eq('status', SUP.status);
  if(SUP.priority) q = q.eq('priority', SUP.priority);
  if(SUP.assignee==='me') q = q.eq('assigned_to', _adminUid);
  if(SUP.assignee==='unassigned') q = q.is('assigned_to', null);
  q = q.range(SUP.page*25, SUP.page*25+24);
  var r = await q;
  if(!r.error){ SUP.tickets = r.data||[]; SUP.total = r.count; await ensureProfiles(SUP.tickets.map(function(t){return t.requester_id;}).concat(SUP.tickets.map(function(t){return t.assigned_to;}))); }
  else SUP.tickets = [];
}
function supGo(p){ SUP.page=p; loadSupport().then(renderSupport); }
function supFilter(k,v){ SUP[k]=v; SUP.page=0; loadSupport().then(renderSupport); }

function renderSupport(){
  if(SUP.missing){ document.getElementById('mainContent').innerHTML = '<div class="sec-head"><div class="sec-title">Support Center</div></div>'+migrationNotice('The Support Center'); return; }
  if(SUP.openTicket){ return renderTicketThread(); }
  if(SUP.tickets===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading tickets…</div>'; return; }

  // SLA + CSAT rollups from the loaded page (indicative) + a live open count.
  var openOld = SUP.tickets.filter(function(t){ return t.status==='open' && (Date.now()-new Date(t.created_at).getTime())>24*3600e3; }).length;
  var csatVals = SUP.tickets.filter(function(t){return t.csat;}).map(function(t){return t.csat;});
  var csatAvg = csatVals.length ? (csatVals.reduce(function(a,b){return a+b;},0)/csatVals.length).toFixed(1) : '—';

  var html = '<div class="sec-head"><div class="sec-title">Support Center</div><div class="sec-actions"><button class="btn-send" style="padding:8px 14px;font-size:13px" onclick="newTicket()">+ New Ticket</button><button class="btn-refresh" onclick="loadSupport().then(renderSupport)">Refresh</button></div></div>';
  html += '<div class="stats-grid">';
  html += statCard('Open Queue','amber',fmtCnt(COUNTS.supportOpen),'open + pending');
  html += statCard('SLA Risk','red',openOld,'open > 24h (this page)');
  html += statCard('Avg CSAT','green',csatAvg==='—'?'—':csatAvg+'/5','satisfaction');
  html += statCard('Assigned to me','blue',SUP.tickets.filter(function(t){return t.assigned_to===_adminUid;}).length,'this page');
  html += '</div>';

  html += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">';
  ['open','pending','resolved','closed','all'].forEach(function(s){ html += '<button class="filter-btn'+(SUP.status===s?' on':'')+'" onclick="supFilter(\'status\',\''+s+'\')">'+s.charAt(0).toUpperCase()+s.slice(1)+'</button>'; });
  html += '<select class="form-select" style="width:auto;padding:7px 10px;font-size:12px" onchange="supFilter(\'priority\',this.value)"><option value="">Any priority</option>'+['urgent','high','normal','low'].map(function(p){return '<option value="'+p+'"'+(SUP.priority===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select>';
  html += '<select class="form-select" style="width:auto;padding:7px 10px;font-size:12px" onchange="supFilter(\'assignee\',this.value)"><option value="">Anyone</option><option value="me"'+(SUP.assignee==='me'?' selected':'')+'>Assigned to me</option><option value="unassigned"'+(SUP.assignee==='unassigned'?' selected':'')+'>Unassigned</option></select>';
  html += '</div>';

  if(!SUP.tickets.length){ html += '<div class="empty-msg">No tickets match. Create one, or connect app-side ticket creation to <code>support_tickets</code>.</div>'; document.getElementById('mainContent').innerHTML=html; return; }

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Priority</th><th>Subject</th><th>Requester</th><th>Status</th><th>Assignee</th><th>Age</th><th></th></tr></thead><tbody>';
  var prioColor = {urgent:'var(--red)',high:'var(--amber)',normal:'var(--sub2)',low:'var(--sub2)'};
  SUP.tickets.forEach(function(t){
    html += '<tr style="cursor:pointer" onclick="openTicket(\''+t.id+'\')">';
    html += '<td><span style="font-size:10px;font-weight:800;text-transform:uppercase;color:'+(prioColor[t.priority]||'var(--sub2)')+'">'+esc(t.priority||'normal')+'</span></td>';
    html += '<td style="font-weight:600;max-width:260px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">'+esc(t.subject)+'</div><div style="font-size:11px;color:var(--sub)">'+esc(t.category||'general')+'</div></td>';
    html += '<td style="font-size:12px;color:var(--sub)">'+esc(t.requester_id?userLabel(t.requester_id):'—')+'</td>';
    html += '<td><span class="badge badge-'+(t.status==='open'?'pending':t.status==='resolved'||t.status==='closed'?'active':'info')+'">'+esc(t.status)+'</span></td>';
    html += '<td style="font-size:12px;color:var(--sub)">'+esc(t.assigned_to?userLabel(t.assigned_to):'—')+'</td>';
    html += '<td>'+(t.status==='open'?ageChip(t.created_at,24,72):'<span style="font-size:11px;color:var(--sub2)">'+ago(t.created_at)+'</span>')+'</td>';
    html += '<td><button class="ab ab-view" onclick="event.stopPropagation();openTicket(\''+t.id+'\')">Open</button></td>';
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += pagerHtml(SUP.page, 25, SUP.total, SUP.tickets.length, 'supGo');
  document.getElementById('mainContent').innerHTML = html;
}
async function newTicket(){
  var subject = await confirm2('New Ticket','Ticket subject:','Next','green',true,'e.g. Payment not reflecting');
  if(subject===null||!String(subject).trim()) return;
  try {
    var r = await sb.from('support_tickets').insert({subject:String(subject).trim(), status:'open', priority:'normal', source:'admin', assigned_to:_adminUid}).select('id').single();
    if(r.error) throw r.error;
    auditLog('create_ticket','support_tickets',r.data.id,null,{subject:String(subject).trim()},null);
    COUNTS.supportOpen=(COUNTS.supportOpen||0)+1; updateBadges();
    openTicket(r.data.id);
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function openTicket(id){
  SUP.openTicket = id; SUP.thread = null;
  document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading ticket…</div>';
  var res = await Promise.allSettled([
    sb.from('support_tickets').select('*').eq('id',id).single(),
    sb.from('support_ticket_messages').select('*').eq('ticket_id',id).order('created_at')
  ]);
  SUP.openTicketData = res[0].value&&res[0].value.data;
  SUP.thread = (res[1].value&&res[1].value.data)||[];
  if(SUP.openTicketData) await ensureProfiles([SUP.openTicketData.requester_id, SUP.openTicketData.assigned_to]);
  renderSupport();
}
function renderTicketThread(){
  var t = SUP.openTicketData;
  if(!t){ SUP.openTicket=null; return renderSupport(); }
  var html = '<button class="filter-btn" style="margin-bottom:12px" onclick="SUP.openTicket=null;renderSupport()">← Back to tickets</button>';
  html += '<div class="tbl-wrap" style="padding:18px;margin-bottom:16px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">';
  html += '<div><div style="font-size:17px;font-weight:800">'+esc(t.subject)+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">'+esc(t.category||'general')+' · from '+esc(t.requester_id?userLabel(t.requester_id):'—')+' · opened '+fmtDateTime(t.created_at)+'</div></div>';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap">';
  ['open','pending','resolved','closed'].forEach(function(s){ html += '<button class="ab '+(t.status===s?'ab-approve':'ab-view')+'" onclick="setTicketStatus(\''+t.id+'\',\''+s+'\')">'+s+'</button>'; });
  html += '</div></div>';
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center">';
  html += '<label style="font-size:12px;color:var(--sub)">Priority <select class="form-select" style="width:auto;padding:5px 8px;font-size:12px;display:inline-block;margin-left:4px" onchange="setTicketField(\''+t.id+'\',\'priority\',this.value)">'+['low','normal','high','urgent'].map(function(p){return '<option value="'+p+'"'+((t.priority||'normal')===p?' selected':'')+'>'+p+'</option>';}).join('')+'</select></label>';
  html += '<button class="ab ab-view" onclick="setTicketField(\''+t.id+'\',\'assigned_to\',\''+_adminUid+'\')">Assign to me</button>';
  if(t.status!=='resolved'&&t.status!=='closed') html += '<button class="ab ab-approve" onclick="resolveTicket(\''+t.id+'\')">Resolve + request CSAT</button>';
  if(t.csat) html += '<span class="badge badge-active">CSAT '+t.csat+'/5</span>';
  html += '</div></div>';

  // Thread
  html += '<div class="tbl-wrap" style="padding:16px;margin-bottom:16px"><div style="display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto">';
  if(!SUP.thread || !SUP.thread.length) html += '<div style="color:var(--sub);font-size:13px">No messages yet. Add the first reply or an internal note below.</div>';
  (SUP.thread||[]).forEach(function(m){
    var mine = m.author_kind==='admin';
    html += '<div style="align-self:'+(mine?'flex-end':'flex-start')+';max-width:80%;background:'+(m.internal?'rgba(245,158,11,.12)':mine?'rgba(99,102,241,.14)':'var(--bg)')+';border:1px solid '+(m.internal?'rgba(245,158,11,.3)':'var(--border)')+';border-radius:12px;padding:9px 12px">';
    html += '<div style="font-size:10px;color:var(--sub2);margin-bottom:3px">'+(m.internal?'INTERNAL NOTE · ':'')+esc(m.author_kind)+' · '+fmtDateTime(m.created_at)+'</div>';
    html += '<div style="font-size:13px;line-height:1.5;white-space:pre-wrap">'+esc(m.body)+'</div></div>';
  });
  html += '</div></div>';

  // Composer
  html += '<div class="tbl-wrap" style="padding:16px">';
  html += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">'+TICKET_TEMPLATES.map(function(tp,i){return '<button class="filter-btn" onclick="applyTicketTemplate('+i+')">'+esc(tp.name)+'</button>';}).join('')+'</div>';
  html += '<textarea id="ticketReply" class="form-textarea" placeholder="Write a reply to the customer, or an internal note…"></textarea>';
  html += '<div style="display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap">';
  html += '<button class="btn-send" onclick="sendTicketReply(\''+t.id+'\',false)">Send Reply</button>';
  html += '<button class="ab ab-edit" style="padding:9px 14px" onclick="sendTicketReply(\''+t.id+'\',true)">Add Internal Note</button>';
  html += '</div></div>';
  document.getElementById('mainContent').innerHTML = html;
}
function applyTicketTemplate(i){ var el=document.getElementById('ticketReply'); if(el){ el.value = TICKET_TEMPLATES[i].body; el.focus(); } }
async function sendTicketReply(id, internal){
  var el = document.getElementById('ticketReply'); var body = el?el.value.trim():'';
  if(!body){ toast('Write something first','error'); return; }
  try {
    await sb.from('support_ticket_messages').insert({ticket_id:id, author_id:_adminUid, author_kind:'admin', body:body, internal:!!internal});
    // First admin reply stamps first_response_at for SLA.
    if(!internal && SUP.openTicketData && !SUP.openTicketData.first_response_at){ try{ await sb.from('support_tickets').update({first_response_at:new Date().toISOString(), updated_at:new Date().toISOString()}).eq('id',id); }catch(e){} }
    auditLog(internal?'ticket_note':'ticket_reply','support_tickets',id,null,null,null);
    openTicket(id); toast(internal?'Note added':'Reply sent');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function setTicketStatus(id, status){
  try { await updRow('support_tickets', id, {status:status, updated_at:new Date().toISOString()});
    auditLog('ticket_status','support_tickets',id,null,{status:status},null);
    if(status!=='open'&&status!=='pending'&&COUNTS.supportOpen) COUNTS.supportOpen--; updateBadges();
    openTicket(id); toast('Ticket '+status);
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function setTicketField(id, field, val){
  try { var patch={updated_at:new Date().toISOString()}; patch[field]=val; await updRow('support_tickets', id, patch);
    auditLog('ticket_'+field,'support_tickets',id,null,patch,null); openTicket(id); toast('Updated');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function resolveTicket(id){
  try {
    await updRow('support_tickets', id, {status:'resolved', resolved_at:new Date().toISOString(), updated_at:new Date().toISOString()});
    // Ask the customer for a rating (best-effort notification if we know them).
    if(SUP.openTicketData && SUP.openTicketData.requester_id){
      try{ await sb.from('notifications').insert({id:notifId(),user_id:SUP.openTicketData.requester_id,title:'How did we do?',body:'Your support request "'+SUP.openTicketData.subject+'" was resolved. Reply with a rating 1–5.',type:'info',read:false,created_at:Date.now()}); }catch(e){}
    }
    auditLog('resolve_ticket','support_tickets',id,null,{status:'resolved'},null);
    if(COUNTS.supportOpen) COUNTS.supportOpen--; updateBadges();
    openTicket(id); toast('Resolved · CSAT requested');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

// FINANCE CENTER — revenue streams, refunds, failed payments, top payers
// Prefers server-side RPC (admin_revenue_summary / admin_top_payers). Falls
// back to bounded row queries if the RPCs aren't installed.
// ════════════════════════════════════════════════════════════
var FIN = { data:null, window:30 };
async function loadFinance(){
  FIN.data = null;
  var win = FIN.window;
  var rev = await rpc('admin_revenue_summary', {days:win});
  var top = await rpc('admin_top_payers', {days:win, lim:10});
  var since = new Date(Date.now()-win*864e5).toISOString();
  // Fallbacks + supplementary data always fetched with tight bounds.
  var playTable = await hasTable('play_purchases');
  var packTable = await hasTable('featured_slot_packs');
  var extra = await Promise.allSettled([
    sb.from('business_payments').select('amount,status,type,created_at,business_id').gte('created_at',since).order('created_at',{ascending:false}).limit(1500),
    sb.from('paid_ads').select('price_paid,created_at').limit(1000),
    sb.from('business_subscriptions').select('plan_id,status').eq('status','active'),
    playTable ? sb.from('play_purchases').select('product_id,status').eq('status','consumed').gte('created_at',since) : Promise.resolve({data:[]}),
    packTable ? sb.from('featured_slot_packs').select('extra_slots,status').eq('status','consumed').gte('created_at',since) : Promise.resolve({data:[]})
  ]);
  var pays = (extra[0].value&&extra[0].value.data)||[];
  var ads  = (extra[1].value&&extra[1].value.data)||[];
  var subs = (extra[2].value&&extra[2].value.data)||[];
  var playPurchases = (extra[3].value&&extra[3].value.data)||[];
  var slotPacks = (extra[4].value&&extra[4].value.data)||[];
  var playRevenue = playPurchases.reduce(function(a,p){ return a+billingProductPrice(p.product_id); }, 0)
    + slotPacks.reduce(function(a,p){ return a+billingSlotPackPriceByExtraSlots(p.extra_slots); }, 0);

  var summary;
  if(rev.data){ summary = rev.data; summary._rpc = true; }
  else {
    summary = {
      subs_paid: pays.filter(function(p){return p.status==='paid'&&p.type==='subscription';}).reduce(function(a,p){return a+(+p.amount||0);},0),
      other_paid: pays.filter(function(p){return p.status==='paid'&&p.type!=='subscription';}).reduce(function(a,p){return a+(+p.amount||0);},0),
      ads_revenue: ads.reduce(function(a,x){return a+(+x.price_paid||0);},0),
      subs_failed: pays.filter(function(p){return p.status==='failed';}).length,
      subs_pending: pays.filter(function(p){return p.status==='pending';}).length,
      txn_count: pays.length, _rpc:false
    };
  }
  // Plan mix (active subscriptions).
  var planMix = {}; subs.forEach(function(s){ planMix[s.plan_id]=(planMix[s.plan_id]||0)+1; });
  // Monthly revenue series from the paid rows we have.
  var byMonth = {};
  pays.filter(function(p){return p.status==='paid';}).forEach(function(p){ var k=(p.created_at||'').slice(0,7); byMonth[k]=(byMonth[k]||0)+(+p.amount||0); });

  FIN.data = { summary:summary, top:(top.data||null), topMissing:!!top.missing, pays:pays, planMix:planMix, byMonth:byMonth, window:win, playRevenue:playRevenue };
  await ensureProfiles((FIN.data.top||[]).map(function(t){return t.business_id;}));  // best-effort (business ids, not profiles)
  if(FIN.data.top){ var bizIds=(FIN.data.top||[]).map(function(t){return t.business_id;}); if(bizIds.length){ var br=await sb.from('businesses').select('id,name').in('id',bizIds); FIN._bizNames={}; (br.data||[]).forEach(function(b){FIN._bizNames[b.id]=b.name;}); } }
}
function finGo(w){ FIN.window=w; loadFinance().then(renderFinance); }
function renderFinance(){
  if(!requirePerm('analytics.view') && !requirePerm('businesses.billing')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Your role cannot access finance.</div>'; return; }
  if(FIN.data===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Aggregating revenue…</div>'; return; }
  var d = FIN.data, s = d.summary;
  var playRev = d.playRevenue||0;
  var total = (+s.subs_paid||0)+(+s.other_paid||0)+(+s.ads_revenue||0)+playRev;
  var html = '<div class="sec-head"><div class="sec-title">Finance Center</div><div class="sec-actions">'
    + [30,90,365].map(function(w){return '<button class="filter-btn'+(FIN.window===w?' on':'')+'" onclick="finGo('+w+')">'+(w===365?'1y':w+'d')+'</button>';}).join('')
    + '<button class="filter-btn" onclick="exportFinance()">Export CSV</button>'
    + '<button class="btn-refresh" onclick="loadFinance().then(renderFinance)">Refresh</button></div></div>';
  if(!s._rpc) html += '<div style="font-size:11px;color:var(--sub2);margin-bottom:12px">Using bounded client aggregation. Install <code>admin_revenue_summary</code> (ADMIN_ENTERPRISE_V2.sql) for exact totals at scale.</div>';

  html += '<div class="stats-grid">';
  html += statCard('Total Revenue','green','$'+fmt(total),'last '+d.window+' days');
  html += statCard('Subscriptions','accent','$'+fmt(s.subs_paid),'recurring income');
  html += statCard('Advertising','amber','$'+fmt(s.ads_revenue),'all-time ad spend');
  html += statCard('Legacy Off-App','blue','$'+fmt(s.other_paid),'pre-Play Billing invoices (historical)');
  html += statCard('Play Billing','green','$'+fmt(playRev),'boosts, subs & slot packs','playBilling');
  html += statCard('Legacy Failed','red',fmtCnt(s.subs_failed),'pre-Play Billing invoices (historical)');
  html += statCard('Legacy Pending','amber',fmtCnt(s.subs_pending),'pre-Play Billing invoices (historical)','businesses');
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">';
  // Monthly revenue bars
  var months = Object.keys(d.byMonth).sort();
  var maxM = Math.max.apply(null, months.map(function(m){return d.byMonth[m];}).concat([1]));
  html += '<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Monthly Revenue</div>';
  if(!months.length) html += '<div style="color:var(--sub);font-size:13px">No paid transactions in window.</div>';
  months.forEach(function(m){ html += '<div class="bar-row"><div class="bar-label">'+m+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(d.byMonth[m]/maxM*100)+'%;background:var(--green)"></div></div><div class="bar-val">$'+Math.round(d.byMonth[m])+'</div></div>'; });
  html += '</div>';
  // Plan mix
  var plans = Object.keys(d.planMix);
  var maxP = Math.max.apply(null, plans.map(function(p){return d.planMix[p];}).concat([1]));
  html += '<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Active Subscription Mix</div>';
  if(!plans.length) html += '<div style="color:var(--sub);font-size:13px">No active subscriptions.</div>';
  plans.forEach(function(p){ html += '<div class="bar-row"><div class="bar-label" style="text-transform:capitalize">'+esc(p)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(d.planMix[p]/maxP*100)+'%;background:var(--accent)"></div></div><div class="bar-val">'+d.planMix[p]+'</div></div>'; });
  html += '</div>';
  html += '</div>';

  // Top payers
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Top Paying Businesses ('+d.window+'d)</div></div>';
  if(d.topMissing) html += migrationNotice('The top-payers ranking (admin_top_payers)');
  else if(!d.top || !d.top.length) html += '<div class="empty-msg">No paid transactions in this window.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Business</th><th>Total</th><th>Payments</th></tr></thead><tbody>';
    d.top.forEach(function(t,i){ html += '<tr><td style="color:var(--sub)">'+(i+1)+'</td><td style="font-weight:600">'+esc((FIN._bizNames&&FIN._bizNames[t.business_id])||String(t.business_id).slice(0,8))+'</td><td style="font-weight:700;color:var(--green)">$'+fmt(t.total)+'</td><td style="color:var(--sub)">'+fmtCnt(t.payments)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }

  // Failed / pending payments needing action
  var problems = d.pays.filter(function(p){ return p.status==='failed'||p.status==='pending'; }).slice(0,15);
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Payments Needing Attention</div></div>';
  if(!problems.length) html += '<div class="empty-msg">No failed or pending payments in window.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Business</th><th>Amount</th><th>Type</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    problems.forEach(function(p){ html += '<tr><td style="font-size:12px;color:var(--sub)">'+esc(String(p.business_id||'').slice(0,8))+'</td><td style="font-weight:700">$'+fmt(p.amount)+'</td><td>'+esc(p.type||'—')+'</td><td><span class="badge badge-'+(p.status==='failed'?'rejected':'pending')+'">'+esc(p.status)+'</span></td><td style="color:var(--sub);font-size:12px">'+fmtDate(p.created_at)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}
function exportFinance(){
  if(!FIN.data){ return; }
  var rows = [['Business','Amount','Type','Status','Date']];
  FIN.data.pays.forEach(function(p){ rows.push([p.business_id||'', p.amount||0, p.type||'', p.status||'', p.created_at||'']); });
  downloadCSV('pamarket-finance-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  auditLog('export_finance','business_payments',null,null,{rows:rows.length-1,window:FIN.window},null);
  toast('Exported '+(rows.length-1)+' transactions');
}

// ── Billing catalogue lookups ──────────────────────────────
// Reads product data (days/extraSlots/estimatedPriceUsd) from the shared
// catalogue (js/billing-products.js — same file the customer app loads),
// never from a duplicated map here. window.H is that catalogue's namespace.
function billingProductDays(productId){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('boosts') : [];
  var p = all.find(function(x){ return x.productId===productId; });
  return p ? p.days : null;
}
function billingProductPrice(productId){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('boosts') : [];
  var p = all.find(function(x){ return x.productId===productId; });
  return p ? (p.estimatedPriceUsd||0) : 0;
}
function billingSlotPackPriceByExtraSlots(extraSlots){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('slotPacks') : [];
  var p = all.find(function(x){ return x.extraSlots===extraSlots; });
  return p ? (p.estimatedPriceUsd||0) : 0;
}

// PLAY BILLING — Google Play consumable purchase history for listing
// boosts. play_purchases is the server-side ledger written ONLY by the
// verify-play-purchase Edge Function (service-role key) — nothing here
// can ever be edited by an admin action, this view is read-only by design
// so it stays a trustworthy audit trail of what Google actually verified.
// ════════════════════════════════════════════════════════════
var PB = { rows:null, missing:false, window:30, statusFilter:'', view:'boosts' };
var PB_SUB = { rows:null, missing:false };
var PB_PACK = { rows:null, missing:false };

async function loadPlayBilling(){
  PB.rows = null;
  PB.missing = !(await hasTable('play_purchases'));
  if(!PB.missing){
    var since = new Date(Date.now()-PB.window*864e5).toISOString();
    var q = sb.from('play_purchases').select('id,user_id,listing_id,product_id,purchase_token,order_id,status,verification_error,purchase_time,expiry_time,created_at,verified_at')
      .gte('created_at', since).order('created_at',{ascending:false}).limit(500);
    if(PB.statusFilter) q = q.eq('status', PB.statusFilter);
    var r = await q;
    PB.rows = r.error ? [] : (r.data||[]);
    var uids = [...new Set(PB.rows.map(function(p){return p.user_id;}).filter(Boolean))];
    await ensureProfiles(uids);
    var lids = [...new Set(PB.rows.map(function(p){return p.listing_id;}).filter(Boolean))];
    PB._listings = {};
    if(lids.length){ var lr = await sb.from('listings').select('id,title').in('id',lids); (lr.data||[]).forEach(function(l){PB._listings[l.id]=l;}); }
  }

  PB_SUB.missing = !(await hasTable('play_subscriptions'));
  if(!PB_SUB.missing){
    var sr = await sb.from('play_subscriptions').select('id,user_id,business_id,product_id,plan_id,billing_cycle,status,subscription_state,verification_error,expiry_time,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_SUB.rows = sr.error ? [] : (sr.data||[]);
    var bizIds = [...new Set(PB_SUB.rows.map(function(s){return s.business_id;}).filter(Boolean))];
    PB_SUB._bizNames = {};
    if(bizIds.length){ var br = await sb.from('businesses').select('id,name').in('id',bizIds); (br.data||[]).forEach(function(b){PB_SUB._bizNames[b.id]=b.name;}); }
  }

  PB_PACK.missing = !(await hasTable('featured_slot_packs'));
  if(!PB_PACK.missing){
    var pr = await sb.from('featured_slot_packs').select('id,user_id,business_id,product_id,extra_slots,status,verification_error,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_PACK.rows = pr.error ? [] : (pr.data||[]);
    var bizIds2 = [...new Set(PB_PACK.rows.map(function(p){return p.business_id;}).filter(Boolean))];
    PB_PACK._bizNames = {};
    if(bizIds2.length){ var br2 = await sb.from('businesses').select('id,name').in('id',bizIds2); (br2.data||[]).forEach(function(b){PB_PACK._bizNames[b.id]=b.name;}); }
  }

  var since2 = new Date(Date.now()-30*864e5).toISOString();
  var failedCount = (PB.missing?0:await cnt('play_purchases', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_SUB.missing?0:await cnt('play_subscriptions', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_PACK.missing?0:await cnt('featured_slot_packs', function(q){ return q.eq('status','failed').gte('created_at',since2); }));
  var badgeEl = document.getElementById('badge-playFailed');
  if(badgeEl){ badgeEl.textContent = failedCount||0; badgeEl.style.display = (failedCount>0) ? '' : 'none'; }
}
function pbGo(w){ PB.window=w; loadPlayBilling().then(renderPlayBilling); }
function pbSetFilter(s){ PB.statusFilter=s; loadPlayBilling().then(renderPlayBilling); }
function pbSetView(v){ PB.view=v; renderPlayBilling(); }

  var pending  = rows.filter(function(p){return p.status==='pending';});

  html += statCard('Active Boosts','blue',fmtCnt(activeBoosts.length),'currently featured');
  html += statCard('Failed Verification','red',fmtCnt(failed.length),'rejected by Google / fraud check');
  html += statCard('Pending','amber',fmtCnt(pending.length),'awaiting verification');
  html += '</div>';

  html += '<div style="display:flex;gap:8px;margin:14px 0">'
    + ['','pending','verified','consumed','failed'].map(function(s){
        return '<button class="filter-btn'+(PB.statusFilter===s?' on':'')+'" onclick="pbSetFilter(\''+s+'\')">'+(s?s.charAt(0).toUpperCase()+s.slice(1):'All')+'</button>';
      }).join('')
    + '</div>';

  if(!rows.length){ html += '<div class="empty-msg">No Play Billing purchases in this window.</div>'; document.getElementById('mainContent').innerHTML = html; return; }

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Buyer</th><th>Listing</th><th>Product</th><th>Status</th><th>Expiry</th><th>Purchased</th><th>Order ID</th></tr></thead><tbody>';
  rows.forEach(function(p){
    var buyer = userLabel(p.user_id);
    var listing = PB._listings[p.listing_id];
    var listingLabel = listing ? esc(listing.title) : esc(String(p.listing_id||'').slice(0,8));
    var days = billingProductDays(p.product_id) || '?';
    var statusColor = { pending:'pending', verified:'active', consumed:'active', failed:'rejected' }[p.status] || 'pending';
    var expiry = p.expiry_time ? fmtDateTime(p.expiry_time) : '—';
    var expired = p.expiry_time && new Date(p.expiry_time).getTime() <= now;
    html += '<tr>';
    html += '<td style="font-size:12.5px;font-weight:600">'+esc(buyer)+'</td>';
    html += '<td style="font-size:12.5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+listingLabel+'">'+listingLabel+'</td>';
    html += '<td style="font-size:12.5px">'+days+'-day boost</td>';
    html += '<td><span class="badge badge-'+statusColor+'">'+esc(p.status)+(p.status==='failed'&&p.verification_error?' ⓘ':'')+'</span></td>';
    html += '<td style="font-size:12px;color:'+(expired?'var(--sub2)':'var(--text)')+'">'+expiry+(expired&&p.status==='consumed'?' (expired)':'')+'</td>';
    html += '<td style="font-size:12px;color:var(--sub)">'+fmtDateTime(p.created_at)+'</td>';
    html += '<td style="font-size:11px;color:var(--sub2)">'+esc(p.order_id||'—')+'</td>';
    html += '</tr>';
    if(p.status==='failed' && p.verification_error){
      html += '<tr><td colspan="7" style="font-size:11.5px;color:var(--red);padding:2px 8px 10px 8px">Reason: '+esc(p.verification_error)+'</td></tr>';
    }
  });
  html += '</tbody></table></div>';

  document.getElementById('mainContent').innerHTML = html;
}

// SECURITY CENTER — MFA · sessions · failed logins · permission matrix · RLS
// ════════════════════════════════════════════════════════════
var SEC = { sessions:null, attempts:null, mfaOn:null, sessMissing:false, attMissing:false };
async function loadSecurity(){
  SEC.sessions=null; SEC.attempts=null;
  var res = await Promise.allSettled([
    hasTable('admin_sessions') ? sb.from('admin_sessions').select('*').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(30) : Promise.resolve({error:{missing:true}}),
    hasTable('admin_login_attempts') ? sb.from('admin_login_attempts').select('*').order('created_at',{ascending:false}).limit(40) : Promise.resolve({error:{missing:true}}),
    sb.from('profiles').select('mfa_secret').eq('id',_adminUid).single()
  ]);
  SEC.sessMissing = !(await hasTable('admin_sessions'));
  SEC.attMissing  = !(await hasTable('admin_login_attempts'));
  SEC.sessions = (res[0].value&&res[0].value.data)||[];
  SEC.attempts = (res[1].value&&res[1].value.data)||[];
  SEC.mfaOn = !!(res[2].value&&res[2].value.data&&res[2].value.data.mfa_secret);
  await ensureProfiles(SEC.sessions.map(function(s){return s.admin_id;}));
}
function renderSecurity(){
  if(!requirePerm('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Security Center is restricted to full admins.</div>'; return; }
  if(SEC.sessions===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading security data…</div>'; return; }
  var recentFails = (SEC.attempts||[]).filter(function(a){ return !a.ok && (Date.now()-new Date(a.created_at).getTime())<24*3600e3; }).length;

  var html = '<div class="sec-head"><div class="sec-title">Security Center</div><button class="btn-refresh" onclick="loadSecurity().then(renderSecurity)">Refresh</button></div>';
  html += '<div class="stats-grid">';
  html += (SEC.mfaOn ? '<div class="stat-card green"><div class="stat-label">Your MFA</div><div class="stat-val" style="font-size:16px">Enabled</div><div class="stat-sub">TOTP active</div></div>'
                     : '<div class="stat-card red"><div class="stat-label">Your MFA</div><div class="stat-val" style="font-size:16px">Off</div><div class="stat-sub">enable it below</div></div>');
  html += statCard('Active Sessions','blue',SEC.sessMissing?'—':fmtCnt(SEC.sessions.length),'admin devices online');
  html += statCard('Failed Logins 24h','red',SEC.attMissing?'—':fmtCnt(recentFails),'brute-force signal');
  html += statCard('Banned Users','amber',fmtCnt(COUNTS.banned),'platform-wide');
  html += '</div>';

  // MFA enrolment
  html += '<div class="tbl-wrap" style="padding:18px;margin-bottom:16px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">Two-Factor Authentication</div>';
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:12px">TOTP (Google Authenticator, Authy, 1Password). Verified in-browser via RFC 6238 — the secret is stored on your profile and required at every login once enabled.</div>';
  if(SEC.mfaOn){ html += '<button class="ab ab-reject" style="padding:9px 16px" onclick="disableMFA()">Disable my MFA</button>'; }
  else { html += '<button class="btn-send" onclick="enrollMFA()">Enable MFA for my account</button>'; }
  html += '</div>';

  // Permission matrix
  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:16px 0 10px;font-size:14px;font-weight:800">Role Permission Matrix</div>';
  html += '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Permission</th>'+ADMIN_ROLES.map(function(r){return '<th style="text-align:center;font-size:10px">'+r.replace('_',' ')+'</th>';}).join('')+'</tr></thead><tbody>';
  var allPerms = ['listings.moderate','reviews.moderate','reports.manage','verifications.manage','rentals.moderate','users.warn','users.view','chats.view','notifications.send','contacts.manage','ads.manage','businesses.billing','analytics.view'];
  allPerms.forEach(function(p){
    html += '<tr><td style="font-family:monospace;font-size:11px">'+esc(p)+'</td>';
    ADMIN_ROLES.forEach(function(role){
      var perms = ROLE_PERMS[role]||[];
      var has = perms.indexOf('*')!==-1 || perms.indexOf(p)!==-1;
      html += '<td style="text-align:center">'+(has?'<span style="color:var(--green);font-weight:800">✓</span>':'<span style="color:var(--sub2)">–</span>')+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div><div style="font-size:11px;color:var(--sub2);padding:8px 0 14px">Client-side gate shown here mirrors server RLS. Grant matching table policies from ADMIN_ENTERPRISE_UPGRADE.sql to let non-admin roles write.</div></div>';

  // Active sessions
  html += '<div class="sec-head"><div class="sec-title">Active Admin Sessions</div></div>';
  if(SEC.sessMissing) html += migrationNotice('Session tracking');
  else if(!SEC.sessions.length) html += '<div class="empty-msg">No active sessions recorded.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Admin</th><th>Device</th><th>Started</th><th>Last seen</th><th></th></tr></thead><tbody>';
    SEC.sessions.forEach(function(s){
      var isMe = s.id===_sessionId;
      html += '<tr><td style="font-weight:600">'+esc(s.admin_email||userLabel(s.admin_id))+(isMe?' <span class="badge badge-active">this device</span>':'')+'</td>'
