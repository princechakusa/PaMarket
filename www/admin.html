// FINANCE CENTER — revenue streams, refunds, failed payments, top payers
// Prefers server-side RPC (admin_revenue_summary / admin_top_payers). Falls
// back to bounded row queries if the RPCs aren't installed.
// ════════════════════════════════════════════════════════════
var FIN = { data:null, window:30 };
async function loadFinance(){
  FIN.data = null;
  var win = FIN.window;
  var rev = await rpc('admin_revenue_summary', {days:win});
  var top = await rpc('admin_top_payers', {days:win, lim:10});
  var since = new Date(Date.now()-win*864e5).toISOString();
  // Fallbacks + supplementary data always fetched with tight bounds.
  var playTable = await hasTable('play_purchases');
  var packTable = await hasTable('featured_slot_packs');
  var extra = await Promise.allSettled([
    sb.from('business_payments').select('amount,status,type,created_at,business_id').gte('created_at',since).order('created_at',{ascending:false}).limit(1500),
    sb.from('paid_ads').select('price_paid,created_at').limit(1000),
    sb.from('business_subscriptions').select('plan_id,status').eq('status','active'),
    playTable ? sb.from('play_purchases').select('product_id,status').eq('status','consumed').gte('created_at',since) : Promise.resolve({data:[]}),
    packTable ? sb.from('featured_slot_packs').select('extra_slots,status').eq('status','consumed').gte('created_at',since) : Promise.resolve({data:[]})
  ]);
  var pays = (extra[0].value&&extra[0].value.data)||[];
  var ads  = (extra[1].value&&extra[1].value.data)||[];
  var subs = (extra[2].value&&extra[2].value.data)||[];
  var playPurchases = (extra[3].value&&extra[3].value.data)||[];
  var slotPacks = (extra[4].value&&extra[4].value.data)||[];
  var playRevenue = playPurchases.reduce(function(a,p){ return a+billingProductPrice(p.product_id); }, 0)
    + slotPacks.reduce(function(a,p){ return a+billingSlotPackPriceByExtraSlots(p.extra_slots); }, 0);

  var summary;
  if(rev.data){ summary = rev.data; summary._rpc = true; }
  else {
    summary = {
      subs_paid: pays.filter(function(p){return p.status==='paid'&&p.type==='subscription';}).reduce(function(a,p){return a+(+p.amount||0);},0),
      other_paid: pays.filter(function(p){return p.status==='paid'&&p.type!=='subscription';}).reduce(function(a,p){return a+(+p.amount||0);},0),
      ads_revenue: ads.reduce(function(a,x){return a+(+x.price_paid||0);},0),
      subs_failed: pays.filter(function(p){return p.status==='failed';}).length,
      subs_pending: pays.filter(function(p){return p.status==='pending';}).length,
      txn_count: pays.length, _rpc:false
    };
  }
  // Plan mix (active subscriptions).
  var planMix = {}; subs.forEach(function(s){ planMix[s.plan_id]=(planMix[s.plan_id]||0)+1; });
  // Monthly revenue series from the paid rows we have.
  var byMonth = {};
  pays.filter(function(p){return p.status==='paid';}).forEach(function(p){ var k=(p.created_at||'').slice(0,7); byMonth[k]=(byMonth[k]||0)+(+p.amount||0); });

  FIN.data = { summary:summary, top:(top.data||null), topMissing:!!top.missing, pays:pays, planMix:planMix, byMonth:byMonth, window:win, playRevenue:playRevenue };
  await ensureProfiles((FIN.data.top||[]).map(function(t){return t.business_id;}));  // best-effort (business ids, not profiles)
  if(FIN.data.top){ var bizIds=(FIN.data.top||[]).map(function(t){return t.business_id;}); if(bizIds.length){ var br=await sb.from('businesses').select('id,name').in('id',bizIds); FIN._bizNames={}; (br.data||[]).forEach(function(b){FIN._bizNames[b.id]=b.name;}); } }
}
function finGo(w){ FIN.window=w; loadFinance().then(renderFinance); }
function renderFinance(){
  if(!requirePerm('analytics.view') && !requirePerm('businesses.billing')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Your role cannot access finance.</div>'; return; }
  if(FIN.data===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Aggregating revenue…</div>'; return; }
  var d = FIN.data, s = d.summary;
  var playRev = d.playRevenue||0;
  var total = (+s.subs_paid||0)+(+s.other_paid||0)+(+s.ads_revenue||0)+playRev;
  var html = '<div class="sec-head"><div class="sec-title">Finance Center</div><div class="sec-actions">'

    + '<button class="filter-btn" onclick="exportFinance()">Export CSV</button>'

  if(!s._rpc) html += '<div style="font-size:11px;color:var(--sub2);margin-bottom:12px">Using bounded client aggregation. Install <code>admin_revenue_summary</code> (ADMIN_ENTERPRISE_V2.sql) for exact totals at scale.</div>';

  html += '<div class="stats-grid">';
  html += statCard('Total Revenue','green','$'+fmt(total),'last '+d.window+' days');
  html += statCard('Subscriptions','accent','$'+fmt(s.subs_paid),'recurring income');
  html += statCard('Advertising','amber','$'+fmt(s.ads_revenue),'all-time ad spend');
  html += statCard('Legacy Off-App','blue','$'+fmt(s.other_paid),'pre-Play Billing invoices (historical)');
  html += statCard('Play Billing','green','$'+fmt(playRev),'boosts, subs & slot packs','playBilling');
  html += statCard('Legacy Failed','red',fmtCnt(s.subs_failed),'pre-Play Billing invoices (historical)');
  html += statCard('Legacy Pending','amber',fmtCnt(s.subs_pending),'pre-Play Billing invoices (historical)','businesses');
  html += '</div>';

  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">';
  // Monthly revenue bars
  var months = Object.keys(d.byMonth).sort();
  var maxM = Math.max.apply(null, months.map(function(m){return d.byMonth[m];}).concat([1]));
  html += '<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Monthly Revenue</div>';
  if(!months.length) html += '<div style="color:var(--sub);font-size:13px">No paid transactions in window.</div>';
  months.forEach(function(m){ html += '<div class="bar-row"><div class="bar-label">'+m+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(d.byMonth[m]/maxM*100)+'%;background:var(--green)"></div></div><div class="bar-val">$'+Math.round(d.byMonth[m])+'</div></div>'; });
  html += '</div>';
  // Plan mix
  var plans = Object.keys(d.planMix);
  var maxP = Math.max.apply(null, plans.map(function(p){return d.planMix[p];}).concat([1]));
  html += '<div class="tbl-wrap" style="padding:18px"><div style="font-size:13px;font-weight:800;margin-bottom:14px">Active Subscription Mix</div>';
  if(!plans.length) html += '<div style="color:var(--sub);font-size:13px">No active subscriptions.</div>';
  plans.forEach(function(p){ html += '<div class="bar-row"><div class="bar-label" style="text-transform:capitalize">'+esc(p)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+Math.round(d.planMix[p]/maxP*100)+'%;background:var(--accent)"></div></div><div class="bar-val">'+d.planMix[p]+'</div></div>'; });
  html += '</div>';
  html += '</div>';

  // Top payers
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Top Paying Businesses ('+d.window+'d)</div></div>';
  if(d.topMissing) html += migrationNotice('The top-payers ranking (admin_top_payers)');
  else if(!d.top || !d.top.length) html += '<div class="empty-msg">No paid transactions in this window.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Business</th><th>Total</th><th>Payments</th></tr></thead><tbody>';
    d.top.forEach(function(t,i){ html += '<tr><td style="color:var(--sub)">'+(i+1)+'</td><td style="font-weight:600">'+esc((FIN._bizNames&&FIN._bizNames[t.business_id])||String(t.business_id).slice(0,8))+'</td><td style="font-weight:700;color:var(--green)">$'+fmt(t.total)+'</td><td style="color:var(--sub)">'+fmtCnt(t.payments)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }

  // Failed / pending payments needing action
  var problems = d.pays.filter(function(p){ return p.status==='failed'||p.status==='pending'; }).slice(0,15);
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Payments Needing Attention</div></div>';
  if(!problems.length) html += '<div class="empty-msg">No failed or pending payments in window.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Business</th><th>Amount</th><th>Type</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    problems.forEach(function(p){ html += '<tr><td style="font-size:12px;color:var(--sub)">'+esc(String(p.business_id||'').slice(0,8))+'</td><td style="font-weight:700">$'+fmt(p.amount)+'</td><td>'+esc(p.type||'—')+'</td><td><span class="badge badge-'+(p.status==='failed'?'rejected':'pending')+'">'+esc(p.status)+'</span></td><td style="color:var(--sub);font-size:12px">'+fmtDate(p.created_at)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}
function exportFinance(){
  if(!FIN.data){ return; }
  var rows = [['Business','Amount','Type','Status','Date']];
  FIN.data.pays.forEach(function(p){ rows.push([p.business_id||'', p.amount||0, p.type||'', p.status||'', p.created_at||'']); });
  downloadCSV('pamarket-finance-'+new Date().toISOString().slice(0,10)+'.csv', rows);
  auditLog('export_finance','business_payments',null,null,{rows:rows.length-1,window:FIN.window},null);
  toast('Exported '+(rows.length-1)+' transactions');
}

// ── Billing catalogue lookups ──────────────────────────────
// Reads product data (days/extraSlots/estimatedPriceUsd) from the shared
// catalogue (js/billing-products.js — same file the customer app loads),
// never from a duplicated map here. window.H is that catalogue's namespace.
function billingProductDays(productId){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('boosts') : [];
  var p = all.find(function(x){ return x.productId===productId; });
  return p ? p.days : null;
}
function billingProductPrice(productId){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('boosts') : [];
  var p = all.find(function(x){ return x.productId===productId; });
  return p ? (p.estimatedPriceUsd||0) : 0;
}
function billingSlotPackPriceByExtraSlots(extraSlots){
  var all = (window.H && typeof window.H.getActiveProducts==='function') ? window.H.getActiveProducts('slotPacks') : [];
  var p = all.find(function(x){ return x.extraSlots===extraSlots; });
  return p ? (p.estimatedPriceUsd||0) : 0;
}

// ════════════════════════════════════════════════════════════
// PLAY BILLING — Google Play consumable purchase history for listing
// boosts. play_purchases is the server-side ledger written ONLY by the
// verify-play-purchase Edge Function (service-role key) — nothing here
// can ever be edited by an admin action, this view is read-only by design
// so it stays a trustworthy audit trail of what Google actually verified.
// ════════════════════════════════════════════════════════════
var PB = { rows:null, missing:false, window:30, statusFilter:'', view:'boosts' };
var PB_SUB = { rows:null, missing:false };
var PB_PACK = { rows:null, missing:false };
var PB_RECRUITER = { rows:null, missing:false };
var PB_JOBCREDIT = { rows:null, missing:false };
var PB_RENTALFEAT = { rows:null, missing:false };

async function loadPlayBilling(){
  PB.rows = null;
  PB.missing = !(await hasTable('play_purchases'));
  if(!PB.missing){
    var since = new Date(Date.now()-PB.window*864e5).toISOString();
    var q = sb.from('play_purchases').select('id,user_id,listing_id,product_id,purchase_token,order_id,status,verification_error,purchase_time,expiry_time,created_at,verified_at')
      .gte('created_at', since).order('created_at',{ascending:false}).limit(500);
    if(PB.statusFilter) q = q.eq('status', PB.statusFilter);
    var r = await q;
    PB.rows = r.error ? [] : (r.data||[]);
    var uids = [...new Set(PB.rows.map(function(p){return p.user_id;}).filter(Boolean))];
    await ensureProfiles(uids);
    var lids = [...new Set(PB.rows.map(function(p){return p.listing_id;}).filter(Boolean))];
    PB._listings = {};
    if(lids.length){ var lr = await sb.from('listings').select('id,title').in('id',lids); (lr.data||[]).forEach(function(l){PB._listings[l.id]=l;}); }
  }

  PB_SUB.missing = !(await hasTable('play_subscriptions'));
  if(!PB_SUB.missing){
    var sr = await sb.from('play_subscriptions').select('id,user_id,business_id,product_id,plan_id,billing_cycle,status,subscription_state,verification_error,expiry_time,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_SUB.rows = sr.error ? [] : (sr.data||[]);
    var bizIds = [...new Set(PB_SUB.rows.map(function(s){return s.business_id;}).filter(Boolean))];
    PB_SUB._bizNames = {};
    if(bizIds.length){ var br = await sb.from('businesses').select('id,name').in('id',bizIds); (br.data||[]).forEach(function(b){PB_SUB._bizNames[b.id]=b.name;}); }
  }

  PB_PACK.missing = !(await hasTable('featured_slot_packs'));
  if(!PB_PACK.missing){
    var pr = await sb.from('featured_slot_packs').select('id,user_id,business_id,product_id,extra_slots,status,verification_error,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_PACK.rows = pr.error ? [] : (pr.data||[]);
    var bizIds2 = [...new Set(PB_PACK.rows.map(function(p){return p.business_id;}).filter(Boolean))];
    PB_PACK._bizNames = {};
    if(bizIds2.length){ var br2 = await sb.from('businesses').select('id,name').in('id',bizIds2); (br2.data||[]).forEach(function(b){PB_PACK._bizNames[b.id]=b.name;}); }
  }

  PB_RECRUITER.missing = !(await hasTable('play_recruiter_subscriptions'));
  if(!PB_RECRUITER.missing){
    var rr = await sb.from('play_recruiter_subscriptions').select('id,user_id,recruiter_id,product_id,plan_id,billing_cycle,status,verification_error,subscription_state,expiry_time,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_RECRUITER.rows = rr.error ? [] : (rr.data||[]);
    var recUids = [...new Set(PB_RECRUITER.rows.map(function(r){return r.user_id;}).filter(Boolean))];
    await ensureProfiles(recUids);
  }

  PB_JOBCREDIT.missing = !(await hasTable('job_credit_packs'));
  if(!PB_JOBCREDIT.missing){
    var jr = await sb.from('job_credit_packs').select('id,user_id,product_id,credits,status,verification_error,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_JOBCREDIT.rows = jr.error ? [] : (jr.data||[]);
    var jcUids = [...new Set(PB_JOBCREDIT.rows.map(function(p){return p.user_id;}).filter(Boolean))];
    await ensureProfiles(jcUids);
  }

  PB_RENTALFEAT.missing = !(await hasTable('rental_featured_slot_packs'));
  if(!PB_RENTALFEAT.missing){
    var fr = await sb.from('rental_featured_slot_packs').select('id,user_id,listing_id,company_id,product_id,duration_days,status,verification_error,created_at')
      .order('created_at',{ascending:false}).limit(300);
    PB_RENTALFEAT.rows = fr.error ? [] : (fr.data||[]);
    var rfUids = [...new Set(PB_RENTALFEAT.rows.map(function(p){return p.user_id;}).filter(Boolean))];
    await ensureProfiles(rfUids);
  }

  var since2 = new Date(Date.now()-30*864e5).toISOString();
  var failedCount = (PB.missing?0:await cnt('play_purchases', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_SUB.missing?0:await cnt('play_subscriptions', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_PACK.missing?0:await cnt('featured_slot_packs', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_RECRUITER.missing?0:await cnt('play_recruiter_subscriptions', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_JOBCREDIT.missing?0:await cnt('job_credit_packs', function(q){ return q.eq('status','failed').gte('created_at',since2); }))
    + (PB_RENTALFEAT.missing?0:await cnt('rental_featured_slot_packs', function(q){ return q.eq('status','failed').gte('created_at',since2); }));
  var badgeEl = document.getElementById('badge-playFailed');
  if(badgeEl){ badgeEl.textContent = failedCount||0; badgeEl.style.display = (failedCount>0) ? '' : 'none'; }
}
function pbGo(w){ PB.window=w; loadPlayBilling().then(renderPlayBilling); }

// ════════════════════════════════════════════════════════════
// SECURITY CENTER — MFA · sessions · failed logins · permission matrix · RLS
// ════════════════════════════════════════════════════════════
var SEC = { sessions:null, attempts:null, blocks:null, mfaOn:null, sessMissing:false, attMissing:false, blocksMissing:false };
async function loadSecurity(){
  SEC.sessions=null; SEC.attempts=null; SEC.blocks=null;
  var res = await Promise.allSettled([
    hasTable('admin_sessions') ? sb.from('admin_sessions').select('*').is('revoked_at',null).order('last_seen_at',{ascending:false}).limit(30) : Promise.resolve({error:{missing:true}}),
    hasTable('admin_login_attempts') ? sb.from('admin_login_attempts').select('*').order('created_at',{ascending:false}).limit(40) : Promise.resolve({error:{missing:true}}),
    sb.rpc('get_my_mfa_secret'),
    hasTable('admin_ip_blocks') ? sb.from('admin_ip_blocks').select('*').gt('until',new Date().toISOString()).order('until',{ascending:false}).limit(30) : Promise.resolve({error:{missing:true}})
  ]);
  SEC.sessMissing = !(await hasTable('admin_sessions'));
  SEC.attMissing  = !(await hasTable('admin_login_attempts'));
  SEC.blocksMissing = !(await hasTable('admin_ip_blocks'));
  SEC.sessions = (res[0].value&&res[0].value.data)||[];
  SEC.attempts = (res[1].value&&res[1].value.data)||[];
  SEC.mfaOn = !!(res[2].value&&res[2].value.data);
  SEC.blocks = (res[3].value&&res[3].value.data)||[];
  await ensureProfiles(SEC.sessions.map(function(s){return s.admin_id;}));
}
function renderSecurity(){
  if(!requirePerm('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Security Center is restricted to full admins.</div>'; return; }
  if(SEC.sessions===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading security data…</div>'; return; }
  var recentFails = (SEC.attempts||[]).filter(function(a){ return !a.ok && (Date.now()-new Date(a.created_at).getTime())<24*3600e3; }).length;

  var html = '<div class="sec-head"><div class="sec-title">Security Center</div><button class="btn-refresh" onclick="loadSecurity().then(renderSecurity)">Refresh</button></div>';
  html += '<div class="stats-grid">';
  html += (SEC.mfaOn ? '<div class="stat-card green"><div class="stat-label">Your MFA</div><div class="stat-val" style="font-size:16px">Enabled</div><div class="stat-sub">TOTP active</div></div>'
                     : '<div class="stat-card red"><div class="stat-label">Your MFA</div><div class="stat-val" style="font-size:16px">Off</div><div class="stat-sub">enable it below</div></div>');
  html += statCard('Active Sessions','blue',SEC.sessMissing?'—':fmtCnt(SEC.sessions.length),'admin devices online');
  html += statCard('Failed Logins 24h','red',SEC.attMissing?'—':fmtCnt(recentFails),'brute-force signal');
  html += statCard('Banned Users','amber',fmtCnt(COUNTS.banned),'platform-wide');
  html += '</div>';

  // MFA enrolment
  html += '<div class="tbl-wrap" style="padding:18px;margin-bottom:16px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">Two-Factor Authentication</div>';
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:12px">TOTP (Google Authenticator, Authy, 1Password). Verified in-browser via RFC 6238 — the secret is stored on your profile and required at every login once enabled.</div>';
  if(SEC.mfaOn){ html += '<button class="ab ab-reject" style="padding:9px 16px" onclick="disableMFA()">Disable my MFA</button>'; }
  else { html += '<button class="btn-send" onclick="enrollMFA()">Enable MFA for my account</button>'; }
  html += '</div>';

  // Permission matrix
  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:16px 0 10px;font-size:14px;font-weight:800">Role Permission Matrix</div>';
  html += '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Permission</th>'+ADMIN_ROLES.map(function(r){return '<th style="text-align:center;font-size:10px">'+r.replace('_',' ')+'</th>';}).join('')+'</tr></thead><tbody>';
  var allPerms = ['listings.moderate','reviews.moderate','reports.manage','verifications.manage','rentals.moderate','users.warn','users.view','chats.view','notifications.send','contacts.manage','ads.manage','businesses.billing','analytics.view'];
  allPerms.forEach(function(p){
    html += '<tr><td style="font-family:monospace;font-size:11px">'+esc(p)+'</td>';
    ADMIN_ROLES.forEach(function(role){
      var perms = ROLE_PERMS[role]||[];
      var has = perms.indexOf('*')!==-1 || perms.indexOf(p)!==-1;
      html += '<td style="text-align:center">'+(has?'<span style="color:var(--green);font-weight:800">✓</span>':'<span style="color:var(--sub2)">–</span>')+'</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div><div style="font-size:11px;color:var(--sub2);padding:8px 0 14px">Client-side gate shown here mirrors server RLS. Grant matching table policies from ADMIN_ENTERPRISE_UPGRADE.sql to let non-admin roles write.</div></div>';

  // Active sessions
  html += '<div class="sec-head"><div class="sec-title">Active Admin Sessions</div></div>';
  if(SEC.sessMissing) html += migrationNotice('Session tracking');
  else if(!SEC.sessions.length) html += '<div class="empty-msg">No active sessions recorded.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Admin</th><th>Device</th><th>Started</th><th>Last seen</th><th></th></tr></thead><tbody>';
    SEC.sessions.forEach(function(s){
      var isMe = s.id===_sessionId;
      html += '<tr><td style="font-weight:600">'+esc(s.admin_email||userLabel(s.admin_id))+(isMe?' <span class="badge badge-active">this device</span>':'')+'</td>'
        + '<td style="font-size:12px;color:var(--sub)">'+esc(s.device||parseDevice(s.user_agent))+'</td>'
        + '<td style="font-size:12px;color:var(--sub)">'+fmtDateTime(s.created_at)+'</td>'
        + '<td style="font-size:12px;color:var(--sub)">'+ago(s.last_seen_at)+' ago</td>'
        + '<td>'+(isMe?'':'<button class="ab ab-reject" onclick="revokeSession(\''+s.id+'\')">Revoke</button>')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Active IP/email blocks (server-side, from admin-login-guard)
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Active Blocks</div></div>';
  if(SEC.blocksMissing) html += migrationNotice('Active Blocks', 'migrations/admin_login_guard.sql');
  else if(!SEC.blocks || !SEC.blocks.length) html += '<div class="empty-msg">No active blocks — no brute-force activity right now.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>IP</th><th>Email</th><th>Reason</th><th>Blocked until</th></tr></thead><tbody>';
    SEC.blocks.forEach(function(b){
      html += '<tr><td style="font-family:monospace;font-size:12px">'+esc(b.ip||'—')+'</td><td style="font-size:12px">'+esc(b.email||'—')+'</td><td style="font-size:12px;color:var(--sub)">'+esc(b.reason||'—')+'</td><td style="font-size:11px;color:var(--red)">'+fmtDateTime(b.until)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Failed logins
  html += '<div class="sec-head" style="margin-top:18px"><div class="sec-title">Recent Login Attempts</div></div>';
  if(SEC.attMissing) html += migrationNotice('Login-attempt logging');
  else if(!SEC.attempts.length) html += '<div class="empty-msg">No login attempts recorded.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Email</th><th>Result</th><th>Reason</th><th>IP</th><th>Device</th><th>When</th></tr></thead><tbody>';
    SEC.attempts.forEach(function(a){
      html += '<tr><td style="font-size:12px">'+esc(a.email||'—')+'</td><td>'+(a.ok?'<span class="badge badge-active">success</span>':'<span class="badge badge-rejected">failed</span>')+'</td><td style="font-size:12px;color:var(--sub)">'+esc(a.reason||'—')+'</td><td style="font-family:monospace;font-size:11px;color:var(--sub)">'+esc(a.ip||'—')+'</td><td style="font-size:11px;color:var(--sub)">'+esc(parseDevice(a.user_agent))+'</td><td style="font-size:11px;color:var(--sub)">'+fmtDateTime(a.created_at)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // RLS verification helper
  html += '<div class="tbl-wrap" style="padding:18px;margin-top:16px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">RLS Verification</div>';
  html += '<div style="font-size:12.5px;color:var(--sub);margin-bottom:10px">Confirms row-level security is actually enforced by attempting a write the anon role must not be allowed to make.</div>';
  html += '<button class="ab ab-view" style="padding:9px 14px" onclick="verifyRLS()">Run RLS probe</button><div id="rlsResult" style="margin-top:10px;font-size:12.5px"></div></div>';

  document.getElementById('mainContent').innerHTML = html;
}
async function enrollMFA(){
  var secret = genTotpSecret();
  var uri = 'otpauth://totp/PaMarket%20Admin:'+encodeURIComponent(_adminEmail)+'?secret='+secret+'&issuer=PaMarket';
  var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(uri);
  openModal('<div class="modal-title">Enable Two-Factor Auth<button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div style="font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:12px">1. Scan this QR in your authenticator app (or enter the key manually). 2. Enter the 6-digit code to confirm.</div>'
    + '<div style="text-align:center;margin-bottom:12px"><img src="'+qr+'" style="border-radius:10px;background:#fff;padding:8px" width="180" height="180"><div style="font-family:monospace;font-size:12px;color:var(--sub);margin-top:8px;word-break:break-all">'+secret+'</div></div>'
    + '<input id="mfaConfirm" class="form-input" placeholder="123456" inputmode="numeric" style="text-align:center;font-size:18px;letter-spacing:4px">'
    + '<button class="btn-send" style="width:100%;margin-top:12px" onclick="confirmMFA(\''+secret+'\')">Verify &amp; Enable</button>');
}
async function confirmMFA(secret){
  var code = (document.getElementById('mfaConfirm')||{}).value||'';
  var ok = await verifyTOTP(secret, code.replace(/\s/g,''));
  if(!ok){ toast('Code incorrect — check your app clock and retry','error'); return; }
  try {
    await updRow('profiles', _adminUid, {mfa_secret:secret});
    auditLog('enable_mfa','profiles',_adminUid,null,null,null);
    closeModal(); toast('MFA enabled — required at next login'); loadSecurity().then(renderSecurity);
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function disableMFA(){
  if(!(await reauth('disable your two-factor authentication'))) return;
  try { await updRow('profiles', _adminUid, {mfa_secret:null}); auditLog('disable_mfa','profiles',_adminUid,null,null,null); toast('MFA disabled'); loadSecurity().then(renderSecurity); }
  catch(e){ toast('Error: '+e.message,'error'); }
}
async function revokeSession(id){
  try { await sb.from('admin_sessions').update({revoked_at:new Date().toISOString()}).eq('id',id); auditLog('revoke_session','admin_sessions',id,null,null,null); toast('Session revoked'); loadSecurity().then(renderSecurity); }
  catch(e){ toast('Error: '+e.message,'error'); }
}
// Genuine RLS probe: spins up a SEPARATE client authenticated as nothing
// (anon key, no session) — not the logged-in admin's client — and asserts
// specific reads/writes are actually DENIED. The previous version of this
// function only checked tables were reachable with the admin's own
// (privileged) session and always printed green regardless of outcome,
// which was a false assurance (found during a security audit).
async function verifyRLS(){
  var el = document.getElementById('rlsResult'); el.innerHTML='<span style="color:var(--sub)">Probing as anonymous…</span>';
  var checks = [];
  try {
    var anon = supabase.createClient(
      'https://gxgytumhknmnwspxjzxw.supabase.co',
      SUPABASE_ANON,
      { auth: { persistSession:false, autoRefreshToken:false } }
    );

    // 1) Anonymous read of profiles must be empty/blocked (owner-or-staff policy).
    var p1 = await anon.from('profiles').select('id,mfa_secret').limit(1);
    checks.push({ label:'Anonymous read of profiles', pass: !!p1.error || (p1.data||[]).length===0 });

    // 2) Anonymous read of admin_login_attempts must be empty/blocked (admin-only policy).
    var p2 = await anon.from('admin_login_attempts').select('id').limit(1);
    checks.push({ label:'Anonymous read of admin_login_attempts', pass: !!p2.error || (p2.data||[]).length===0 });

    // 3) Anonymous read of admin_ip_blocks must be empty/blocked.
    var p3 = await anon.from('admin_ip_blocks').select('id').limit(1);
    checks.push({ label:'Anonymous read of admin_ip_blocks', pass: !!p3.error || (p3.data||[]).length===0 });

    // 4) Anonymous write to profiles (impossible-looking but real attempt) must be rejected.
    var p4 = await anon.from('profiles').update({role:'admin'}).eq('id','00000000-0000-0000-0000-000000000000');
    checks.push({ label:'Anonymous write to profiles', pass: !!p4.error || !(p4.data&&p4.data.length) });

    // 5) mfa_secret column lockdown: even the logged-in admin's OWN client
    // reading another staff row's mfa_secret directly should come back null
    // (column revoked from `authenticated`) — sample any other admin row.
    var others = await sb.from('profiles').select('id').neq('id',_adminUid).in('role',ADMIN_ROLES).limit(1);
    if(others.data && others.data.length){
      var p5 = await sb.from('profiles').select('mfa_secret').eq('id',others.data[0].id).single();
      checks.push({ label:'mfa_secret column hidden from other staff', pass: !p5.data || p5.data.mfa_secret==null });
    }

    var failed = checks.filter(function(c){ return !c.pass; });
    var rows = checks.map(function(c){ return '<div>'+(c.pass?'<span style="color:var(--green)">✓</span>':'<span style="color:var(--red)">✗</span>')+' '+esc(c.label)+'</div>'; }).join('');
    el.innerHTML = rows + '<div style="margin-top:8px;font-weight:700;color:'+(failed.length?'var(--red)':'var(--green)')+'">'+(failed.length? failed.length+' check(s) FAILED — RLS gap detected.' : 'All checks passed.')+'</div>';
    auditLog('rls_probe','security',null,null,{checks:checks},null);
  } catch(e){ el.innerHTML='<span style="color:var(--red)">Probe error: '+esc(e.message)+'</span>'; }
}

// pg_cron's own run/next-run state lives in Postgres superuser-only system

// browser, so "next scheduled run" here is computed from the known fixed
// cron expression rather than read live — accurate for a static daily
// schedule, and honestly a computed estimate rather than a live cron read.
function amosNextResearchRun(){
  var now = new Date();
  var next = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), 6, 0, 0));
  if (next <= now) next.setUTCDate(next.getUTCDate()+1);
  return next;
}

function renderAmosApprovalQueue(){
  if(AMOS.missing){ document.getElementById('mainContent').innerHTML = '<div class="sec-head"><div class="sec-title">Approval Queue</div></div>' + migrationNotice('The Approval Queue','AMOS_MODULE_0_FOUNDATION.sql'); return; }
  if(AMOS.drafts===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading…</div>'; return; }
  var html = '<div class="sec-head"><div class="sec-title">Approval Queue</div><button class="btn-refresh" onclick="loadAmosApprovalQueue().then(renderAmosApprovalQueue)">Refresh</button></div>';
  if(!AMOS.drafts.length){
    html += '<div class="empty-msg">Nothing waiting on review. Every AI-generated draft — Facebook, Instagram, LinkedIn, X, blog, push, and email — lands here with status \'draft\' and stays here until an admin approves, edits, or rejects it. Nothing publishes automatically.</div>';
  } else {
    // Group by content item so the 7 placements for one idea review together.
    var byItem = {};
    AMOS.drafts.forEach(function(d){
      var key = d.content_item_id;
      (byItem[key] = byItem[key] || []).push(d);
    });
    Object.keys(byItem).forEach(function(itemId){
      var group = byItem[itemId];
      var item = group[0].amos_content_items || {};
      html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:14px">';
      html += '<div style="padding:16px 0 10px;border-bottom:1px solid var(--border)">';
      html += '<div style="font-size:14px;font-weight:800">'+esc(item.title||'Untitled')+' <span style="font-weight:400;font-size:11.5px;color:var(--sub)">· '+group.length+' placement(s)</span></div>';
      html += '<div style="margin-top:4px;font-size:11px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap">';
      if(item.category) html += '<span class="badge badge-pending" style="text-transform:capitalize">'+esc(item.category)+'</span>';
      if(item.campaign_type) html += '<span class="badge badge-pending" style="text-transform:capitalize">'+esc(item.campaign_type)+'</span>';
      if(item.country_code) html += '<span class="badge badge-pending">'+esc(item.country_code)+'</span>';
      if(item.target_audience) html += '<span style="color:var(--sub)">Audience: '+esc(item.target_audience)+'</span>';
      html += '</div></div>';
      group.forEach(function(d){
        var expanded = AMOS_EXPANDED_DRAFT===d.id;
        html += '<div style="padding:12px 0;border-bottom:1px solid var(--border)">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer" onclick="toggleAmosDraft(\''+d.id+'\')">';
        html += '<div><span class="badge badge-pending" style="text-transform:capitalize">'+esc(d.channel)+'</span> <span style="font-size:11.5px;color:var(--sub);margin-left:6px">'+esc(d.draft_type)+(d.status==='edited'?' · edited':'')+' · '+ago(d.created_at)+' ago</span></div>';
        html += '<div style="font-size:11px;color:var(--sub2)">'+(expanded?'▲ collapse':'▼ expand')+'</div>';
        html += '</div>';
        if(d.relevance_score!=null || d.brand_alignment_score!=null || d.engagement_prediction_score!=null){
          html += '<div style="display:flex;gap:12px;margin-top:6px;font-size:10.5px;color:var(--sub)">';
          if(d.relevance_score!=null) html += '<span>Relevance <b style="color:'+scoreColor(d.relevance_score)+'">'+d.relevance_score+'</b></span>';
          if(d.brand_alignment_score!=null) html += '<span>Brand fit <b style="color:'+scoreColor(d.brand_alignment_score)+'">'+d.brand_alignment_score+'</b></span>';
          if(d.engagement_prediction_score!=null) html += '<span>Engagement <b style="color:'+scoreColor(d.engagement_prediction_score)+'">'+d.engagement_prediction_score+'</b></span>';
          if(d.seo_value_score!=null && d.seo_value_score>0) html += '<span>SEO <b style="color:'+scoreColor(d.seo_value_score)+'">'+d.seo_value_score+'</b></span>';
          html += '</div>';
        }
        if(expanded){
          html += '<div style="margin-top:10px">';
          html += '<textarea id="amosDraftBody_'+d.id+'" class="search-input" style="width:100%;min-height:140px;resize:vertical;font-family:inherit;white-space:pre-wrap">'+esc(d.body||'')+'</textarea>';
          if(d.performance_rationale) html += '<div style="font-size:11.5px;color:var(--sub);margin-top:8px"><b>Why this should perform well:</b> '+esc(d.performance_rationale)+'</div>';
          if(d.hashtags && d.hashtags.length) html += '<div style="font-size:11.5px;color:var(--sub);margin-top:4px"><b>Hashtags:</b> '+esc(d.hashtags.join(' '))+'</div>';
          html += '<div style="font-size:10.5px;color:var(--sub2);margin-top:6px">'+esc(d.ai_provider||'')+(d.ai_model?' · '+esc(d.ai_model):'')+(d.prompt_version?' · prompt '+esc(d.prompt_version):'')+'</div>';
          html += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">';
          html += '<button class="ab ab-approve" onclick="approveAmosDraft(\''+d.id+'\')">Approve</button>';
          html += '<button class="ab ab-view" onclick="saveAmosDraftEdit(\''+d.id+'\')">Save Edit</button>';
          html += '<button class="ab ab-reject" onclick="rejectAmosDraft(\''+d.id+'\')">Reject</button>';
          html += '</div></div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
  }
  document.getElementById('mainContent').innerHTML = html;
}
function toggleAmosDraft(id){
  AMOS_EXPANDED_DRAFT = (AMOS_EXPANDED_DRAFT===id) ? null : id;
  renderAmosApprovalQueue();
}
function findAmosDraft(id){
  return (AMOS.drafts||[]).find(function(d){ return d.id===id; });
}
// Writes one amos_content_feedback row per approve/edit/reject action —
// the pre-publish training signal for a future Learning Engine (deletes
// are covered separately by a DB trigger, AMOS_MODULE_2_QUALITY_LAYER.sql,
// so they're preserved even if a row is removed outside this UI).
async function recordAmosFeedback(action, d, extra){
  var item = d.amos_content_items || {};
  var uid = (await sb.auth.getUser()).data.user;
  var row = Object.assign({
    draft_id: d.id, content_item_id: d.content_item_id, action: action,
    channel: d.channel, draft_type: d.draft_type, category: item.category||null, topic: item.title||null,
    ai_provider: d.ai_provider, ai_model: d.ai_model, prompt_version: d.prompt_version,
    relevance_score: d.relevance_score, brand_alignment_score: d.brand_alignment_score,
    engagement_prediction_score: d.engagement_prediction_score, seo_value_score: d.seo_value_score,
    before_body: d.body, actor_id: uid?uid.id:null, actor_email: _adminEmail||null
  }, extra||{});
  try { await sb.from('amos_content_feedback').insert(row); } catch(e){ /* best effort — never blocks the actual action */ }
}
async function approveAmosDraft(id){
  if(!requirePerm('*')) return;
  var d = findAmosDraft(id);
  if(!d) return;
  var uid = (await sb.auth.getUser()).data.user;
  var r = await sb.from('amos_content_drafts').update({ status:'approved', reviewed_by: uid?uid.id:null, reviewed_at:new Date().toISOString() }).eq('id',id).eq('status', d.status);
  if(r.error){ toast('Error: '+r.error.message,'error'); return; }
  auditLog('approve_amos_draft','amos_content_drafts',id,{status:d.status},{status:'approved'},null);
  recordAmosFeedback('approved', d, {});
  toast('Draft approved — ready to schedule (Module 4 adds actual publishing)');
  AMOS_EXPANDED_DRAFT = null;
  loadAmosApprovalQueue().then(renderAmosApprovalQueue);
}
async function rejectAmosDraft(id){
  if(!requirePerm('*')) return;
  var d = findAmosDraft(id);
  if(!d) return;
  var reason = await confirm2('Reject Draft','Reason (optional)','Reject','red',true,'e.g. off-brand tone, factual issue');
  if(reason===null) return;
  var uid = (await sb.auth.getUser()).data.user;
  var r = await sb.from('amos_content_drafts').update({ status:'rejected', reviewed_by: uid?uid.id:null, reviewed_at:new Date().toISOString() }).eq('id',id).eq('status', d.status);
  if(r.error){ toast('Error: '+r.error.message,'error'); return; }
  if(reason){
    await sb.from('amos_content_revisions').insert({ draft_id:id, edited_by: uid?uid.id:null, before_body:d.body, after_body:d.body, reason: reason });
  }
  auditLog('reject_amos_draft','amos_content_drafts',id,{status:d.status},{status:'rejected'},reason);
  recordAmosFeedback('rejected', d, {reason: reason||null});
  toast('Draft rejected');
  AMOS_EXPANDED_DRAFT = null;
  loadAmosApprovalQueue().then(renderAmosApprovalQueue);
}
async function saveAmosDraftEdit(id){
  if(!requirePerm('*')) return;
  var d = findAmosDraft(id);
  if(!d) return;
  var textarea = document.getElementById('amosDraftBody_'+id);
  if(!textarea) return;
  var newBody = textarea.value;
  if(newBody === d.body){ toast('No changes to save'); return; }
  var uid = (await sb.auth.getUser()).data.user;
  var r = await sb.from('amos_content_drafts').update({ body:newBody, status:'edited', version:(d.version||1)+1 }).eq('id',id).select().maybeSingle();
  if(r.error){ toast('Error: '+r.error.message,'error'); return; }
  await sb.from('amos_content_revisions').insert({ draft_id:id, edited_by: uid?uid.id:null, before_body:d.body, after_body:newBody, reason:'manual edit before approval' });
  auditLog('edit_amos_draft','amos_content_drafts',id,{body:d.body},{body:newBody},null);
  recordAmosFeedback('edited', d, {after_body: newBody, reason:'manual edit before approval'});
  toast('Edit saved');
  loadAmosApprovalQueue().then(renderAmosApprovalQueue);
}

async function runAmosResearchNow(){
  if(!requirePerm('*')) return;
  var btns = [document.getElementById('amosRunResearchBtn'), document.getElementById('amosDashRunBtn')].filter(Boolean);
  btns.forEach(function(b){ b.disabled = true; b.dataset.origText = b.textContent; b.textContent = 'Running…'; });
  try {
    var session = (await sb.auth.getSession()).data.session;
    if(!session){ toast('Session expired — please log in again','error'); return; }
    var res = await fetch(SUPABASE_URL + '/functions/v1/amos-research-runner', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + session.access_token }
    });
    var body = await res.json().catch(function(){ return {}; });
    if(!res.ok && res.status!==207){ toast('Error: '+(body.error||('Server responded '+res.status)),'error'); return; }
    toast((body.search_gaps_found||0)+' search gap(s), '+(body.calendar_signals_written||0)+' calendar signal(s) collected'+(body.errors&&body.errors.length?' (with '+body.errors.length+' error(s) — see Audit Trail)':''));
    if(currentTab==='amosHealth') loadAmosHealth().then(renderAmosHealth);
  } catch(e){ toast('Error: '+e.message,'error'); }
  finally { btns.forEach(function(b){ b.disabled = false; b.textContent = b.dataset.origText||'Run Now'; }); }
}
async function runAmosContentGenerationNow(){
  if(!requirePerm('*')) return;
  var btn = document.getElementById('amosDashGenBtn');
  if(btn){ btn.disabled = true; btn.dataset.origText = btn.textContent; btn.textContent = 'Generating…'; }
  try {
    var session = (await sb.auth.getSession()).data.session;
    if(!session){ toast('Session expired — please log in again','error'); return; }
    var res = await fetch(SUPABASE_URL + '/functions/v1/amos-content-generator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON, 'Authorization': 'Bearer ' + session.access_token }
    });
    var body = await res.json().catch(function(){ return {}; });
    if(!res.ok && res.status!==207){ toast('Error: '+(body.error||('Server responded '+res.status)),'error'); return; }
    if(body.drafts_written){
      toast('Generated '+body.drafts_written+' draft(s) for "'+(body.topic_selected||'topic')+'"'+(body.placements_failed&&body.placements_failed.length?' ('+body.placements_failed.length+' placement(s) failed — see Audit Trail)':''));
    } else {
      toast('No drafts generated: '+((body.errors&&body.errors[0])||'unknown error'),'error');
    }
  } catch(e){ toast('Error: '+e.message,'error'); }
  finally { if(btn){ btn.disabled = false; btn.textContent = btn.dataset.origText||'Generate Content Now'; } }
}

// ── Audit Trail (AMOS slice of admin_audit_logs, plus the full job_runs
//    history for every amos-* edge function — the per-execution audit
//    record: trigger type, start time, status, data collected, error) ──
var AMOS_ENTITIES = ['amos_settings','amos_integrations','amos_content_items','amos_content_drafts','amos_schedule','amos_market_intelligence'];
async function loadAmosAudit(){
  AMOS.auditMissing = !(await hasTable('admin_audit_logs'));
  var res = await Promise.allSettled([
    AMOS.auditMissing ? Promise.resolve({data:[]}) : sb.from('admin_audit_logs').select('*').in('entity',AMOS_ENTITIES).order('created_at',{ascending:false}).limit(100),
    sb.from('job_runs').select('*').ilike('job','amos_%').order('created_at',{ascending:false}).limit(80)
  ]);
  AMOS.audit = (res[0].value && res[0].value.data) || [];
  AMOS.researchRunHistory = (res[1].value && res[1].value.data) || [];
}
function renderAmosAudit(){
  if(!requirePerm('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">Audit Trail is restricted to full admins.</div>'; return; }
  if(AMOS.audit===null){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading…</div>'; return; }
  var html = '<div class="sec-head"><div class="sec-title">AMOS Audit Trail</div><button class="btn-refresh" onclick="loadAmosAudit().then(renderAmosAudit)">Refresh</button></div>';

  html += '<div class="sec-head" style="margin-top:0"><div class="sec-title" style="font-size:13px">Automated Job Execution Record</div></div>';
  html += '<div style="font-size:11px;color:var(--sub2);padding:0 0 12px">One row per amos-research-runner or amos-content-generator execution — every cron and manual run, whether it succeeded or failed.</div>';
  if(!(AMOS.researchRunHistory||[]).length) html += '<div class="empty-msg">No automated job runs recorded yet.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Job</th><th>Trigger</th><th>Started</th><th>Status</th><th>Data Collected</th><th>Error</th></tr></thead><tbody>';
    AMOS.researchRunHistory.forEach(function(r){
      var trig = r.trigger_type ? esc(r.trigger_type) : '—';
      var started = r.started_at ? fmtDateTime(r.started_at) : fmtDateTime(r.created_at);
      html += '<tr><td style="font-family:monospace;font-size:11.5px">'+esc(r.job)+'</td><td>'+trig+'</td><td style="font-size:12px;color:var(--sub)">'+started+'</td><td>'+(r.ok?'<span class="badge badge-active">success</span>':'<span class="badge badge-rejected">failed</span>')+'</td><td style="font-size:12px">'+esc(r.detail||'—')+'</td><td style="font-size:12px;color:var(--red)">'+(r.ok?'—':esc((r.meta&&r.meta.errors&&r.meta.errors.join('; '))||r.detail||'—'))+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  html += '<div class="sec-head"><div class="sec-title" style="font-size:13px">Admin Actions</div></div>';
  if(AMOS.auditMissing) html += migrationNotice('Audit logging','ADMIN_ENTERPRISE_UPGRADE.sql');
  else if(!AMOS.audit.length) html += '<div class="empty-msg">No AMOS actions logged yet. Every settings change, approval, rejection, manual research trigger, and publish is recorded here via the same audit log used across the rest of the admin panel.</div>';
  else {
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Entity</th></tr></thead><tbody>';
    AMOS.audit.forEach(function(a){
      html += '<tr><td style="font-size:12px;color:var(--sub)">'+fmtDateTime(a.created_at)+'</td><td style="font-size:12px">'+esc(a.actor_email||a.actor_id||'system')+'</td><td>'+esc(a.action)+'</td><td style="font-family:monospace;font-size:12px">'+esc(a.entity)+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('mainContent').innerHTML = html;
}

// ── AI Configuration ────────────────────────────────────────
async function loadAmosSettings(){
  if(await amosMissing()) return;
  var r = await sb.from('amos_settings').select('*').eq('country_code','ZW').maybeSingle();
  AMOS.settings = r.data || { country_code:'ZW', approval_required:true, ai_provider:'anthropic', video_provider:'google_veo', brand_voice:{} };
}
function renderAmosSettings(){
  if(!requirePerm('*')){ document.getElementById('mainContent').innerHTML='<div class="empty-msg">AI Configuration is restricted to full admins.</div>'; return; }
  if(AMOS.missing){ document.getElementById('mainContent').innerHTML = '<div class="sec-head"><div class="sec-title">AI Configuration</div></div>' + migrationNotice('AI Configuration','AMOS_MODULE_0_FOUNDATION.sql'); return; }
  if(!AMOS.settings){ document.getElementById('mainContent').innerHTML='<div class="loading-msg">Loading…</div>'; return; }
  var s = AMOS.settings;
  var html = '<div class="sec-head"><div class="sec-title">AI Configuration</div></div>';

  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:18px 0 12px;font-size:15px;font-weight:800;border-bottom:1px solid var(--border)">Publishing</div>';
  html += '<div class="setting-row"><div class="setting-info"><div class="setting-title">Require Approval Before Publishing</div><div class="setting-desc">Every generated item enters the Approval Queue first. Turn off to auto-publish selected campaign types once you trust the pipeline.</div></div>';
  html += '<label class="toggle"><input type="checkbox" '+(s.approval_required!==false?'checked':'')+' onchange="saveAmosSetting(\'approval_required\',this.checked)"><span class="toggle-slider"></span></label></div>';
  html += '<div class="setting-row"><div class="setting-info"><div class="setting-title">Daily Batch</div><div class="setting-desc">Auto-run the daily research + content batch. Off until the research/generation modules are live.</div></div>';
  html += '<label class="toggle"><input type="checkbox" '+(s.daily_batch_enabled?'checked':'')+' disabled><span class="toggle-slider"></span></label></div>';
  html += '</div>';

  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:18px 0 12px;font-size:15px;font-weight:800;border-bottom:1px solid var(--border)">AI Providers</div>';
  html += '<div class="setting-row"><div class="setting-info"><div class="setting-title">Content &amp; Copy — Anthropic Claude</div><div class="setting-desc">Primary AI brain for all generated text. Additional providers (e.g. OpenAI) can be added later without changing this schema — nothing to configure until then.</div></div><span class="badge badge-active">active</span></div>';
  html += '<div class="setting-row"><div class="setting-info"><div class="setting-title">Video Generation — Google Veo</div><div class="setting-desc">Primary video provider. Pika/Runway/Canva remain available as fallback providers in the architecture, not wired yet.</div></div><span class="badge badge-active">active</span></div>';
  html += '</div>';

  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:18px 0 12px;font-size:15px;font-weight:800;border-bottom:1px solid var(--border)">Brand Voice</div>';
  html += '<div style="padding:12px 0;font-size:12.5px;color:var(--sub)">Tone: '+esc((s.brand_voice&&s.brand_voice.tone||[]).join(', ')||'—')+'</div>';
  html += '<div style="padding:0 0 16px;font-size:12.5px;color:var(--sub)">Avoid: '+esc((s.brand_voice&&s.brand_voice.avoid||[]).join(', ')||'—')+'</div>';
  html += '</div>';

  html += '<div class="tbl-wrap" style="padding:0 18px;margin-bottom:16px"><div style="padding:18px 0 12px;font-size:15px;font-weight:800;border-bottom:1px solid var(--border)">Weekly Report Recipients</div>';
  html += '<div style="padding:12px 0;display:flex;gap:8px"><input id="amosReportRecipients" class="search-input" style="flex:1;width:auto" value="'+esc((s.report_recipients||[]).join(', '))+'" placeholder="founder@pamarketzw.com, ceo@pamarketzw.com"><button class="ab ab-view" onclick="saveAmosReportRecipients()">Save</button></div>';
  html += '</div>';

  document.getElementById('mainContent').innerHTML = html;
}
async function saveAmosSetting(field, value){
  if(!requirePerm('*')) return;
  var before = AMOS.settings ? AMOS.settings[field] : null;
  var r = await sb.from('amos_settings').update({ [field]: value, updated_at: new Date().toISOString() }).eq('country_code','ZW').select().maybeSingle();
  if(r.error){ toast('Error: '+r.error.message,'error'); return; }
  AMOS.settings = r.data;
  auditLog('update_amos_setting','amos_settings','ZW',{[field]:before},{[field]:value},null);
  toast('Saved');
}
async function saveAmosReportRecipients(){
  if(!requirePerm('*')) return;
  var raw = document.getElementById('amosReportRecipients').value;
  var list = raw.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var before = AMOS.settings ? AMOS.settings.report_recipients : null;
  var r = await sb.from('amos_settings').update({ report_recipients:list, updated_at:new Date().toISOString() }).eq('country_code','ZW').select().maybeSingle();
  if(r.error){ toast('Error: '+r.error.message,'error'); return; }
  AMOS.settings = r.data;
  auditLog('update_amos_setting','amos_settings','ZW',{report_recipients:before},{report_recipients:list},null);
  toast('Report recipients saved');
}

// Keyboard shortcut: press / to focus the current tab's search box.
document.addEventListener('keydown', function(e){
  if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')){
    var box = document.querySelector('#mainContent .search-input');

});

// ── Session init ──────────────────────────────────────────
(async function init(){
  if(!sb){ document.getElementById('loginWrap').style.display='flex'; return; }
  try {
    var res = await sb.auth.getSession();
    if(res.data && res.data.session && res.data.session.user) {
      var uid = res.data.session.user.id;
      var pr = await sb.from('profiles').select('role,name,email').eq('id',uid).single();
      if(!pr.error && pr.data && ADMIN_ROLES.indexOf(pr.data.role)!==-1) {
        _adminEmail = res.data.session.user.email || pr.data.email || '';
        ADMIN_ROLE = pr.data.role;
        _adminUid = uid;
        startAdminSession();
        document.getElementById('sidebarUser').textContent = (pr.data.name || _adminEmail) + (ADMIN_ROLE!=='admin' ? ' ('+ADMIN_ROLE+')' : '');
        showDash();
        return;
      } else {
        await sb.auth.signOut();
      }
    }
  } catch(e){}
  document.getElementById('loginWrap').style.display='flex';
})();
</script>
