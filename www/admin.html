<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaMarket Admin</title>
<link rel="icon" type="image/png" href="img/icon-192.png">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0F172A;--card:#1E293B;--card2:#263044;--border:#334155;
  --text:#F1F5F9;--sub:#94A3B8;--sub2:#64748B;
  --accent:#6366F1;--accent2:#4F46E5;
  --green:#10B981;--amber:#F59E0B;--red:#EF4444;--blue:#3B82F6;
  --sidebar-w:220px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow-x:hidden;}
.content{min-width:0;}
.tbl-wrap{max-width:100%;}

/* ── LOGIN ── */
#loginWrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:radial-gradient(ellipse at 50% 0%,#1e1b4b 0%,var(--bg) 60%);}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:400px;box-shadow:0 25px 60px rgba(0,0,0,.6);}
.login-logo{font-size:28px;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:-1px;}
.login-logo em{font-style:normal;color:var(--accent);}
.login-sub{font-size:13px;color:var(--sub);text-align:center;margin-bottom:28px;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;color:var(--sub);margin-bottom:5px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
.fi{width:100%;padding:11px 14px;background:#0F172A;border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;font-family:inherit;}
.fi:focus{border-color:var(--accent);}
.btn-login{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s;font-family:inherit;}
.btn-login:hover{background:var(--accent2);}
.btn-login:disabled{opacity:.5;cursor:not-allowed;}
.err-box{background:rgba(239,68,68,.15);color:#FCA5A5;border:1px solid rgba(239,68,68,.4);padding:11px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;line-height:1.5;}

/* ── DASHBOARD ── */
#dash{display:none;min-height:100vh;}
.layout{display:flex;min-height:100vh;}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s;}
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-brand-name{font-size:20px;font-weight:900;letter-spacing:-.5px;}
.sidebar-brand-name em{font-style:normal;color:var(--accent);}
.sidebar-badge{font-size:10px;background:rgba(99,102,241,.2);color:var(--accent);border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:700;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;}
.nav-section{font-size:10px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.8px;padding:12px 16px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-radius:0;transition:background .15s;color:var(--sub);font-size:13px;font-weight:500;position:relative;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text);}
.nav-item.active{background:rgba(99,102,241,.15);color:var(--accent);font-weight:700;}
.nav-item.active::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-badge{background:var(--red);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:auto;}
.nav-badge.amber{background:var(--amber);}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
.sidebar-user{font-size:12px;color:var(--sub);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.btn-signout{width:100%;padding:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-signout:hover{background:rgba(239,68,68,.2);}

/* ── MAIN ── */
.main{margin-left:var(--sidebar-w);flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:800;color:var(--text);}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn-refresh{padding:7px 14px;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--sub);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-refresh:hover{background:rgba(255,255,255,.1);color:var(--text);}
.content{padding:20px 24px 40px;flex:1;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;transition:border-color .15s,transform .15s;}
.stat-card[onclick]:hover{border-color:var(--accent);transform:translateY(-2px);}
.stat-label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
.stat-val{font-size:26px;font-weight:900;color:var(--text);line-height:1;}
.stat-sub{font-size:11px;color:var(--sub);margin-top:4px;}
.stat-card.green .stat-val{color:var(--green);}
.stat-card.amber .stat-val{color:var(--amber);}
.stat-card.red .stat-val{color:var(--red);}
.stat-card.blue .stat-val{color:var(--blue);}
.stat-card.accent .stat-val{color:var(--accent);}

/* ── SECTION HEADER ── */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sec-title{font-size:15px;font-weight:800;}
.sec-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.filter-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.filter-btn.on{background:rgba(99,102,241,.15);border-color:var(--accent);color:var(--accent);}
.search-input{padding:7px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none;font-family:inherit;width:200px;}
.search-input:focus{border-color:var(--accent);}

/* ── TABLE ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 14px;font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;text-align:left;border-bottom:1px solid var(--border);background:rgba(255,255,255,.03);}
.tbl td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:rgba(255,255,255,.03);}
.tbl-thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;}
.tbl-thumb-ph{width:40px;height:40px;border-radius:8px;background:var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--sub);}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-pending{background:rgba(245,158,11,.15);color:var(--amber);}
.badge-active{background:rgba(16,185,129,.15);color:var(--green);}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--red);}
.badge-verified{background:rgba(59,130,246,.15);color:var(--blue);}
.badge-banned{background:rgba(239,68,68,.2);color:#FCA5A5;}
.badge-info{background:rgba(99,102,241,.15);color:var(--accent);}

/* ── ACTION BUTTONS ── */
.ab{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:opacity .15s;white-space:nowrap;}
.ab:hover{opacity:.8;}
.ab-approve{background:rgba(16,185,129,.15);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.ab-reject{background:rgba(239,68,68,.12);color:var(--red);border:1px solid rgba(239,68,68,.25);}
.ab-view{background:rgba(99,102,241,.12);color:var(--accent);border:1px solid rgba(99,102,241,.25);}
.ab-edit{background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.25);}
.ab-delete{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
.ab-ban{background:rgba(239,68,68,.12);color:#FCA5A5;border:1px solid rgba(239,68,68,.25);}

/* ── VERIFICATIONS ── */
.verif-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.verif-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
.verif-user{display:flex;align-items:center;gap:12px;}
.verif-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0;}
.verif-name{font-size:15px;font-weight:700;}
.verif-meta{font-size:12px;color:var(--sub);margin-top:3px;}
.verif-docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.verif-doc-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.verif-doc-label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--border);}
.verif-doc-img{width:100%;height:160px;object-fit:contain;background:#000;display:block;cursor:pointer;}
.verif-selfie{width:100%;height:160px;object-fit:cover;display:block;cursor:pointer;}
.verif-actions{display:flex;gap:10px;}
.btn-verif-approve{flex:1;padding:11px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .2s;}
.btn-verif-approve:hover{opacity:.85;}
.btn-verif-reject{flex:1;padding:11px;background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-verif-reject:hover{background:rgba(239,68,68,.25);}

/* ── NOTIFICATION FORM ── */
.notif-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:20px;}
.form-row{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.form-input{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color .2s;}
.form-input:focus{border-color:var(--accent);}
.form-select{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.form-textarea{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:inherit;resize:vertical;min-height:80px;}
.form-textarea:focus,.form-select:focus{border-color:var(--accent);}
.char-count{font-size:11px;color:var(--sub);text-align:right;margin-top:3px;}
.btn-send{padding:12px 28px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;}
.btn-send:hover{background:var(--accent2);}
.btn-send:disabled{opacity:.5;cursor:not-allowed;}
.notif-preview{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:12px;}
.notif-preview-label{font-size:10px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.notif-preview-card{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;backdrop-filter:blur(8px);}
.notif-preview-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.notif-preview-title{font-size:13px;font-weight:700;color:var(--text);}
.notif-preview-body{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4;}
.notif-preview-app{font-size:10px;color:var(--sub2);margin-top:4px;}

/* ── SETTINGS ── */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.setting-row:last-child{border-bottom:none;}
.setting-info{flex:1;padding-right:16px;}
.setting-title{font-size:14px;font-weight:600;color:var(--text);}
.setting-desc{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4;}
.toggle{position:relative;width:46px;height:26px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:background .2s;}
.toggle-slider::before{content:'';position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle input:checked+.toggle-slider{background:var(--green);}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}

/* ── MODAL ── */
#modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px;}
#modalOverlay.open{display:flex;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:24px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;color:var(--sub);cursor:pointer;font-size:20px;line-height:1;padding:2px;}
.modal-img{width:100%;border-radius:10px;margin-bottom:12px;max-height:300px;object-fit:contain;background:#000;}

/* ── TOAST ── */
#toastWrap{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:toastIn .25s ease;max-width:320px;pointer-events:auto;}
.toast.success{background:#065F46;border:1px solid var(--green);}
.toast.error{background:#7F1D1D;border:1px solid var(--red);}
.toast.info{background:#1E1B4B;border:1px solid var(--accent);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ── CONFIRM ── */
#confirmOverlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1100;display:none;align-items:center;justify-content:center;padding:16px;}
#confirmOverlay.open{display:flex;}
.confirm-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:380px;width:100%;}
.confirm-title{font-size:16px;font-weight:800;margin-bottom:8px;}
.confirm-msg{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:16px;}
.confirm-input{width:100%;padding:10px 12px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;font-family:inherit;margin-bottom:14px;}
.confirm-input:focus{border-color:var(--accent);}
.confirm-btns{display:flex;gap:10px;}
.confirm-ok{flex:1;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.confirm-cancel{flex:1;padding:11px;background:rgba(255,255,255,.06);color:var(--sub);border:1px solid var(--border);border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.confirm-ok.red{background:var(--red);}
.confirm-ok.green{background:var(--green);}

/* ── EMPTY ── */
.empty-msg{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px;}
.empty-msg svg{display:block;margin:0 auto 12px;opacity:.3;}

/* ── LOADING ── */
.loading-msg{text-align:center;padding:30px;color:var(--sub);font-size:13px;}

/* ── ANALYTICS BARS ── */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.bar-label{font-size:12px;color:var(--sub);width:120px;text-align:right;flex-shrink:0;}
.bar-track{flex:1;height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);transition:width .6s ease;}
.bar-val{font-size:12px;font-weight:700;color:var(--text);width:40px;flex-shrink:0;}

/* ── HAMBURGER (mobile) ── */
.hamburger{display:none;padding:8px;background:none;border:none;color:var(--text);cursor:pointer;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;}

/* ── MOBILE ── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:none;}
  .sidebar-overlay.open{display:block;}
  .main{margin-left:0;}
  .hamburger{display:flex;}
  .topbar{padding:12px 16px;}
  .content{padding:14px 14px 40px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .verif-docs{grid-template-columns:1fr;}
  .search-input{width:140px;}
  .tbl-wrap{overflow-x:auto;}
}
</style>
</head>
<body>

<!-- ══════════════════════════ LOGIN -->
<div id="loginWrap" style="display:none">
  <div class="login-card">
    <div class="login-logo">Pa<em>Market</em></div>
    <div class="login-sub">Admin Portal</div>
    <div class="err-box" id="errMsg"></div>
    <div class="fg">
      <label class="fl">Email</label>
      <input class="fi" id="aEmail" type="email" autocomplete="username" placeholder="admin@pamarket.co.zw">
    </div>
    <div class="fg">
      <label class="fl">Password</label>
      <input class="fi" id="aPass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn-login" id="loginBtn">Sign In</button>
  </div>
</div>

<!-- ══════════════════════════ DASHBOARD -->
<div id="dash">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="layout">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-name">Pa<em>Market</em><span class="sidebar-badge">Admin</span></div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Main</div>
        <button class="nav-item active" data-tab="overview" onclick="showTab('overview')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Overview
          <span class="nav-badge amber" id="badge-overview" style="display:none">!</span>
        </button>
        <button class="nav-item" data-tab="listings" onclick="showTab('listings')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          Listings
          <span class="nav-badge" id="badge-listings" style="display:none">0</span>
        </button>
        <button class="nav-item" data-tab="users" onclick="showTab('users')">

// ── CSV export ────────────────────────────────────────────
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(filename, rows){
  var csv = rows.map(function(r){ return r.map(csvCell).join(','); }).join('\n');
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

}

// confirm2: returns Promise<string|null>
var _confirmResolve = null;
function confirm2(title, msg, btnLabel, btnClass, withInput, inputPlaceholder) {
  return new Promise(function(resolve) {
    _confirmResolve = resolve;
    var inputHtml = withInput ? '<input class="confirm-input" id="confirmInput" placeholder="'+(inputPlaceholder||'')+'" autofocus>' : '';
    document.getElementById('confirmBox').innerHTML =
      '<div class="confirm-title">'+esc(title)+'</div>'+
      '<div class="confirm-msg">'+esc(msg)+'</div>'+
      inputHtml+
      '<div class="confirm-btns">'+
        '<button class="confirm-ok '+(btnClass||'')+'" onclick="_confirmOk()">'+esc(btnLabel||'Confirm')+'</button>'+
        '<button class="confirm-cancel" onclick="_confirmCancel()">Cancel</button>'+
      '</div>';
    document.getElementById('confirmOverlay').classList.add('open');
    if(withInput) setTimeout(function(){ var el=document.getElementById('confirmInput'); if(el) el.focus(); },100);
  });
}
function _confirmOk() {
  var input = document.getElementById('confirmInput');
  var val = input ? input.value.trim() : true;
  document.getElementById('confirmOverlay').classList.remove('open');
  if(_confirmResolve){ _confirmResolve(val); _confirmResolve=null; }
}
function _confirmCancel() {
  document.getElementById('confirmOverlay').classList.remove('open');
  if(_confirmResolve){ _confirmResolve(null); _confirmResolve=null; }
}

// ── Auth ──────────────────────────────────────────────────
var LOGIN_KEY = '_adm_fl';
var MAX_FAILS = 5;
var LOCKOUT_MS = 15 * 60 * 1000;
function getFailState(){ try{ return JSON.parse(sessionStorage.getItem(LOGIN_KEY)||'{"count":0,"until":0}'); } catch(e){ return {count:0,until:0}; } }
function saveFailState(s){ sessionStorage.setItem(LOGIN_KEY, JSON.stringify(s)); }
function recordFail(){ var s=getFailState(); s.count++; if(s.count>=MAX_FAILS) s.until=Date.now()+LOCKOUT_MS; saveFailState(s); }
function clearFails(){ sessionStorage.removeItem(LOGIN_KEY); }

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('aPass').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

async function doLogin() {
  if(!sb){ showErr('Supabase not loaded. Please refresh the page.'); return; }
  var email = document.getElementById('aEmail').value.trim();
  var pass  = document.getElementById('aPass').value;
  var errEl = document.getElementById('errMsg');
  errEl.style.display='none';
  var fs = getFailState();
  if(fs.until && Date.now()<fs.until){
    var mins=Math.ceil((fs.until-Date.now())/60000);
    showErr('Too many failed attempts. Try again in '+mins+' min'+(mins>1?'s':'.'));
    return;
  }
  if(!email||!pass){ showErr('Enter your email and password.'); return; }
  var btn=document.getElementById('loginBtn');
  btn.disabled=true; btn.textContent='Signing in…';
  try {
    var res = await sb.auth.signInWithPassword({ email:email, password:pass });
    if(res.error||!res.data||!res.data.user){ recordFail(); showErr((res.error?res.error.message:'Invalid credentials')+' ('+(MAX_FAILS-getFailState().count)+' attempts left)'); btn.disabled=false; btn.textContent='Sign In'; return; }
    var pr = await sb.from('profiles').select('role,name').eq('id',res.data.user.id).single();
    if(pr.error||!pr.data||pr.data.role!=='admin'){
      await sb.auth.signOut(); showErr('Access denied. Admin only.');
      btn.disabled=false; btn.textContent='Sign In'; return;
    }
    clearFails();
    _adminEmail = email;
    document.getElementById('sidebarUser').textContent = pr.data.name || email;
    showDash();
  } catch(e) {
    showErr('Login error: '+e.message);
    btn.disabled=false; btn.textContent='Sign In';
  }
}

function signedVUrl(path) {
  if(!path) return Promise.resolve(null);
  return sb.storage.from('verification-docs').createSignedUrl(path, 3600).then(function(r){
    return (r && r.data && r.data.signedUrl) || null;
  }).catch(function(){ return null; });
}
async function loadVerifications() {
  try {
    var r = await sb.from('verifications').select('id,user_id,id_doc,selfie,id_doc_path,selfie_path,status,submitted_at,admin_note').order('submitted_at',{ascending:false}).limit(200);
    if(r.error) { toast('Verifications load error: '+r.error.message,'error'); return; }
    if(r.data) {
      DATA.verifications = r.data;
      // Resolve signed URLs for images held in the private verification-docs bucket
      await Promise.all(r.data.map(async function(v){
        if(v.id_doc_path && !v.id_doc) v._idUrl = await signedVUrl(v.id_doc_path);
        if(v.selfie_path && !v.selfie) v._selfieUrl = await signedVUrl(v.selfie_path);
      }));
    }
  } catch(e){ toast('Verifications exception: '+e.message,'error'); }
  // Company verifications (table may not exist until the migration is run)
  try {
    var rc = await sb.from('company_verifications').select('*').order('submitted_at',{ascending:false}).limit(200);
    if(!rc.error && rc.data) {
      DATA.companyVerifications = rc.data;
      await Promise.all(rc.data.map(async function(cv){
        cv._regUrl      = await signedVUrl(cv.reg_cert_path);
        cv._ownerUrl    = await signedVUrl(cv.owner_id_path);
        cv._taxUrl      = await signedVUrl(cv.tax_cert_path);
        cv._premisesUrl = await signedVUrl(cv.premises_path);
      }));
    } else { DATA.companyVerifications = []; }
  } catch(e){ DATA.companyVerifications = []; }
}

var BIZ_PLAN_PRICES = { free: 0, starter: 9, pro: 29, premium: 79 };

function extractPlanFromDesc(desc) {
  var m = (desc||'').match(/\[([a-z0-9_]+)\]\s*$/i);
  return m ? m[1].toLowerCase() : null;
}

function renderBizUpgradeSection() {
  var pending = (DATA.bizUpgradeRequests||[]).filter(function(r){ return r.status==='pending'; });
  var recent  = (DATA.bizUpgradeRequests||[]).filter(function(r){ return r.status==='paid'||r.status==='failed'; }).slice(0,5);
  if (!pending.length && !recent.length) return '';

  var html = '<div style="background:#1E293B;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:20px">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">';
  html += '<div style="display:flex;align-items:center;gap:8px">';
  html += '<div style="background:'+(pending.length?'#F59E0B':'#334155')+';border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>';
  html += '<span style="font-size:14px;font-weight:800;color:var(--text)">Subscription Upgrade Requests</span>';
  if(pending.length) html += '<span style="background:#F59E0B;color:#000;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:800">'+pending.length+' pending</span>';
  html += '</div></div>';

  if (!pending.length) {
    html += '<div style="font-size:13px;color:var(--sub);margin-bottom:10px">No pending requests.</div>';
  }

  pending.forEach(function(req) {
    var biz = DATA.businesses.find(function(b){ return b.id===req.business_id; });
    var planId = extractPlanFromDesc(req.description);
    var planLabel = planId ? (planId.charAt(0).toUpperCase()+planId.slice(1)) : (req.description||'Unknown');
    var cleanDesc = (req.description||'').replace(/\s*\[[a-z0-9]+\]\s*$/i,'');
    html += '<div style="background:#263044;border:1px solid #FFE2A8;border-radius:12px;padding:14px;margin-bottom:8px">';
    html += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">';
    html += '<div style="min-width:0">';
    html += '<div style="font-size:13.5px;font-weight:700;color:var(--text)">'+(biz?esc(biz.name):'<span style="color:var(--sub)">Unknown Business</span>')+'</div>';
    html += '<div style="font-size:12px;color:#F59E0B;font-weight:700;margin-top:3px">Upgrade to '+esc(planLabel)+' plan</div>';
    html += '<div style="font-size:11.5px;color:var(--sub);margin-top:2px">'+esc(cleanDesc)+' &nbsp;·&nbsp; <b style="color:var(--green)">$'+fmt(req.amount||0)+'</b> &nbsp;·&nbsp; '+fmtDate(req.created_at)+'</div>';
    html += '</div>';
    html += '<div style="display:flex;gap:6px;flex-shrink:0;align-items:flex-start">';
    if(planId && BIZ_PLANS.includes(planId)) {
      html += '<button class="ab ab-approve" style="padding:7px 14px;font-size:12px" onclick="approveBizUpgrade(\''+esc(req.id)+'\',\''+esc(req.business_id)+'\',\''+esc(planId)+'\')">Approve + Activate</button>';
    }
    html += '<button class="ab ab-reject" style="padding:7px 12px;font-size:12px" onclick="declineBizUpgrade(\''+esc(req.id)+'\')">Decline</button>';
    html += '</div></div></div>';
  });

  if(recent.length) {
    html += '<div style="border-top:1px solid #334155;padding-top:12px;margin-top:4px">';
    html += '<div style="font-size:11px;font-weight:700;color:var(--sub2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Recent</div>';
    recent.forEach(function(req) {
      var biz = DATA.businesses.find(function(b){ return b.id===req.business_id; });
      var planId = extractPlanFromDesc(req.description);
      var planLabel = planId ? (planId.charAt(0).toUpperCase()+planId.slice(1)) : 'Unknown';
      var statusColor = req.status==='paid' ? 'var(--green)' : 'var(--red)';
      var statusLabel = req.status==='paid' ? 'Approved' : 'Declined';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1E293B;font-size:12px">';
      html += '<span style="color:var(--sub)">'+(biz?esc(biz.name):'Unknown')+' <span style="color:var(--text)">'+esc(planLabel)+'</span></span>';
      html += '<span style="font-weight:700;color:'+statusColor+'">'+statusLabel+'</span>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
}

async function approveBizUpgrade(paymentId, businessId, planId) {
  if(!BIZ_PLANS.includes(planId)){ toast('Unknown plan: '+planId,'error'); return; }
  var biz = DATA.businesses.find(function(b){return b.id===businessId;});
  var confirmed = await confirm2(
    'Approve Upgrade',
    'Activate '+planId.charAt(0).toUpperCase()+planId.slice(1)+' plan for '+(biz?biz.name:'this business')+'? Mark as paid and activate the subscription now.',
    'Approve + Activate', 'confirm-ok'
  );
  if(!confirmed) return;
  try {
    var rp = await sb.from('business_payments').update({status:'paid'}).eq('id',paymentId);
    if(rp.error) throw rp.error;
    await sb.from('business_subscriptions').update({status:'downgraded'}).eq('business_id',businessId).eq('status','active');
    var now = new Date(); now.setMonth(now.getMonth()+1);
    var rs = await sb.from('business_subscriptions').insert({business_id:businessId,plan_id:planId,billing_cycle:'monthly',status:'active',current_period_end:now.toISOString()});
    if(rs.error) throw rs.error;
    await sb.from('businesses').update({plan_id:planId}).eq('id',businessId);
    var req = DATA.bizUpgradeRequests.find(function(r){return r.id===paymentId;});
    if(req) req.status='paid';
    DATA.businessSubs = DATA.businessSubs.map(function(s){
      if(s.business_id===businessId&&s.status==='active') s.status='downgraded'; return s;
    });
    DATA.businessSubs.push({business_id:businessId,plan_id:planId,billing_cycle:'monthly',status:'active'});
    if(biz) biz.plan_id=planId;
    toast('Plan activated: '+(planId.charAt(0).toUpperCase()+planId.slice(1))+' for '+(biz?biz.name:'business'));
    updateBadges(); renderBusinesses();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function declineBizUpgrade(paymentId) {
  var req = DATA.bizUpgradeRequests.find(function(r){return r.id===paymentId;});
  var biz = req && DATA.businesses.find(function(b){return b.id===req.business_id;});
  var confirmed = await confirm2('Decline Request','Decline the upgrade request'+(biz?' for '+biz.name:'')+' and mark it as failed?','Decline','confirm-ok');
  if(!confirmed) return;
  try {
    var rp = await sb.from('business_payments').update({status:'failed'}).eq('id',paymentId);
    if(rp.error) throw rp.error;
    if(req) req.status='failed';
    toast('Upgrade request declined');
    updateBadges(); renderBusinesses();
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function loadBusinesses() {
  try {
    var rb = await sb.from('businesses').select('*').order('created_at',{ascending:false}).limit(500);
    DATA.businesses = (!rb.error && rb.data) ? rb.data : [];
  } catch(e){ DATA.businesses = []; }
  try {
    var rs = await sb.from('business_subscriptions').select('business_id,plan_id,billing_cycle,status,current_period_end').eq('status','active');
    DATA.businessSubs = (!rs.error && rs.data) ? rs.data : [];
  } catch(e){ DATA.businessSubs = []; }
  try {
    var rl = await sb.from('business_leads').select('business_id,status').limit(2000);
    DATA.businessLeads = (!rl.error && rl.data) ? rl.data : [];
  } catch(e){ DATA.businessLeads = []; }
  try {
    var ru = await sb.from('business_payments').select('id,business_id,type,amount,description,status,created_at').eq('type','subscription').in('status',['pending','paid','failed']).order('created_at',{ascending:false}).limit(200);
    DATA.bizUpgradeRequests = (!ru.error && ru.data) ? ru.data : [];
  } catch(e){ DATA.bizUpgradeRequests = []; }
}

function bizActivePlan(id){ var s=DATA.businessSubs.find(function(x){return x.business_id===id;}); return s?s.plan_id:'free'; }
function bizLeadCount(id){ return DATA.businessLeads.filter(function(l){return l.business_id===id;}).length; }
function bizListingCount(id){ return DATA.listings.filter(function(l){return l.business_id===id;}).length; }
function ownerName(uid){ var u=DATA.users.find(function(x){return x.id===uid;}); return u?(u.name||u.email||'—'):'—'; }

function renderBusinesses() {
  var list = DATA.businesses.filter(function(b){ return _bizFilter==='all' || (_bizFilter==='draft' ? (b.status==='draft'||b.status==='pending_activation') : b.status===_bizFilter); });
  var counts = {
    all: DATA.businesses.length,
    active: DATA.businesses.filter(function(b){return b.status==='active';}).length,
    suspended: DATA.businesses.filter(function(b){return b.status==='suspended';}).length,
    draft: DATA.businesses.filter(function(b){return b.status==='draft'||b.status==='pending_activation';}).length
  };

  var html = '<div class="sec-head"><div class="sec-title">Business Platform</div><div class="sec-actions">';
  ['all','active','suspended','draft'].forEach(function(f){
    html += '<button class="filter-btn'+((_bizFilter===f)?' on':'')+'" onclick="_bizFilter=\''+f+'\';renderBusinesses()">'+f.charAt(0).toUpperCase()+f.slice(1)+' ('+counts[f]+')</button>';
  });
  html += '<button class="btn-refresh" onclick="loadBusinesses().then(renderBusinesses)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Refresh</button>';
  html += '</div></div>';

  html += renderBizUpgradeSection();

  html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Business</th><th>Owner</th><th>Type</th><th>Plan</th><th>Verify</th><th>Listings</th><th>Leads</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
  if(!list.length){ html += '<tr><td colspan="9"><div class="empty-msg">No businesses found</div></td></tr>'; }
  list.forEach(function(b){
    var plan = bizActivePlan(b.id);
    var st = b.status||'draft';
    var stClass = st==='active'?'active':(st==='suspended'?'rejected':'pending');
    html += '<tr>';
    html += '<td style="max-width:170px"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px">'+esc(b.name||'Unnamed')+'</div><div style="color:var(--sub);font-size:11px">'+esc((b.city||'')+(b.province?', '+b.province:''))+'</div></td>';
    html += '<td style="color:var(--sub);font-size:12px">'+esc(ownerName(b.owner_user_id))+'</td>';
    html += '<td><span class="badge badge-info">'+esc(b.biz_type||'—')+'</span></td>';
    html += '<td><span class="badge badge-info" style="text-transform:capitalize">'+esc(plan)+'</span></td>';
    html += '<td><span class="badge badge-info">L'+(b.verification_level||0)+'</span></td>';
    html += '<td style="text-align:center">'+bizListingCount(b.id)+'</td>';
    html += '<td style="text-align:center">'+bizLeadCount(b.id)+'</td>';
    html += '<td><span class="badge badge-'+stClass+'">'+esc(st)+'</span></td>';
    html += '<td><div style="display:flex;gap:4px;flex-wrap:wrap">';
    html += '<button class="ab ab-view" onclick="viewBusiness(\''+b.id+'\')">View</button>';
    if(st==='suspended'||st==='pending_activation') html += '<button class="ab ab-approve" onclick="bizSetStatus(\''+b.id+'\',\'active\')">'+(st==='pending_activation'?'Approve':'Activate')+'</button>';
    if(st!=='pending_activation') html += '<button class="ab ab-reject" onclick="bizSetStatus(\''+b.id+'\',\'suspended\')">Suspend</button>';
    html += '<button class="ab ab-view" onclick="bizSetPlan(\''+b.id+'\')">Plan</button>';
    html += '<button class="ab ab-view" onclick="bizSetVerify(\''+b.id+'\')">Verify</button>';
    html += '<button class="ab ab-reject" onclick="adminDeleteBusiness(\''+b.id+'\')" style="background:rgba(239,68,68,.12);color:var(--red)">Delete</button>';
    html += '</div></td></tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('mainContent').innerHTML = html;
}

function viewBusiness(id) {
  var b = DATA.businesses.find(function(x){return x.id===id;}); if(!b) return;
  var plan = bizActivePlan(id);
  var sub = DATA.businessSubs.find(function(x){return x.business_id===id;});
  var leadsNew = DATA.businessLeads.filter(function(l){return l.business_id===id && l.status==='new';}).length;
  openModal('<div class="modal-title">'+esc(b.name||'Business')+'<button class="modal-close" onclick="closeModal()">×</button></div>'
    + '<div style="font-size:13px;color:var(--sub);line-height:1.8">'
    + '<div><b>Owner:</b> '+esc(ownerName(b.owner_user_id))+'</div>'
    + '<div><b>Type:</b> '+esc(b.biz_type||'—')+' &nbsp; <b>Category:</b> '+esc((b.category||'—').replace(/\|/g,', '))+'</div>'
    + '<div><b>Contact:</b> '+esc(b.phone||'—')+(b.email?(' · '+esc(b.email)):'')+'</div>'
    + '<div><b>Location:</b> '+esc([b.suburb,b.city,b.province].filter(Boolean).join(', ')||'—')+'</div>'
    + '<div><b>Plan:</b> '+esc(plan)+(sub&&sub.billing_cycle?(' ('+esc(sub.billing_cycle)+')'):'')+(sub&&sub.current_period_end?(' · renews '+fmtDate(sub.current_period_end)):'')+'</div>'
    + '<div><b>Verification level:</b> '+(b.verification_level||0)+'</div>'
    + '<div><b>Status:</b> '+esc(b.status||'—')+'</div>'
    + '<div><b>Listings:</b> '+bizListingCount(id)+' &nbsp; <b>Leads:</b> '+bizLeadCount(id)+' ('+leadsNew+' new)</div>'
    + '</div>'
    + (b.description?'<div style="font-size:13px;color:var(--sub);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'+esc(b.description)+'</div>':'')
    + '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">'
    + (b.status==='suspended'
        ? '<button class="btn-verif-approve" onclick="bizSetStatus(\''+id+'\',\'active\');closeModal()">Activate</button>'
        : '<button class="btn-verif-reject" onclick="bizSetStatus(\''+id+'\',\'suspended\');closeModal()">Suspend</button>')
    + '<button class="btn-verif-approve" style="background:#1A3A8F" onclick="bizSetPlan(\''+id+'\')">Override Plan</button>'
    + '</div>'
  );
}

async function bizSetStatus(id, status) {
  try {
    var r = await sb.from('businesses').update({status:status}).eq('id',id);
    if(r.error) throw r.error;
    var b = DATA.businesses.find(function(x){return x.id===id;}); if(b) b.status=status;
    renderBusinesses(); toast('Business '+status);
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function bizSetVerify(id) {
  var b = DATA.businesses.find(function(x){return x.id===id;}); if(!b) return;
  var next = ((b.verification_level||0)+1)%4;
  try {
    var r = await sb.from('businesses').update({verification_level:next}).eq('id',id);
    if(r.error) throw r.error;
    b.verification_level = next;
    renderBusinesses(); toast('Verification level set to '+next);
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function adminDeleteBusiness(id) {
  var b = DATA.businesses.find(function(x){return x.id===id;}); if(!b) return;
  openModal('<div class="modal-title">Delete Business<button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:16px">Permanently delete <strong>'+esc(b.name||'this business')+'</strong>? This cannot be undone.</div>'
    +'<div style="display:flex;gap:10px">'
    +'<button class="btn-verif-reject" style="flex:1" onclick="closeModal()">Cancel</button>'
    +'<button class="btn-verif-approve" style="flex:1;background:var(--red)" onclick="closeModal();_doDeleteBusiness(\''+id+'\')">Delete</button>'
    +'</div>'
  );
}

async function _doDeleteBusiness(id) {
  var b = DATA.businesses.find(function(x){return x.id===id;});
  try {
    var r = await sb.from('businesses').delete().eq('id',id);
    if(r.error) throw r.error;
    DATA.businesses = DATA.businesses.filter(function(x){return x.id!==id;});
    renderBusinesses(); toast('Business deleted');
  } catch(e){ toast('Error: '+(e.message||'Failed'),'error'); }
}

function bizSetPlan(id) {
  var cur = bizActivePlan(id);
  var b = DATA.businesses.find(function(x){return x.id===id;}); if(!b) return;
  var rows = BIZ_PLANS.map(function(p){
    var price = BIZ_PLAN_PRICES[p] || 0;
    var priceLabel = price===0 ? 'Free' : ('$'+price+'/mo');
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)">'
      +'<div><span style="font-size:13px;font-weight:700;color:var(--text);text-transform:capitalize">'+esc(p)+'</span>'
      +' <span style="font-size:12px;color:var(--sub)">'+priceLabel+'</span></div>'
      +(cur===p
        ? '<span class="badge badge-active">Current</span>'
        : '<button class="ab ab-approve" style="padding:6px 14px" onclick="doSetPlan(\''+id+'\',\''+p+'\')">Set</button>')
      +'</div>';
  }).join('');
  openModal('<div class="modal-title">Override Plan: '+esc(b.name||'Business')+'<button class="modal-close" onclick="closeModal()">×</button></div>'
    +'<div style="font-size:12px;color:var(--sub);margin-bottom:14px;line-height:1.5">Admin override activates the plan immediately without requiring payment. Use this to manually apply an approved plan.</div>'
    +rows
  );
}

async function doSetPlan(id, next) {
  closeModal();
  try {
    await sb.from('business_subscriptions').update({status:'downgraded'}).eq('business_id',id).eq('status','active');
    var now = new Date(); now.setMonth(now.getMonth()+1);
    var r = await sb.from('business_subscriptions').insert({business_id:id,plan_id:next,billing_cycle:'monthly',status:'active',current_period_end:now.toISOString()});
    if(r.error) throw r.error;
    await sb.from('businesses').update({plan_id:next}).eq('id',id);
    DATA.businessSubs = DATA.businessSubs.map(function(s){
      if(s.business_id===id&&s.status==='active') s.status='downgraded'; return s;
    });
    DATA.businessSubs.push({business_id:id,plan_id:next,billing_cycle:'monthly',status:'active'});
    var biz = DATA.businesses.find(function(b){return b.id===id;});
    if(biz) biz.plan_id=next;
    renderBusinesses(); toast('Plan overridden to '+next);
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function updateBadges() {
  var pendingL = DATA.listings.filter(function(l){ return l.status==='pending'; }).length;
  var pendingV = DATA.verifications.filter(function(v){ return v.status==='pending'; }).length
    + DATA.users.filter(function(u){ return u.verification_pending && !DATA.verifications.find(function(v){ return v.user_id===u.id; }); }).length
    + (DATA.companyVerifications||[]).filter(function(c){ return c.status==='pending'; }).length;
  var openR = DATA.reports.filter(function(r){ return r.status==='open'; }).length;
  var pendingC = DATA.contactRequests.filter(function(c){ return c.status==='pending'; }).length;

  function setBadge(id, count) {
    var el=document.getElementById(id); if(!el) return;
    el.textContent=count; el.style.display=count>0?'':'none';
  }
  var pendingUpgrades = (DATA.bizUpgradeRequests||[]).filter(function(r){return r.status==='pending';}).length;
  setBadge('badge-listings', pendingL);
  setBadge('badge-verif', pendingV);
  setBadge('badge-reports', openR);
  setBadge('badge-contacts', pendingC);
  setBadge('badge-biz-upgrades', pendingUpgrades);
  document.getElementById('badge-overview').style.display = (pendingL||pendingV||openR||pendingC) ? '' : 'none';
}

function renderOverview() {
  var total = DATA.users.length;
  var active = DATA.listings.filter(function(l){ return l.status==='active'; }).length;
  var pendingL = DATA.listings.filter(function(l){ return l.status==='pending'; }).length;
  var pendingV = DATA.verifications.filter(function(v){ return v.status==='pending'; }).length
    + DATA.users.filter(function(u){ return u.verification_pending && !DATA.verifications.find(function(v){ return v.user_id===u.id; }); }).length;
  var openR = DATA.reports.filter(function(r){ return r.status==='open'; }).length;
  var verified = DATA.users.filter(function(u){ return u.verified; }).length;

  var alerts = '';
  if(pendingL) alerts += alertBox('amber','<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:5px"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>'+pendingL+' listing'+(pendingL>1?'s':'')+' waiting for review.','listings');
  if(pendingV) alerts += alertBox('blue','<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:5px"><polyline points="20 6 9 17 4 12"/></svg>'+pendingV+' verification'+(pendingV>1?'s':'')+' pending.','verifications');
  if(openR) alerts += alertBox('red','<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:5px"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>'+openR+' open report'+(openR>1?'s':'')+' need attention.','reports');

  var recentListings = DATA.listings.filter(function(l){ return l.status==='pending'; }).slice(0,8);
  var recentUsers = DATA.users.slice(0,8);

  var html = '';
  html += '<div class="stats-grid">';
  html += statCard('Users','blue',total,'registered accounts','users');
  html += statCard('Active Listings','green',active,'live marketplace ads','listings');
  html += statCard('Pending Listings','amber',pendingL,'awaiting approval','listings');
  html += statCard('Pending Verifications','accent',pendingV,'ID reviews needed','verifications');
  html += statCard('Open Reports','red',openR,'need attention','reports');

function statCard(label, cls, val, sub, tab) {
  var attrs = tab ? ' onclick="showTab(\''+tab+'\')" style="cursor:pointer"' : '';
  return '<div class="stat-card '+cls+'"'+attrs+'><div class="stat-label">'+esc(label)+'</div><div class="stat-val">'+val+'</div><div class="stat-sub">'+esc(sub)+'</div></div>';
}
function alertBox(color, msg, tab) {
  var colors = {amber:'rgba(245,158,11,.15)',red:'rgba(239,68,68,.15)',blue:'rgba(59,130,246,.15)'};
  var border = {amber:'rgba(245,158,11,.3)',red:'rgba(239,68,68,.3)',blue:'rgba(59,130,246,.3)'};
  var textc = {amber:'var(--amber)',red:'var(--red)',blue:'var(--blue)'};
  return '<div style="background:'+colors[color]+';border:1px solid '+border[color]+';border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px"><span style="font-size:13px;font-weight:600;color:'+textc[color]+'">'+msg+'</span><button onclick="showTab(\''+tab+'\')" style="background:none;border:none;color:'+textc[color]+';font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline">Review →</button></div>';
}

// ── LISTINGS ──────────────────────────────────────────────
function renderListings() {

  var counts = {

    html += '<td>'+badge+'</td>';

    if(l.status==='pending'){
      html += '<button class="ab ab-approve" onclick="approveListing(\''+l.id+'\')">Approve</button>';

function viewListing(id) {
  var l = DATA.listings.find(function(x){ return x.id===id; });
  if(!l) return;
  var photos = (l.photos||[]).map(function(p){ return '<img src="'+esc(p)+'" style="width:100%;border-radius:10px;margin-bottom:8px;max-height:260px;object-fit:cover">'; }).join('');
  openModal('<div class="modal-title">'+esc(l.title)+'<button class="modal-close" onclick="closeModal()">×</button></div>'
    + photos
    + '<div style="font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:12px">'+esc(l.desc||'')+'</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<span class="badge badge-info">'+esc(l.cat||'—')+'</span>'
    + '<span class="badge badge-info">'+esc(l.city||'')+'</span>'
    + '<span class="badge badge-'+(l.status||'pending')+'">'+esc(l.status||'—')+'</span>'
    + '</div>'
    + (l.status==='pending'?'<div style="display:flex;gap:10px;margin-top:16px"><button class="btn-verif-approve" onclick="approveListing(\''+l.id+'\');closeModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> Approve</button><button class="btn-verif-reject" onclick="rejectListing(\''+l.id+'\');closeModal()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> Reject</button></div>':'')
  );
}

async function approveListing(id) {
  try {
    var r = await sb.from('listings').update({status:'active'}).eq('id',id);
    if(r.error) throw r.error;
    var l = DATA.listings.find(function(x){ return x.id===id; });
    if(l){ l.status='active'; }
    // Notify seller
    if(l && l.sellerId) {
      await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:'Listing Approved!',body:'Your listing "'+l.title+'" is now live.',type:'info',read:false,created_at:Date.now()});
    }
    updateBadges(); renderTab(); toast('Listing approved and seller notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rejectListing(id) {
  var note = await confirm2('Reject Listing','Provide a reason (optional)','Reject','red',true,'e.g. Prohibited item');
  if(note===null) return;
  try {
    var r = await sb.from('listings').update({status:'rejected'}).eq('id',id);
    if(r.error) throw r.error;
    var l = DATA.listings.find(function(x){ return x.id===id; });
    if(l){ l.status='rejected'; }
    if(l && l.sellerId) {
      await sb.from('notifications').insert({id:notifId(),user_id:l.sellerId,title:'Listing Not Approved',body:'Your listing "'+l.title+'" was not approved.'+(note?' Reason: '+note:''),type:'report',read:false,created_at:Date.now()});
    }
    updateBadges(); renderTab(); toast('Listing rejected','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function deleteListing(id) {
  var ok = await confirm2('Delete Listing','This cannot be undone.','Delete','red');
  if(!ok) return;
  try {
    var r = await sb.from('listings').delete().eq('id',id);
    if(r.error) throw r.error;
    DATA.listings = DATA.listings.filter(function(x){ return x.id!==id; });
    updateBadges(); renderTab(); toast('Listing deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function banUser(userId) {
  var reason = await confirm2('Ban User','Enter reason for ban:','Ban','red',true,'e.g. Spam, fraudulent listing');
  if(reason===null) return;
  try {
    var banUntil = new Date(Date.now()+30*24*3600*1000).toISOString();
    var r = await sb.from('profiles').update({status:'banned',ban_reason:reason||'Policy violation',ban_until:banUntil}).eq('id',userId);
    if(r.error) throw r.error;
    var u = DATA.users.find(function(x){ return x.id===userId; });
    if(u){ u.status='banned'; u.ban_reason=reason; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Suspended',body:'Your account has been suspended.'+(reason?' Reason: '+reason:''),type:'ban',read:false,created_at:Date.now()});
    renderTab(); toast('User banned and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function unbanUser(userId) {
  var ok = await confirm2('Unban User','Remove ban from this user?','Unban','green');
  if(!ok) return;
  try {
    var r = await sb.from('profiles').update({status:'active',ban_reason:null,ban_until:null}).eq('id',userId);
    if(r.error) throw r.error;
    var u = DATA.users.find(function(x){ return x.id===userId; });
    if(u){ u.status='active'; u.ban_reason=null; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Account Reinstated',body:'Your account ban has been removed. Welcome back!',type:'info',read:false,created_at:Date.now()});
    renderTab(); toast('User unbanned');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function verifyUser(userId) {
  var ok = await confirm2('Verify User','Grant verified badge to this user?','Verify','green');
  if(!ok) return;
  try {
    var r = await sb.from('profiles').update({verified:true,verification_pending:false}).eq('id',userId);
    if(r.error) throw r.error;
    var u = DATA.users.find(function(x){ return x.id===userId; });
    if(u){ u.verified=true; u.verification_pending=false; }
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Congratulations! Your blue verified badge is now active.',type:'verify',read:false,created_at:Date.now()});
    renderTab(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function msgUser(userId, name) {
  // Quick notify a specific user
  currentTab = 'notifications';
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.tab==='notifications'); });
  document.getElementById('topbarTitle').textContent = 'Send Notification';
  renderNotifications(userId);
}

// ── VERIFICATIONS ─────────────────────────────────────────
function renderVerifications() {
  // Merge: verifications table + profiles with verification_pending=true
  var verifMap = {};
  DATA.verifications.forEach(function(v){ verifMap[v.user_id]=v; });

  var pendingFromTable = DATA.verifications.filter(function(v){ return v.status==='pending'; });
  var pendingFromProfiles = DATA.users.filter(function(u){ return (u.verification_pending===true||u.verification_pending==='true'||u.verification_pending==1) && !verifMap[u.id]; });
  var approved = DATA.verifications.filter(function(v){ return v.status==='approved'; });
  var rejected = DATA.verifications.filter(function(v){ return v.status==='rejected'; });

  var cvPending = (DATA.companyVerifications||[]).filter(function(c){ return c.status==='pending'; }).length;
  var html = '<div class="stats-grid">';
  html += statCard('ID Pending','amber',pendingFromTable.length+pendingFromProfiles.length,'awaiting review');
  html += statCard('Co. Pending','accent',cvPending,'company / sole trader');
  html += statCard('Approved','green',approved.length,'identity verified');
  html += statCard('Rejected','red',rejected.length,'declined');
  html += '</div>';

  html += '<div class="sec-head"><div class="sec-title">Pending Verifications</div><button class="btn-refresh" onclick="Promise.all([loadUsers(),loadVerifications()]).then(function(){updateBadges();renderVerifications();})"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>Refresh</button></div>';

  // Show note if documents are missing (verifications table might not exist)
  if(!DATA.verifications.length && pendingFromProfiles.length) {
    html += '<div style="background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:12px;color:var(--sub);line-height:1.7">';
    html += '<strong style="color:#fbbf24"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> ID photos not available</strong><br>';
    html += 'The user submitted their verification request but the <code>verifications</code> table may not exist in your Supabase database. You can still approve the profile below (they will get their verified badge), but you won\'t be able to see their ID photo.<br><br>';
    html += '<strong style="color:var(--text)">To enable photo verification, run this SQL in your Supabase SQL editor:</strong><br>';
    html += '<code style="display:block;margin-top:6px;padding:8px;background:rgba(0,0,0,.3);border-radius:6px;font-size:11px;white-space:pre-wrap">CREATE TABLE IF NOT EXISTS verifications (\n  id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n  user_id uuid REFERENCES profiles(id),\n  id_doc text,\n  selfie text,\n  status text DEFAULT \'pending\',\n  submitted_at timestamptz DEFAULT now(),\n  admin_note text,\n  UNIQUE(user_id)\n);\nALTER TABLE verifications ENABLE ROW LEVEL SECURITY;\nCREATE POLICY "Admin reads verifications" ON verifications FOR SELECT USING (true);\nCREATE POLICY "User inserts own" ON verifications FOR INSERT WITH CHECK (auth.uid() = user_id);\nCREATE POLICY "User upserts own" ON verifications FOR UPDATE USING (auth.uid() = user_id);</code>';
    html += '</div>';
  }

  var total = pendingFromTable.length + pendingFromProfiles.length;
  if(!total) {
    html += '<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:12px;padding:20px;text-align:center;color:var(--green);font-weight:700;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> No pending verification requests</div>';
  }

  // Cards with photos
  pendingFromTable.forEach(function(v){
    var u = DATA.users.find(function(x){ return x.id===v.user_id; }) || {};
    html += verifCard(v, u, true);
  });
  pendingFromProfiles.forEach(function(u){
    html += verifCard(null, u, false);
  });

  // Recently approved/rejected
  if(approved.length||rejected.length) {
    html += '<div class="sec-head" style="margin-top:24px"><div class="sec-title">Recent Reviews</div></div>';
    html += '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>User</th><th>Status</th><th>Date</th><th>Note</th></tr></thead><tbody>';
    DATA.verifications.filter(function(v){ return v.status!=='pending'; }).slice(0,20).forEach(function(v){
      var u = DATA.users.find(function(x){ return x.id===v.user_id; })||{};
      html += '<tr><td style="font-weight:600">'+esc(u.name||v.user_id.slice(0,8))+'</td><td><span class="badge badge-'+(v.status==='approved'?'active':'rejected')+'">'+esc(v.status)+'</span></td><td style="color:var(--sub);font-size:12px">'+fmtDate(v.submitted_at)+'</td><td style="color:var(--sub);font-size:12px">'+esc(v.admin_note||'—')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // ── Company verifications ──

function companyVerifCard(cv, u) {
  var isSoleTrader = (cv.company_name||'').startsWith('SOLE TRADER:');

    ? (cv.company_name||'').replace(/^SOLE TRADER:\s*/,'')

  var typeBadge = isSoleTrader
    ? '<span class="badge" style="background:rgba(124,58,237,.15);color:#7c3aed">Sole Trader</span>'
    : '<span class="badge badge-info">Company</span>';

  var docs = isSoleTrader
    ? [['Owner ID / National ID', cv._ownerUrl]]
    : [
        ['Certificate of Incorporation', cv._regUrl],
        ['Tax Clearance',                cv._taxUrl],
        ['Business Premises',            cv._premisesUrl]

  var html = '<div class="verif-card">';
  html += '<div class="verif-header">';
  html += '<div class="verif-user"><div class="verif-avatar">'+initials(displayName||u.name||'C')+'</div>';

  html += '<div style="display:flex;gap:6px;align-items:center">'+typeBadge+'<span class="badge badge-pending">Pending</span></div>';
  html += '</div>';

  html += '<div class="verif-docs">';
  docs.forEach(function(d){
    html += '<div class="verif-doc-box"><div class="verif-doc-label">'+esc(d[0])+'</div>';
    if(d[1]) html += '<img class="verif-doc-img" src="'+esc(d[1])+'" onclick="openVerifPhoto(this,false)" onerror="this.style.opacity=\'.3\'">';
    else html += '<div style="padding:20px;text-align:center;color:var(--sub);font-size:12px">Not submitted</div>';
    html += '</div>';
  });
  html += '</div>';

  html += '<div class="verif-actions">';
  html += '<button class="btn-verif-approve" onclick="approveCompany(\''+esc(cv.user_id)+'\')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:4px"><polyline points="20 6 9 17 4 12"/></svg> Approve</button>';

  html += '</div></div>';

async function approveVerification(userId, verifId) {
  var ok = await confirm2('Approve Verification','Grant verified badge to this user?','Approve','green');
  if(!ok) return;
  try {
    var r = await sb.from('profiles').update({verified:true,verification_pending:false,updated_at:new Date().toISOString()}).eq('id',userId).select('id');
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('Could not update the user — run FIX_ADMIN_PROFILE_UPDATE.sql so admins can verify other users.');
    if(verifId) await sb.from('verifications').update({status:'approved',admin_note:'Approved by admin'}).eq('id',verifId);
    var u = DATA.users.find(function(x){ return x.id===userId; }); if(u){ u.verified=true; u.verification_pending=false; }
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='approved';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Identity Verified',body:'Your blue verified badge is now active on all your listings.',type:'verify',read:false,created_at:Date.now()});
    updateBadges(); renderVerifications(); toast('User verified and notified');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function rejectVerification(userId, verifId) {
  var note = await confirm2('Reject Verification','Reason for rejection (will be sent to user):','Reject','red',true,'e.g. ID photo blurry, face not visible');
  if(note===null) return;
  try {
    await sb.from('profiles').update({verification_pending:false}).eq('id',userId);
    if(verifId) await sb.from('verifications').update({status:'rejected',admin_note:note||'Documents unclear'}).eq('id',verifId);
    var u = DATA.users.find(function(x){ return x.id===userId; }); if(u) u.verification_pending=false;
    var v = DATA.verifications.find(function(x){ return x.id===verifId; }); if(v) v.status='rejected';
    await sb.from('notifications').insert({id:notifId(),user_id:userId,title:'Verification Not Approved',body:'Your ID was not approved.'+(note?' Reason: '+note+'. Please resubmit with clearer photos.':' Please resubmit.'),type:'report',read:false,created_at:Date.now()});
    updateBadges(); renderVerifications(); toast('Verification rejected, user notified','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function sendNotification() {
  var target       = document.getElementById('notifTarget').value;
  var title        = document.getElementById('notifTitle').value.trim();
  var body         = document.getElementById('notifBody').value.trim();
  var type         = document.getElementById('notifType').value;
  var deepLink     = (document.getElementById('notifDeepLink')||{}).value||'';
  var imageUrl     = (document.getElementById('notifImageUrl')||{}).value||'';
  var schedLater   = document.getElementById('schedLater');
  var scheduledFor = (schedLater && schedLater.checked)
    ? (document.getElementById('notifScheduledFor')||{}).value || '' : '';

  if(!title){ toast('Enter a notification title','error'); return; }
  if(!body){  toast('Enter a message','error'); return; }
  if(schedLater && schedLater.checked && !scheduledFor){ toast('Select a date and time to schedule','error'); return; }

  // Collect province checkboxes
  var provinces = [];
  document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ provinces.push(cb.value); });

  var btn = document.getElementById('sendNotifBtn');
  var status = document.getElementById('sendStatus');
  btn.disabled = true;
  btn.textContent = scheduledFor ? 'Scheduling…' : 'Sending…';

  try {
    var sess = await sb.auth.getSession();
    var jwt = sess && sess.data && sess.data.session && sess.data.session.access_token;
    if(!jwt) throw new Error('Not authenticated — please sign in again');

    var payload = {
      target:       target,
      title:        title,
      body:         body,
      type:         type,
      deepLink:     deepLink  || null,
      imageUrl:     imageUrl  || null,
      provinces:    provinces.length ? provinces : null,
      scheduledFor: scheduledFor || null,
    };

    if(status) status.textContent = 'Calling FCM…';
    var res = await fetch(SUPABASE_URL + '/functions/v1/send-push', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + jwt,
        'Content-Type':  'application/json',
        'apikey':        SUPABASE_ANON,
      },
      body: JSON.stringify(payload),
    });

    var result = await res.json();
    if(!res.ok) throw new Error(result.error || ('HTTP ' + res.status));

    btn.disabled = false;
    btn.textContent = schedLater && schedLater.checked ? 'Schedule Notification' : 'Send Notification';
    if(status) status.textContent = '';

    // Clear form
    document.getElementById('notifTitle').value = '';
    document.getElementById('notifBody').value  = '';
    if(document.getElementById('notifDeepLink'))  document.getElementById('notifDeepLink').value  = '';
    if(document.getElementById('notifImageUrl'))  document.getElementById('notifImageUrl').value  = '';
    document.querySelectorAll('.prov-cb:checked').forEach(function(cb){ cb.checked = false; });
    updateNotifPreview();

    if(result.scheduled) {
      toast('Scheduled for '+new Date(scheduledFor).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'}));
    } else {
      var msg = 'Sent to '+result.total_users+' user'+(result.total_users!==1?'s':'');
      if(result.fcm_sent  > 0) msg += ' · '+result.fcm_sent+' FCM delivered';
      if(result.no_token  > 0) msg += ' · '+result.no_token+' no device token';
      if(result.fcm_failed> 0) msg += ' · '+result.fcm_failed+' FCM failed';
      toast(msg);
    }

    await loadNotifHistory();
    renderNotifications();
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Send Notification';
    if(status) status.textContent = '';
    toast('Error: '+e.message,'error');
  }
}

async function resolveReport(id) {
  try {
    var r = await sb.from('reports').update({status:'resolved'}).eq('id',id);
    if(r.error) throw r.error;
    var rr=DATA.reports.find(function(x){return x.id===id;}); if(rr) rr.status='resolved';
    updateBadges(); renderReports(); toast('Report resolved');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
async function dismissReport(id) {
  try {
    var r = await sb.from('reports').update({status:'dismissed'}).eq('id',id);
    if(r.error){ // some databases restrict status to open/resolved — fall back gracefully
      r = await sb.from('reports').update({status:'resolved'}).eq('id',id);
      if(r.error) throw r.error;
    }
    DATA.reports=DATA.reports.filter(function(x){return x.id!==id;});
    updateBadges(); renderReports(); toast('Report dismissed','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function decideContact(id, status) {
  try {
    var c = DATA.contactRequests.find(function(x){ return x.id===id; });
    var r = await sb.from('contact_requests').update({ status:status, decided_at:new Date().toISOString() }).eq('id',id);
    if(r.error) throw r.error;
    if(c) { c.status=status; c.decided_at=new Date().toISOString(); }
    // Notify the employer that their request was reviewed (best-effort; ignore failures)
    if(c && c.requester_id) {
      try {
        var candName = (c.candidate_name) || ((DATA.users.find(function(x){return x.id===c.candidate_id;})||{}).name) || 'the candidate';
        await sb.from('notifications').insert({
          id: notifId(), user_id: c.requester_id, type: 'contact',
          title: status==='approved' ? 'Contact unlocked' : 'Contact request declined',
          body: status==='approved'
            ? ('You can now view '+candName+'’s contact details in Hire Talent.')
            : ('Your request to contact '+candName+' was not approved.'),
          created_at: Date.now()
        });
      } catch(e){}
    }
    updateBadges(); renderContactRequests();
    toast(status==='approved' ? 'Contact unlocked for employer' : 'Request declined', status==='approved'?'success':'info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

function renderAds() {

  html+='<div style="background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:var(--sub);line-height:1.7">';
  html+='<strong style="color:var(--text)">Ad types:</strong> <b>Banner</b> — carousel on Home/category. <b>Spotlight</b> — category-specific. <b>Announcement</b> — dismissible popup notification shown to all users. <b>Half-Screen</b> — bottom sheet with full image.';
  html+='</div>';

  if(!DATA.ads.length) { html+='<div class="empty-msg">No paid ads yet.</div>'; document.getElementById('mainContent').innerHTML=html; return; }

  // ── Announcements sub-section ──────────────────────────
  var announcements = DATA.ads.filter(function(a){ return a.type === 'announcement'; });
  if(announcements.length) {
    html+='<div style="margin-bottom:20px">';
    html+='<div class="sec-head" style="margin-bottom:10px"><div class="sec-title" style="font-size:14px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:5px"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Announcement Ads</div></div>';
    announcements.forEach(function(a){
      html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px">';
      if(a.image_url||a.image) html+='<img src="'+esc(a.image_url||a.image)+'" style="width:52px;height:40px;object-fit:cover;border-radius:8px;flex-shrink:0" onerror="this.style.display=\'none\'">';
      html+='<div style="flex:1;min-width:0">';
      html+='<div style="font-size:13px;font-weight:700;color:var(--text)">'+esc(a.headline||a.business_name||'Announcement')+'</div>';
      if(a.tagline) html+='<div style="font-size:11px;color:var(--sub);margin-top:2px">'+esc(a.tagline)+'</div>';
      html+='<div style="display:flex;gap:6px;margin-top:5px"><span class="badge badge-'+(a.active?'active':'rejected')+'">'+(a.active?'Active':'Paused')+'</span><span class="badge badge-pending">announcement</span></div>';
      html+='</div>';
      html+='<div style="display:flex;flex-direction:column;gap:6px">';
      html+='<button class="ab '+(a.active?'ab-reject':'ab-approve')+'" onclick="toggleAd(\''+esc(a.id)+'\','+(a.active?'false':'true')+')">'+(a.active?'Pause':'Resume')+'</button>';
      html+='<button class="ab ab-delete" onclick="deleteAd(\''+esc(a.id)+'\')">Delete</button>';
      html+='</div></div>';
    });
    html+='</div>';
    html+='<div style="border-top:1px solid var(--border);margin-bottom:18px"></div>';
  }

  var totalImp = DATA.ads.reduce(function(s,a){return s+(a.impressions||0);},0);
  var totalClk = DATA.ads.reduce(function(s,a){return s+(a.clicks||0);},0);
  var totalRev = DATA.ads.reduce(function(s,a){return s+(parseFloat(a.price_paid)||0);},0);
  var activeAds = DATA.ads.filter(function(a){return a.active;}).length;
  html+='<div class="stats-grid" style="margin-bottom:18px">'
    + statCard('Active Ads','accent',activeAds,'live now')
    + statCard('Impressions','blue',totalImp.toLocaleString(),'total views')
    + statCard('Clicks','green',totalClk.toLocaleString(),'total taps')
    + statCard('Ad Revenue','amber','$'+totalRev.toFixed(2),'collected')
    + '</div>';

  // Cards view for ads (shows image thumbnail)
  DATA.ads.forEach(function(a){
    var advertiser = DATA.users.find(function(x){ return x.id===a.advertiser_id; })||{};
    var imgHtml = (a.image_url||a.image) ? '<img src="'+esc(a.image_url||a.image)+'" style="width:64px;height:48px;object-fit:cover;border-radius:8px;flex-shrink:0" onerror="this.style.display=\'none\'">'
      : '<div style="width:64px;height:48px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg></div>';
    var sectionLabel = a.target_cat ? ('Home + '+esc(a.target_cat.charAt(0).toUpperCase()+a.target_cat.slice(1))) : 'Home carousel';
    html+='<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px">';
    html+='<div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:12px">';
    html+=imgHtml;
    html+='<div style="flex:1;min-width:0">';
    html+='<div style="font-size:15px;font-weight:700;color:var(--text)">'+esc(a.headline||a.business_name||'Ad')+'</div>';
    if(a.tagline) html+='<div style="font-size:12px;color:var(--sub);margin-top:2px">'+esc(a.tagline)+'</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">';

    html+='<div style="display:flex;gap:8px;margin-bottom:12px">'+mbox('Impressions',(a.impressions||0).toLocaleString())+mbox('Clicks',(a.clicks||0).toLocaleString())+mbox('CTR',ctr+'%')+'</div>';
    html+='<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:10px">';
    html+='<span><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Advertiser: <strong style="color:var(--text)">'+esc(advertiser.name||a.business_name||'—')+'</strong></span>';
    html+='<span>'+fmtDate(a.starts_at)+' – '+fmtDate(a.ends_at)+'</span>';
    html+='</div>';
    html+='<div style="display:flex;gap:8px">';
    html+='<button class="ab '+(a.active?'ab-reject':'ab-approve')+'" onclick="toggleAd(\''+esc(a.id)+'\','+(a.active?'false':'true')+')">'+(a.active?'Pause':'Resume')+'</button>';
    html+='<button class="ab ab-delete" onclick="deleteAd(\''+esc(a.id)+'\')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg> Delete</button>';
    html+='</div></div>';
  });
  document.getElementById('mainContent').innerHTML=html;
}

async function toggleAd(id, active) {
  try {
    await sb.from('paid_ads').update({active:active==='true'||active===true}).eq('id',id);
    var a=DATA.ads.find(function(x){return x.id===id;}); if(a) a.active=active==='true'||active===true;
    renderAds(); toast(active?'Ad activated':'Ad paused','info');
  } catch(e){ toast('Error: '+e.message,'error'); }
}

async function deleteAd(id) {
  var ok = await confirm2('Delete Ad','Remove this ad permanently?','Delete','red');
  if(!ok) return;
  try {
    await sb.from('paid_ads').delete().eq('id',id);
    DATA.ads=DATA.ads.filter(function(x){return x.id!==id;});
    renderAds(); toast('Ad deleted');
  } catch(e){ toast('Error: '+e.message,'error'); }
}
