name: pamarket
description: "PaMarket — Konke Endaweni Eyodwa. Zimbabwe's marketplace for buy/sell, jobs, rentals, cars, and services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  photo_view: ^0.15.0
  badges: ^3.1.2
  flutter_svg: ^2.0.16

  # Media
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  path_provider: ^2.1.5

  # Notifications
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Storage
  shared_preferences: ^2.3.5

  # Permissions
  permission_handler: ^11.4.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
