<header id="hdr">
  <div class="hdr-w">
    <a href="/" class="logo">Pa<em>Market</em></a>
    <div class="search-bar">
      <select class="search-cat" id="hCat" aria-label="Category">
        <option value="">All Categories</option>
        <option value="property">Property</option><option value="vehicles">Vehicles</option><option value="electronics">Electronics</option>
        <option value="jobs">Jobs</option><option value="furniture">Furniture</option><option value="fashion">Fashion</option>
        <option value="services">Services</option><option value="agriculture">Agriculture</option><option value="rooms">Rooms</option>
        <option value="pets">Pets</option><option value="kids">Baby &amp; Kids</option>
      </select>
      <input class="search-inp" id="hQ" type="text" placeholder="Search listings, shops, jobs..." aria-label="Search" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()" aria-label="Search">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <span class="sbtn-lbl">Search</span>
      </button>
    </div>
    <div class="hdr-util">
      <a href="notifications" class="util-btn" title="Notifications" aria-label="Notifications">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="util-lbl">Notifications</span>
      </a>
      <a href="saved-searches" class="util-btn" title="Saved Searches" aria-label="Saved Searches">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span class="util-lbl">My Searches</span>
      </a>
      <a href="favourites" class="util-btn" title="Favourites" aria-label="Favourites">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="util-lbl">Favourites</span>
      </a>
      <a href="chats" class="util-btn" title="Chats" aria-label="Chats">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="util-lbl">Chats</span>
      </a>
      <a href="dashboard" class="util-btn" title="My Ads" aria-label="My Ads">
        <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
        <span class="util-lbl">My Ads</span>
      </a>
    </div>
    <div class="hdr-right">
      <a href="auth" class="btn-sign" id="signInBtn">Sign In</a>
      <a href="post-ad" class="btn-post">+ Post Free Ad</a>
      <button class="ham" onclick="toggleMob()" aria-label="Menu" aria-expanded="false">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <nav id="mobNav" class="mob-nav">
    <a href="/">Home</a>
    <a href="browse">Browse</a>
    <a href="favourites">My Favourites</a>
    <a href="saved-searches">Saved Searches</a>
    <a href="notifications">Notifications</a>
    <a href="dashboard">My Ads</a>
    <a href="advertise">Advertise</a>
    <a href="contact">Contact Us</a>
    <a href="blog">Blog</a>
    <a href="about">About Us</a>
    <a href="post-ad">+ Post Free Ad</a>
  </nav>
</header>
<script>
/* Self-contained header behaviour so the partial works on any page
   regardless of what else the page loads. Guarded so pages that
   already define these keep their own implementation. */
window.toggleMob = window.toggleMob || function(){
  var n = document.getElementById('mobNav');
  var h = document.querySelector('#hdr .ham');
  if (!n) return;
  var open = n.classList.toggle('open');
  if (h) h.setAttribute('aria-expanded', open ? 'true' : 'false');
};
window.doSearch = window.doSearch || function(){
  var cat = document.getElementById('hCat');
  var q = document.getElementById('hQ');
  var p = new URLSearchParams();
  if (cat && cat.value) p.set('cat', cat.value);
  if (q && q.value.trim()) p.set('q', q.value.trim());
  var qs = p.toString();
  window.location.href = (cat && cat.value === 'jobs' ? 'jobs' : 'browse') + (qs ? '?' + qs : '');
};
</script>
