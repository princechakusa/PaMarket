<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <style>
      .bg{fill:#f4f6fb}.navy{fill:#1A3A8F}.gold{fill:#F5A623}.card{fill:#fff}.soft{fill:#F8FAFC}.border{stroke:#D9E1F2;stroke-width:2}.text{fill:#18181B;font-family:'Plus Jakarta Sans','Inter',Arial,sans-serif}.sub{fill:#667085}.white{fill:#fff}.label{font-size:17px;font-weight:800}.small{font-size:14px}.tiny{font-size:12px}.title{font-size:30px;font-weight:900}.phone{fill:#101828}.screen{fill:#FAFAFA}.bubbleMe{fill:#1A3A8F}.bubbleThem{fill:#fff;stroke:#E4E8F0;stroke-width:1}.key{fill:#fff;stroke:#CDD5E1;stroke-width:1}.bad{fill:#FEF2F2;stroke:#FCA5A5;stroke-width:2}.good{fill:#ECFDF3;stroke:#86EFAC;stroke-width:2}.callout{fill:#fff;stroke:#CBD5E1;stroke-width:2}.shadow{filter:url(#ds)}
    </style>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#101828" flood-opacity=".16"/>
    </filter>
    <marker id="arrowBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#DC2626"/>
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect width="1600" height="1050" class="bg"/>
  <text x="80" y="70" class="text title">PaMarket Chat UI/UX Fix Mockup</text>
  <text x="80" y="100" class="text sub small">Affected screen only: Chat conversation with keyboard open. No unrelated redesign.</text>

