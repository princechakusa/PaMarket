  <g transform="translate(1070,142)">
    <rect x="0" y="0" width="430" height="170" rx="18" class="bad"/>
    <text x="22" y="36" class="text label" fill="#991B1B">Current problems</text>
    <text x="22" y="68" class="text small">1. Enter key is configured as Send.</text>
    <text x="22" y="96" class="text small">2. Pressing Enter sends instead of adding a line.</text>
    <text x="22" y="124" class="text small">3. Send, +, $, camera and gallery flows blur input.</text>
    <text x="22" y="152" class="text small">4. Header only shows Online/Verified/profile fallback.</text>

    <rect x="0" y="205" width="430" height="238" rx="18" class="good"/>
    <text x="22" y="241" class="text label" fill="#14532D">Proposed changes</text>
    <text x="22" y="273" class="text small">1. Use multiline textarea with Return key.</text>
    <text x="22" y="301" class="text small">2. Return inserts newline and never sends.</text>
    <text x="22" y="329" class="text small">3. Blue send button sends, clears, refocuses input.</text>
    <text x="22" y="357" class="text small">4. Toolbar actions restore focus after sheet/file picker.</text>
    <text x="22" y="385" class="text small">5. Header cycles: Online, Typing..., Last seen formats.</text>
    <text x="22" y="413" class="text small">6. Respect presence privacy before showing timestamps.</text>

    <rect x="0" y="478" width="430" height="250" rx="18" class="callout"/>
    <text x="22" y="514" class="text label">Presence examples</text>
    <circle cx="34" cy="548" r="5" fill="#16A34A"/><text x="52" y="553" class="text small">Online</text>
    <circle cx="34" cy="582" r="5" fill="#F5A623"/><text x="52" y="587" class="text small">Typing...</text>
    <circle cx="34" cy="616" r="5" fill="#98A2B3"/><text x="52" y="621" class="text small">Last seen just now</text>
    <circle cx="34" cy="650" r="5" fill="#98A2B3"/><text x="52" y="655" class="text small">Last seen 2 minutes ago</text>
    <circle cx="34" cy="684" r="5" fill="#98A2B3"/><text x="52" y="689" class="text small">Last seen today at 5:42 PM</text>
    <circle cx="34" cy="718" r="5" fill="#98A2B3"/><text x="52" y="723" class="text small">Last seen yesterday / Monday</text>
  </g>

  <path d="M450 674 C520 675 535 674 570 674" fill="none" stroke="#DC2626" stroke-width="4" marker-end="url(#arrowBad)"/>
  <text x="420" y="708" class="text tiny" fill="#DC2626" font-weight="800">Send key sends + closes flow</text>
  <path d="M930 674 C1000 675 1020 674 1060 674" fill="none" stroke="#16A34A" stroke-width="4" marker-end="url(#arrowGood)"/>
  <text x="885" y="708" class="text tiny" fill="#16A34A" font-weight="800">Return inserts newline; keyboard remains open</text>

  <rect x="82" y="1005" width="1438" height="1" fill="#D0D5DD"/>
  <text x="80" y="1030" class="text sub tiny">Mockup generated for approval only. Production files are unchanged.</text>
</svg>
