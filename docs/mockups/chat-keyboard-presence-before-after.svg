    <path d="M350 458 L373 468 L350 478 L356 468 Z" fill="#fff"/>

    <rect x="18" y="506" width="394" height="316" fill="#DDE3EE"/>
    <g transform="translate(35,526)">
      <rect x="0" y="0" width="80" height="42" rx="8" class="key"/><rect x="88" y="0" width="80" height="42" rx="8" class="key"/><rect x="176" y="0" width="80" height="42" rx="8" class="key"/><rect x="264" y="0" width="80" height="42" rx="8" class="key"/>
      <rect x="0" y="50" width="80" height="42" rx="8" class="key"/><rect x="88" y="50" width="80" height="42" rx="8" class="key"/><rect x="176" y="50" width="80" height="42" rx="8" class="key"/><rect x="264" y="50" width="80" height="42" rx="8" class="key"/>
      <rect x="0" y="100" width="70" height="42" rx="8" class="key"/><rect x="78" y="100" width="70" height="42" rx="8" class="key"/><rect x="156" y="100" width="70" height="42" rx="8" class="key"/><rect x="234" y="100" width="110" height="42" rx="8" fill="#1A3A8F"/>
      <text x="289" y="126" text-anchor="middle" class="white text small" font-weight="800">Send</text>
      <rect x="0" y="158" width="344" height="42" rx="8" class="key"/>
    </g>
  </g>

  <g transform="translate(570,145)">
    <text x="0" y="-30" class="text label">AFTER - Proposed behavior</text>
    <rect x="0" y="0" width="430" height="840" rx="42" class="phone shadow"/>
    <rect x="18" y="18" width="394" height="804" rx="32" class="screen"/>
    <rect x="18" y="18" width="394" height="78" rx="32" class="navy"/>
    <rect x="18" y="64" width="394" height="32" class="navy"/>
    <text x="46" y="66" class="white text" font-size="28" font-weight="700">‹</text>
    <circle cx="92" cy="58" r="20" fill="#2952cc"/>
    <text x="92" y="64" text-anchor="middle" class="white text tiny" font-weight="800">TM</text>
    <text x="122" y="51" class="white text" font-size="15" font-weight="800">Tariro Moyo</text>
    <circle cx="125" cy="70" r="4" fill="#7CF6B0"/>
    <text x="135" y="74" class="white text tiny" fill="#7CF6B0">Online</text>
    <text x="380" y="63" class="white text" font-size="24" font-weight="900">...</text>

    <rect x="34" y="112" width="362" height="62" rx="14" class="card border"/>
    <rect x="48" y="126" width="44" height="36" rx="9" fill="#DBEAFE"/>
    <text x="108" y="140" class="text tiny" font-weight="700">Samsung S24 Ultra</text>
    <text x="108" y="158" class="text tiny" fill="#1A3A8F" font-weight="800">$620</text>
    <text x="365" y="152" class="text sub" font-size="18">›</text>

    <rect x="54" y="205" width="245" height="48" rx="18" class="bubbleThem"/>
    <text x="76" y="234" class="text small">Is it still available?</text>
    <rect x="142" y="270" width="240" height="54" rx="18" class="bubbleMe"/>
    <text x="162" y="294" class="white text small">Yes, I can meet today</text>
    <text x="318" y="314" class="white text tiny" opacity=".75">9:42 ✓✓</text>
    <g>
      <circle cx="78" cy="374" r="14" fill="#2952cc"/>
      <rect x="102" y="354" width="76" height="34" rx="17" class="bubbleThem"/>
      <circle cx="126" cy="371" r="4" fill="#98A2B3"/><circle cx="140" cy="371" r="4" fill="#98A2B3"/><circle cx="154" cy="371" r="4" fill="#98A2B3"/>
    </g>

    <rect x="18" y="430" width="394" height="76" fill="#fff" stroke="#E4E8F0"/>
    <circle cx="52" cy="468" r="21" fill="#EEF2FF" stroke="#D9E1F2"/>
    <text x="52" y="476" text-anchor="middle" class="text" font-size="28">+</text>
    <circle cx="98" cy="468" r="21" fill="#EEF2FF" stroke="#D9E1F2"/>
    <text x="98" y="475" text-anchor="middle" class="text" font-size="24" font-weight="800">$</text>
    <rect x="126" y="444" width="198" height="48" rx="22" fill="#F5F6FA" stroke="#1A3A8F" stroke-width="2"/>
    <text x="146" y="465" class="text small">Can you do</text>
    <text x="146" y="484" class="text small">$600 today?</text>
    <line x1="246" y1="460" x2="246" y2="486" stroke="#1A3A8F" stroke-width="2"/>
    <circle cx="360" cy="468" r="23" fill="#1A3A8F"/>
    <path d="M350 458 L373 468 L350 478 L356 468 Z" fill="#fff"/>

    <rect x="18" y="506" width="394" height="316" fill="#DDE3EE"/>
    <g transform="translate(35,526)">
      <rect x="0" y="0" width="80" height="42" rx="8" class="key"/><rect x="88" y="0" width="80" height="42" rx="8" class="key"/><rect x="176" y="0" width="80" height="42" rx="8" class="key"/><rect x="264" y="0" width="80" height="42" rx="8" class="key"/>
      <rect x="0" y="50" width="80" height="42" rx="8" class="key"/><rect x="88" y="50" width="80" height="42" rx="8" class="key"/><rect x="176" y="50" width="80" height="42" rx="8" class="key"/><rect x="264" y="50" width="80" height="42" rx="8" class="key"/>
      <rect x="0" y="100" width="70" height="42" rx="8" class="key"/><rect x="78" y="100" width="70" height="42" rx="8" class="key"/><rect x="156" y="100" width="70" height="42" rx="8" class="key"/><rect x="234" y="100" width="110" height="42" rx="8" class="key"/>
      <path d="M278 112 L262 121 L278 130" fill="none" stroke="#475467" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
